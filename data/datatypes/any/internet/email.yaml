id: email
name: Email (Electronic mail)
status: stable
doc: Electronic mail (email or e-mail) is a method of exchanging messages ("mail") between people using
  electronic devices. Email was thus conceived as the electronic (digital) version of, or counterpart
  to, mail, at a time when "mail" meant only physical mail (hence e- + mail).
categories:
- common
- internet
- pii
langs:
- common
is_pii: true
classification: identifier
regexp: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z][A-Za-z0-9-]{1,62}$
examples:
- value: user@example.com
  description: Plain address
- value: first.last+tag@mail.example.org
  description: Dots, a plus tag and a subdomain
- value: user@
  valid: false
  description: No domain
- value: user.example.com
  valid: false
  description: No @
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Email
- type: schema.org
  url: https://schema.org/email
translations:
  ru:
    name: Электронная почта (email)
    doc: Электро́нная по́чта (англ. email, e-mail [iˈmeɪl], от англ. electronic mail) — технология и служба
      по пересылке и получению электронных сообщений (называемых «письма», «электронные письма» или «сообщения»)
      между пользователями компьютерной сети (в том числе — Интернета).
