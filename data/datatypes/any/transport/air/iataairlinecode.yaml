id: iataairlinecode
name: IATA airline designator (airline code)
status: stable
doc: IATA airline designators, sometimes called IATA reservation codes, are two-character codes assigned
  by the International Air Transport Association (IATA) to the worlds airlines.
semantic_type: airlinecode
langs:
- common
regexp: ^[A-Z0-9]{2}$
examples:
- value: MH
  description: Malaysia Airlines
- value: QW
  description: Blue Wings
mappings:
  wikidata: P229
  fta: AIRLINE.IATA_CODE
  schema_org: iataCode
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Airline_codes
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P229
