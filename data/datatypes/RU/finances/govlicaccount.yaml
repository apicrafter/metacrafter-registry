  description: Лицевой счет получателя бюджетных средствАДМИНИСТРАЦИЯ СЕВЕРНОГО РАЙОНА НОВОСИБИРСКОЙ ОБЛАСТИ
- value: 712Я5686001
  description: л/c для учета операций со средствами юридических лиц при казначейском сопровождении ООО
    "ПРОШКОЛА №13"
translations:
  ru:
    name: Лицевой счет
    doc: Лицевой счёт (англ. personal account) — бухгалтерский счёт для ведения учёта расчетов с физическими
      и юридическими лицами, на котором отражаются все финансово-кредитные операции с определенным клиентом,
      является документом аналитического учёта.
