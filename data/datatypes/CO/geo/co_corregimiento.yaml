id: co_corregimiento
name: Corregimiento of a Colombian municipality
status: draft
doc: 'Rural subdivision of a Colombian municipality by name: the municipal council may divide the area
  outside the municipal seat into corregimientos (Ley 136 de 1994), each covering populated centres and
  veredas (co_vereda). Tables of municipalities name it Corregimiento, Nombre Corregimiento or, together
  with the urban comunas, Comuna/Corregimiento: La Habana, Zanjón Hondo, Puerto Caldas, Tribunas Córcega.'
