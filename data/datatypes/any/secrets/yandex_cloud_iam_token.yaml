id: yandex_cloud_iam_token
name: Yandex Cloud IAM token
status: draft
doc: 'Short-lived IAM token of Yandex Cloud, sent in the Authorization: Bearer header. The regexp is the
  one that the Yandex Cloud documentation gives for the current format, which starts with t1.; Yandex
  notes that a future format will change the prefix.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^t1\.[A-Za-z0-9_-]+={0,2}\.[A-Za-z0-9_-]{86}={0,2}$
examples:
- value: t1.
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://yandex.cloud/en/docs/iam/concepts/authorization/iam-token
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
