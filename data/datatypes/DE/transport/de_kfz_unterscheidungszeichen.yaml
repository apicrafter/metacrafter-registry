id: de_kfz_unterscheidungszeichen
name: German vehicle registration district code (Unterscheidungszeichen)
status: draft
doc: 'The one to three letters that open a German vehicle plate and name the district or city of registration:
  K for Cologne, BN for Bonn, HA for Hagen. The federal transport ministry sets the codes at the request
  of the states. Tables of traffic fines and parking offences give the code alone, without the rest of
  the plate, in columns named Kennzeichen, so that a vehicle cannot be identified. The full plate is de_vehicle_plate.'
