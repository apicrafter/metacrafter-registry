id: pythonstdnum
name: python-stdnum
category: other
doc: 'python-stdnum is an open source Python library with one module per standard number: national tax,
  VAT, company and personal identifiers, bank account and payment references, and international codes
  such as IBAN, ISBN, ISIN and IMEI. Each module cleans a given value and checks its length, format and
  check digit where one is defined; it does not scan text or guess the type of a column. The supported
  formats are listed in the project README and on its formats page.'
website: https://arthurdejong.org/python-stdnum/formats
