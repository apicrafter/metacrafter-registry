translations:
  ru:
    name: Регистрационный номер объекта в FRS EPA США
    doc: Двенадцатизначный идентификатор объекта в реестре Facility Registry Service Агентства по охране
      окружающей среды США; связывает записи об одном объекте в разных системах EPA.
