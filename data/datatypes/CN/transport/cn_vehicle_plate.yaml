id: cn_vehicle_plate
name: Chinese civil vehicle registration plate
status: draft
doc: 'Registration number on the plate of a civil vehicle in mainland China under the standard GA 36-2018:
  the one-character abbreviation of the province, a letter of the issuing authority, often a separating
  dot, and a serial. Ordinary plates have five digits and letters, never I or O. Green new-energy plates
  have six characters: small vehicles start with an energy letter (D, A, B, C or E for pure electric,
  F, G, H, J or K for others), large vehicles end with it. Police, learner, trailer, Hong Kong, Macao
  and diplomatic plates are not covered.'
categories:
