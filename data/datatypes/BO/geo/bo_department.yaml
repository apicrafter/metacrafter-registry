doc: 'Name of one of the nine departments of Bolivia, the first-level divisions: Chuquisaca, La Paz, Cochabamba,
  Oruro, Potosí, Tarija, Santa Cruz, Beni and Pando. Tables write them in capitals without accents (POTOSI),
  after their INE code (09.PANDO), as El Beni, or abbreviated (LPZ, SCZ, CBBA); GIS layers often carry
  broken encodings (PotosÃ­, Potos?). La Paz is also a department of Honduras and El Salvador and Santa
  Cruz a province of Argentina, so a column needs most of the nine names. The INE code is bo_department_code.'
