is_pii: false
classification: categorical
regexp: ^(?:Arctic Cordillera|Northern Arctic|Southern Arctic|Taiga Plains|Taiga Shield|Boreal Shield|Atlantic
  Maritime|Mixedwood Plains|Boreal Plains|Prairies|Taiga Cordillera|Boreal Cordillera|Pacific Maritime|Montane
  Cordillera|Hudson Plains)$
examples:
