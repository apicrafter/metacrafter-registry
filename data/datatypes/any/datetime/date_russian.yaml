id: date_russian
name: Date with a Russian month name
status: draft
doc: 'Calendar date written in Russian with the month name in the genitive case, day first: 5 мая 2022,
  5 мая 2022 г. or 5 мая 2022 года, optionally after the weekday (четверг, 5 мая 2022 г.). Also a numeric
  date followed by the year word (05.05.2022 г.), the month between dots or slashes (5.мая.2022, 5/мая/2022)
  and the month-first form Май 5, 2022.'
semantic_type: date
langs:
- ru
regexp: '^(?:(?:(?:[Пп]онедельник|[Вв]торник|[Сс]реда|[Чч]етверг|[Пп]ятница|[Сс]уббота|[Вв]оскресенье),?
  )?(?:0?[1-9]|[12]\d|3[01]) (?:[Яя]нваря|[Фф]евраля|[Мм]арта|[Аа]преля|[Мм]ая|[Ии]юня|[Ии]юля|[Аа]вгуста|[Сс]ентября|[Оо]ктября|[Нн]оября|[Дд]екабря),?
  \d{4}(?: ?(?:г\.|года))?|(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.\d{4} ?(?:г\.|года)|(?:0?[1-9]|[12]\d|3[01])[./](?:[Яя]нваря|[Фф]евраля|[Мм]арта|[Аа]преля|[Мм]ая|[Ии]юня|[Ии]юля|[Аа]вгуста|[Сс]ентября|[Оо]ктября|[Нн]оября|[Дд]екабря)[./]\d{4}|(?:Январь|Февраль|Март|Апрель|Май|Июнь|Июль|Август|Сентябрь|Октябрь|Ноябрь|Декабрь)
  (?:0?[1-9]|[12]\d|3[01]), \d{4})$'
examples:
- value: 25 декабря 2024
  description: 25 December 2024
- value: 25 декабря 2024 г.
  description: With the abbreviation of года (year)
- value: 25 декабря 2024 года
  description: With года (year)
- value: Среда, 25 декабря 2024 г.
  description: With the weekday
- value: 25.12.2024 г.
  description: Numeric date with the year word
- value: декабрь 2024
  valid: false
- value: 25 декабрь 2024
  valid: false
- value: 25.12.2024
  valid: false
mappings:
  qddate:
  - dt:date:date_rus
  - dt:date:date_rus2
  - dt:date:date_rus3
  - dt:date:date_rus_lc1
  - dt:date:date_rus_lc2
  - dt:date:weekday_rus
  - dt:date:weekday_rus_lc1
  - dt:date:rus_rare_2
  - dt:date:rus_rare_3
  - dt:date:rus_rare_5
  - dt:date:rus_rare_6
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Date_and_time_notation_in_Russia
- type: other
  url: https://github.com/ivbeg/qddate/blob/v1.1.0/qddate/patterns/ru.py
translations:
  ru:
    name: Дата с русским названием месяца
    doc: 'Календарная дата на русском языке с названием месяца в родительном падеже: 5 мая 2022, 5 мая
      2022 г., 5 мая 2022 года, в том числе с днём недели; а также числовая дата с «г.» (05.05.2022 г.).'
