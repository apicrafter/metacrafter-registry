name: Journal title
status: draft
doc: 'Title of the journal, magazine or other serial in which an article appeared, as bibliographic records
  give it beside the article: the container title of Crossref, the source title of Scopus, SO of Web of
  Science, the revista of a Spanish-language research information system. It is the full or abbreviated
  title, often in capitals (FOOD CHEMISTRY, J. Biol. Chem.); the serial is identified by its issn.'
