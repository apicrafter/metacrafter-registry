id: transport_mode
name: Mode of transport
status: draft
doc: Kind of transport that carries goods or passengers, written as a word, for example Air, Sea, Road
  or Rail. Customs declarations and trade statistics record the mode of transport at the border. The coded
  form in trade documents is the one-digit code of UN/ECE Recommendation 19 (unece_rec19_transport_mode_code).
