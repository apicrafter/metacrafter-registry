id: age_secret_key
name: age secret key (X25519 identity)
status: draft
doc: Secret key (identity) of the age file encryption format and tool, which decrypts files encrypted
  to the matching age1... public key. It is an uppercase Bech32 string with the human-readable part AGE-SECRET-KEY-,
  so it starts with AGE-SECRET-KEY-1 and has 74 characters. Post-quantum identities start with AGE-SECRET-KEY-PQ-1.
  The Bech32 checksum covers the whole string, including the hyphens of the prefix.
parent: private_key
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^AGE-SECRET-KEY-(?:PQ-)?1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}$
checksum: bech32
examples:
- value: AGE-SECRET-KEY-1GFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPQ4EGAEX
  description: X25519 test vector of the age specification
- value: AGE-SECRET-KEY-PQ-1XX76JRALNLXDMEW0CRK45QMCCH4X06SE84UN3VPM33W6HWDX0H3SK3ZQFR
  description: Post-quantum (ML-KEM-768 + X25519) test vector of the age specification
- value: age-secret-key-1gfpyysjzgfpyysjzgfpyysjzgfpyysjzgfpyysjzgfpyysjzgfpq4egaex
  valid: false
  description: Lower case
- value: AGE-SECRET-KEY-1GFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPQ4EGAEQ
  valid: false
  description: Wrong Bech32 checksum
