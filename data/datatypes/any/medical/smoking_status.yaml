id: smoking_status
name: Smoking status
status: draft
doc: 'Whether a person smokes tobacco, as health surveys and clinical records class it: never smoker,
  former smoker and current smoker, the current smokers often split into daily and occasional (every day,
  some days). Questionnaires word the options as sentences (I smoke regularly, I used to smoke but quit,
  I have never smoked; fumo habitualmente, antes fumaba pero lo dejé, nunca he fumado), and data files
  hold them as words, as codes of a form (nunca_he_fumado) or as numbers with a codebook. A yes or no
  answer to Do you smoke? is a boolean, and the number of cigarettes a day is a count.'
