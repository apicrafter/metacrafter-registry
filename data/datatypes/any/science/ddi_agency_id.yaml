id: ddi_agency_id
name: DDI agency identifier
status: draft
doc: Identifier of an organization that maintains metadata in the Data Documentation Initiative (DDI)
  standard, such as a national statistics office, a data archive or a survey project. The organization
  registers it in the DDI Agency Registry in the form country code, dot, name (for example dk.dst; international
  bodies use int, as in int.esseric), and may extend it with sub-agency labels separated by dots (us.mpc.ipums).
  The DDI Lifecycle schema allows labels of letters, digits and hyphens, up to 63 characters each and
  253 in total. It also accepts a single label, but the identifiers listed in the registry all have a
  prefix, so the regexp requires at least one dot. The agency identifier is the namespace part of DDI
  URNs (urn:ddi:<agency>:<id>:<version>) and the registration authority in ISO/IEC 11179-6 identifiers
  (IRDI).
categories:
- science
- government
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?=.{3,253}$)[A-Za-z0-9-]{1,63}(?:\.[A-Za-z0-9-]{1,63})+$
examples:
- value: dk.dst
  description: Statistics Denmark
- value: ca.statcan
  description: Statistics Canada
- value: fr.insee
  description: INSEE, France
- value: us.mpc.ipums
  description: Sub-agency of us.mpc (Minnesota Population Center), from the DDI Lifecycle guide
- value: urn:ddi:us.mpc:V321:2
  valid: false
  description: Full DDI URN, not the agency identifier alone
links:
- type: doc
  url: https://registry.ddialliance.org/Agency
- type: doc
  url: https://docs.ddialliance.org/DDI-Lifecycle/3.3/xmlschema/schemas/reusable_xsd/simpleTypes/DDIAgencyIDType.html
- type: doc
  url: https://docs.ddialliance.org/DDI-Lifecycle/guide/General%20Structures/Identification/
translations:
