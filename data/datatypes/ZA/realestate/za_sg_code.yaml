id: za_sg_code
name: South African Surveyor-General 21-character code
status: draft
doc: 'Key of a land parcel in the cadastre of the Chief Surveyor-General of South Africa (SG code, LPI
  code): 21 characters with the letter of the Surveyor-General office (B, C, F, K, N or T), the major
  region (3 characters), the minor region or township (4 digits, 0000 for farms), the parcel number (8
  digits) and the portion (5 digits), such as C03700050000652000000.'
categories:
- realestate
- geo
- identifiers
country:
- ZA
langs:
- en
is_pii: false
classification: identifier
regexp: ^[BCFKNT][0-9A-Z]{3}\d{17}$
examples:
- value: C03700050000652000000
  description: Parcel 6520 in the Northern Cape
- value: C05300370000000100000
- value: C0370005000065200000
  valid: false
  description: 20 characters
- value: A03700050000652000000
  valid: false
  description: A is not an office letter
links:
- type: doc
  url: https://help.1map.co.za/knowledge/lpi-code-sg21-key
translations:
  ru:
    name: Кадастровый код SG (ЮАР)
