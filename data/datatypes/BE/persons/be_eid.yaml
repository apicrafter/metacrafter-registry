- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.be.eid.html
translations:
  nl:
    name: Kaartnummer van de elektronische identiteitskaart (eID)
    doc: Twaalfcijferig nummer van een Belgische eID-kaart (xxx-xxxxxxx-yy); de laatste twee cijfers zijn
      de rest van de deling van de eerste tien door 97.
  fr:
