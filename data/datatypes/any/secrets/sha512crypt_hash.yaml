id: sha512crypt_hash
name: SHA-512-crypt password hash
status: draft
doc: 'Password hash of the SHA-512-based crypt scheme by Ulrich Drepper, in Modular Crypt Format: $6$,
  an optional rounds=N$ (5000 rounds by default), a salt of up to 16 characters, $ and 86 characters of
  crypt Base64. It is widely used in /etc/shadow on Linux.'
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^\$6\$(?:rounds=[1-9][0-9]+\$)?[^$:\n]{1,16}\$[./0-9A-Za-z]{86}$
examples:
- value: $6$saltstring$svn8UoSVapNtMuq1ukKS4tPQd8iKwSMHWjl/O817G3uBnIFNjnQJuesI68u4OTLiBFdcbYEdFCoEOfaS35inz1
  description: 'Test vector of the specification: Hello world! with the salt saltstring'
- value: $6$rounds=10000$saltstringsaltst$OW1/O6BYHV6BcXZu8QVeXbDWra3Oeqh0sbHbbMCVNSnCM/UrjmM0Dp8vOuZeHBy/YTBmSK6H9qs/y3RnOaw5v.
  description: Test vector of the specification with 10000 rounds
- value: $5$saltstring$5B8vYYiY.CVt1RlTTf8KbXBH3hsxY/GNooZaBBGWEc5
  valid: false
  description: SHA-256-crypt hash
links:
- type: doc
  url: https://www.akkadia.org/drepper/SHA-crypt.txt
- type: doc
  url: https://man.archlinux.org/man/crypt.5
