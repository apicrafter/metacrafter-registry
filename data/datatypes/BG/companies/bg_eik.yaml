id: bg_eik
name: Bulgarian unified identification code (EIK)
status: draft
doc: ЕИК (единен идентификационен код), the unified identification code under which a company is entered
  in the Commercial Register of Bulgaria. With the BG prefix it forms the VAT number (bg_vat). ORG-ID.guide
  lists the register as BG-EIK; with that prefix an identifier reads BG-EIK-204853663.
categories:
- companies
country:
- BG
langs:
- bg
is_pii: false
classification: identifier
examples:
- value: '204853663'
  description: example from ORG-ID.guide
mappings:
  orgid: BG-EIK
links:
