    name: Postcode
    doc: Vier cijfers (de eerste geen 0), een spatie en twee hoofdletters; de combinaties SA, SD en SS
      worden niet gebruikt.
  ru:
    name: Почтовый индекс Нидерландов
    doc: Четыре цифры (первая не 0), пробел и две заглавные буквы; сочетания SA, SD и SS не используются.
