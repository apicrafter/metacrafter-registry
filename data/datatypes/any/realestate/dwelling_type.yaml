id: dwelling_type
name: Type of dwelling (Detached, Semi-detached, Condo)
status: draft
doc: 'The built form of a home or a residential property, as house price tables, estate agents, rental
  listings and housing surveys classify it: houses by how they join their neighbours (detached, semi-detached,
  terraced, end terrace), flats and maisonettes, bungalows, and the American forms single family home,
  condominium, townhouse, duplex, multi-family and mobile or manufactured home. The price paid data of
  HM Land Registry codes four of them as D, S, T and F. House, Flat, Apartment, Studio and Villa are also
  other words (the House of a legislature, a flat finish), so they are matched only in a field named Property
  Type, Dwelling Type or Home Type.'
