id: date_bosnian
name: Date with a Bosnian month name
status: draft
doc: Calendar date written in Bosnian with the month name, day, month and year in the order of the CLDR
  long (d. MMMM y.) and medium (d. MMM y.) date formats of the bs locale. The month is the CLDR wide or
  abbreviated name in the format context, written exactly as CLDR gives it, including any dot or apostrophe;
  no extra capitalisation variants are accepted.
semantic_type: date
langs:
- bs
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01])\. (?:septembar|decembar|novembar|februar|oktobar|august|januar|april|mart|juni|juli|maj)
  \d{4}\.|(?:0?[1-9]|[12]\d|3[01])\. (?:nov|dec|jul|sep|feb|okt|aug|maj|jun|jan|apr|mar) \d{4}\.)$
examples:
- value: 3. oktobar 2024.
  description: 3 October 2024, CLDR long format d. MMMM y.
- value: 25. dec 2024.
  description: 25 December 2024, CLDR medium format d. MMM y.
- value: oktobar 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/bs/ca-gregorian.json
