id: ca_wsc_station_number
name: Water Survey of Canada hydrometric station number
status: draft
doc: 'The seven-character number the Water Survey of Canada gives a hydrometric station (a gauge of water
  level or streamflow): two digits of the major drainage area (01 to 11), a letter of the sub-drainage
  area, a letter of the sub-sub-drainage area and three digits of the station in it, so 05BH004 is a station
  of sub-sub-drainage area 05BH (ca_wsc_drainage_area_code). HYDAT, the national archive of hydrometric
  data, the real-time water office and provincial water files use it as the station key, in fields named
  STATION_NUMBER, Station Number, STATION_NU or STATION_ID. Provincial networks write their own numbers
  (MB05LDS002 of Manitoba), which are not this type.'
parent: id
categories:
