id: de_wkn
name: German securities identification number (WKN)
status: stable
doc: Wertpapierkennnummer, the 6-character code of digits and capital letters (without I and O) that identifies
  securities in Germany. It has no check digit and no internal structure, and the ISIN is replacing it.
  A German ISIN is DE000, the WKN and an ISIN check digit.
categories:
- finances
country:
- DE
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9A-HJ-NP-Z]{6}$
examples:
- value: A0DPBF
  description: Real-world value published online (ISIN DE000A0DPBF7)
- value: LYX0AB
  description: Real-world value published online (ISIN DE000LYX0AB6)
- value: A0DPBF7
  valid: false
  description: One character too many
- value: AOMNRK
  valid: false
  description: The letter O is not used
mappings:
  stdnum: de.wkn
links:
- type: wikipedia
  url: https://de.wikipedia.org/wiki/Wertpapierkennnummer
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.de.wkn.html
- type: other
  url: https://docs.dataprep.ai/user_guide/clean/clean_de_wkn.html
translations:
  de:
    name: Wertpapierkennnummer (WKN)
  ru:
    name: Идентификационный номер ценной бумаги в Германии (WKN)
    doc: Шестисимвольный код ценной бумаги из цифр и заглавных букв (без I и O), без контрольной цифры;
      его заменяет ISIN.
