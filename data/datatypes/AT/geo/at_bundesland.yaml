id: at_bundesland
name: Austrian state (Bundesland)
status: draft
doc: Name of one of the nine states (Bundesländer) of Austria, in German as the Austrian open data portals
  write them (Burgenland, Kärnten, Niederösterreich, Oberösterreich, Salzburg, Steiermark, Tirol, Vorarlberg,
  Wien), sometimes in capitals, with oe for ö (Niederoesterreich) or in English (Carinthia, Lower Austria,
  Upper Austria, Styria, Tyrol, Vienna). Statistics Austria numbers the states 1 to 9 in this alphabetical
  order (at_bundesland_code).
