id: ir_melli_code
name: Iranian national identification number (code melli)
status: draft
doc: Ten-digit national identification number (code melli) printed on the Iranian national identity card
  and written as XXX-XXXXXX-X. Validators such as validator.js treat the last digit as a modulo 11 check
  digit over the first nine; no official description of the algorithm was found, so the record sets no
  checksum.
categories:
- pii
- persons
country:
- IR
langs:
- fa
is_pii: true
classification: identifier
regexp: ^[0-9]{3}-?[0-9]{6}-?[0-9]$
mappings:
  dpv: pd:OfficialID
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/National_identification_number
- type: other
  url: https://github.com/validatorjs/validator.js/blob/master/src/lib/isIdentityCard.js
