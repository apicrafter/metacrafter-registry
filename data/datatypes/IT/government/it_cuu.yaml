id: it_cuu
name: Italian unique office code (codice univoco ufficio)
status: draft
doc: Codice univoco ufficio, the 6-character code of an office (organisational unit) of the Italian public
  administration in the IPA index. It is used, for example, to address electronic invoices to public bodies.
  ORG-ID.guide lists the register as IT-CUUO; with that prefix an identifier reads IT-CUUO-7GEM3B.
