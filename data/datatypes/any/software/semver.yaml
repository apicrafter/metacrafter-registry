id: semver
name: Semantic version (SemVer)
status: stable
doc: 'Version number in the Semantic Versioning 2.0.0 format: MAJOR.MINOR.PATCH, optionally followed by
  a pre-release part after ''-'' and build metadata after ''+''.'
categories:
- software
langs:
- common
is_pii: false
classification: identifier
regexp: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
examples:
- value: 1.0.0
  description: release
- value: 2.1.3-alpha.1
  description: pre-release
- value: 1.0.0-rc.1+build.5
  description: pre-release with build metadata
- value: '1.0'
  valid: false
  description: PATCH is missing
- value: 01.2.3
  valid: false
  description: leading zero
links:
- type: doc
  url: https://semver.org/spec/v2.0.0.html
