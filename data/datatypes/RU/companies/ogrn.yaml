id: ogrn
name: Russian primary state registration number (OGRN, OGRNIP)
status: stable
doc: 'Number that the Russian tax service assigns when it enters a business in a state register. A legal
  entity gets a 13-digit OGRN in the register of legal entities (EGRUL); an individual entrepreneur gets
  a 15-digit OGRNIP in the register of individual entrepreneurs (EGRIP), and that number identifies a
  natural person. The first digit is 1 or 5 for an OGRN and 3 for an OGRNIP; numbers of other register
  entries (GRN) start with other digits. Then come the last two digits of the registration year (OGRN
  numbers are issued since 2002, OGRNIP numbers since 2004), the region code, the entry number and a check
  digit: the last digit of the remainder of the preceding digits divided by 11 (OGRN) or by 13 (OGRNIP).'
aliases:
- ogrn_ogrnip
categories:
- companies
country:
- RU
langs:
- ru
is_pii: false
classification: identifier
regexp: ^(?:[15]\d{12}|3\d{14})$
checksum: ru_ogrn
examples:
- value: '1027700043502'
  description: Rosneft
- value: '1027700132195'
  description: Sberbank of Russia
- value: '304500116000157'
  description: OGRNIP (15 digits), registration year 04, region 50
- value: '385768585948949'
  valid: false
  description: Check digit is valid, but the registration year 85 is impossible (OGRNIP numbers are issued
    since 2004)
- value: '2027700132195'
  valid: false
  description: First digit 2 marks another register entry (GRN), not an OGRN
