id: ua_kekv
name: Ukrainian economic classification code of expenditure (КЕКВ)
status: draft
doc: Four-digit code of the economic classification of budget expenditure of Ukraine, which groups spending
  by its economic content, as in 2111 for wages, 2210 for supplies and equipment and 2240 for services.
categories:
