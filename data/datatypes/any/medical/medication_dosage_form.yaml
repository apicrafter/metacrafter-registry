id: medication_dosage_form
name: Medication dosage form
status: draft
doc: Pharmaceutical form of a medicine that fits the way it is given or used, such as tablets, film-coated
  tablets, capsules, syrup or a solution for injection. Drug registers and catalogues take the form from
  a closed list of terms. The EDQM Standard Terms are the international list of dose forms. In the Eurasian
  Economic Union the list is the Nomenclature of dosage forms (Decision No. 172 of the EEC Board, 22 December
  2015), and the Russian ESKLP catalogue writes the form in Russian. The value is a term, not a code,
  so a dictionary of terms detects it better than a regular expression.
categories:
- medical
