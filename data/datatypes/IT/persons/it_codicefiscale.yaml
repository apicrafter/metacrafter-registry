translations:
  it:
    name: Codice fiscale
    doc: Codice di 16 caratteri delle persone fisiche, ricavato da cognome, nome, data e comune di nascita
      e sesso, con un carattere di controllo finale.
  ru:
    name: Налоговый код Италии (codice fiscale)
    doc: Налоговый код физического лица в Италии - 16 символов, составленных из фамилии, имени, даты и
      места рождения и пола, с контрольной буквой в конце.
