id: de_ars
name: German regional key (Amtlicher Regionalschlüssel, ARS)
status: stable
doc: 'Twelve-digit official regional key of a German municipality: the municipality key with a four-digit
  code of the municipal association (Gemeindeverband) inserted after the district, so two digits for the
  state, one for the government region, two for the district, four for the association and three for the
  municipality. Keys that end in zeros denote a district or an association as a whole.'
categories:
- geo
country:
- DE
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:0[1-9]|1[0-6])\d{10}$
examples:
- value: '034565404000'
  description: Uelsen
- value: 092715202130
  description: Lalling
- value: 010590000000
  description: Schleswig-Flensburg District
- value: 03459033
  valid: false
  description: A municipality key (AGS), not a regional key
- value: '174565404000'
  valid: false
  description: There is no state 17
mappings:
