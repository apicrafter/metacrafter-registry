id: mk_embs
name: North Macedonian entity registration number (EMBS)
status: draft
doc: ЕМБС (единствен матичен број на субјектот), the 7-digit number of a legal entity in the Central Registry
  of the Republic of North Macedonia. ORG-ID.guide lists the register as MK-CR; with that prefix an identifier
  reads MK-CR-6524710.
