  url: https://cs.wikipedia.org/wiki/Po%C5%A1tovn%C3%AD_sm%C4%9Brovac%C3%AD_%C4%8D%C3%ADslo
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Postal_codes_in_the_Czech_Republic
