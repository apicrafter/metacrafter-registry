id: us_census_block_group
name: US census block group GEOID
status: draft
doc: Identifier of a census block group, a cluster of census blocks inside one tract, generally with 600
  to 3,000 people. The 12-digit GEOID is the 11-digit tract GEOID followed by the block group number,
  which is the first digit of the block numbers in the group.
parent: us_census_geoid
categories:
