id: tm_phone
name: Turkmenistan phone number (E.164)
status: draft
doc: 'Phone number of Turkmenistan in international E.164 form: a plus sign, the country calling code
  +993 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- TM
langs:
- common
regexp: ^\+993(?:[1-7]\d{7})$
examples:
- value: '+99312345678'
  description: Example number from Google libphonenumber (fixed line)
- value: '+99366123456'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
