id: inchl
name: International Chemical Identifier (InChl)
status: stable
doc: 'International Chemical Identifier (InChI): a textual identifier for chemical substances defined
  by IUPAC. It starts with ''InChI=''.'
categories:
- chemistry
langs:
- common
is_pii: false
classification: identifier
regexp: InChI=1S?/([0-9]*[A-Z][ub]?[a-z]?[0-9]*\.?)+(/[0-9A-Za-z+\-(),.*;?]+)*
examples:
- value: InChI=1S/C6H6/c1-2-4-6-5-3-1/h1-6H
  description: benzene
- value: InChI=1S/C10H9NO2/c12-10(13)5-7-6-11-9-4-2-1-3-8(7)9/h1-4,6,11H,5H2,(H,12,13)
  description: indoleacetic acid
mappings:
  wikidata: P234
links:
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P234
- type: bioschemas
  url: https://bioschemas.org/inChI
- type: schema.org
  url: https://schema.org/inChI
- type: wikipedia
  url: https://en.wikipedia.org/wiki/International_Chemical_Identifier
translations:
  ru:
    name: Международный химический идентификатор
    doc: Международный химический идентификатор
