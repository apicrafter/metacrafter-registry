id: facebook_app_access_token
name: Facebook app access token
status: draft
doc: App access token of the Meta (Facebook) Graph API written as the app ID, a vertical bar and the app
  secret. Meta allows this form in place of a generated app access token; it contains the app secret and
  must stay on the server.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9]{15,16}\|[0-9A-Za-z_-]{27,40}$
examples:
- value: 100000000000000|0123456789abcdef0123456789abcdef
  description: Constructed, non-functional value
- value: '100000000000000'
  valid: false
  description: App ID alone
links:
- type: doc
  url: https://developers.facebook.com/docs/facebook-login/guides/access-tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
