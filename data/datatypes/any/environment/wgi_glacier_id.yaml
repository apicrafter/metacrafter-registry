  url: https://nsidc.org/data/g01130/versions/1
- type: doc
  url: https://nsidc.org/sites/default/files/g01130-v001-userguide_1_0.pdf
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P1404
translations:
  ru:
    name: Идентификатор ледника во Всемирном каталоге ледников (WGI)
    doc: 'Двенадцатизначный код ледника во Всемирном каталоге ледников WGMS: код страны, код континента,
      код бассейна стока и местный номер ледника.'
