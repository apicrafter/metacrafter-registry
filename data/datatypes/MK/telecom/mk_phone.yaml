id: mk_phone
name: North Macedonia phone number (E.164)
status: draft
doc: 'Phone number of North Macedonia in international E.164 form: a plus sign, the country calling code
  +389 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- MK
langs:
- common
regexp: ^\+389(?:[2-578]\d{7})$
examples:
- value: '+38922012345'
  description: Example number from Google libphonenumber (fixed line)
- value: '+38972345678'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
