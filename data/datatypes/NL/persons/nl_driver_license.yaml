id: nl_driver_license
name: Dutch driver's license number
status: draft
doc: Document number of a driving licence (rijbewijs) issued in the Netherlands by the RDW, ten digits
  printed in field 5 of the card. Microsoft Purview looks for ten digits without spaces or delimiters
  and no check digit.
parent: driver_license
categories:
- pii
- persons
country:
- NL
langs:
- nl
is_pii: true
classification: identifier
regexp: ^\d{10}$
examples:
- value: '6236186433'
  description: Number of the RDW specimen driving licence, model 2025
- value: '623618643'
  valid: false
  description: Nine digits
mappings:
  purview:
  - Netherlands drivers license number
  - EU drivers license number
  dpv: pd:OfficialID
links:
