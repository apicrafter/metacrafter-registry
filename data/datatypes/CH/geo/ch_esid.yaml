id: ch_esid
name: Swiss federal street identifier (ESID)
status: draft
doc: Number of a street, square or named area in the street directory of the Swiss Federal Register of
  Buildings and Dwellings (GWR). It is a whole number of eight digits from 10 000 000 to 90 000 000 and
  is unique across the country. Building address tables carry it next to the EGID and the EDID.
parent: id
categories:
- geo
- government
country:
- CH
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:[1-8]\d{7}|90000000)$
examples:
- value: '10063517'
  description: a street of Basel (open data of data.bs.ch)
- value: '10025948'
- value: '1006351'
  valid: false
  description: seven digits, below the range of the register
- value: '90000001'
  valid: false
links:
- type: doc
  url: https://dam-api.bfs.admin.ch/hub/api/dam/assets/7008785/master
translations:
  de:
    name: Eidgenössischer Strassenidentifikator (ESID)
  fr:
    name: Identificateur fédéral de rue (ESID)
  ru:
    name: Федеральный идентификатор улицы Швейцарии (ESID)
