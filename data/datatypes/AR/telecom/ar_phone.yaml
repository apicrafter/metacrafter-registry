id: ar_phone
name: Argentina phone number (E.164)
status: draft
doc: 'Phone number of Argentina in international E.164 form: a plus sign, the country calling code +54
  and the national number, with no spaces. The regexp follows the national number pattern of Google libphonenumber.
  National formats with a trunk prefix and numbers written with spaces or hyphens are not covered.'
semantic_type: phone
country:
- AR
langs:
- common
regexp: ^\+54(?:(?:11|[89]\d\d)\d{8}|[2368]\d{9})$
examples:
- value: '+541123456789'
  description: Example number from Google libphonenumber (fixed line)
- value: '+5491123456789'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
