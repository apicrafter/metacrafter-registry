id: gitlab_scim_token
name: GitLab SCIM token
status: draft
doc: Token with which an identity provider provisions and deprovisions GitLab users and group members
  through the SCIM API. GitLab gives these tokens the prefix glsoat-, which cannot be configured. GitLab
  does not document the length; the regexp follows the gitleaks rule (20 characters after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glsoat-[A-Za-z0-9_-]{20}$
examples:
- value: glsoat-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
