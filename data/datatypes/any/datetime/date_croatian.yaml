id: date_croatian
name: Date with a Croatian month name
status: draft
doc: Calendar date written in Croatian with the month name, day, month and year in the order of the CLDR
  long (d. MMMM y.) and medium (d. MMM y.) date formats of the hr locale. The month is the CLDR wide or
  abbreviated name in the format context, written exactly as CLDR gives it, including any dot or apostrophe;
  no extra capitalisation variants are accepted.
semantic_type: date
langs:
- hr
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01])\. (?:listopada|studenoga|siječnja|prosinca|kolovoza|svibnja|travnja|veljače|lipnja|srpnja|ožujka|rujna)
  \d{4}\.|(?:0?[1-9]|[12]\d|3[01])\. (?:velj|ruj|lip|sij|stu|pro|lis|tra|ožu|srp|kol|svi) \d{4}\.)$
examples:
- value: 3. listopada 2024.
  description: 3 October 2024, CLDR long format d. MMMM y.
- value: 25. pro 2024.
  description: 25 December 2024, CLDR medium format d. MMM y.
- value: listopada 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/hr/ca-gregorian.json
