id: yandex_oauth_token
name: Yandex OAuth token
status: draft
doc: OAuth token of a Yandex account (Yandex ID), which Yandex Cloud also accepts to obtain IAM tokens.
  Yandex documents that the token starts with y, a digit from 0 to 3 and an underscore, followed by letters,
  digits, underscores and hyphens.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^y[0-3]_[A-Za-z0-9_-]+$
examples:
- value: y3_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://yandex.cloud/en/docs/iam/concepts/authorization/oauth-token
