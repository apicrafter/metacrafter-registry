id: pywhat
name: pyWhat
category: detector
doc: Open-source (MIT) Python tool and library that tells what a string or the contents of a file are.
  It matches the input against a database of regular expressions, each with a name, a rarity score, tags
  and often a link to documentation, and can filter matches by tag or rarity. The database covers internet
  and network identifiers, cryptocurrency wallet addresses, payment card numbers, API keys and tokens
  of common services, public and private keys, timestamps and a few national identifiers. The Rust tool
  lemmeknow reuses the same database.
website: https://github.com/bee-san/pyWhat
