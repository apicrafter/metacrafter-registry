id: es_aplicacion_presupuestaria
name: Spanish public budget line (aplicación presupuestaria)
status: draft
doc: 'Budget line (aplicación presupuestaria) of a Spanish public budget, as the City of Madrid writes
  it in its contract registers: the budget year, the organic code, the programme code and the economic
  code, as in 2026 001130 - 33210 - 62999. A contract that spans several years lists one line per year,
  often with the amount.'
parent: id
