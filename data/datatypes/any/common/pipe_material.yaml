id: pipe_material
name: Pipe material
status: draft
doc: 'Material of a water, sewer, stormwater or gas pipe or fitting in the asset register of a utility
  or a council, in words or in the abbreviations of the water industry (WSAA codes): Asbestos Cement (AC),
  Cast Iron Cement Lined (CICL), Ductile Iron Cement Lined (DICL), Mild Steel Cement Lined (MSCL), Polyvinyl
  Chloride (PVC, uPVC, mPVC, oPVC), Polyethylene (PE, HDPE), Polypropylene (PP), Vitreous Clay (VC), Reinforced
  Concrete (RC, RCP), Glass Reinforced Plastic (GRP), Copper, Galvanised Iron, Stainless Steel, Brick,
  Earthenware. A plastic alone is not a polymer type of a microplastic sample.'
