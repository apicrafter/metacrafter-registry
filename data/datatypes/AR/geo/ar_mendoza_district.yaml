id: ar_mendoza_district
name: District of a department of Mendoza
status: draft
doc: 'Name of a distrito, the division of a department of the province of Mendoza, Argentina, below the
  18 departments: Villa Nueva, Rodeo de la Cruz and Dorrego in Guaymallén, El Challao and Uspallata in
  Las Heras, Chacras de Coria in Luján de Cuyo, Cuadro Benegas in San Rafael, the twelve numbered sections
  of the Capital (Segunda Sección, 4ª Sección Área Fundacional). The head town of a department is the
  district Ciudad (Ciudad de San Martín). Provincial and municipal tables of schools, health centres,
  offices and addresses have a distrito column; names are written in capitals without accents (RODEO DE
  LA CRUZ), abbreviated (Va. Hipódromo, Gdor. Benegas) or with the initial of the department where two
  departments have a district of the same name (San José (G), La Primavera (T)).'
