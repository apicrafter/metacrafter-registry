doc: Corporate Identification Number (CIN), the 21-character number that the Ministry of Corporate Affairs
  of India gives to companies. ORG-ID.guide lists the register as IN-MCA; with that prefix an identifier
  reads IN-MCA-L24111UR1986PLC015895.
