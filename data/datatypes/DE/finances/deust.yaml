id: deust
name: German VAT identification number (USt-IdNr.)
status: stable
doc: Umsatzsteuer-Identifikationsnummer (USt-IdNr.), the VAT identification number that the Federal Central
  Tax Office (BZSt) issues to businesses in Germany for trade with other EU member states. It is DE followed
  by nine digits; the last digit is an ISO 7064 MOD 11,10 check digit. It is not the domestic tax number
  (Steuernummer) or the personal tax identification number (Steuer-ID).
parent: vatin
categories:
- finances
country:
- DE
langs:
- de
is_pii: true
classification: identifier
regexp: ^DE[0-9]{9}$
examples:
- value: DE136695976
  description: python-stdnum reference value
- value: DE13669597
  valid: false
  description: One digit short
- value: '136695976'
  valid: false
  description: The DE prefix is part of the number
mappings:
