id: medication_route
name: Route of administration of a medicine
status: draft
doc: 'The way a medicine is given: Oral, Parenteral, Topical, Ocular, Rectal, Inhalation, Transdermal,
  Intravenous, Intramuscular, Subcutaneous in words, or the abbreviations of prescriptions and veterinary
  registers (IV, IM, SC, PO). Price lists and registers of authorised medicines give it beside the active
  substance and the pharmaceutical form (medication_dosage_form), in columns named Route of Administration.'
