id: googledlp
name: Google Cloud Sensitive Data Protection (DLP)
category: pii
doc: 'Google Cloud Sensitive Data Protection, formerly Cloud DLP, inspects text, files, BigQuery and Cloud
  Storage with built-in infoType detectors: names, contact details, credentials, financial data, medical
  codes and national identifiers of many countries. Findings can be masked, tokenized or redacted. Each
  registry record lists the matching infoType names in mappings.google_dlp.'
website: https://cloud.google.com/sensitive-data-protection/docs/infotypes-reference
