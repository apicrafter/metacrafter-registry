id: nl_municipality_code
name: Dutch municipality code (CBS)
status: stable
doc: Four-digit code of a Dutch municipality assigned by Statistics Netherlands (CBS), often written with
  the prefix GM, as in GM0363 for Amsterdam. CBS never reuses a whole code; a municipality created by
  a merger or renamed gets a new code that starts with 1, which may repeat the last three digits of an
  abolished municipality (1892 Zuidplas, from 0892). The code is the first four digits of the CBS district
  (nl_wijk_code) and neighbourhood (nl_buurt_code) codes; BAG identifiers (nl_bag_id) start with the code
  of the municipality that assigned them.
semantic_type: nl_municipality
country:
- NL
regexp: ^(?:GM)?\d{4}$
examples:
- value: GM0363
  description: Amsterdam
- value: 0599
  description: Rotterdam
- value: 0518
  description: '''s-Gravenhage (The Hague)'
- value: GM0344
  description: Utrecht
- value: '363'
  valid: false
  description: Leading zero dropped
- value: WK036300
  valid: false
  description: A district code, not a municipality code
mappings:
  wikidata: P382
  fta: STATE_PROVINCE.MUNICIPALITY_CODE_NL
links:
