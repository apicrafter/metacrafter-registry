id: ar_caba_barrio
name: Barrio of the City of Buenos Aires
status: draft
doc: Name of one of the 48 official barrios (neighbourhoods) of the Autonomous City of Buenos Aires, such
  as Palermo, Villa Crespo or Parque Patricios. City datasets write them in capitals without accents (CONSTITUCION,
  NUÑEZ, SAN CRISTOBAL) or in title case, shorten Villa General Mitre to VILLA GRAL. MITRE, and write
  La Boca as BOCA, La Paternal as PATERNAL and Monserrat also as Montserrat. Every barrio belongs to one
  comuna (ar_caba_comuna).
