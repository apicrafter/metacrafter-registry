id: ru_okvgum
name: Russian code of cargo, package and packaging material types (OKVGUM)
status: draft
doc: Code in the Russian Classification of Types of Cargo, Packaging and Packaging Materials (ОКВГУМ,
  ОК 031-2002), which is based on Recommendation 21 of UNECE. The classifier has three facets. The type
  of cargo is one digit, the type of packaging is two digits (the external form and the size class), and
  the packaging material is one digit. The codes are too short to detect by format, so the record has
  no regular expression.
categories:
