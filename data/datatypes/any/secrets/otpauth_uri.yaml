id: otpauth_uri
name: One-time password key URI (otpauth)
status: draft
doc: 'URI that provisions an HOTP or TOTP one-time password generator, usually shown as a QR code: otpauth://TYPE/LABEL?PARAMETERS,
  where TYPE is hotp or totp, the label names the account and the issuer, and the secret parameter carries
  the shared key in Base32. Whoever has the URI can generate the second factor of the account.'
categories:
- secrets
langs:
- common
is_pii: false
regexp: ^otpauth://(?:totp|hotp)/[^?\s]+\?(?:\S*&)?secret=[A-Za-z2-7]+=*(?:&\S*)?$
examples:
- value: otpauth://totp/Example:alice@google.com?secret=JBSWY3DPEHPK3PXP&issuer=Example
  description: Example from the Key Uri Format specification
- value: otpauth://totp/Example:alice@google.com?issuer=Example
  valid: false
  description: No secret
links:
- type: doc
  url: https://github.com/google/google-authenticator/wiki/Key-Uri-Format
