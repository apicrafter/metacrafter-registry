id: fi_alv
name: Finnish VAT number (ALV)
status: draft
doc: 'Arvonlisäveronumero, the Finnish VAT number: the FI prefix and the 8-digit business ID (Y-tunnus)
  without its hyphen. The last digit is a weighted check digit.'
