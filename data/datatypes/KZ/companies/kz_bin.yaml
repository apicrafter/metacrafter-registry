translations:
  ru:
    name: Бизнес-идентификационный номер (БИН)
    doc: Двенадцатизначный номер юридического лица, его филиала или представительства, а также индивидуального
      предпринимателя, действующего в форме совместного предпринимательства. Первые четыре цифры - год
      и месяц регистрации, пятая - тип лица, шестая - признак головного подразделения, филиала или представительства,
      затем пять цифр порядкового номера и контрольная цифра. С 1 января 2013 года заменил РНН.
  kk:
