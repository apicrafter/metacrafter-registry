id: cz_driver_license
name: Czech driver's license number
status: draft
doc: Number of a driving licence (řidičský průkaz) issued in the Czech Republic. Microsoft Purview describes
  it as two letters and six digits, and matches the letter E, another letter, an optional space and six
  digits, without a check digit. Older licences may use other series.
parent: driver_license
categories:
- pii
- persons
country:
- CZ
langs:
- cs
is_pii: true
classification: identifier
regexp: ^E[A-Z] ?\d{6}$
examples:
- value: E 408273
  valid: false
  description: The second letter is missing
mappings:
  purview:
  - Czech drivers license number
  - EU drivers license number
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-czech-drivers-license-number
translations:
  cs:
    name: Číslo řidičského průkazu
  ru:
    name: Номер водительского удостоверения Чехии
    doc: Номер чешского водительского удостоверения - по описанию Microsoft Purview буква E, ещё одна
      буква и шесть цифр.
