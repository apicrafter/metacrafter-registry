id: stock_exchange
name: Stock exchange (NYSE, NASDAQ, London Stock Exchange)
status: draft
doc: 'The name or acronym of the stock, futures or options exchange on which a security is listed or traded,
  as stock screeners, quote pages, company profiles and lists of listed companies give it: NYSE, NASDAQ
  (and its tiers NasdaqGS, NasdaqGM, NasdaqCM), NYSE MKT (the former AMEX), NYSE Arca, the OTC markets
  (OTCBB, OTCQB, OTCQX, Pink Sheets), the London Stock Exchange and its AIM, TSX and TSX Venture, ASX,
  Xetra, Euronext Paris, CME, NYMEX and others. Acronyms that are also words, cards, schools, car models
  or cities (OTC, AIM, ICE, BSE, AMEX, TSX, Frankfurt) are matched only in a field named Exchange. The
  ISO 10383 code of an exchange is miccode.'
