id: kvk
name: Dutch Chamber of Commerce number (KVK-nummer)
status: stable
doc: KVK-nummer, the eight-digit number that the Netherlands Chamber of Commerce (Kamer van Koophandel,
  KVK) gives to every company, legal entity and other organisation registered in the Business Register
  (Handelsregister). An organisation has one KVK number; each of its locations (vestigingen) has a separate
  12-digit vestigingsnummer (nl_kvk_vestigingsnummer), and a legal entity also gets an RSIN (rsin). KVK
  publishes no check-digit rule. The Wikidata format constraint also accepts seven digits.
categories:
- companies
country:
- NL
langs:
- nl
is_pii: false
classification: identifier
regexp: ^\d{8}$
examples:
- value: '68750110'
  description: Fictitious BV of the KVK API test environment
- value: '69599084'
  description: Fictitious eenmanszaak of the KVK API test environment
- value: '59581883'
  description: Example of the KVK Zoeken API specification
- value: '687501101'
  valid: false
  description: Nine digits, the length of an RSIN
- value: 000038509504
  valid: false
  description: A 12-digit vestigingsnummer of the KVK test environment
