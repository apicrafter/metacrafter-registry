id: ca_postalcode
name: Canadian postal code
status: draft
doc: 'Postal code of Canada Post, written A1A 1A1: letter, digit, letter, a space, then digit, letter,
  digit. The first three characters are the forward sortation area (FSA, see ca_fsa) and the last three
  the local delivery unit. The letters D, F, I, O, Q and U are never used, and W and Z are not used as
  the first letter. The first letter is a postal district of a province or territory: for example, K,
  L, M, N and P are in Ontario.'
semantic_type: postindex
country:
- CA
langs:
- common
regexp: ^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z] ?\d[ABCEGHJ-NPRSTV-Z]\d$
examples:
- value: K1A 0B1
  description: Canada Post head office, Ottawa
- value: H0H 0H0
  description: Canada Post's code for letters to Santa Claus
- value: K1A0B1
  description: Without the space
- value: D1A 0B1
  valid: false
  description: D is never used
- value: W1A 0B1
  valid: false
  description: W is not used as the first letter
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Postal_codes_in_Canada
translations:
  ru:
    name: Почтовый индекс Канады
    doc: Шестисимвольный почтовый индекс Canada Post вида A1A 1A1.
