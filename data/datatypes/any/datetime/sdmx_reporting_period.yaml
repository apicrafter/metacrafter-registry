  url: https://github.com/sdmx-twg/sdmx-ml/blob/master/schemas/SDMXCommon.xsd
- type: doc
  url: https://sdmx.org/standards-2/
- type: wikipedia
  url: https://en.wikipedia.org/wiki/SDMX
