id: fr_finess
name: French health and social establishment number (FINESS)
status: draft
doc: Nine-character number of a legal entity or an establishment in FINESS, the French national register
  of health, medico-social and social establishments, managed by the Agence du Numérique en Santé. The
  register gives a FINESS juridique number to each legal entity and a FINESS géographique number to each
  of its establishments (places of activity). The characters are digits, except that the second may be
  A or B.
