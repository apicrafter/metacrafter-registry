id: libphonenumber
name: libphonenumber
category: other
doc: Google's open-source (Apache-2.0) library for parsing, formatting and validating international phone
  numbers, with ports to many languages (Python phonenumbers, libphonenumber-js and others). Its metadata
  describes, for each country or region, the calling code, the national number patterns per number type
  (fixed line, mobile, toll free, premium rate and others), formatting rules and example numbers. The
  country phone patterns of the registry are built from this metadata, so the supported types list them
  together with the generic phone datatypes.
website: https://github.com/google/libphonenumber
