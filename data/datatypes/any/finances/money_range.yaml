id: money_range
name: Money range (amount band)
status: draft
doc: 'Band of money amounts that groups records, written with its bounds: $100K - $5m, < $100K, > $5m,
  $18,201 to $37,000, $0-$49999, Equal to or greater than $25,001, or with a letter that orders the bands
  (a. 10,000 to less than 50,000; e. Refund between $2,000 and $3,999). Tax statistics give the taxable
  income or turnover range of a group of taxpayers, registers the income or assets range of an organisation,
  grant programs the value range of a grant. A band of loss or no income (Loss/nil, a. Less than $0) is
  one of the bands. One amount is money.'
categories:
- finances
langs:
- common
is_pii: false
classification: categorical
examples:
- value: $100K - $5m
  description: Total income band of an Aboriginal and Torres Strait Islander corporation (ORIC register)
- value: '> $2.5m'
  description: Total assets band of the same register
- value: b. $18,201 to $37,000
  description: Taxable income range of ATO taxation statistics
- value: a. 10,000 to less than 50,000
  description: Total income band of ATO small business benchmarks
- value: $0-$49999
- value: Loss/nil
