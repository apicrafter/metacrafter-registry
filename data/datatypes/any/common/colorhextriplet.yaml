id: colorhextriplet
name: Color hex triplet (web color)
status: stable
doc: Web colors are colors used in displaying web pages on the World Wide Web, and the methods for describing
  and specifying those colors. Colors may be specified as an RGB triplet or in hexadecimal format (a hex
  triplet) or according to their common English names in some cases.
semantic_type: color
langs:
- common
regexp: ^#(?:[0-9a-fA-F]{3}){1,2}$
mappings:
  wikidata: P465
links:
