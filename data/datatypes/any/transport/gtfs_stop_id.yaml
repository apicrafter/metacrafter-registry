name: GTFS stop id
status: draft
doc: 'Identifier of a stop, station, entrance or boarding area in a GTFS feed (stop_id of stops.txt),
  which stop_times.txt and the parent_station field refer to. Feeds choose the form: numbers (1, 2), codes
  or text such as 1001 2.'
