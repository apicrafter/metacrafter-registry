id: isbn10
name: International Standard Book Number 10-digits (ISBN10)
status: stable
doc: 10-digit International Standard Book Number, used for books published before 2007. The last character
  is a check digit (0-9 or X).
categories:
- objectids
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:\d[- ]?){9}[\dX]$
examples:
- value: 0-521-29366-9
  description: Hamlet, Prince of Denmark
- value: 0-521-22151-X
  description: Hamlet, Prince of Denmark
mappings:
  wikidata: P957
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/International_Standard_Book_Number
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P957
