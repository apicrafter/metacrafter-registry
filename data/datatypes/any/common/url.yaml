id: url
name: Uniform Resource Locator (URL)
status: stable
doc: A Uniform Resource Locator (URL), colloquially termed a web address, is a reference to a web resource
  that specifies its location on a computer network and a mechanism for retrieving it. A URL is a specific
  type of Uniform Resource Identifier (URI), although many people use the two terms interchangeably
categories:
- common
langs:
- common
is_pii: false
regexp: ^(?:https?|ftp)://(?:\S+\.)+\S+(?:/\S*)?$
examples:
- value: http://www.rdaregistry.info/xml/termList/AspectRatio.xml
  description: RDA aspect ratio designation
- value: http://vocab.getty.edu/doc/
  description: Art & Architecture Thesaurus LOD Dataset
mappings:
  autotype: url
  cdm: means.reference.URL
  d3m: http://schema.org/URL
  google_dlp: URL
  presidio: URL
  wikidata: P2699
  fta: URI.URL
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/URL
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P2699
- type: schema.org
  url: https://schema.org/URL
