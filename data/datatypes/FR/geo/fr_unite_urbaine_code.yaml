id: fr_unite_urbaine_code
name: French urban unit code (INSEE unité urbaine)
status: draft
doc: Five-character code of an unité urbaine, an INSEE zoning of built-up areas (continuous buildings
  with at least 2,000 inhabitants). Files name the columns uu2020 or uu2010 after the zoning year; communes
  outside any urban unit can carry a special value instead of a code.
