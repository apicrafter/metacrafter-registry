id: sendgrid_api_key
name: SendGrid API key
status: draft
doc: API key of Twilio SendGrid, also used as the SMTP password. Keys are always 69 characters long and
  start with SG. followed by letters, digits and the characters . _ - and =.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^SG\.[A-Za-z0-9_.=-]{66}$
examples:
- value: SG.ExampleKeyExampleKeyEx
  valid: false
  description: Too short
links:
- type: doc
  url: https://support.sendgrid.com/hc/en-us/articles/44146758703387-Can-I-Use-a-Reduced-Shorter-API-Key-Size-in-SendGrid
- type: doc
  url: https://www.twilio.com/docs/sendgrid/ui/account-and-settings/api-keys
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
