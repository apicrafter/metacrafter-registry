id: ar_department
name: Argentine department
status: draft
doc: Name of one of the 529 departments of Argentina, the second-level divisions of the provinces (partidos
  in Buenos Aires Province, comunas in the City of Buenos Aires), such as Calamuchita, Río Cuarto or Pehuajó.
  Many names repeat across provinces (Capital, San Martín, Colón, General Roca), and provincial tables
  write them in capitals without accents (RIO CUARTO) or abbreviated (Pte. Roque S. Peña, Gral. San Martín);
  the INDEC code is ar_indec_department_code.
