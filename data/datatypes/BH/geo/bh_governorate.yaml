id: bh_governorate
name: Bahrain governorate
status: draft
doc: Name of a governorate (محافظة) of the Kingdom of Bahrain, in English or Arabic, as the census, vital
  and labour statistics label their tables by governorate. Since September 2014 there are four, Capital
  (العاصمة), Muharraq (المحرق), Northern (الشمالية) and Southern (الجنوبية); the Central governorate (الوسطى)
  was then divided among them, and tables of earlier years still list it. Names come with or without the
  word Governorate and in transliterations (Al Asimah, Al Muharraq, Ash Shamaliyah, Al Janubiyah). The
  ISO 3166-2 codes are BH-13, BH-15, BH-17 and BH-14.
