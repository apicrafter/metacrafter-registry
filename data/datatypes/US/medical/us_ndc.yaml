id: us_ndc
name: US National Drug Code (NDC)
status: draft
doc: 'Code of a drug product in the United States: labeler, product and package segments of 4-4-2, 5-3-2
  or 5-4-1 digits. The labeler and product segments alone, such as 0009-0417, identify the product without
  its package; Wikidata stores this form. The FDA publishes the NDC Directory.'
categories:
- medical
country:
- US
langs:
- en
is_pii: false
classification: identifier
regexp: ^(?:\d{4}-\d{4}(?:-\d{2})?|\d{5}-\d{3}(?:-\d{2})?|\d{5}-\d{4}(?:-\d{1,2})?)$
examples:
- value: 50242-090
  description: vemurafenib
- value: 0009-0417
  description: Depo-testosterone
- value: 0037-6824
  description: Epifoam
mappings:
  wikidata: P3640
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/National_drug_code
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P3640
