id: ean
name: European Article Number (EAN-13, EAN-8)
status: stable
doc: 'GS1 barcode number of a trade item, the form of the GTIN printed under EAN-13 and EAN-8 barcodes
  on retail goods, books, music releases and video discs. EAN-13 has 13 digits: a GS1 prefix, a company
  number, an item reference and a check digit. EAN-8 has 8 digits and is used on small packages. The last
  digit is a GS1 mod 10 check digit. Books carry their ISBN-13 as an EAN-13 with the prefix 978 or 979.
  A GS1 element string (gtin) carries the same number as 14 digits, with leading zeros, after the Application
  Identifier 01.'
categories:
- gs1
- objectids
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:\d{8}|\d{13})$
checksum: gtin
examples:
