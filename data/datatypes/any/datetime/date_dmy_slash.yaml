id: date_dmy_slash
name: Date as DD/MM/YYYY
status: draft
doc: Calendar date written as day, month and four-digit year separated by slashes, for example 25/12/2024,
  as in the United Kingdom and France. The United States writes the month first in the same shape (date_mdy_slash),
  so a value whose first two numbers are both 12 or less, such as 05/06/2024, can be read either way.
semantic_type: date
langs:
- common
regexp: ^(?:0?[1-9]|[12]\d|3[01])/(?:0?[1-9]|1[0-2])/\d{4}$
examples:
- value: 25/12/2024
  description: 25 December 2024
- value: 5/5/2022
  description: 5 May 2022
- value: 12/25/2024
  valid: false
- value: 25/12/24
  valid: false
mappings:
  qddate: dt:date:date_1
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/List_of_date_formats_by_country
- type: other
  url: https://github.com/ivbeg/qddate/blob/v1.1.0/qddate/patterns/base.py
translations:
  ru:
    name: Дата в формате ДД/ММ/ГГГГ
    doc: 'Календарная дата: день, месяц и год из четырёх цифр через косую черту, например 25/12/2024.'
