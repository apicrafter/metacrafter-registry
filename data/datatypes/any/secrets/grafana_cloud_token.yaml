id: grafana_cloud_token
name: Grafana Cloud access policy token
status: draft
doc: Token of a Grafana Cloud access policy, used by agents and API clients to send and query telemetry.
  Grafana documents that these tokens start with glc_; the regexp follows the gitleaks rule for the rest
  (32 to 400 Base64 characters). Service account tokens of a Grafana instance (glsa_) are grafana_service_account_token.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glc_[A-Za-z0-9+/]{32,400}={0,3}$
examples:
- value: glc_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://grafana.com/docs/learning-paths/connect-agent-to-agent-observability/create-access-policy-and-token/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
