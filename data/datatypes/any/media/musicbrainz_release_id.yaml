id: musicbrainz_release_id
name: MusicBrainz release ID
status: draft
doc: 'MBID of a release in MusicBrainz: one edition of a release group, such as a CD, vinyl or digital
  release with its own date, country, label and barcode, as in musicbrainz.org/release/<id>.'
parent: musicbrainz_id
categories:
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
examples:
- value: 4f970f09-69ed-47bd-85e6-daf19347f17a
  description: 'Nuggets: Original Artyfacts from the First Psychedelic Era, 1965–1968'
- value: B10BBBFC-CF9E-42E0-BE17-E2C3E1D2600D
  valid: false
  description: Upper case; MusicBrainz writes MBIDs in lower case
mappings:
  wikidata: P5813
links:
- type: doc
  url: https://musicbrainz.org/doc/Release
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P5813
