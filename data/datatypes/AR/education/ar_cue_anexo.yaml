  url: https://www.argentina.gob.ar/educacion/evaluacion-e-informacion-educativa/padron-oficial-de-establecimientos-educativos
- type: doc
  url: https://data.buenosaires.gob.ar/dataset/establecimientos-educativos
translations:
  es:
    name: CUE-Anexo de un establecimiento educativo
