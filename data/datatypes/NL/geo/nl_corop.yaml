id: nl_corop
name: Dutch COROP region code
status: draft
doc: Code of one of the 40 COROP regions, the statistical regions of the Netherlands between province
  and municipality (NUTS 3), written as two digits 01-40 or with the CBS prefix CR (CR23).
categories:
- geo
- government
country:
- NL
langs:
- nl
is_pii: false
classification: identifier
regexp: ^(?:CR)?(?:0[1-9]|[1-3]\d|40)$
examples:
- value: '07'
  description: COROP region in a school register
- value: '40'
  description: COROP region in a school register
- value: CR23
  description: With the CBS prefix
- value: '41'
  valid: false
  description: There are 40 regions
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/COROP
translations:
  nl:
    name: COROP-gebied code
