id: iswc
name: International Standard Musical Work Code (ISWC)
status: draft
doc: ISO 15707 identifier of a musical work as a composition, apart from its recordings (which have ISRC
  codes) and editions. It is the letter T, a nine-digit work number and a check digit, usually printed
  as T-123.456.789-C; the dots and hyphens are optional. Collecting societies issue the numbers in sequence
  under CISAC, the registration authority, and the number says nothing about the work. The check digit
  is a weighted sum of the digits modulo 10, which the registry does not verify.
categories:
- objectids
- publishing
langs:
- common
is_pii: false
classification: identifier
regexp: ^T-?\d{3}\.?\d{3}\.?\d{3}-?\d$
examples:
- value: T-034.524.680-1
  description: Example from the Wikipedia article
- value: T-000.000.001-0
  description: The first ISWC
- value: T0000000010
  description: The first ISWC in compact form, as Wikidata stores it
- value: T-034.524.680
  valid: false
  description: No check digit
