id: saiban
name: Saudi IBAN
status: stable
doc: 'International Bank Account Number of a bank account in Saudi Arabia. It has 24 characters: the country
  code, two IBAN check digits and a two-digit bank code and an 18-character account number, as defined
  in the SWIFT IBAN registry.'
