id: snowflake
name: Snowflake sensitive data classification
category: pii
doc: 'Sensitive data classification in Snowflake samples the columns of tables and assigns each column
  a native semantic category, such as EMAIL, NATIONAL_IDENTIFIER or POSTAL_CODE, with a country-specific
  subcategory where one exists. Each category also has a privacy category: identifier, quasi-identifier
  or sensitive information. Results are stored as the SEMANTIC_CATEGORY and PRIVACY_CATEGORY tags.'
website: https://docs.snowflake.com/en/user-guide/classify-native
