is_pii: false
classification: categorical
examples:
- value: Totalmente de acuerdo
  description: Strongly agree, survey of researchers of the Universidad Nacional de Rosario
- value: Moderadamente en desacuerdo
  description: Moderately disagree, same survey
- value: Extremadamente probable
  description: Extremely likely, same survey
- value: A veces
  description: Sometimes, frequency item of the same survey
- value: Strongly disagree
- value: '4'
  valid: false
  description: a coded answer needs the codebook
