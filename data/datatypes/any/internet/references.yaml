id: references
name: References (Email Header)
status: stable
doc: 'Value of the References header of an email message (RFC 5322, section 3.6.4): the Message-IDs of
  the earlier messages of the thread, separated by whitespace. A reply copies the References of the message
  it answers and appends that message''s Message-ID, so mail clients can rebuild a thread even when some
  of its messages are missing.'
categories:
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^<[^<>@\s]+@[^<>@\s]+>(?:\s+<[^<>@\s]+@[^<>@\s]+>)*$
examples:
- value: <1234@local.machine.example> <3456@example.net>
  description: Second reply of the thread in RFC 5322, appendix A.2
- value: <1234@local.machine.example>
  description: First reply of the thread in RFC 5322, appendix A.2
- value: 1234@local.machine.example, 3456@example.net
  valid: false
  description: No angle brackets
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Message-ID
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc5322.html#section-3.6.4
translations:
  ru:
    name: Заголовок письма References
    doc: 'Значение заголовка References: Message-ID предыдущих писем цепочки через пробел (RFC 5322).'
