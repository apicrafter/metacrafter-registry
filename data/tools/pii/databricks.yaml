id: databricks
name: Databricks Unity Catalog data classification
category: pii
doc: Data classification in Databricks Unity Catalog scans the tables of a catalog with an AI agent and
  tags columns with classes such as class.email_address, class.iban_code or class.us_ssn. Global classes
  apply everywhere; regional classes for national identifiers are detected only in the matching cloud
  regions.
website: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification-tags
