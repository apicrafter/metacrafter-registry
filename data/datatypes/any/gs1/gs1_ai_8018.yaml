id: gs1_ai_8018
name: GSRN of a service recipient (GS1 AI 8018)
status: draft
doc: 'GS1 element string of Application Identifier (8018): ''8018'' followed by the 18-digit GSRN that
  identifies the relationship between an organisation offering services and the recipient of the services.
  GS1 format N4+N18. In the human-readable text under a barcode it is written as (8018) and the value.'
semantic_type: gsrn
langs:
- common
regexp: ^8018\d{18}$
examples:
- value: '8018952876500003104257'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '8018952876510000005891'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '801895287650000310425'
  valid: false
  description: Seventeen digits
mappings:
  gs1_ai: '8018'
links:
- type: doc
  url: https://ref.gs1.org/ai/8018
