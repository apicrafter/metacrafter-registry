id: shippo_api_token
name: Shippo API token
status: draft
doc: API token of the Shippo shipping API. Shippo documents that live tokens start with shippo_live_ and
  test tokens with shippo_test_; the regexp follows the gitleaks rule for the rest (40 hexadecimal digits).
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^shippo_(?:live|test)_[0-9a-fA-F]{40}$
examples:
- value: shippo_live_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://docs.goshippo.com/guides/authentication
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
