id: it_province
name: Italian province
status: draft
doc: Name of a province or metropolitan city of Italy, the level between the region and the comune, such
  as Milano, Napoli or Bolzano. In Sicily this level is formed by free municipal consortia and metropolitan
  cities, and in Friuli Venezia Giulia by decentralised regional entities. On 1 January 2026 Sardinia
  replaced the provinces of Sassari and Sud Sardegna with the metropolitan city of Sassari and the provinces
  of Gallura Nord-Est Sardegna, Ogliastra, Medio Campidano and Sulcis Iglesiente. Each has a two-letter
  abbreviation, the pattern it_province_code.
