id: ae_dubai_community
name: Dubai community
status: draft
doc: Name of a community of the emirate of Dubai, the planning and statistical subdivisions of its sectors
  (226 in the Dubai Statistics Center bulletin of 2021), in English or Arabic, such as Al Muteena, Al
  Barsha First or Hor Al Anz East. Dubai Municipality, RTA and DEWA files write them in capitals and in
  other transliterations (AL DAGHAYA for Al Dhagaya, MUHAISANAH FOURTH), with digits for the ordinals
  (Al Barsha 2) or without the ordinal (Al Qusais); the community number is ae_dubai_community_code.
