id: nl_onderwijsnummer
name: Dutch education number (onderwijsnummer)
status: stable
doc: Onderwijsnummer, the 9-digit number that the Dienst Uitvoering Onderwijs (DUO) gives to a pupil or
  student in government-funded education in the Netherlands who has no citizen service number (BSN), for
  example a pupil from abroad. It starts with 10 and uses the weights of the BSN 11-proef, but the weighted
  sum leaves a remainder of 5 when divided by 11 instead of 0, which tells the two numbers apart. When
  the pupil gets a BSN, the BSN replaces it in school records.
categories:
- pii
- persons
- education
country:
- NL
langs:
- nl
is_pii: true
classification: identifier
regexp: ^10\d{7}$
checksum: nl_onderwijsnummer
examples:
