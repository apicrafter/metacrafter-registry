id: word_count
name: Word count
status: draft
doc: Number of words in a text, such as an article, a chapter, a book or a post, as a non-negative integer.
  Tools count words differently (hyphenated words, numbers, words in scripts without spaces), so two counts
  of one text may differ. Any integer looks the same, so there is no regexp; detect the type by field
  names such as word_count, wordcount and words.
