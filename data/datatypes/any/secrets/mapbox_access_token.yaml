id: mapbox_access_token
name: Mapbox access token
status: draft
doc: 'Access token of the Mapbox APIs. Mapbox documents three kinds by prefix: public tokens (pk), meant
  to be embedded in client applications, secret tokens (sk) and temporary tokens (tk). The regexp applies
  to all three the structure that gitleaks checks for public tokens: the prefix, a dot, 60 letters and
  digits, a dot and 22 letters and digits.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:pk|sk|tk)\.[A-Za-z0-9]{60}\.[A-Za-z0-9]{22}$
examples:
- value: sk.
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://docs.mapbox.com/accounts/guides/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
