id: jwt
name: JSON Web Token (JWT)
status: draft
doc: 'Compact JSON Web Token (RFC 7519) signed with JWS: three Base64url parts (header, claims and signature)
  separated by dots. The header and the claims are JSON objects, so both parts start with ey. Used as
  bearer access tokens and ID tokens; the encrypted JWE form has five parts and is not covered.'
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^ey[A-Za-z0-9_-]+\.ey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*$
examples:
- value: eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJqb2UiLA0KICJleHAiOjEzMDA4MTkzODAsDQogImh0dHA6Ly9leGFtcGxlLmNvbS9pc19yb290Ijp0cnVlfQ.dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
  description: Example JWT from RFC 7519, section 3.1
- value: eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9
  valid: false
  description: Header part alone
links:
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc7519
- type: wikipedia
  url: https://en.wikipedia.org/wiki/JSON_Web_Token
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
