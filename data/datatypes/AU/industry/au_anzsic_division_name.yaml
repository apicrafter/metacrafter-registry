id: au_anzsic_division_name
name: ANZSIC division title (Australia and New Zealand)
status: draft
doc: 'Title of one of the 19 divisions of the Australian and New Zealand Standard Industrial Classification
  (ANZSIC 2006) without its letter: Agriculture, Forestry and Fishing; Mining; Manufacturing; Electricity,
  Gas, Water and Waste Services; Construction; Wholesale Trade; Retail Trade; Accommodation and Food Services;
  Transport, Postal and Warehousing; Information Media and Telecommunications; Financial and Insurance
  Services; Rental, Hiring and Real Estate Services; Professional, Scientific and Technical Services;
  Administrative and Support Services; Public Administration and Safety; Education and Training; Health
  Care and Social Assistance; Arts and Recreation Services; Other Services. ABS counts of businesses,
  council economic profiles and the CLUE tables write them, in any case and with & for and; the letter
  or a code with its title is au_anzsic_code.'
