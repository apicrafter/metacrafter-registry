id: li_phone
name: Liechtenstein phone number (E.164)
status: draft
doc: 'Phone number of Liechtenstein in international E.164 form: a plus sign, the country calling code
  +423 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- LI
langs:
- common
regexp: ^\+423(?:[68]\d{8}|(?:[2378]\d|90)\d{5})$
examples:
- value: '+4232345678'
  description: Example number from Google libphonenumber (fixed line)
- value: '+423660234567'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
