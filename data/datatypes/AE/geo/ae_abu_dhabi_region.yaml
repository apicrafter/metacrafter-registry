id: ae_abu_dhabi_region
name: Region of the emirate of Abu Dhabi
status: draft
doc: Name of one of the three regions of the emirate of Abu Dhabi, in English or Arabic, as the statistics
  of Abu Dhabi label their tables by region (Region, Region_AR) - Abu Dhabi (the capital region), Al Ain
  (the eastern region, العين) and Al Dhafra (الظفرة), called the Western Region (المنطقة الغربية, Al Gharbia)
  until 2017. Abu Dhabi is also the name of the emirate (ae_emirate) and of its capital city, and federal
  tables list Al Ain and Western Region beside the seven emirates.
