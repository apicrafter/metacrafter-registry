id: sha256crypt_hash
name: SHA-256-crypt password hash
status: draft
doc: 'Password hash of the SHA-256-based crypt scheme by Ulrich Drepper, in Modular Crypt Format: $5$,
  an optional rounds=N$ (5000 rounds by default), a salt of up to 16 characters, $ and 43 characters of
  crypt Base64.'
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^\$5\$(?:rounds=[1-9][0-9]+\$)?[^$:\n]{1,16}\$[./0-9A-Za-z]{43}$
examples:
- value: $5$saltstring$5B8vYYiY.CVt1RlTTf8KbXBH3hsxY/GNooZaBBGWEc5
  description: 'Test vector of the specification: Hello world! with the salt saltstring'
- value: $5$rounds=10000$saltstringsaltst$3xv.VbSHBb41AL9AvLeujZkZRBAwqFMz2.opqey6IcA
  description: Test vector of the specification with 10000 rounds
- value: $6$saltstring$svn8UoSVapNtMuq1ukKS4tPQd8iKwSMHWjl/O817G3uBnIFNjnQJuesI68u4OTLiBFdcbYEdFCoEOfaS35inz1
  valid: false
  description: SHA-512-crypt hash
links:
- type: doc
  url: https://www.akkadia.org/drepper/SHA-crypt.txt
- type: doc
  url: https://man.archlinux.org/man/crypt.5
