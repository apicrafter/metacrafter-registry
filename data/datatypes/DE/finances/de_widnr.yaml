  ru:
    name: Хозяйственный идентификационный номер Германии (W-IdNr.)
    doc: Постоянный налоговый номер предприятия или самозанятого, который BZSt выдаёт с ноября 2024 года,
      - DE, девять цифр как в номере плательщика НДС и пятизначный суффикс вида деятельности (-00001).
