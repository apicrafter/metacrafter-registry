id: political_party
name: Political party (name)
status: draft
doc: Name of a political party or of a registered group of candidates, as election results, candidate
  lists and lists of office holders give it (Australian Labor Party, Canberra Liberals, The Greens). Results
  tables add rows for independents and ungrouped candidates (Independent, Ungrouped) in the same field.
  The names are free text, so a value is a party in a field named after it (Party, Party/Group, party_name).
