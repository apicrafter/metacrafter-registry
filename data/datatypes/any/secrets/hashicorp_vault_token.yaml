  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/hashicorpvault/hashicorpvaulttoken/hashicorpvaulttoken.go
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/hashicorpvault/hashicorpvaultbatchtoken/hashicorpvaultbatchtoken.go
