id: coden
name: CODEN bibliographic code
status: draft
doc: Six-character code for the title of a periodical or non-serial publication, defined by ASTM E250
  and assigned by the International CODEN Service at Chemical Abstracts Service. For a periodical the
  first four letters come from the title and the fifth is a letter (traditionally A to F, but newer journals
  have others, such as NUTRHU for Nutrients); the sixth character is a check character. For non-serial
  publications such as conference proceedings the code starts with two digits. CODEN is common in chemistry
  and other science citations. Codes assigned before 1976 had five characters, without the check character;
  this format accepts only the six-character form.
categories:
- publishing
- science
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:[A-Z]{5}|\d{2}[A-Z]{3})[A-Z0-9]$
examples:
- value: NATUAS
  description: Nature
- value: TEREAU
  description: Technology Review
- value: NARHAD
  description: Nucleic Acids Research
- value: JASCDU
  description: Journal of the American Chemical Society (Wikidata example)
- value: NUTRHU
  description: Nutrients, a journal started in 2009
- value: 66HYAL
  description: Conference proceedings (non-serial publication)
- value: natuas
  valid: false
  description: CODEN always uses capital letters
mappings:
  wikidata: P1159
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/CODEN
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P1159
- type: doc
  url: https://cassi.cas.org/
translations:
