translations:
  ru:
    name: Лекарственная форма
    doc: Лекарственная форма препарата, например таблетки, капсулы, сироп или раствор для инъекций. Значения
      берутся из закрытого справочника; в России лекарственную форму указывают государственный реестр
      лекарственных средств (ГРЛС) и ЕСКЛП.
