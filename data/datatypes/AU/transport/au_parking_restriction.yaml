id: au_parking_restriction
name: Australian parking restriction (sign code)
status: draft
doc: 'Restriction of a parking bay or zone as Australian parking signs and council parking registers write
  it: the time limit in hours before P (1P, 2P, 1/2P, 1/4P), or P and minutes (P 10 Min, P5), with Meter,
  Ticket or Disabled Only for paid and reserved bays, the days and hours it applies (2P MTR M-SAT 7:30-18:30),
  and the zones Loading Zone (LZ 15), Clearway, No Stopping and No Parking. The City of Melbourne abbreviates
  half and quarter hour parking as HP and QP and its meter and ticket bays as MP2P and FP2P.'
