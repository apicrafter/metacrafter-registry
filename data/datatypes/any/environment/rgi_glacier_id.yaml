id: rgi_glacier_id
name: Randolph Glacier Inventory (RGI) 7.0 glacier ID
status: draft
doc: Identifier of a glacier or glacier complex in version 7.0 of the Randolph Glacier Inventory, a global
  set of glacier outlines taken from GLIMS for the target year 2000. It joins the target year, the version,
  the product (G glacier, C glacier complex), the two-digit first-order region and a sequence number counted
  from the westernmost outline of the region, as in RGI2000-v7.0-G-02-00003. The ids differ from those
  of RGI 6.0 and may change in later versions, so keep the version with the id.
categories:
- environment
- geo
langs:
- common
is_pii: false
classification: identifier
regexp: ^RGI2000-v7\.0-[GC]-(?:0[1-9]|1\d|20)-\d{5}$
examples:
- value: RGI2000-v7.0-G-02-00003
  description: Third glacier of region 02 (Western Canada and USA); RGI 7.0 user guide
- value: RGI2000-v7.0-C-11-00005
  description: Fifth glacier complex of region 11 (Central Europe); RGI 7.0 user guide
- value: RGI2000-v7.0-G-01_alaska
  valid: false
  description: Name of a regional file, not of a glacier
links:
- type: doc
  url: https://rgidata.org/user_guide/03_data_decription.html
- type: doc
  url: https://www.glims.org/RGI/
translations:
  ru:
    name: Идентификатор ледника в каталоге Randolph Glacier Inventory 7.0
    doc: 'Идентификатор ледника или ледникового комплекса в версии 7.0 каталога RGI: год, версия, продукт,
      регион и порядковый номер. В других версиях RGI идентификаторы другие.'
