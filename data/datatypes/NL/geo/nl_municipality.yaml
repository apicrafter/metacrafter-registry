id: nl_municipality
name: Dutch municipality (gemeente)
status: draft
doc: Name of a municipality (gemeente) of the Netherlands, the level below the province, such as Amsterdam,
  Aalsmeer or Aa en Hunze. Mergers have reduced their number almost every year; Statistics Netherlands
  (CBS) counts 342 on 1 January 2026, the same as in 2025. Their CBS codes are the pattern nl_municipality_code.
