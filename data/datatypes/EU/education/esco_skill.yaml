id: esco_skill
name: ESCO skill URI
status: draft
doc: URI of a skill, competence or knowledge concept in ESCO (European Skills, Competences, Qualifications
  and Occupations), the multilingual classification of the European Commission. The URI is http://data.europa.eu/esco/skill/
  followed by a lowercase UUID; Wikidata stores only the UUID. ESCO links each occupation (esco_occupation)
  to its essential and optional skills.
categories:
- education
country:
- EU
langs:
- common
is_pii: false
classification: categorical
regexp: ^https?://data\.europa\.eu/esco/skill/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
examples:
