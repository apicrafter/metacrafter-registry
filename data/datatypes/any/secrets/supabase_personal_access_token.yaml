id: supabase_personal_access_token
name: Supabase personal access token
status: draft
doc: Personal access token of the Supabase Management API and CLI. Supabase shows these tokens with the
  prefix sbp_ and documents that tokens created with a scope start with sbp_fc. The vendor does not document
  the length or the characters after the prefix; the regexp accepts letters and digits.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^sbp_[A-Za-z0-9_]+$
examples:
- value: sbp_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://supabase.com/docs/guides/platform/personal-access-tokens
