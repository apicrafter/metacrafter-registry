name: HESA institution identifier (INSTID)
status: draft
doc: INSTID, the identifier of a higher education provider that returns data to the Higher Education Statistics
  Agency (HESA) of the United Kingdom. ORG-ID.guide lists the register as GB-HESA; with that prefix an
  identifier reads GB-HESA-0177.
