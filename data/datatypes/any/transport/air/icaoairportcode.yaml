id: icaoairportcode
name: ICAO Airport code
status: stable
doc: 'The ICAO airport code or location indicator is a four-letter code designating aerodromes around
  the world. These codes, as defined by the International Civil Aviation Organization and published in
  ICAO Document 7910: Location Indicators, are used by air traffic control and airline operations such
  as flight planning.'
semantic_type: airport
categories:
- transport
langs:
- common
regexp: ([A-Z]{2}|[CKY][A-Z0-9])([A-Z]{2}|[0-9]{2,4})
examples:
- value: CYXK
  description: Rimouski Airport
- value: YBBN
  description: Brisbane Airport
mappings:
  wikidata: P239
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/ICAO_airport_code
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P239
