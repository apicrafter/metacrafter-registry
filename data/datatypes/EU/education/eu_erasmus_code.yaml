  url: https://eche-list.erasmuswithoutpaper.eu/docs/01_ECHE_DATA/02_ERASMUS.md
- type: doc
  url: https://wikis.ec.europa.eu/display/NAITDOC/ECHE+-+Erasmus+Charter+for+Higher+Education
