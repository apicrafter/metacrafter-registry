id: ru_banknote_serial
name: Russian rouble banknote serial number
status: draft
doc: Series and number printed on a Bank of Russia banknote. Notes of the 1997 design and its modifications
  have a two-letter series and a seven-digit number. The 200 and 2000 rouble notes of 2017 have a nine-digit
  number. The pattern accepts Cyrillic letters in either case and an optional space after the series.
categories:
- finances
country:
- RU
langs:
- ru
is_pii: false
classification: identifier
regexp: ^[А-Яа-я]{2} ?(?:\d{7}|\d{9})$
