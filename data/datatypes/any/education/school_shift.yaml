id: school_shift
name: School shift (session of the day)
status: draft
doc: 'Part of the day or of the week in which a school, a programme or a class works, in words: morning,
  afternoon, evening or full day. Latin American school and university registers call it jornada or turno:
  Mañana, Tarde, Diurna, Nocturna, Completa, Única, Fin de semana, Sabatina in Spanish; Matutino, Vespertino,
  Noturno, Integral in Portuguese. A school that runs two shifts has a record for each. How people attend
  (in person or online) is attendance_mode.'
