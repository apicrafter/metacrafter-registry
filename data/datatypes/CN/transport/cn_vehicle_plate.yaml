is_pii: false
classification: identifier
regexp: ^[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][A-Z][·• -]?(?:[A-HJ-NP-Z0-9]{5}|[A-HJKP][A-HJ-NP-Z0-9]\d{4}|\d{5}[A-HJK])$
