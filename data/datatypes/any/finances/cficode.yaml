id: cficode
name: Classification of Financial Instruments (ISO 10962)
status: stable
doc: ISO 10962, generally known as CFI (Classification of Financial Instruments) is a six-letter-code
  used in the financial services industry to classify and describe the structure and function of a financial
  instrument (in the form of security or contract). It is an international standard approved by the International
  Organization for Standardization (ISO)
categories:
- finances
langs:
- common
is_pii: false
classification: categorical
regexp: ^[A-Z]{6}$
examples:
- value: ESVUFR
  description: Equity, shares, voting, free, fully paid, registered
- value: FCEPNX
  description: Future, commodities, extraction resources, physical delivery, non-standardized
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/ISO_10962
- type: other
  url: https://www.iso.org/standard/81140.html
