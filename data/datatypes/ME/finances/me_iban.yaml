id: me_iban
name: Montenegrin IBAN
status: draft
doc: 'International Bank Account Number of a bank account in Montenegro. It has 22 characters: ME, two
  IBAN check digits, a 3-digit bank code, a 13-digit account number and two national check digits.'
parent: iban
categories:
- finances
country:
- ME
langs:
- common
is_pii: false
classification: identifier
regexp: '^ME\d{2}(?: ?\d{4}){4} ?\d{2}$'
checksum: iban_mod97
examples:
