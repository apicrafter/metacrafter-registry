id: discord_webhook_url
name: Discord webhook URL
status: draft
doc: 'URL of a Discord webhook: the API route /webhooks/<webhook id>/<webhook token> on discord.com. Anyone
  who knows the URL can post messages to the channel, so the URL itself is the secret. The regexp also
  accepts an API version in the path, the ptb and canary hosts and the former discordapp.com domain, as
  the pyWhat tool does.'
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^https://(?:(?:ptb|canary)\.)?discord(?:app)?\.com/api(?:/v[0-9]+)?/webhooks/[0-9]+/[A-Za-z0-9_-]+$
examples:
- value: https://discord.com/api/webhooks/
  valid: false
  description: Route without the webhook ID and token
links:
- type: doc
  url: https://docs.discord.com/developers/resources/webhook
- type: other
  url: https://github.com/bee-san/pyWhat/blob/main/pywhat/Data/regex.json
