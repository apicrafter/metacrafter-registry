id: gb_usrn
name: UK Unique Street Reference Number (USRN)
status: draft
doc: 'Eight-digit number of a street in the street gazetteers of Great Britain: the National Street Gazetteer
  of England and Wales and the Street Gazetteer of Scotland. Local authorities assign the numbers from
  ranges allocated to them, so the streets of one authority share the first digits (380 in Stirling).'
categories:
- geo
- transport
country:
- GB
langs:
- en
is_pii: false
classification: identifier
regexp: ^\d{8}$
examples:
- value: '47901305'
  description: Royal Crescent, Bath; example of Wikipedia
- value: '38002160'
  description: A street of Stirling
- value: '122046218'
  valid: false
  description: A UPRN, the number of a property
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Unique_Street_Reference_Number
- type: doc
  url: https://www.gov.uk/government/publications/open-standards-for-government/identifying-property-and-street-information
