id: content_id
name: Content item ID
status: draft
doc: Identifier of a content item, such as a page, node or entry, in a content management system. Drupal
  calls it a node ID; other systems call it a page, entry or content ID. Formats differ from system to
  system, so there is no regexp; metacrafter detects the type by field names such as content_id, cms_id,
  page_id and node_id. Not to be confused with YouTube Content ID, the copyright matching system.
categories:
- texts
langs:
