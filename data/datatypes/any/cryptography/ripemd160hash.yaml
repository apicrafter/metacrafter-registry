id: ripemd160hash
name: RIPEMD-160 hash
status: stable
doc: 'Digest of the RIPEMD-160 hash function (160 bits), used for example in Bitcoin addresses. It is
  written as 40 hexadecimal digits. SHA-1 and RIPEMD-160 digests have the same length, so the value alone
  does not tell them apart: use the field name or context.'
parent: hash
categories:
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-fA-F]{40}$
examples:
- value: 9c1185a5c5e9fc54612808977ee8f548b2258d31
  description: RIPEMD-160 hash of the empty string
- value: 8eb208f7e05d987a9b044a8e98c6b087f15a0bfc
  description: RIPEMD-160 hash of the string 'abc'
- value: 9c1185a5c5e9fc54612808977ee8f548b2258d3
  valid: false
  description: one hex digit short (39 instead of 40)
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/RIPEMD
- type: other
  url: https://homes.esat.kuleuven.be/~bosselae/ripemd160.html
