id: es_cups
name: Spanish energy supply point code (CUPS)
status: draft
doc: 'Código Unificado de Punto de Suministro, the identifier of an electricity or piped gas supply point
  in Spain. It has 20 or 22 characters: ES, a 4-digit distribution company code, a 12-digit supply point
  number, two check letters and, optionally, a border point digit and letter.'
categories:
- industry
country:
- ES
langs:
- es
is_pii: false
classification: identifier
regexp: ^ES\d{16}[A-Z]{2}(?:\d[A-Z])?$
examples:
- value: ES0341392425346906CP
  description: Synthetic number with a valid check digit
- value: ES0116359966285471RN
  description: Synthetic number with a valid check digit
- value: ES0341392425346906CP7
  valid: false
  description: One character too many
links:
