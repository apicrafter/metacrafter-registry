id: interest_rate
name: Interest rate
status: draft
doc: Rate of interest of a loan, a bond, a deposit or a credit line, written as a percentage (6,00%, 11.41
  %), as a reference rate and a spread over it (Badlar + 2%, LIBOR 12M + 3,70%, CER + 0,1%, EURIBOR 6M
  + 0.5%, SOFR + 150 bps), as a reference rate alone (BADLAR Bancos Privados) or in words (tasa fija anual
  del 21%, 30 % de la TNA del BNA). Public debt profiles, credit lines of development funds and bond lists
  have one per row. A percentage of another kind (a share, an inflation rate) is not one.
categories:
- finances
langs:
