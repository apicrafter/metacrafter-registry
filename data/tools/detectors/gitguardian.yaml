id: gitguardian
name: GitGuardian
category: detector
doc: Commercial secrets detection platform with the open-source ggshield command-line client. It scans
  git history, CI pipelines, containers and collaboration tools. Specific detectors target the credential
  format of one service, and many of them can check whether a found secret is still valid; generic detectors
  find passwords, high-entropy strings, authentication headers and JSON Web Tokens without knowing the
  issuer. The list of supported credentials had about 650 specific and 19 generic detectors in November
  2026; the supported types cover only the registry datatypes that match one of them.
website: https://docs.gitguardian.com/secrets-detection/secrets-detection-engine/detectors/supported_credentials
