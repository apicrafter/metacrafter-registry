id: metacrafter
name: metacrafter
category: detector
doc: Python command line tool and python engine to label table fields and fields in data files. It could
  help to find meaningful data in your tables and data files or to find Personal identifable information
  (PII). Its supported types are generated from the pinned metacrafter-rules release (data/coverage/metacrafter-rules.json);
  do not list them here.
website: https://github.com/apicrafter/metacrafter
