      le reste de la division des dix premiers par 97.
  de:
    name: Kartennummer des elektronischen Personalausweises (eID)
  ru:
    name: Номер бельгийской электронной ID-карты (eID)
    doc: Двенадцатизначный номер бельгийской карты eID (xxx-xxxxxxx-yy); последние две цифры - остаток
      от деления первых десяти на 97.
