id: ar_electricity_distributor
name: Argentine electricity distribution company
status: draft
doc: 'Name of a company or cooperative that distributes electricity to users in Argentina, as the regulators
  of the provinces (EPRE Mendoza) and the national ENRE list them in tables of users, tariffs, quality
  of service, networks and transformer stations: the provincial concessionaires and companies EDENOR,
  EDESUR, EDELAP, EPEC, EPE, EDEMSA, EDESTE, EDET, EJESA and the electricity cooperatives of smaller towns
  (Cooperativa Eléctrica de Godoy Cruz, CECSAGAL, Coop. Popular Rivadavia). Tables write them as acronyms
  (EDEMSA, E.D.E.M.S.A.), with Coop. or Cooperativa or by the town of the cooperative alone (GODOY CRUZ,
  ALTO VERDE, MONTE COMAN).'
