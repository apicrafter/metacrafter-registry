- en
- ru
is_pii: false
classification: categorical
examples:
- value: Капсулы
  description: Capsules, from the ESKLP catalogue
- value: Таблетки, покрытые оболочкой
  description: Coated tablets, from the ESKLP catalogue
- value: Раствор для внутривенного введения
  description: Solution for intravenous administration, from the ESKLP catalogue
- value: Капли гомеопатические
  description: Homeopathic drops, from the ESKLP catalogue
- value: Film-coated tablet
  description: EDQM Standard Term
- value: Capsule, hard
  description: EDQM Standard Term
- value: Solution for injection
  description: EDQM Standard Term
