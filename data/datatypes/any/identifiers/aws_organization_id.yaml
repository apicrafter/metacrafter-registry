id: aws_organization_id
name: AWS Organizations organization ID
status: draft
doc: 'Identifier of an organization in AWS Organizations: o- followed by 10 to 32 lowercase letters or
  digits. The regexp is the pattern from the AWS Organizations API reference.'
categories:
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: ^o-[a-z0-9]{10,32}$
examples:
- value: o-abc
  valid: false
  description: Fewer than 10 characters
links:
- type: doc
  url: https://docs.aws.amazon.com/organizations/latest/APIReference/API_Organization.html
