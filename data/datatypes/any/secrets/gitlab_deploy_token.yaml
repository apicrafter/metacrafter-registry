id: gitlab_deploy_token
name: GitLab deploy token
status: draft
doc: Token that gives read or write access to the repositories, container registry or package registry
  of one GitLab project or group, without a user account. GitLab gives these tokens the prefix gldt-,
  which cannot be configured. GitLab does not document the length; the regexp follows the gitleaks rule
  (20 characters after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^gldt-[A-Za-z0-9_-]{20}$
examples:
- value: gldt-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
