id: spotify_album_id
name: Spotify album ID
status: draft
doc: 'Spotify ID of an album or single, as in open.spotify.com/album/<id> and spotify:album:<id>: 22 letters
  and digits in base 62.'
parent: spotify_id
categories:
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9A-Za-z]{22}$
examples:
- value: 2WT1pbYjLJciAR26yMebkH
  description: The Dark Side of the Moon
- value: 1x6guHfwvOGsIQgRK5v5p1
  description: Thriller
- value: 3WrFJ7ztbogyGnTHbHJFl
  valid: false
  description: 21 characters, one too few
mappings:
