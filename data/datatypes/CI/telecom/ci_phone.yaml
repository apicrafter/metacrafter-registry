id: ci_phone
name: Côte d'Ivoire phone number (E.164)
status: draft
doc: 'Phone number of Côte d''Ivoire in international E.164 form: a plus sign, the country calling code
  +225 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- CI
langs:
- common
regexp: ^\+225(?:[02]\d{9})$
examples:
- value: '+2252123456789'
  description: Example number from Google libphonenumber (fixed line)
- value: '+2250123456789'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
