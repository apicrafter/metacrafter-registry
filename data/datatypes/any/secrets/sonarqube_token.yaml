id: sonarqube_token
name: SonarQube token
status: draft
doc: Token of SonarQube Server used to run an analysis or call the web API instead of a login and password.
  Current tokens start with one of the prefixes squ_, sqa_ and sqp_, which depend on the token type (user,
  global analysis or project analysis token), followed by 40 characters. Older tokens without a prefix
  are not covered by the regexp.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^sq[uap]_[A-Za-z0-9=_-]{40}$
examples:
- value: squ_example0example0example0example0example0
  description: Constructed, non-functional value
- value: example0example0example0example0example0
  valid: false
  description: No type prefix
links:
- type: doc
  url: https://docs.sonarsource.com/sonarqube-server/latest/user-guide/managing-tokens/
- type: doc
  url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/mes-partner-SonarQubeToken.html
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
