id: amazonmacie
name: Amazon Macie
category: pii
doc: Amazon Macie scans objects in Amazon S3 for sensitive data with managed data identifiers. They cover
  credentials and private keys, financial data such as card and bank account numbers, health identifiers,
  and personal identifiers such as passport, driver's license and tax numbers for a list of countries.
  Many identifiers report a match only when a keyword is near the value.
website: https://docs.aws.amazon.com/macie/latest/user/mdis-reference-quick.html
