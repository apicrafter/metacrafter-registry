id: eu_eic
name: Energy Identification Code (EIC)
status: draft
doc: Energy Identification Code, the 16-character code of the European electricity and gas sector for
  market participants, areas, metering points and other objects. It has a 2-character code of the issuing
  office, an object type letter, twelve characters for the object and a check character. Digits, capital
  letters and hyphens are used.
categories:
- industry
country:
- EU
langs:
- en
is_pii: false
classification: identifier
regexp: ^\d{2}[A-Z][0-9A-Z-]{12}[0-9A-Z]$
checksum: eu_eic
examples:
- value: 59Z000000001534U
  description: Real-world value published online
- value: 19XENIONENERGIAM
  description: Real-world value published online
- value: 59Z000000001534A
  valid: false
  description: Check digit does not match
