id: issn
name: International Standard Serial Number (ISSN)
status: stable
doc: The International Standard Serial Number (ISSN) is an eight-digit serial number used to uniquely
  identify a serial publication, such as a magazine. The ISSN is especially helpful in distinguishing
  between serials with the same title. ISSNs are used in ordering, cataloging, interlibrary loans, and
  other practices in connection with serial literature.
categories:
- objectids
- publishing
langs:
- common
is_pii: false
classification: identifier
regexp: \d{4}-\d{3}[\dX]|\d{8}
examples:
- value: 0317-8471
  description: Example ISSN
- value: 2049-3630
  description: Example ISSN
- value: 03178471
  description: ISSN without hyphen
