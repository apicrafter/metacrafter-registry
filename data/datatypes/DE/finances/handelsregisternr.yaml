  url: https://en.wikipedia.org/wiki/German_Trade_Register
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.de.handelsregisternummer.html
translations:
  de:
    name: Handelsregisternummer
  ru:
    name: Номер в торговом реестре Германии (Handelsregisternummer)
    doc: Номер записи в торговом реестре, который ведут участковые суды, - раздел (HRA для единоличных
      предпринимателей и товариществ, HRB для GmbH, AG и других корпораций) и номер до шести цифр. Номер
      уникален только вместе с названием суда.
