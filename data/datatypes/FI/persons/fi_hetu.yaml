id: fi_hetu
name: Finnish personal identity code (henkilötunnus)
status: draft
doc: Personal identity code of Finland (henkilötunnus, HETU; personbeteckning in Swedish). It has 11 characters,
  DDMMYYCZZZQ - the date of birth, a century sign (+ for the 1800s, - or U to Y for the 1900s, A to F
  for the 2000s), an individual number (odd for men, even for women; 900 to 999 for temporary codes) and
  a control character. The control character is the nine-digit number DDMMYYZZZ modulo 31, looked up in
  0123456789ABCDEFHJKLMNPRSTUVWXY.
categories:
- pii
- persons
country:
- FI
langs:
- fi
- sv
is_pii: true
classification: identifier
regexp: ^(?:0[1-9]|[12]\d|3[01])(?:0[1-9]|1[0-2])\d{2}[-+A-FU-Y]\d{3}[0-9A-FHJ-NPR-Y]$
checksum: fi_hetu
examples:
- value: 131052-308T
  description: worked example from Wikipedia, valid control character
- value: 131052-308U
  valid: false
  description: wrong control character
- value: 131052G308T
  valid: false
  description: G is not a century sign
mappings:
  google_dlp: FINLAND_NATIONAL_ID_NUMBER
  purview: Finland national ID
links:
