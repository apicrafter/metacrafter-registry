id: twilio_account_sid
name: Twilio Account SID
status: draft
doc: 'String identifier (SID) of a Twilio account: AC followed by 32 hexadecimal digits. It is the user
  name of Twilio API requests and is used together with the account''s auth token or with an API key,
  so an Account SID in code or data often means that a secret is nearby.'
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^AC[0-9a-fA-F]{32}$
examples:
- value: SMb7c0a2ce80504485a6f653a7110836f5
  valid: false
  description: Message SID from the Twilio glossary (prefix SM)
links:
- type: doc
  url: https://www.twilio.com/docs/glossary/what-is-a-sid
- type: other
  url: https://github.com/bee-san/pyWhat/blob/main/pywhat/Data/regex.json
