id: ioc_country_code
name: IOC country code
status: draft
doc: Three-letter code of a National Olympic Committee assigned by the International Olympic Committee.
  It is used in sports results and often differs from ISO 3166-1 alpha-3, such as GER for Germany.
categories:
- geo
langs:
- common
is_pii: false
classification: categorical
regexp: ^[A-Z]{3}$
examples:
- value: ASA
  description: American Samoa
- value: ITA
  description: Italy
- value: INA
  description: Indonesia
mappings:
  wikidata: P984
