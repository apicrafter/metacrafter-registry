id: iso4217curcode
name: ISO 4217 Currency code
status: stable
doc: Three-letter alphabetic code of a currency in ISO 4217, as in EUR or USD. The Russian classifier
  of currencies (OKV, okvalpha) uses the same codes.
semantic_type: currency
aliases:
- okvalpha
langs:
- common
regexp: ^[A-Z]{3}$
examples:
- value: XPD
  description: palladium
- value: EUR
  description: euro
- value: USD
  description: US dollar
- value: EURO
  valid: false
  description: four letters
- value: eur
  valid: false
  description: lowercase
mappings:
  autotype: currency
  cdm:
  - means.measurement.currencyCode
  - means.measurement.currency.iSOCode
  fibo: FND/Accounting/CurrencyAmount/CurrencyIdentifier
  wikidata: P498
  fta: CURRENCY_CODE.ISO-4217
  schema_org: currency
links:
- type: other
  url: https://www.iso.org/iso-4217-currency-codes.html
- type: wikipedia
  url: https://en.wikipedia.org/wiki/ISO_4217
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P498
translations:
  ru:
    name: Буквенный код валюты (ISO 4217, ОКВ)
