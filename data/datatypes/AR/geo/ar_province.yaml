id: ar_province
name: Argentine province
status: draft
doc: 'Name of one of the 23 provinces of Argentina or of the Ciudad Autónoma de Buenos Aires, the 24 first-level
  jurisdictions: Buenos Aires, Catamarca, Chaco, Chubut, Córdoba, Corrientes, Entre Ríos, Formosa, Jujuy,
  La Pampa, La Rioja, Mendoza, Misiones, Neuquén, Río Negro, Salta, San Juan, San Luis, Santa Cruz, Santa
  Fe, Santiago del Estero, Tierra del Fuego (Antártida e Islas del Atlántico Sur) and Tucumán. Tables
  write them with or without accents, in capitals (BUENOS AIRES in the connection points of the Red Federal
  de Fibra Óptica of ARSAT), with the word Provincia, or abbreviated (Sgo Del Estero, CABA, Capital Federal).
  The INDEC code of a province is ar_indec_province_code, its ISO 3166-2 letter iso3166code_part.'
