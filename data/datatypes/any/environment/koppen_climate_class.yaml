translations:
  ru:
    name: Класс климата по Кёппену — Гейгеру
    doc: Код типа климата в классификации Кёппена — Гейгера из двух или трёх букв, например Cfb или BWh.
      Первая буква обозначает основную группу климатов (A, B, C, D, E).
