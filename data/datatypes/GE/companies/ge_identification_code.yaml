id: ge_identification_code
name: Georgian legal entity identification code
status: draft
doc: Identification code (საიდენტიფიკაციო კოდი) of a legal entity in Georgia. The National Agency of Public
  Registry assigns it, and the Revenue Service uses the same code, which is also the VAT number. ORG-ID.guide
  lists it under GE-NAPR and GE-RS; with that prefix an identifier reads GE-NAPR-233105449.
