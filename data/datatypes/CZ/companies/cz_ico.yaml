id: cz_ico
name: Czech business identification number (IČO)
status: stable
doc: Identifikační číslo osoby (IČO), the eight-digit number that identifies a company, cooperative, association,
  public body or self-employed person in the Czech Republic. It was introduced on 1 January 1990. Registry
  courts assign it to companies, trade licensing offices to self-employed persons, and the Czech Statistical
  Office to the remaining economic subjects. Older, shorter numbers are padded with leading zeros. The
  last digit is a check digit (weights 8 to 2, modulo 11). Numbers can be looked up in ARES, the register
  of economic subjects. The DIČ of a legal entity is CZ followed by its IČO. ORG-ID.guide lists the register
  as CZ-ICO; with that prefix an identifier reads CZ-ICO-28179609.
