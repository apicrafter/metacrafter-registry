id: item_availability
name: Stock availability of an item (In Stock, Out of Stock, Pre-order)
status: draft
doc: 'Whether an item that a shop offers can be ordered and shipped: In Stock, Out of Stock, Sold Out,
  Pre-order, Backordered, Discontinued, Special Order, the number left (Only 2 left!) and the same in
  other languages (Auf Lager, En stock, Agotado, Op voorraad). Product lists, price comparisons and catalogs
  show it next to the price. The values of the schema.org enumeration ItemAvailability (InStock, OutOfStock,
  PreOrder, SoldOut) mark it up in product pages.'
