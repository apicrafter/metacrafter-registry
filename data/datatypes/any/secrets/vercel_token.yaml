id: vercel_token
name: Vercel access token
status: draft
doc: 'Access token or API key of Vercel. Vercel documents a prefix for each credential type: vcp_ for
  personal access tokens, vci_ for integration tokens, vca_ for app access tokens, vcr_ for app refresh
  tokens and vck_ for AI Gateway API keys. Older tokens have no prefix and are not covered. The vendor
  does not document the length or the characters after the prefix; the regexp accepts letters and digits.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^vc[piark]_[A-Za-z0-9]+$
examples:
- value: vcp_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://vercel.com/docs/accounts/access-tokens
- type: doc
  url: https://vercel.com/changelog/new-token-formats-and-secret-scanning
