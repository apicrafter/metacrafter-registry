id: st_phone
name: Sao Tome and Principe phone number (E.164)
status: draft
doc: 'Phone number of Sao Tome and Principe in international E.164 form: a plus sign, the country calling
  code +239 and the national number, with no spaces. The regexp follows the national number pattern of
  Google libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens
  are not covered.'
semantic_type: phone
country:
- ST
langs:
- common
regexp: ^\+239(?:(?:22|9\d)\d{5})$
examples:
- value: '+2392221234'
  description: Example number from Google libphonenumber (fixed line)
- value: '+2399812345'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
