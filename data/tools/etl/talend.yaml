id: talend
name: Talend (Qlik Talend Data Preparation, Data Catalog and Data Inventory)
category: etl
doc: Talend, now part of Qlik, suggests a semantic type for each column of a dataset. The types live in
  Talend Dictionary Service and are shared by Data Preparation, Data Inventory, Data Stewardship and Pipeline
  Designer. A type is either a list of values (for example ISO country and currency lists or INSEE lists
  of French communes), a regular expression, or a compound of other types. The predefined list covers
  names and titles, addresses and postal codes, phone numbers, card and bank numbers, national identifiers
  for France, Sweden, the UK and the US, and several kinds of URLs.
website: https://help.qlik.com/talend/en-US/data-preparation-user-guide/Cloud/predefined-semantic-types
