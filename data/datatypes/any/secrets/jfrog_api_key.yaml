id: jfrog_api_key
name: JFrog Artifactory API key
status: draft
doc: 'Deprecated API key of JFrog Artifactory: the prefix AKCp followed by 69 letters and digits (the
  format that the gitleaks secret scanner checks). JFrog replaced API keys with reference and access tokens,
  but old keys still appear in configuration files.'
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^AKCp[A-Za-z0-9]{69}$
examples:
- value: AKCpExampleTokenExampleTokenExampleTokenExampleTokenExampleTokenExampleTo
  description: Constructed, non-functional value
links:
- type: doc
  url: https://jfrog.com/help/r/platform-api-key-deprecation-and-the-new-reference-tokens
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
