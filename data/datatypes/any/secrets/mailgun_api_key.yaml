id: mailgun_api_key
name: Mailgun API key
status: draft
doc: Private API key of Mailgun, the password of HTTP Basic authentication with the user name api. The
  regexp covers the older form key- followed by 32 hexadecimal digits, as gitleaks checks it. Keys created
  later have a different form that Mailgun does not document, and they are not covered.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^key-[0-9a-f]{32}$
examples:
- value: key-
  valid: false
  description: Prefix without the key
links:
- type: doc
  url: https://documentation.mailgun.com/docs/mailgun/api-reference/authentication
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
