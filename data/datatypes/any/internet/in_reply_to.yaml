id: in_reply_to
name: In-Reply-To (Email Header)
status: stable
doc: 'Value of the In-Reply-To header of an email message (RFC 5322, section 3.6.4): the Message-ID of
  the message that this one answers, or several of them when it answers more than one. Each identifier
  is enclosed in angle brackets. Mail clients use it together with the References header to build conversation
  threads.'
categories:
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^<[^<>@\s]+@[^<>@\s]+>(?:\s+<[^<>@\s]+@[^<>@\s]+>)*$
examples:
- value: <1234@local.machine.example>
  description: Reply example of RFC 5322, appendix A.2
- value: <3456@example.net>
  description: Reply to the reply in RFC 5322, appendix A.2
- value: 1234@local.machine.example
  valid: false
  description: No angle brackets
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Message-ID
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc5322.html#section-3.6.4
translations:
  ru:
    name: Заголовок письма In-Reply-To
    doc: 'Значение заголовка In-Reply-To: Message-ID письма, на которое дан ответ (RFC 5322).'
