id: wifaddruncomp
name: Bitcoin private key in WIF (uncompressed public key)
status: stable
doc: 'Bitcoin private key in Wallet Import Format (WIF) for an uncompressed public key: the Base58Check
  encoding of the byte 0x80 and the 32-byte private key. Such keys have 51 characters and start with 5
  (5H, 5J or 5K). The value is a secret: whoever knows it can spend the funds. Testnet keys start with
  9 and are not matched; keys for a compressed public key are wifaddrcomp.'
parent: private_key
categories:
- cryptocurrency
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^5[HJK][1-9A-HJ-NP-Za-km-z]{49}$
checksum: base58check
examples:
- value: 5HueCGU8rMjxEXxiPuD5BDku4MkFqeZyd4dZ1jvhTVqvbTLvyTJ
  description: Sample key of the Bitcoin Wiki article on WIF; never import or fund it
- value: 5Hwgr3u458GLafKBgxtssHSPqJnYoGrSzgQsPwLFhLNYskDPyyA
  description: Example from https://allprivatekeys.com/bitcoin-address-format
- value: 5HueCGU8rMjxEXxiPuD5BDku4MkFqeZyd4dZ1jvhTVqvbTLvyTK
  valid: false
  description: last character changed, the checksum fails
links:
- type: other
  url: https://en.bitcoin.it/wiki/Wallet_import_format
- type: other
  url: https://allprivatekeys.com/bitcoin-address-format
translations:
  ru:
    name: Закрытый ключ Bitcoin в формате WIF (несжатый открытый ключ)
