id: azure_function_key
name: Azure Functions key
status: draft
doc: Function, host or master key of Azure Functions, sent as the code query parameter or the x-functions-key
  header to call an HTTP-triggered function. Keys in the identifiable format are 56 Base64url characters
  ending in == with the signature AzFu at positions 45 to 48. Older keys and URL-encoded keys are not
  covered. The regexp follows the pattern of the Microsoft security-utilities library; Microsoft Purview
  describes the same key.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9_-]{44}AzFu[A-Za-z0-9_-]{5}[AQgw]==$
mappings:
  purview:
  - Azure Function Master / API key
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-azure-function-master-api-key
- type: other
  url: https://github.com/microsoft/security-utilities/blob/main/GeneratedRegexPatterns/PreciselyClassifiedSecurityKeys.json
