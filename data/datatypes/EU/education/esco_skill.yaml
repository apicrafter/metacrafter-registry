  description: Sales argumentation
- value: http://data.europa.eu/esco/skill/f28617ad-afdd-4041-814c-216153a38998
  description: Analyse software specifications
- value: http://data.europa.eu/esco/occupation/f2b15a0e-e65a-438a-affb-29b9d50b77d1
  valid: false
  description: An occupation URI, not a skill
