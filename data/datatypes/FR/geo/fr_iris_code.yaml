id: fr_iris_code
name: French IRIS code (INSEE)
status: draft
doc: Code of an IRIS, the basic sub-municipal unit of INSEE statistics. It has 9 characters - the 5-character
  code of the commune (of the municipal arrondissement in Paris, Lyon and Marseille) followed by 4 digits.
  A commune that is not divided into IRIS counts as one IRIS with the suffix 0000.
categories:
- geo
- government
country:
- FR
langs:
- fr
is_pii: false
classification: categorical
regexp: ^(?:\d{2}|2[AB])\d{7}$
examples:
- value: '751156007'
  description: IRIS in Paris 15e arrondissement
- value: '940800304'
  description: IRIS in Vincennes
- value: '75115600'
  valid: false
  description: eight characters
links:
- type: doc
  url: https://www.insee.fr/fr/metadonnees/definition/c1523
- type: doc
  url: https://www.insee.fr/fr/statistiques/fichier/2383389/doc_utilisations_bases_infracommunales_2010.pdf
translations:
  fr:
    name: Code IRIS
  ru:
    name: Код IRIS (INSEE)
