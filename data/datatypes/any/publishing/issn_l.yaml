id: issn_l
name: Linking ISSN (ISSN-L)
status: draft
doc: 'ISSN chosen by the ISSN Network to group all media versions (print, online, CD-ROM) of one continuing
  resource. It is one of the ISSNs of the resource, usually the first one assigned, and has the same form
  and check digit: two groups of four characters, the last a check digit or X. It is written with a hyphen,
  often after the prefix ISSN-L.'
parent: issn
categories:
- publishing
- objectids
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9]{4}\-[0-9]{3}[0-9X]$
checksum: issn
examples:
- value: 0264-2875
  description: Dance Research
- value: 1748-7188
  description: Algorithms for Molecular Biology
- value: 0264-2876
  valid: false
  description: Dance Research with a wrong check digit
mappings:
