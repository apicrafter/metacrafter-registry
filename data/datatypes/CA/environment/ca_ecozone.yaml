id: ca_ecozone
name: Terrestrial ecozone of Canada
status: draft
doc: Name of one of the fifteen terrestrial ecozones of Canada, the top level of the Ecological Land Classification
  of Statistics Canada and of the National Ecological Framework for Canada (ecozones, ecoprovinces, ecoregions,
  ecodistricts). Field studies of lakes, soils, forests and wildlife give the ecozone of a sampling site
  in a field named Ecozone.
parent: category
categories:
