id: es_dni
name: Spanish national identity document number (DNI)
status: draft
doc: 'Documento Nacional de Identidad, the identity number of Spanish citizens: eight digits and a check
  letter. The same value is the person''s tax number (NIF). Foreigners receive an NIE instead.'
parent: esnif
categories:
- pii
- persons
country:
- ES
langs:
- es
is_pii: true
classification: identifier
regexp: ^\d{8}-?[A-Z]$
checksum: es_dni
examples:
- value: 12442144H
  description: Synthetic number with a valid check digit
- value: 85103532J
  description: Synthetic number with a valid check digit
- value: 12442144A
  valid: false
  description: Check digit does not match
