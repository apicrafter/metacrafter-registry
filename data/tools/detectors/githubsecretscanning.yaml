id: githubsecretscanning
name: GitHub secret scanning
category: detector
doc: Built-in GitHub service that scans repositories, issues, pull requests and discussions for committed
  credentials and can block pushes that contain them. Most patterns are provider-specific token formats,
  many of them supplied by the service providers through GitHub's partner program, which also lets providers
  revoke leaked tokens. A smaller set of generic patterns covers private keys, database connection strings
  and HTTP authentication headers, and passwords are found with an AI model. The reference page lists
  nearly 500 patterns; the supported types cover only the registry datatypes that match one of them.
website: https://docs.github.com/en/code-security/reference/secret-security/supported-secret-scanning-patterns
