id: vnpostcode
name: Vietnamese postal code
status: stable
doc: 'Postal code in Vietnam: five digits in the current system. Google''s address metadata also accepts
  six digits, and GeoNames lists the older six-digit format.'
semantic_type: postindex
categories:
- geo
country:
- VN
langs:
- vi
is_pii: false
classification: identifier
regexp: ^\d{5,6}$
examples:
- value: '70010'
- value: '55999'
- value: '7001'
  valid: false
  description: too short
mappings:
  dpv: pd:PostalCode
  schema_org: postalCode
links:
- type: other
  url: https://chromium-i18n.appspot.com/ssl-address/data/VN
