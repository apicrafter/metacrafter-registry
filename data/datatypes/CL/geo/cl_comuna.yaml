id: cl_comuna
name: Chilean commune (comuna)
status: draft
doc: Name of one of the 346 comunas of Chile, the third-level division below the 16 regions and 56 provinces
  and the unit of local government, each run by a municipalidad (Santiago, Maipú, Lo Barnechea, Til Til,
  Chillán, Temuco, Punta Arenas). Tables of projects, schools, health facilities and survey respondents
  give the comuna by name, in capitals or without accents (CONCEPCION), and some names have more than
  one spelling (Aysén and Aisén, Coyhaique and Coihaique, Til Til and Tiltil, Llay-Llay and Llaillay,
  Marchigüe and Marchihue, Treguaco and Trehuaco) or are replaced by the name of the seat (Puerto Natales
  for Natales, Puerto Saavedra for Saavedra). Many names repeat towns of other Spanish-speaking countries
  (Santiago, Concepción, San Pedro, Santa Cruz), so the field or the other values tell that a value is
  a comuna. The Código Único Territorial (CUT) of SUBDERE numbers the comunas with five digits, region,
  province and comuna (13101 Santiago).
