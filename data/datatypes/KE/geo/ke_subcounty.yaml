id: ke_subcounty
name: Kenyan sub-county
status: draft
doc: Name of a sub-county of Kenya, the division of a county that the national government administers
  and that the Kenya National Bureau of Statistics reports on, such as Changamwe, Kisauni, Lungalunga
  or Westlands; most match a constituency. Sub-county names repeat county names (Lamu West, Kitui Central)
  and common words (Central, East), so a column is told by its field name and the share of known names.
