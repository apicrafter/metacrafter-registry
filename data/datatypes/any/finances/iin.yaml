  url: https://en.wikipedia.org/wiki/ISO/IEC_7812
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Payment_card_number
translations:
  ru:
    name: Идентификатор эмитента платёжной карты (IIN, BIN)
