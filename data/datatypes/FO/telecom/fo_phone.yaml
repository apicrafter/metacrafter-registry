id: fo_phone
name: Faroe Islands phone number (E.164)
status: draft
doc: 'Phone number of Faroe Islands in international E.164 form: a plus sign, the country calling code
  +298 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- FO
langs:
- common
regexp: ^\+298(?:[2-9]\d{5})$
examples:
- value: '+298201234'
  description: Example number from Google libphonenumber (fixed line)
- value: '+298211234'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
