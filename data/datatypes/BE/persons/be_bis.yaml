id: be_bis
name: Belgian BIS number
status: draft
doc: 'BIS number (BIS-nummer, numéro BIS), the 11-digit number that the Crossroads Bank for Social Security
  (KSZ/BCSS) assigns to people who have a link with Belgium but are not in the National Register, such
  as cross-border workers, owners of property in Belgium and people with Belgian social security rights
  who live abroad. It is built like the national register number (benatcardid): date of birth as YYMMDD,
  a serial number (even for women, odd for men or when the sex is unknown) and two check digits modulo
  97, with a 2 put before the first nine digits for people born from 2000. The month is increased by 40
  when the sex was known at creation and by 20 when it was not, so it is 20 to 32 or 40 to 52. The date
  and sex reflect what was known when the number was created and are not updated.'
parent: be_insz
categories:
- pii
