id: operating_system
name: Operating system name
status: draft
doc: 'Name of the operating system of a computer or mobile device: Windows, macOS (Mac OS X in older exports),
  Linux, Android, iOS, Chrome OS. Web analytics and survey platforms read it from the user agent (user_agent)
  and keep it in fields named OSType, os, operating_system or platform, beside the browser (web_browser)
  and the device type (device_type); IT asset inventories record it for every machine. A name with a version
  (Windows 10, Android 13) is still this type.'
