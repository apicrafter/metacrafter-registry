id: gr_amka
name: Greek social security number (AMKA)
status: draft
doc: Αριθμός Μητρώου Κοινωνικής Ασφάλισης, the 11-digit social security registration number in Greece.
  It begins with the date of birth (DDMMYY), includes the sex and ends with a Luhn check digit.
