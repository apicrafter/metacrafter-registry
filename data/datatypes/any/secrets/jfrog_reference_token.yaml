id: jfrog_reference_token
name: JFrog reference token
status: draft
doc: 'Short token of the JFrog Platform (Artifactory) that refers to a full JWT access token. It has 64
  characters: the prefix cmVmd followed by 59 letters and digits. JFrog introduced it to replace API keys.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^cmVmd[A-Za-z0-9]{59}$
examples:
- value: cmVmdExampleTokenExampleTokenExampleTokenExampleTokenExampleToke
  description: Constructed, non-functional value
links:
- type: doc
  url: https://docs.jfrog.com/user-management/docs/identity-tokens
- type: doc
  url: https://jfrog.com/help/r/platform-api-key-deprecation-and-the-new-reference-tokens
