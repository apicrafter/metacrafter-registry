id: za_medicine_registration_number
name: South African medicine registration number
status: draft
doc: 'Registration number of a medicine with the South African regulator (the Medicines Control Council,
  now SAHPRA): a year or series code, the pharmacological class and a serial number separated by slashes,
  such as 29/20.1.1/0163 or A40/7.1.3/0123. Old medicines carry numbers like B675 (OM) or E875 (Act 101/1965).'
categories:
- medical
- identifiers
country:
- ZA
langs:
- en
is_pii: false
classification: identifier
regexp: ^(?:[A-Z]|\d{1,2}|[A-Z]\d{2})/\d{1,2}(?:\.\d{1,2}){0,3}/\d{2,4}$
examples:
- value: 29/20.1.1/0163
  description: Series 29, class 20.1.1
- value: 37/30.2/0252
  description: Class 30.2
- value: R/3.1/71
  description: A lettered series
- value: 29-20.1.1-0163
  valid: false
  description: Hyphens instead of slashes
links:
- type: doc
  url: https://www.sahpra.org.za/registered-health-products/
translations:
  ru:
    name: Регистрационный номер лекарства (ЮАР)
