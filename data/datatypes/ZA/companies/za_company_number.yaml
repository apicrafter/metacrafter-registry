id: za_company_number
name: South African company registration number (CIPC)
status: draft
doc: 'Registration number of a company at the Companies and Intellectual Property Commission (CIPC) of
  South Africa: the year of registration, a sequence number and a code for the type of company. ORG-ID.guide
  lists the register as ZA-CIP; with that prefix an identifier reads ZA-CIP-6713-713839-07.'
