id: grafana_service_account_token
name: Grafana service account token
status: draft
doc: 'Token of a Grafana service account, sent as a bearer token to the Grafana HTTP API: glsa_ followed
  by 32 letters and digits, an underscore and 8 hexadecimal digits.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}$
examples:
- value: glsa_ExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://grafana.com/docs/grafana/latest/administration/service-accounts/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/grafanaserviceaccount/grafanaserviceaccount.go
