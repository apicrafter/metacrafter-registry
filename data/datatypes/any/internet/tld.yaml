id: tld
name: Top level domain (TLD)
status: stable
doc: Last label of a domain name, the level directly below the DNS root, such as com, org, ru or de. Country-code
  TLDs have two letters and mostly follow ISO 3166-1 alpha-2 codes; generic TLDs such as com, info or
  app are longer. Internationalized TLDs are stored in Punycode form starting with xn--, such as xn--p1ai
  for .рф. IANA lists the delegated TLDs in the Root Zone Database. Data often writes a TLD with a leading
  dot, which the regexp allows; the regexp checks the form, not whether the TLD is delegated.
categories:
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^\.?(?:[A-Za-z]{2,63}|[Xx][Nn]--[A-Za-z0-9-]{1,59})$
examples:
- value: com
  description: Generic TLD
- value: .org
  description: Generic TLD written with a leading dot
- value: ru
  description: Country-code TLD of Russia
- value: xn--p1ai
  description: Internationalized country-code TLD .рф in Punycode
- value: example.com
  valid: false
  description: A domain name with two labels
- value: c
  valid: false
  description: One letter; TLDs have at least two characters
mappings:
  wikidata: P78
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Top-level_domain
- type: wikidata
  url: https://www.wikidata.org/wiki/Q14296
- type: doc
  url: https://www.iana.org/domains/root/db
translations:
  ru:
    name: Домен верхнего уровня (TLD)
    doc: Последняя метка доменного имени, например com, org или ru; национальные домены состоят из двух
      букв.
