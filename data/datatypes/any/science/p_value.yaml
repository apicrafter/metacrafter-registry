id: p_value
name: p-value of a statistical test
status: draft
doc: 'Probability, under the null hypothesis of a statistical test, of a result at least as extreme as
  the one observed: a number from 0 to 1, written as a decimal (0.023), without the leading zero (.05)
  or in scientific notation when it is very small (3.2e-08). Tables of results have one for every test:
  differential expression of genes, regression coefficients, comparisons of groups; the fields are named
  p-value, pvalue, p.value, pval or P, and values adjusted for multiple testing padj, FDR or q-value.
  A program may print a p-value too small to represent as 0. A number alone does not tell a p-value from
  another share or probability: the field name does.'
parent: numeric
categories:
- science
- values
langs:
- common
is_pii: false
classification: categorical
regexp: ^(?:0?[.,]\d+|[01]|1[.,]0+|\d(?:[.,]\d+)?[eE]-\d{1,3})$
examples:
- value: '0.023'
- value: '0.96'
- value: '3.2e-08'
  description: Scientific notation
- value: '1'
- value: '.05'
  description: Without the leading zero, as SPSS and Stata print it
- value: '1.5'
  valid: false
  description: Above one
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/P-value
