id: ru_bbk
name: BBK index (Library-Bibliographical Classification)
status: draft
doc: 'Index of ББК, the Library-Bibliographical Classification: the national library classification of
  Russia, developed by the Russian State Library, the National Library of Russia and the Library of the
  Russian Academy of Sciences. Books published in Russia print a BBK index next to the UDC number (udkindex),
  often followed by the author mark, as in 72 Д63. Indexes combine digits, Cyrillic letters and signs:
  territorial divisions in parentheses, form divisions after the letter я, as in 88я2 on a dictionary
  of psychology, and special divisions after a hyphen. The notation is too varied for a reliable format,
  so no regexp is given.'
