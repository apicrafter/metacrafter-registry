id: au_act_district
name: District of the Australian Capital Territory
status: draft
doc: 'Name of one of the nineteen districts of the ACT, the largest units of land division administered
  under the Districts Act 2002: Belconnen, Booth, Canberra Central, Coree, Cotter River, Gungahlin, Hall,
  Jerrabomberra, Kowen, Majura, Molonglo Valley, Mount Clear, Paddys River, Rendezvous Creek, Stromlo,
  Tennent, Tuggeranong, Weston Creek and Woden Valley. Districts are divided into divisions (suburbs,
  au_suburb), sections (au_act_section) and blocks (au_act_block). ACT registers also write a district
  in four capitals (BELC, CANB, GUNG, MOLO, TUGG); North Canberra and South Canberra are statistical areas
  of Canberra Central, not districts.'
