id: dkcprnum
name: CPR-Number, Personal identification number (Denmark)
status: stable
doc: 'The Danish Personal Identification number is a national identification number, which is part of
  the personal information stored in the Civil Registration System (Danish: Det Centrale Personregister,
  Greenlandic: Inunnik Qitiusumik Nalunaarsuiffik).'
categories:
- pii
- persons
country:
- DK
langs:
- da
is_pii: true
classification: identifier
regexp: ^(0[1-9]|[12]\d|3[01])(0[1-9]|1[0-2])\d{2}[-]?\d{4}$
mappings:
  google_dlp: DENMARK_CPR_NUMBER
  purview:
  - Denmark personal identification number
  - EU Social Security Number (SSN) or Equivalent ID
  - EU social security number or equivalent identification
  - EU national identification number
  - EU Tax Identification Number (TIN)
  - EU Tax identification number
  dpv: pd:OfficialID
  stdnum: dk.cpr
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Personal_identification_number_(Denmark)
