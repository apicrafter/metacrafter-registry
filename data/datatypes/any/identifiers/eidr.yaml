id: eidr
name: Entertainment Identifier Registry (EIDR)
status: stable
doc: The Entertainment Identifier Registry, or EIDR, is a global unique identifier system for a broad
  array of audio visual objects, including motion pictures, television, and radio programs.
parent: doi
categories:
- identifiers
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^10\.5240/(?:[0-9A-Z]{4}-){5}[0-9A-Z]$
examples:
- value: 10.5240/58DD-06EB-3EED-A705-EE28-7
  description: The Simpsons
- value: 10.5240/E058-3983-F191-9805-DD81-Q
  description: Never Say Never Again
- value: 10.1000/182
  valid: false
  description: DOI outside the EIDR prefix 10.5240
mappings:
  wikidata: P2704
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/EIDR
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P2704
- type: schema.org
  url: https://schema.org/editEIDR
- type: schema.org
  url: https://schema.org/titleEIDR
translations:
  ru:
    name: Код EIDR
    doc: Entertainment Identifier Registry ID
