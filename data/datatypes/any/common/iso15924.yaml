id: iso15924
name: ISO 15924 script code
status: draft
doc: Four-letter code of a writing system (script) in ISO 15924, written with an initial capital, such
  as Latn for Latin or Cyrl for Cyrillic. It is used in language tags (BCP 47) and in Unicode data.
categories:
- common
langs:
- common
is_pii: false
classification: categorical
regexp: ^[A-Z][a-z]{3}$
examples:
- value: Latg
  description: Gaelic type
- value: Jamo
  description: jamo
- value: Qaaa
  description: reserved for private use (start)
mappings:
  wikidata: P506
links:
