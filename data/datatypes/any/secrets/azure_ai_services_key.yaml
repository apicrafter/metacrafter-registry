id: azure_ai_services_key
name: Azure AI services key (Azure OpenAI, Cognitive Services)
status: draft
doc: Key of an Azure AI services resource, including Azure OpenAI and the former Cognitive Services, sent
  in the api-key or Ocp-Apim-Subscription-Key header. Keys in the current format have 84 letters and digits
  with the marker JQQJ99 after the first 52 characters and a service signature ending in COG (AAAAACOG
  for AI services, AAABACOG for Azure OpenAI, AAAEACOG for Cognitive Services). Older keys are 32 hexadecimal
  digits, which look like an MD5 hash, and are not covered. The regexp follows the pattern of the Microsoft
  security-utilities library; Microsoft Purview describes the same key.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9]{52}JQQJ99[A-Za-z0-9][A-L][A-Za-z0-9]{12}(?:AAAAACOG|AAABACOG|AAAEACOG)[A-Za-z0-9]{4}$
mappings:
  purview:
  - Azure Cognitive Service key
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-azure-cognitive-service-key
- type: other
  url: https://github.com/microsoft/security-utilities/blob/main/GeneratedRegexPatterns/PreciselyClassifiedSecurityKeys.json
