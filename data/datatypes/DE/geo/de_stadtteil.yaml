id: de_stadtteil
name: German city quarter (Stadtteil, Ortsteil)
status: draft
doc: 'Name or number of a Stadtteil or Ortsteil, a part of a German city or municipality below the Stadtbezirk:
  Pempelfort and Carlstadt in Düsseldorf, Bahnhofsviertel in Frankfurt, Golzheim in Merzenich. Cities
  number their quarters for statistics, so tables give the name, the number (014, 101) or both (014 Pempelfort,
  101 / Altstadt/Süd) in columns named Stadtteil, Ortsteil, Stadtteilname or Stadtteilnummer. Population,
  election and facility tables of city portals are broken down by it.'
