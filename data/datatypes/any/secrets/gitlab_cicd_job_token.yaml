id: gitlab_cicd_job_token
name: GitLab CI/CD job token
status: draft
doc: Short-lived token that GitLab creates for each CI/CD job (CI_JOB_TOKEN) to call the API and fetch
  artifacts and packages during the job. GitLab gives these tokens the prefix glcbt-, which cannot be
  configured. GitLab does not document the length; the regexp follows the gitleaks rule (one to five letters
  or digits, an underscore and 20 characters).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glcbt-[A-Za-z0-9]{1,5}_[A-Za-z0-9_-]{20}$
examples:
- value: glcbt-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
