id: gitlab_incoming_mail_token
name: GitLab incoming mail token
status: draft
doc: Token in the email address to which a user sends mail to create issues or merge requests in a GitLab
  project. GitLab gives these tokens the prefix glimt-, which cannot be configured. GitLab does not document
  the length; the regexp follows the gitleaks rule (25 characters after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glimt-[A-Za-z0-9_-]{25}$
examples:
- value: glimt-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
