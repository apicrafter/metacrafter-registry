id: icd10
name: Identifier in the ICD catalogue codes for diseases - Version 10 (ICD-10)
status: stable
doc: ICD-10 is the 10th revision of the International Statistical Classification of Diseases and Related
  Health Problems (ICD), a medical classification list by the World Health Organization (WHO).
categories:
- medical
langs:
- common
is_pii: false
classification: categorical
regexp: '[A-Z]\d{2}(\.\d{1,2})?'
examples:
- value: J11
  description: influenza
- value: R19.6
  description: halitosis
mappings:
  autotype: ICD10_correct
  google_dlp: ICD10_CODE
  wikidata: P494
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/ICD-10
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P494
translations:
  ru:
    name: МКБ-10
    doc: Международная статистическая классификация болезней и проблем, связанных со здоровьем, Десятого
      пересмотра (МКБ-10) — версия классификатора МКБ, разработанная в 1989 году, принятая ВОЗ в 1990
      году
