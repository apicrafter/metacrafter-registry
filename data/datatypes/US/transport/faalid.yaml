id: faalid
name: FAA airport code (FAA identifier)
status: stable
doc: The Federal Aviation Administration location identifier (FAA LID) is a three- to five-character alphanumeric
  code identifying aviation related facilities inside the United States, though some codes are reserved
  for, and are managed by other entities.
semantic_type: airport
categories:
- transport
country:
- US
langs:
- common
regexp: ^[A-Z0-9]{3,5}$
examples:
- value: '554'
  description: New Zealand
- value: '276'
  description: Germany
mappings:
  wikidata: P240
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/IATA_airport_code
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P240
