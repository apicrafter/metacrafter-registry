id: crime_type
name: Type of crime (Burglary, Robbery, Aggravated Assault)
status: draft
doc: 'The type or category of a crime or an offence, as crime statistics, police logs, campus security
  reports and open data of police forces give it: the offences of the Uniform Crime Reporting program
  of the FBI (Murder and Nonnegligent Manslaughter, Rape, Robbery, Aggravated Assault, Burglary, Larceny-Theft,
  Motor Vehicle Theft, Arson) and its other offences (Simple Assault, Vandalism, Fraud, Forgery, Drug
  Abuse Violations, Liquor Law Violations, DUI, Disorderly Conduct), the categories of police.uk (Anti-social
  behaviour, Criminal damage and arson, Violence and sexual offences, Shoplifting, Vehicle crime) and
  the like. Assault, Battery, Theft and Drugs alone are also other words and are matched only in a field
  named Crime, Offense or Primary Type.'
