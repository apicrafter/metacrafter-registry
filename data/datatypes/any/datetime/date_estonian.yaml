id: date_estonian
name: Date with a Estonian month name
status: draft
doc: Calendar date written in Estonian with the month name, day, month and year in the order of the CLDR
  long (d. MMMM y) and medium (d. MMM y) date formats of the et locale. The month is the CLDR wide or
  abbreviated name in the format context, written exactly as CLDR gives it, including any dot or apostrophe;
  no extra capitalisation variants are accepted.
semantic_type: date
langs:
- et
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01])\. (?:detsember|september|veebruar|oktoober|november|jaanuar|aprill|august|märts|juuli|juuni|mai)
  \d{4}|(?:0?[1-9]|[12]\d|3[01])\. (?:märts|juuli|veebr|juuni|dets|sept|jaan|mai|okt|aug|nov|apr) \d{4})$
examples:
- value: 3. oktoober 2024
  description: 3 October 2024, CLDR long format d. MMMM y
- value: 25. dets 2024
  description: 25 December 2024, CLDR medium format d. MMM y
- value: oktoober 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/et/ca-gregorian.json
