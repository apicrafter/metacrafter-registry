id: usdeanumber
name: USA DEA Registration (cerficicate) Number
status: stable
doc: A DEA number (DEA Registration Number) is an identifier assigned to a health care provider (such
  as a physician, physician assistant, nurse practitioner, optometrist, podiatrist, dentist, or veterinarian)
  by the United States Drug Enforcement Administration allowing them to write prescriptions for controlled
  substances.
categories:
- pii
- persons
- medical
country:
- US
langs:
- en
is_pii: true
classification: identifier
regexp: '[a-zA-Z]{2}\d{7}|[a-zA-Z]{1}9\d{7}'
mappings:
  autotype: dea
  google_dlp: US_DEA_NUMBER
  presidio: MEDICAL_LICENSE
  purview: Drug Enforcement Agency (DEA) number
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/DEA_number
