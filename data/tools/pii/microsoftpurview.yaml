id: microsoftpurview
name: Microsoft Purview Data Loss Prevention
category: pii
doc: 'Microsoft Purview (formerly Microsoft 365 compliance) finds sensitive data in Microsoft 365, endpoints
  and connected sources with built-in sensitive information types: national identifiers, financial data,
  credentials, medical terms and addresses. Each registry record lists the matching type names in mappings.purview.'
website: https://learn.microsoft.com/en-us/purview/sensitive-information-type-entity-definitions
