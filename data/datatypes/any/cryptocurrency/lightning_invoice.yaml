id: lightning_invoice
name: Lightning Network invoice (BOLT 11)
status: draft
doc: Payment request of the Lightning Network as defined by BOLT 11. The human-readable part is ln, the
  network (bc for Bitcoin mainnet, tb for testnet, tbs for signet, bcrt for regtest) and an optional amount
  with a multiplier (m, u, n or p). The Bech32 data part, without the 90-character limit of BIP 173, holds
  a timestamp, tagged fields such as the payment hash, description and expiry, and the signature of the
  payee. Invoices are written in lower case, or in upper case in QR codes.
categories:
- cryptocurrency
- finances
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:ln(?:bcrt|bc|tbs|tb)[0-9]*[munp]?1[02-9ac-hj-np-z]+|LN(?:BCRT|BC|TBS|TB)[0-9]*[MUNP]?1[02-9AC-HJ-NP-Z]+)$
checksum: bech32
