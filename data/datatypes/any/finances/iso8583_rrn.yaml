id: iso8583_rrn
name: Retrieval reference number (RRN, ISO 8583)
status: draft
doc: Reference number of a card transaction, data element 37 of an ISO 8583 message. It has 12 letters
  and digits. The acquirer sets it, and it stays the same in the request, the response and later reversals,
  so banks and merchants use it to find a payment.
categories:
- finances
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9]{12}$
