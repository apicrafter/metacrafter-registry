id: gb_ni_soa_code
name: Northern Ireland Super Output Area code
status: draft
doc: Code of one of the 890 Super Output Areas of Northern Ireland, the small areas of NISRA for the census
  and the Multiple Deprivation Measure. It is the code of the 1992 ward (gb_ni_ward_1992_code) that holds
  it, S and a number for a part of a ward or W1 for a whole ward, such as 95AA01S1 for Aldergrove_1.
parent: ukonscode
categories:
- geo
- government
country:
- GB
langs:
- common
is_pii: false
classification: identifier
regexp: ^95([A-Z])\1\d{2}[SW]\d$
examples:
- value: 95AA01S1
  description: Aldergrove_1
- value: 95AA02W1
  description: A whole ward
- value: 95AA01
  valid: false
  description: A ward code (gb_ni_ward_1992_code)
links:
- type: doc
  url: https://admin.opendatani.gov.uk/dataset/population-estimates-for-super-output-areas-soas-and-electoral-wards-northern-ireland
translations:
  ru:
    name: Код Super Output Area Северной Ирландии
