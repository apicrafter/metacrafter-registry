id: azureailanguage
name: Azure AI Language PII detection
category: pii
doc: Azure AI Language (now named Azure Language in Foundry Tools) has a PII detection API that uses NLP
  models to find personal data in text and conversation transcripts and can redact it. Callers pick entity
  types with the piiCategories request parameter. The types cover people, contact and location data, dates,
  financial identifiers, Azure credentials and connection strings, and a long list of country-specific
  government identifiers, many of which share names with Microsoft Purview sensitive information types.
  The list is on the Learn page of recognized PII entities.
website: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/concepts/entity-categories
