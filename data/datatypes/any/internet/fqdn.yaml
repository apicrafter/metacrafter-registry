id: fqdn
name: Fully qualified domain name (FQDN)
status: stable
doc: Complete domain name of a host or zone, written as labels separated by dots from the host up to the
  top-level domain, such as www.example.com. A trailing dot stands for the DNS root and is left out in
  most data. Each label has 1 to 63 letters, digits or hyphens and does not start or end with a hyphen,
  and the whole name has at most 253 characters (RFC 1035, RFC 1123). Internationalized names are stored
  as Punycode labels that start with xn--. The regexp requires at least two labels and rejects an all-numeric
  last label, so IPv4 addresses do not match.
categories:
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?=.{1,253}\.?$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+(?![0-9]+\.?$)[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.?$
examples:
- value: ec2-35-160-210-253.us-west-2.compute.amazonaws.com
  description: Amazon web services ec2 server
- value: xn--kxae4bafwg.xn--pxaix.gr
  description: Greek language national domain name
- value: did:web:w3c-ccg.github.io
  valid: false
  description: Decentralized identifier (DID); a colon is not allowed in a label
- value: https://www.example.com/path
  valid: false
  description: URL; a domain name has no scheme or path
- value: my host.example.com
  valid: false
  description: A label with a space
- value: ec2-35-160-210-253.us-west-2-.compute.amazonaws.com
  valid: false
  description: A label that ends with a hyphen
- value: 192.0.2.1
  valid: false
  description: IPv4 address; the top-level label must not be all-numeric
mappings:
  wikidata: P13337
  google_dlp: DOMAIN_NAME
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Fully_qualified_domain_name
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P13337
