id: github_fine_grained_pat
name: GitHub fine-grained personal access token
status: draft
doc: 'Fine-grained personal access token of GitHub, limited to selected repositories and permissions:
  github_pat_ followed by 82 letters, digits and underscores. Classic personal access tokens (ghp_) and
  GitHub''s other token types are in github_token.'
parent: github_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^github_pat_[A-Za-z0-9_]{82}$
examples:
- value: github_pat_ExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github
