id: co_cuin
name: Colombian unique institutional code (CUIN)
status: draft
doc: Código Único Institucional (CUIN), the 15-digit code that the Contaduría General de la Nación gives
  to public sector entities of Colombia. ORG-ID.guide lists the register as CO-CUIN; with that prefix
  an identifier reads CO-CUIN-311100000000027.
