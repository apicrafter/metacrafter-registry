id: ar_caba_subte_station
name: Buenos Aires Underground (Subte) station
status: draft
doc: 'Name of a station of the Buenos Aires Underground or of the Premetro: about 90 Subte stations on
  six lines and 18 Premetro stops, such as Plaza de Mayo, Congreso de Tucumán or Facultad de Medicina.
  The operator''s data write them in capitals, mostly without accents (CASTRO BARROS, SAENZ PEÑA), and
  many carry a second name (CALLAO - MAESTRO ALFREDO BRAVO, PASTEUR - AMIA). Stations of different lines
  share names (Callao, Pueyrredón, Independencia, Retiro), so tables give the line beside the station
  (ar_caba_subte_line).'
