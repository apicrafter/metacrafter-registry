id: pulumi_access_token
name: Pulumi access token
status: draft
doc: 'Access token of Pulumi Cloud (a personal, organization or team token): pul- followed by 40 hexadecimal
  digits.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^pul-[a-f0-9]{40}$
examples:
- value: pul-ExampleTokenNotReal
  valid: false
  description: Not hexadecimal and too short
links:
- type: doc
  url: https://www.pulumi.com/docs/administration/concepts/access-tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/pulumi/pulumi.go
