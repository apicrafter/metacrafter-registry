id: azure_devops_pat
name: Azure DevOps personal access token
status: draft
doc: Personal access token of Azure DevOps, used instead of a password for Git, the REST API and package
  feeds. Tokens in the current format have 84 letters and digits with the marker JQQJ99 after the first
  52 characters and the signature AZDO at positions 77 to 80. Older 52-character tokens are not covered.
  The regexp follows the pattern of the Microsoft security-utilities library; Microsoft Purview describes
  the same key.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9]{52}JQQJ99[A-Za-z0-9][A-L][A-Za-z0-9]{12}AAAAAZDO[A-Za-z0-9]{4}$
mappings:
  purview:
  - Azure DevOps personal access token
links:
