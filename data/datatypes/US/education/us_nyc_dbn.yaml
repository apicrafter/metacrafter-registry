id: us_nyc_dbn
name: New York City school code (DBN, district borough number)
status: draft
doc: 'Code of a school of the New York City Department of Education: the two-digit district, a borough
  letter (M Manhattan, X Bronx, K Brooklyn, Q Queens, R Staten Island) and the three-digit school number,
  such as 01M015. Districts 01 to 32 are the community school districts; 75, 79 and 84 are citywide districts.'
categories:
- education
- identifiers
country:
- US
langs:
- en
is_pii: false
classification: identifier
regexp: ^\d{2}[KMQRX]\d{3}$
examples:
- value: 01M015
  description: District 1, Manhattan, school 015
- value: 24Q600
  description: District 24, Queens
- value: 02M630
- value: 01A015
  valid: false
  description: A is not a borough letter
- value: 1M015
  valid: false
  description: The district has two digits
links:
- type: doc
