id: au_tern_cv_concept
name: TERN controlled vocabulary concept IRI
status: draft
doc: IRI of a concept of the TERN controlled vocabularies (TERN CV), the SKOS vocabularies of observable
  properties, methods, feature types and categorical values of the Terrestrial Ecosystem Research Network,
  http://linked.data.gov.au/def/tern-cv/ and a UUID. TERN data dictionaries link every field of a dataset
  to one (the URI or URL column); the TERN linked data viewer resolves them.
