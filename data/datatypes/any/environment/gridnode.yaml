id: gridnode
name: Grid node identifier
status: draft
doc: Generic type of an identifier of a node of an electric power grid, such as a substation, a pricing
  node of an electricity market or a balancing authority area. The metacrafter rules recognize it by column
  names such as grid_node, interconnect_node or balancing_authority. Each grid operator and market has
  its own codes, so this record has no regexp.
categories:
- energy
langs:
- en
is_pii: false
classification: identifier
