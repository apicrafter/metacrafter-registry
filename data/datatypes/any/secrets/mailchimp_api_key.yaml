id: mailchimp_api_key
name: Mailchimp API key
status: draft
doc: 'API key of the Mailchimp Marketing API: 32 hexadecimal digits, a hyphen and the data center of the
  account (for example us6), which is also the subdomain of the API endpoint.'
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-f]{32}-us[0-9]{1,2}$
examples:
- value: 0123456789abcdef0123456789abcdef
  valid: false
  description: No data center suffix
links:
- type: doc
  url: https://mailchimp.com/help/about-api-keys/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
