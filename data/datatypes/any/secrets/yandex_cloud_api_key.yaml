id: yandex_cloud_api_key
name: Yandex Cloud API key
status: draft
doc: API key of a Yandex Cloud service account. Yandex does not publish the format; the masked key in
  the Yandex Cloud documentation and the gitleaks rule both start with AQVN, and the regexp follows gitleaks
  for the rest (35 to 38 letters, digits, underscores and hyphens).
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^AQVN[A-Za-z0-9_-]{35,38}$
examples:
- value: AQVN
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://yandex.cloud/en/docs/iam/concepts/authorization/api-key
- type: doc
  url: https://yandex.cloud/en/docs/iam/operations/authentication/manage-api-keys
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
