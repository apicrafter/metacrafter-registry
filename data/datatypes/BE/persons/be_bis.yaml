- de
is_pii: true
classification: identifier
regexp: ^\d{2}\.?(?:[24]\d|[35][0-2])\.?(?:[0-2]\d|3[01])[-. ]?\d{3}[-. ]?\d{2}$
checksum: be_bis
examples:
- value: 76.47.03-285.95
  description: Synthetic number of a man born on 3 July 1976 whose sex was known (month 47)
- value: 09.23.11-065.81
  description: Synthetic number of a person born on 11 March 2009 whose sex was unknown (month 23)
- value: '76470328595'
  description: The first example without separators
- value: 76.47.03-285.96
  valid: false
  description: Check digits do not match
- value: 83.09.14-276.43
  valid: false
  description: National register number (month 01 to 12), not a BIS number
- value: 76.53.03-285.95
  valid: false
  description: Month 53 is not used
