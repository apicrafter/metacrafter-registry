id: clli
name: CLLI code (Common Language Location Identifier)
status: draft
doc: Code of the North American telecommunications industry, maintained by iconectiv (formerly Bellcore
  and Telcordia), that identifies telephone company buildings and the switches and other equipment in
  them. Four characters name the place and two the state, province or country; two more letters or digits
  name the building, which makes the 8-character site code, and three further characters name the equipment
  in an 11-character entity code.
categories:
- telecom
country:
- US
- CA
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?$
examples:
- value: HSTNTXMOCG0
  description: Switch CG0 in a building MO in Houston (HSTN), Texas (TX) (Wikipedia)
- value: PTLDOR12DS0
  description: First digital switch DS0 in building 12 in Portland (PTLD), Oregon (OR) (Wikipedia)
- value: PTLDOR12
  description: Site code of the building alone
- value: HSTN-TX-MO
  valid: false
  description: Separators are not part of the code
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/CLLI_code
translations:
  ru:
    name: Код CLLI (Common Language Location Identifier)
    doc: Код телекоммуникационной отрасли Северной Америки (ведёт iconectiv, ранее Bellcore и Telcordia),
      который обозначает здания телефонных компаний и установленные в них коммутаторы и другое оборудование.
      Четыре символа обозначают населённый пункт, два — штат, провинцию или страну, ещё два — здание;
      три следующих символа обозначают оборудование.
