id: datadogsds
name: Datadog Sensitive Data Scanner
category: pii
doc: Datadog service that finds and redacts sensitive data in logs, traces, RUM events and cloud storage.
  Its Scanning Rule Library holds predefined rules, each a regular expression with recommended keywords
  and, where one exists, a check-digit validation. The rules are grouped into secrets and credentials,
  payment card and banking information, personal identifiable information (mostly national identifiers
  of EU countries, the US, Brazil and Asia-Pacific) and network and device information. The library had
  about 500 rules in November 2026, most of them for service tokens.
website: https://docs.datadoghq.com/security/sensitive_data_scanner/scanning_rules/library_rules/
