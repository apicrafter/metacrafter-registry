id: it_iva
name: Italian VAT number (partita IVA)
status: stable
doc: 'Partita IVA, the 11-digit VAT number that the Agenzia delle Entrate gives in Italy: seven digits
  that number the taxpayer, the 3-digit code of the office that issued it and a Luhn check digit. The
  office code is 001 to 100, 120 or 121 for a tax office, mostly the ISTAT code of its province; 888 marks
  taxpayers under the franchise regime and 999 non-residents that identify themselves directly in Italy.
  In the EU form it has the IT prefix. For companies and other legal entities the 11 digits are also the
  fiscal code (codice fiscale).'
parent: vatin
categories:
- finances
country:
- IT
langs:
- it
is_pii: false
classification: identifier
regexp: ^(?:IT[ -]?)?\d{11}$
checksum: it_iva
examples:
- value: '61248020200'
  description: Synthetic number with a valid check digit
- value: '21360460394'
  description: Synthetic number with a valid check digit
- value: IT00743110157
  description: python-stdnum test value in the EU form
- value: '61248020201'
  valid: false
  description: Check digit does not match
- value: '00743115007'
  valid: false
  description: 500 is not an office code (python-stdnum test value with a valid Luhn digit)
