id: uri_with_password
name: URI with embedded password
status: draft
doc: URI whose user information part contains a password, as in scheme://user:password@host/. RFC 3986
  deprecates this form, but database and message broker connection URIs still use it. The user name may
  be empty, as in Redis URIs.
categories:
- secrets
- internet
langs:
- common
is_pii: true
classification: identifier
regexp: ^[A-Za-z][A-Za-z0-9+.-]*://[^\s:/?#@]*:[^\s/?#@]+@[^\s/?#]+(?:[/?#]\S*)?$
examples:
- value: postgresql://user:secret@localhost
  description: Example connection URI from the PostgreSQL documentation
- value: postgresql://user@localhost
  valid: false
  description: User name without a password
links:
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc3986#section-3.2.1
- type: doc
  url: https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING-URIS
