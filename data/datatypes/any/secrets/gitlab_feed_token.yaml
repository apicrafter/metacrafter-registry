id: gitlab_feed_token
name: GitLab feed token
status: draft
doc: Token in the URLs of GitLab RSS and Atom feeds and calendar feeds; it gives read access to the activity
  of the user. GitLab gives these tokens the prefix glft-, which cannot be configured. GitLab does not
  document the length; the regexp follows the gitleaks rule (20 characters after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glft-[A-Za-z0-9_-]{20}$
examples:
- value: glft-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
