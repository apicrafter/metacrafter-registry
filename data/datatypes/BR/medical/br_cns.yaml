id: br_cns
name: Brazilian national health card number (CNS)
status: draft
doc: Number of the Cartão Nacional de Saúde, the 15-digit identifier of a patient of the Brazilian Unified
  Health System (SUS), issued by the Ministry of Health and DATASUS. According to the ANS, numbers start
  with 1 or 2 (derived from the PIS base), 7 (generated by DATASUS) or 8 or 9 (generated locally). The
  DATASUS FHIR profile only requires 15 digits, which the regexp follows.
categories:
- medical
- pii
- persons
country:
- BR
langs:
- pt
is_pii: true
classification: identifier
regexp: ^\d{15}$
examples:
- value: '764602784845945'
  description: Synthetic value in the documented format
- value: '76460278484594'
  valid: false
  description: Fourteen digits
links:
- type: doc
  url: http://www.ans.gov.br/images/FAQ_CNS.pdf
translations:
