id: us_uei
name: Unique Entity ID (SAM.gov UEI)
status: draft
doc: Unique Entity ID (UEI), the 12-character identifier of an entity registered in the US System for
  Award Management (SAM.gov). It replaced the DUNS number as the identifier of federal award recipients
  in 2022. ORG-ID.guide lists the register as US-SAM; with that prefix an identifier reads US-SAM-YNDUZMUZF8H8.
categories:
- companies
- government
country:
- US
langs:
- en
is_pii: false
classification: identifier
