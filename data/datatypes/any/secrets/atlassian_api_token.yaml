id: atlassian_api_token
name: Atlassian API token
status: draft
doc: API token of an Atlassian account (Jira, Confluence and other Atlassian cloud products). Current
  tokens start with ATATT3; secret scanners expect 186 more letters, digits and the characters _ - =.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^ATATT3[A-Za-z0-9_=-]{186}$
examples:
- value: ATATT3ExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
