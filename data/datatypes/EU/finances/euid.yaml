id: euid
name: European Unique Identifier (EUID)
status: stable
doc: Identifier of a company or branch in the Business Registers Interconnection System (BRIS) of the
  EU and EEA. It joins a code of the Member State and of its domestic business register, a dot, and the
  company number in that register, for example CYDRCOR.HE139104 for a company in the Cyprus register of
  companies. The format of the registration number after the dot depends on the register. Implementing
  Regulation (EU) 2021/1042 defines its elements.
categories:
- finances
country:
- EU
langs:
- en
is_pii: false
classification: identifier
regexp: ^(?:ATBRA\.\d{6}-[01]{3}|BEKBOBCE\.[01]\d{3}\.\d{3}\.\d{3}|BGCOMREG\.\d{9}|CYDRCOR\.(?:AE|HE)\d{1,10}|CZVROR\.\d{8}|DE[A-Z][1-9]\d{3}[RV]?(?:_[A-Z][1-9]\d{3}[RV]?)?\.(?:G[ns]R|HR[AB]|[PV]R)\d+[A-Z]*|DKCVR\.\d{8}|EEARIREG\.\d{8}|ELGEMI\.\d{12}|ES[0-5]\d{4}\.\d{9}|FIFPRO\.\d{7}-\d|FR\d{4}\.\d{9}|HRSR\.\d{9}|HUOCCSZ\.\d{2}-\d{2}-\d{6}|IECRO\.\d{6,7}|ISREI\.[4-7]\d[01]\d{3}-\d{3}[09]|ITRI\.\d{11}|LIFL\.FL-\d{4}\.\d{3}\.\d{3}-\d|LTJAR\.\d{9}|LURCSL\.B\d{1,6}|LVUR\.(?:\d{9}|\d{11})|MTROC\.C\d{1,6}|NLNHR\.\d{8}|NOFOR\.\d{9}|PLKRS\.\d{10}|PTIRNMJ\.\d{9}|ROONRC\.[CFJ](?:\d{1,2}/\d{1,6}/\d{4}|\d{13})|SEBOLREG\.\d{10}|SIPRS\.\d{7}0{3}|SKORSR\.\d{1,18})$
examples:
- value: CYDRCOR.HE139104
  description: Company in the Cyprus register of companies (Wikidata P13790 example)
- value: DKCVR.11845118
  description: Company in the Danish CVR register (Wikidata P13790 example)
- value: DEX1517R.HRB395KI
  description: Company in the commercial register (HRB) of a German local court (Wikidata P13790 example)
- value: MTROC.C22796
  description: Company in the Malta Business Registry (Wikidata P13790 example)
- value: ELGEMI.077700527000
  description: Company in the Greek GEMI register (Wikidata P13790 example)
- value: BEKBOBCE.1014.559.919
  description: Enterprise in the Belgian Crossroads Bank for Enterprises (Wikidata P13790 example)
- value: CYDRCORHE139104
  valid: false
  description: Dot between the register code and the company number missing
- value: FR1234567890
  valid: false
  description: Country code and digits only, without a register code and a dot
