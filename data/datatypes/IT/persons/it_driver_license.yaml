id: it_driver_license
name: Italian driver's license number
status: draft
doc: 'Number of a driving licence issued in Italy (field 5 of the card). Licences issued by the central
  office of the Motorizzazione, such as duplicates after loss or theft, start with U1, followed by seven
  characters and a check letter; since November 2011 the seven characters are a letter (from B, without
  A, I, O and Q) and six digits. Licences of the provincial offices have two letters, seven digits and
  a letter, the other form that Presidio looks for. The regexp is the Microsoft Purview pattern, which
  covers both: a letter, a letter or digit, seven letters or digits and a final letter, optionally separated
  by spaces or hyphens.'
parent: driver_license
categories:
- pii
- persons
country:
- IT
langs:
- it
is_pii: true
classification: identifier
regexp: '^[A-Z][A-Z0-9](?: - | |-)?[A-Z0-9]{7}(?: - | |-)?[A-Z]$'
examples:
- value: U1B482613K
  description: Synthetic number in the form of the central office since November 2011
- value: AB4826137C
  description: Synthetic number in the provincial form that Presidio looks for
- value: U1B48261K
  valid: false
  description: Nine characters
mappings:
  purview:
  - Italy drivers license number
  - EU drivers license number
  presidio: IT_DRIVER_LICENSE
  dpv: pd:OfficialID
links:
