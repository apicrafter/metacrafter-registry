    name: Код ОКПД
    doc: Код по Общероссийскому классификатору продукции по видам экономической деятельности (ОКПД 2,
      ОК 034-2014 (КПЕС 2008)). Код содержит от 2 до 9 цифр; точки ставятся после второй, четвёртой и
      шестой цифр.
