id: au_rto_code
name: Registered training organisation (RTO) code
status: draft
doc: 'National code of a registered training organisation (RTO), a provider of vocational education and
  training (VET) registered by ASQA or a state regulator, as training.gov.au lists it: four or five digits,
  sometimes six, kept with leading zeros (0101 is the Canberra Institute of Technology). Spreadsheets
  often keep the leading zero by writing the code with an apostrophe or in quotes (''0101''). Four or
  five digits alone are also postcodes and other codes, so a value is an RTO code in a field named after
  it.'
parent: id
categories:
- education
- companies
country:
- AU
langs:
- common
is_pii: false
classification: identifier
regexp: ^\d{4,6}$
examples:
- value: '0101'
  description: Canberra Institute of Technology (training.gov.au)
- value: '90821'
  description: RTO of the ACT Skilled Capital qualification list
- value: '101'
  valid: false
  description: without the leading zero
links:
- type: doc
  url: https://training.gov.au/Organisation/Details/0101
translations:
  ru:
    name: Код зарегистрированной учебной организации (RTO, Австралия)
