id: br_capes_evaluation_area
name: CAPES evaluation area (Brazil)
status: draft
doc: One of the 49 evaluation areas into which CAPES groups the graduate programmes of Brazil for their
  evaluation every four years (ENGENHARIAS III, CIÊNCIAS BIOLÓGICAS I, ASTRONOMIA / FÍSICA, INTERDISCIPLINAR),
  each with a number (CD_AREA_AVALIACAO 1 to 50). Older data use earlier names (LETRAS / LINGUÍSTICA).
