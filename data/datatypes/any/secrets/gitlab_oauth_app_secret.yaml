id: gitlab_oauth_app_secret
name: GitLab OAuth application secret
status: draft
doc: Client secret of an OAuth application registered in GitLab. GitLab gives these tokens the prefix
  gloas-, which cannot be configured. GitLab does not document the length; the regexp follows the gitleaks
  rule (64 characters after the prefix).
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^gloas-[A-Za-z0-9_-]{64}$
examples:
- value: gloas-
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
