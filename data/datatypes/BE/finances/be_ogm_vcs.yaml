  description: Example from Dutch Wikipedia
- value: +++010/8068/17183+++
  description: Example from the python-stdnum documentation
- value: '***120/3004/81750***'
  description: Synthetic reference written with asterisks
- value: 450/0000/81595
  description: Synthetic reference without the plus signs
- value: +++090/9337/55494+++
  valid: false
  description: Check digits do not match
- value: +++090/9337/5549+++
  valid: false
