id: mk_municipality
name: Municipality of North Macedonia
status: draft
doc: 'Name of one of the 80 municipalities (општини) of North Macedonia under the territorial organisation
  of 2004, as amended in 2013, in Macedonian: Битола, Крушево, Демир Хисар, Маврово и Ростуша. Ten of
  them make up the City of Skopje (Аеродром, Бутел, Гази Баба, Ѓорче Петров, Карпош, Кисела Вода, Сарај,
  Центар, Чаир, Шуто Оризари). Tables of the national open data portal (data.gov.mk) give the municipality
  of a school, a company or a public building in a column named општина, also in capitals.'
