id: facebook_access_token
name: Meta (Facebook) Graph API access token
status: draft
doc: User, page or system user access token of the Meta (Facebook) Graph API. These tokens start with
  EAA followed by a long string of letters and digits. Meta does not publish the format; the regexp accepts
  EAA followed by at least 100 letters and digits, which covers the forms that gitleaks (EAAM or EAAC
  and 100 or more characters) and pyWhat expect. An app access token written as app ID|app secret is the
  datatype facebook_app_access_token.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^EAA[A-Za-z0-9]{100,}$
links:
- type: doc
  url: https://developers.facebook.com/docs/facebook-login/guides/access-tokens
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/bee-san/pyWhat/blob/main/pywhat/Data/regex.json
