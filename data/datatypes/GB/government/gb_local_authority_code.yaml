id: gb_local_authority_code
name: UK local authority register code
status: draft
doc: Three-letter code of a local authority in the local authority registers of the UK Government Digital
  Service for England, Northern Ireland, Scotland and Wales. The codes follow the second part of the ISO
  3166-2:GB subdivision codes where one exists. ORG-ID.guide lists it under GB-LAE, GB-LANI, GB-LAS and
  GB-PLA; with that prefix an identifier reads GB-LAE-WOT.
