id: twilio_api_key_sid
name: Twilio API key SID
status: draft
doc: 'String identifier (SID) of a Twilio API key: SK followed by 32 hexadecimal digits. The SID is used
  together with the API key secret as the user name and password of Twilio API requests, so a SID in code
  or data usually means that the secret is nearby.'
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^SK[0-9a-fA-F]{32}$
links:
- type: doc
  url: https://www.twilio.com/docs/glossary/what-is-a-sid
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
