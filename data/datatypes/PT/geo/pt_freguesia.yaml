id: pt_freguesia
name: Portuguese civil parish (freguesia)
status: draft
doc: Name of a civil parish (freguesia) of Portugal, the level below the municipality (pt_concelho), such
  as Valongo do Vouga, Santa Maria Maior or Arroios. Parishes merged in 2013 carry names of the form União
  das Freguesias de Águeda e Borralha, written UF Águeda e Borralha in many municipal geoportal layers.
  Its code is the six-digit form of pt_dicofre.
