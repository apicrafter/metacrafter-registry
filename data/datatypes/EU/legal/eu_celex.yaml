  url: https://en.wikipedia.org/wiki/EUR-Lex
- type: doc
  url: https://eur-lex.europa.eu/content/tools/TableOfSectors/types_of_documents_in_eurlex.html
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P476
