name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Validate registry sources
        run: metacrafter-registry validate

      - name: Tests
        run: pytest -q

  build:
    name: Build site and check URL contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Build
        run: metacrafter-registry build

      - name: Committed data/*_latest.* files are fresh
        run: |
          if ! git diff --quiet -- data/; then
            git diff --stat -- data/
            echo "::error::data/*_latest.json(l) are stale. Run 'metacrafter-registry build' and commit the result."
            exit 1
          fi

      - name: Internal links resolve
        run: metacrafter-registry check-links

      - name: URL contract on the built site (Pages-like local server)
        run: |
          metacrafter-registry serve --port 8089 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8089/ >/dev/null && break; sleep 0.5; done
          metacrafter-registry check-contract http://127.0.0.1:8089

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
