id: x509_certificate
name: X.509 certificate (PEM)
status: draft
doc: 'Public-key certificate in the PEM textual encoding of RFC 7468: the Base64 of the DER certificate
  between the lines -----BEGIN CERTIFICATE----- and -----END CERTIFICATE-----. Older tools also write
  the labels X509 CERTIFICATE or X.509 CERTIFICATE, and OpenSSL writes TRUSTED CERTIFICATE for a certificate
  with trust settings. A certificate holds a public key and is not secret.'
categories:
- cryptography
langs:
- common
is_pii: false
regexp: ^-----BEGIN (?:X509 |X\.509 |TRUSTED )?CERTIFICATE-----[\s\S]+-----END (?:X509 |X\.509 |TRUSTED
  )?CERTIFICATE-----$
