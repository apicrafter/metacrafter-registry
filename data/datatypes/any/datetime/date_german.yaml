id: date_german
name: Date with a German month name
status: draft
doc: 'Calendar date written in German with the month name, day first: 5. Mai 2022, 5 Mai 2022 or 5. Mär
  2022, optionally after the weekday (Donnerstag, 5. Mai 2022). The month is full or abbreviated, capitalised
  or in lower case. The month-first form Mai 5, 2022 is accepted too.'
semantic_type: date
langs:
- de
regexp: ^(?:(?:(?:[Mm]ontag|[Dd]ienstag|[Mm]ittwoch|[Dd]onnerstag|[Ff]reitag|[Ss]amstag|[Ss]onntag),?
  )?(?:0?[1-9]|[12]\d|3[01])\.? (?:[Jj]an(?:uar)?|[Ff]eb(?:ruar)?|[Mm]ärz?|[Aa]pr(?:il)?|[Mm]ai|[Jj]uni?|[Jj]uli?|[Aa]ug(?:ust)?|[Ss]ep(?:tember)?|[Oo]kt(?:ober)?|[Nn]ov(?:ember)?|[Dd]ez(?:ember)?)
  \d{4}|(?:[Jj]an(?:uar)?|[Ff]eb(?:ruar)?|[Mm]ärz?|[Aa]pr(?:il)?|[Mm]ai|[Jj]uni?|[Jj]uli?|[Aa]ug(?:ust)?|[Ss]ep(?:tember)?|[Oo]kt(?:ober)?|[Nn]ov(?:ember)?|[Dd]ez(?:ember)?)
  (?:0?[1-9]|[12]\d|3[01]), \d{4})$
examples:
- value: 25. Dezember 2024
  description: 25 December 2024
- value: Mittwoch, 25. Dezember 2024
  description: With the weekday
- value: 5. Mär 2022
  description: Abbreviated month
- value: Dezember 2024
  valid: false
- value: 25. December 2024
  valid: false
mappings:
  qddate:
  - dt:date:de_base
  - dt:date:de_base_lc
  - dt:date:de_weekday
  - dt:date:de_weekday_lc
  - dt:date:de_short
  - dt:date:de_short_lc
  - dt:date:de_rare_1
  - dt:date:de_rare_2
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Date_and_time_notation_in_Europe#Austria,_Germany,_Switzerland
- type: other
  url: https://github.com/ivbeg/qddate/blob/v1.1.0/qddate/patterns/de.py
translations:
  ru:
    name: Дата с немецким названием месяца
    doc: Календарная дата на немецком языке с названием месяца, например 5. Mai 2022.
