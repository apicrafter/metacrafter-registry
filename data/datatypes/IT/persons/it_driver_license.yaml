id: it_driver_license
name: Italian driver's license number
status: draft
doc: 'Number of a driving licence issued in Italy. Microsoft Purview looks for ten letters and digits:
  a letter, a letter or digit, seven letters or digits and a final letter, optionally separated by spaces
  or hyphens.'
categories:
- pii
- persons
country:
- IT
langs:
- it
is_pii: true
classification: identifier
regexp: '^[A-Z][A-Z0-9](?: - | |-)?[A-Z0-9]{7}(?: - | |-)?[A-Z]$'
mappings:
  purview:
  - Italy drivers license number
  - EU drivers license number
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-italy-drivers-license-number
