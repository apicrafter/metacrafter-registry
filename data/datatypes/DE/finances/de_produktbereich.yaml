id: de_produktbereich
name: Product area of a German municipal budget (Produktbereich)
status: draft
doc: 'Top level of the product structure of a municipal budget in double-entry accounting (in North Rhine-Westphalia
  the Neues Kommunales Finanzmanagement, NKF). A state fixes the product areas for all its municipalities:
  in North Rhine-Westphalia 01 Innere Verwaltung, 02 Sicherheit und Ordnung, 03 Schulträgeraufgaben, 05
  Soziale Leistungen, 07 Gesundheitsdienste and so on. Budget tables give the two-digit number, the name,
  often shortened, or both, in columns named Produktbereich. Some cities number the areas as the municipal
  finance statistics do (11 Innere Verwaltung, 12 Sicherheit und Ordnung, 21 Schulträgeraufgaben), and
  other states have their own frameworks. Product groups (Produktgruppe) and products below it are defined
  by each municipality and are not this type.'
