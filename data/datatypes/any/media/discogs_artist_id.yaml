id: discogs_artist_id
name: Discogs artist ID
status: draft
doc: Numeric identifier of an artist (a person, group or alias) in Discogs, the database and marketplace
  of music recordings, as in discogs.com/artist/<id>. Artists, labels, masters and releases are numbered
  separately, so the same number can name entities of different kinds, and the field name matters.
categories:
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^[1-9]\d{0,7}$
examples:
- value: '82730'
  description: The Beatles
- value: '45467'
  description: Pink Floyd
- value: '0'
  valid: false
  description: Discogs numbers start at 1
mappings:
  wikidata: P1953
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Discogs
- type: doc
  url: https://data.discogs.com/
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P1953
translations:
  ru:
    name: Идентификатор исполнителя в Discogs
