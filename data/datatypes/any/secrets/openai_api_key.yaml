id: openai_api_key
name: OpenAI API key
status: draft
doc: Secret key of the OpenAI API. Keys start with sk-; project, service account and admin keys start
  with sk-proj-, sk-svcacct- or sk-admin-. Secret scanners recognise them by the fixed marker T3BlbkFJ
  in the middle of the key. Examples are left out because GitHub push protection rejects token-shaped
  values, even constructed ones.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})|sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20})$
examples:
- value: sk-ExampleKeyNotReal000ExampleKeyNotReal000
  valid: false
  description: The T3BlbkFJ marker is missing
links:
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
