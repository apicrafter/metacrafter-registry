- value: '38422948'
  description: example from ORG-ID.guide
- value: '19280108'
  description: example from ORG-ID.guide
- value: '01566117'
  description: State University of Trade and Economics
- value: '20077720'
  description: Naftogaz of Ukraine
mappings:
