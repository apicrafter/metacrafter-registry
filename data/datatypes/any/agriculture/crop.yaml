id: crop
name: Crop (Corn, Wheat, Soybeans)
status: draft
doc: 'A plant grown on farms for food, feed, fibre, oil or fuel, as crop reports, agricultural statistics,
  farm budgets and planting tables name it: cereals (Corn or Maize, Wheat, Winter Wheat, Barley, Oats,
  Rice, Sorghum, Rye), oilseeds and pulses (Soybeans, Canola, Sunflower, Peanuts, Dry Beans, Lentils),
  fibre and industrial crops (Cotton, Sugar Beets, Sugarcane, Tobacco), forage (Alfalfa, Hay) and root
  crops (Potatoes, Cassava). Corn, Rice, Cotton, Hay and Potatoes are also foods, fabrics and a university,
  so they are matched only in a field named Crop or Commodity.'
