id: ibmknowledgecatalog
name: IBM Knowledge Catalog (IBM watsonx.data intelligence)
category: catalogs
doc: IBM Knowledge Catalog, now part of IBM watsonx.data intelligence, assigns data classes to table columns
  when it profiles data assets. More than 150 predefined data classes ship with the product; each one
  matches values or column names with a regular expression, a value list or a built-in Java classifier.
  They cover personal and financial identifiers, US state and Canadian province driver's licenses, codes
  such as ISO country and language codes, and generic classes such as Code, Identifier and Text. The table
  of classes and their matching criteria is published in the IBM documentation.
website: https://dataplatform.cloud.ibm.com/docs/content/governance/dmg_attr_classifier.html
