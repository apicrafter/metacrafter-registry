id: nl_onderwijsnummer
name: Dutch education number (onderwijsnummer)
status: draft
doc: Onderwijsnummer, the 9-digit number of pupils and students in the Netherlands who have no citizen
  service number (BSN). It starts with 10 and has a check similar to the BSN's.
categories:
- pii
- persons
- education
country:
- NL
langs:
- nl
is_pii: true
classification: identifier
regexp: ^10\d{7}$
examples:
- value: '108148380'
  description: Synthetic number with a valid check digit
- value: '109964543'
  description: Synthetic number with a valid check digit
- value: '1081483807'
  valid: false
  description: One character too many
