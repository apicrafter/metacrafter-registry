[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metacrafter-registry"
version = "1.3.0.dev0"
description = "Registry of semantic data types (identifiers, PII, codes) for the Metacrafter ecosystem: build, validation and static site."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ivan Begtin", email = "ivan@begtin.tech" }]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "cerberus>=1.3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://registry.apicrafter.io"
Repository = "https://github.com/apicrafter/metacrafter-registry"

[project.scripts]
metacrafter-registry = "metacrafter_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["metacrafter_registry*"]

[tool.setuptools.package-data]
metacrafter_registry = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_original", "analysis", "scripts", "src/registry.py", "src/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
