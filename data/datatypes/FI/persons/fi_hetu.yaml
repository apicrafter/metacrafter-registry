id: fi_hetu
name: Finnish personal identity code (HETU)
status: draft
doc: Henkilötunnus, the personal identity code of people registered in Finland. It is the date of birth
  (DDMMYY), a century sign (+ for the 1800s, - or one of Y, X, W, V, U for the 1900s, A to F for the 2000s),
  a 3-digit individual number (odd for men, even for women; 900 to 999 for temporary codes) and a check
  character - the nine-digit number DDMMYYZZZ modulo 31, looked up in 0123456789ABCDEFHJKLMNPRSTUVWXY.
categories:
- pii
- persons
country:
- FI
langs:
- fi
- sv
is_pii: true
classification: identifier
regexp: ^(?:0[1-9]|[12]\d|3[01])(?:0[1-9]|1[0-2])\d{2}[-+A-FU-Y]\d{3}[0-9A-FHJ-NPR-Y]$
checksum: fi_hetu
examples:
- value: 241060-268N
  description: Synthetic number with a valid check digit
- value: 271117A736D
  description: Synthetic number with a valid check digit
- value: 131052-308T
  description: Worked example from Wikipedia
- value: 131052-308U
  valid: false
  description: Check character does not match
- value: 241060-268N7
  valid: false
  description: One character too many
mappings:
  google_dlp: FINLAND_NATIONAL_ID_NUMBER
  purview:
  - Finland national ID
  - EU Social Security Number (SSN) or Equivalent ID
  - EU social security number or equivalent identification
  - EU national identification number
  - EU Tax Identification Number (TIN)
  - EU Tax identification number
