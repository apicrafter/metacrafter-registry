id: depersonalausweis
name: German identity card number (Personalausweis)
status: stable
doc: 'Serial number (Ausweisnummer) of a German identity card (Personalausweis). Cards issued since 1
  November 2010 have nine characters: a four-character code of the issuing authority and a five-character
  random number, from the digits and the consonants C, F, G, H, J, K, L, M, N, P, R, T, V, W, X, Y and
  Z (0 is no longer used since November 2021). Microsoft Purview expects the first character to be L,
  M, N, P, R, T, V, W, X or Y; in the machine-readable zone a check digit follows. Cards issued from April
  1987 to October 2010 have a nine-digit number and a check digit. The cards are produced by the Bundesdruckerei
  and issued by local registration offices and missions abroad.'
categories:
- pii
- persons
country:
- DE
langs:
- common
is_pii: true
classification: identifier
regexp: ^(?:[LMNPRTVWXY][0-9CFGHJKLMNPRTVWXYZ]{8}\d?D?|\d{10})$
examples:
- value: LF5HT23N4
  description: Synthetic number in the format used since 2010
- value: TGP2M723J5
  description: Synthetic number with its machine-readable zone check digit
- value: '5259324215'
  description: Synthetic number in the format used until 2010, with its check digit
- value: CJ383NJ2P
  valid: false
  description: Passport numbers start with C, F, G, H, J or K
- value: '525932421501'
  valid: false
  description: Twelve digits
mappings:
  google_dlp: GERMANY_IDENTITY_CARD_NUMBER
  presidio: DE_ID_CARD
  purview:
  - Germany identity card number
  - EU Social Security Number (SSN) or Equivalent ID
  - EU social security number or equivalent identification
  - EU national identification number
  dpv: pd:OfficialID
links:
