id: fccid
name: FCC ID (FCC equipment identifier)
status: stable
doc: Identifier of radio equipment certified by the Federal Communications Commission (FCC) of the United
  States for the US market; it is printed on the device label. It joins a grantee code, which the FCC
  assigns to the applicant, and a product code of 1 to 14 capital letters, digits or hyphens, which the
  applicant chooses. Grantee codes that start with a letter have three characters; those issued since
  May 2013 have five characters and start with a digit from 2 to 9. Wikidata property P7290 (FCC Product
  Code) holds only the product code part.
categories:
- telecom
country:
- US
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:[A-Z][A-Z0-9]{2}|[2-9][A-Z0-9]{4})[A-Z0-9-]{1,14}$
examples:
- value: BCGA1395
  description: iPad 2, model A1395; grantee code BCG (Apple), product code A1395
- value: BCG-E2381A
  description: iPad, model A1219; Wikidata records its product code as -E2381A
- value: 2ABCB-RPI4B
  description: Raspberry Pi 4 Model B; five-character grantee code 2ABCB
- value: FCC ID BCGA1395
  valid: false
  description: The label text and the space are not part of the identifier
mappings:
  wikidata: P7290
links:
- type: doc
  url: https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-2/subpart-J/subject-group-ECFR491b8ce5b4e7963/section-2.926
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P7290
translations:
  ru:
    name: FCC ID (идентификатор оборудования FCC)
    doc: Идентификатор радиооборудования, сертифицированного Федеральной комиссией по связи США (FCC)
      для рынка США; указывается на этикетке устройства. Состоит из кода заявителя, который присваивает
      FCC (3 символа с буквой в начале или, для кодов, выданных с мая 2013 года, 5 символов с цифрой от
      2 до 9 в начале), и кода продукта из 1–14 заглавных букв, цифр или дефисов, который выбирает заявитель.
