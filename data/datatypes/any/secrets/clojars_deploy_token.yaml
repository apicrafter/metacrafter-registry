id: clojars_deploy_token
name: Clojars deploy token
status: draft
doc: Token with which a build tool deploys artifacts to the Clojars repository instead of a password.
  Deploy tokens start with CLOJARS_, as the Clojars maintainers decided; the regexp follows the gitleaks
  rule (60 letters and digits after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^CLOJARS_[A-Za-z0-9]{60}$
examples:
- value: CLOJARS_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://github.com/clojars/clojars-web/issues/726
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
