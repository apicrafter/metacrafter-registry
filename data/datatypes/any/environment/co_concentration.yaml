id: co_concentration
name: Carbon monoxide concentration
status: draft
doc: 'Concentration of carbon monoxide (CO) in air, as air quality stations and gas sensors report it:
  in parts per million (ppm) or milligrams per cubic metre; standards use 8-hour means. The number is
  usually bare, with the unit in the column name or the metadata. A bare co column is as often a company,
  a county or Colorado, so the field name has the full name or a unit (co_ppm). A number alone does not
  tell this measure from another, so a value is one only in a field named after the gas (air quality observations
  of the City of Ballarat, Victoria).'
parent: numeric
categories:
- environment
- chemistry
- values
langs:
- common
is_pii: false
regexp: ^[-+]?\d+(?:[.,]\d+)?\s?(?:µg/m³|µg/m3|μg/m³|ug/m3|mg/m³|mg/m3|ppb|ppm)?$
examples:
- value: '41'
  description: parts per billion
- value: '37.5'
  description: one decimal
- value: 82 µg/m³
  description: with the unit
- value: CO
  valid: false
  description: the notation of the pollutant (air_pollutant), not a concentration
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Carbon_monoxide
translations:
  ru:
    name: Концентрация угарного газа
