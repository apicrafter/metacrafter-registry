doc: Name of the industry or economic sector in which a company or organization works, such as Communications
  or Retail. Values are free-text names or terms from a list chosen by the data publisher. Codes of an
  industry classification have their own records, such as isicrev4 (ISIC Rev. 4), eu_nace (NACE) and naicscode
  (NAICS).
