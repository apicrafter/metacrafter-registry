id: gs1_ai_415
name: GLN of the invoicing party (GS1 AI 415)
status: draft
doc: 'GS1 element string of Application Identifier (415): ''415'' followed by the 13-digit Global Location
  Number of the party that issued the invoice. GS1 format N3+N13. The GLN ends in a GS1 check digit. In
  the human-readable text under a barcode it is written as (415) and the value.'
semantic_type: gln
langs:
- common
regexp: ^415\d{13}$
examples:
- value: '4159528765000017'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '4159528765000253'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '415952876500001'
  valid: false
  description: Twelve-digit GLN
mappings:
  gs1_ai: '415'
links:
- type: doc
  url: https://ref.gs1.org/ai/415
