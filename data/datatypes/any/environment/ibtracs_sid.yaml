translations:
  ru:
    name: Идентификатор циклона в IBTrACS (SID)
    doc: Серийный идентификатор тропического циклона в архиве IBTrACS (NOAA NCEI) из 13 символов — год,
      день года, полушарие, широта и долгота зарождения циклона.
