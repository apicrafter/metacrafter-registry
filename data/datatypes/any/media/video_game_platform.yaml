id: video_game_platform
name: Video game platform
status: draft
doc: 'Console, handheld or computer system that a video game is released for: PlayStation 3, Xbox 360,
  Wii, Nintendo DS, PSP, Game Boy Advance, PC. Sales charts, reviews and game catalogues give one platform
  per row, often in the short forms of the trade (PS3, X360, DS, GBA, N64). The field name (platform,
  console, system, plataforma, piattaforma) together with a known list of platforms tells it from other
  meanings of platform (a mobile operating system, a social network).'
