id: iso3166code_compact
name: ISO 3166-2 subdivision code without a separator
status: draft
doc: Code of a country subdivision from ISO 3166-2 written without the hyphen between the two-letter country
  code and the subdivision part, as in UYAR for Artigas, Uruguay (UY-AR). Uruguayan open data writes department
  codes this way. Any short upper-case code has the same shape, so the form alone does not identify the
  type; the column name and the country do.
semantic_type: iso3166code
langs:
- common
regexp: ^[A-Z]{2}[A-Z0-9]{1,3}$
examples:
- value: UYAR
  description: Artigas, Uruguay (ISO 3166-2 UY-AR)
- value: UYMO
  description: Montevideo, Uruguay (ISO 3166-2 UY-MO)
- value: UY-AR
  valid: false
  description: The hyphenated form, covered by iso3166code
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/ISO_3166-2:UY
