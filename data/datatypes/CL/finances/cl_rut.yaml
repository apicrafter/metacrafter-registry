id: cl_rut
name: Chilean tax number (RUT, RUN)
status: draft
doc: Rol Único Tributario, the Chilean tax number. For people it is the same as the RUN (Rol Único Nacional),
  the national identification number. It has up to eight digits and a check character (a digit or K),
  and is usually written with dots and a hyphen.
categories:
- finances
- pii
country:
- CL
langs:
- es
is_pii: true
classification: identifier
regexp: ^\d{1,2}\.?\d{3}\.?\d{3}-?[0-9K]$
checksum: cl_rut
examples:
- value: 95566826K
  description: Synthetic number with a valid check digit
- value: '676347704'
  description: Synthetic number with a valid check digit
- value: 95.566.826-K
  description: The first example in its printed form
- value: 95566826K7
  valid: false
  description: One character too many
