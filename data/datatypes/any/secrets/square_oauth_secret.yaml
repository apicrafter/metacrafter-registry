id: square_oauth_secret
name: Square OAuth application secret
status: draft
doc: Application secret of a Square developer application, which the application uses to exchange OAuth
  authorization codes for access tokens. It starts with sq0csp- followed by 43 characters. It is a different
  credential from a Square access token. Examples are left out because GitHub push protection rejects
  token-shaped values, even constructed ones.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^sq0csp-[A-Za-z0-9_-]{43}$
examples:
- value: sq0csp-ExampleSecretTooShort
  valid: false
  description: Too short
links:
- type: other
  url: https://github.com/Yelp/detect-secrets/blob/master/detect_secrets/plugins/square_oauth.py
