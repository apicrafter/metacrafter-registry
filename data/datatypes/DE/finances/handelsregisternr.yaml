id: handelsregisternr
name: German commercial register number (Handelsregisternummer)
status: stable
doc: 'Number of an entry in the German commercial register (Handelsregister), which the local courts (Amtsgerichte)
  keep. It is the register section and a number of up to six digits: HRA for sole traders and partnerships
  such as OHG and KG, HRB for corporations such as GmbH and AG. Some courts add a letter suffix, as in
  HRB 12345 B. The cooperative (GnR), partnership (PR) and association (VR) registers number their entries
  the same way. A number is unique only together with the court, so it is often written after the court
  name, as in Aachen HRA 11223; python-stdnum validates only this full form. HRA entries can name natural
  persons (sole traders).'
categories:
- companies
- finances
country:
- DE
langs:
- de
is_pii: false
classification: identifier
regexp: '^(?:[A-ZÄÖÜ][A-Za-zÄÖÜäöüß.()/-]*(?: [A-Za-zÄÖÜäöüß.()/-]+)* )?(?:HRA|HRB|GnR|PR|VR) ?[1-9][0-9]{0,5}(?:
  ?[A-Z]{1,3})?$'
examples:
- value: HRA 11223
  description: python-stdnum reference value (court Aachen)
- value: HRB 12345 B
  description: Format of the court Berlin-Charlottenburg, with a suffix letter
- value: GnR 11223
  description: Cooperative register
- value: Aachen HRA 11223
  description: python-stdnum example, with the court
- value: Frankfurt/Oder GnR 11223
  description: python-stdnum example, cooperative register
- value: HRC 44123
  valid: false
  description: There is no section HRC
- value: H12345
  valid: false
  description: The section is HRA or HRB, not a single letter
- value: Aachen HRC 44123
  valid: false
  description: There is no section HRC (python-stdnum example)
mappings:
  orgid: DE-CR
  presidio: DE_HANDELSREGISTER
  stdnum: de.handelsregisternummer
links:
- type: doc
  url: https://www.handelsregister.de/
