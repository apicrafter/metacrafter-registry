id: it_iva
name: Italian VAT number (partita IVA)
status: draft
doc: 'Partita IVA, the 11-digit VAT number in Italy: seven digits that identify the taxpayer, a 3-digit
  tax office code (mostly the province code; 888 and 999 are used for special regimes and for non-residents)
  and a Luhn check digit. In the EU form it has the IT prefix. For companies the 11 digits are also the
  fiscal code.'
parent: vatin
categories:
- finances
