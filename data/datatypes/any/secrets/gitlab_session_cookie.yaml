id: gitlab_session_cookie
name: GitLab session cookie
status: draft
doc: Session cookie of the GitLab web interface, written as _gitlab_session=<value>. Whoever has the cookie
  is signed in as the user until the session ends. GitLab documents the cookie name; the regexp follows
  the gitleaks rule (32 lowercase letters and digits as the value).
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^_gitlab_session=[0-9a-z]{32}$
examples:
- value: _gitlab_session=
  valid: false
  description: Cookie name without the value
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
