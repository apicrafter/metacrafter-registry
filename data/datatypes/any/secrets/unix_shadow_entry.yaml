id: unix_shadow_entry
name: Unix shadow password file entry
status: draft
doc: 'One line of /etc/shadow on Linux and other Unix systems: nine colon-separated fields with the login
  name, the hashed password (or ! or * for a locked account), and the password ageing and expiry dates,
  counted in days since 1970-01-01.'
categories:
- secrets
langs:
- common
is_pii: true
classification: identifier
regexp: ^[^:\s]+:[^:\s]*:[0-9]*:[0-9]*:[0-9]*:[0-9]*:[0-9]*:[0-9]*:[^:\s]*$
examples:
- value: 'daemon:*:19000:0:99999:7:::'
  description: System account without a password
- value: 'example:$1$examples$9syBlMva027I.Vd2Z0JGl1:19000:0:99999:7:::'
  description: MD5-crypt hash of the word "example"
- value: root:x:0:0:root:/root:/bin/bash
  valid: false
  description: Line of /etc/passwd, which has seven fields
links:
- type: doc
  url: https://man7.org/linux/man-pages/man5/shadow.5.html
