id: sl_chiefdom
name: Sierra Leonean chiefdom
status: draft
doc: Name of a chiefdom of Sierra Leone, the third-level division under the districts in the provinces,
  headed by a paramount chief, such as Kpeje Bongre, Penguia, Barri or Panga Kabonde; urban areas such
  as Freetown are wards instead. The chiefdoms are the admin 3 units of the OCHA common operational datasets
  (Adm3_Name) and are split into sections.
