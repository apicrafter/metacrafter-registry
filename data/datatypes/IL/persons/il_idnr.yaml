id: il_idnr
name: Israeli identity number (Mispar Zehut)
status: draft
doc: Mispar Zehut (מספר זהות), the 9-digit identity number given to Israeli citizens at birth. The last
  digit is a Luhn check digit; leading zeros are sometimes left out.
categories:
- pii
- persons
country:
- IL
langs:
- he
is_pii: true
classification: identifier
regexp: ^\d{8}-?\d$
checksum: luhn
examples:
- value: '106814593'
  description: Synthetic number with a valid check digit
- value: '221991706'
  description: Synthetic number with a valid check digit
- value: 10681459-3
  description: The first example in its printed form
- value: '106814590'
  valid: false
  description: Check digit does not match
mappings:
  purview:
  - Israel National ID
  - Israel national identification number
  dpv: pd:OfficialID
  stdnum: il.idnr
links:
