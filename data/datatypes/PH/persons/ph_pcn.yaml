id: ph_pcn
name: Philippine PhilSys Card Number (PCN)
status: draft
doc: PhilSys Card Number, the public 16-digit number printed on the front of the PhilID card. It is a
  tokenized form of the confidential PhilSys Number and is the number to give in transactions. It changes
  when the card is replaced. The regexp describes the compact form; a grouping of the digits is not documented.
categories:
- pii
- persons
country:
- PH
langs:
- common
is_pii: true
classification: identifier
regexp: ^\d{16}$
examples:
- value: '4290771630582194'
  description: Synthetic value in the documented format
- value: '429077163058219'
  valid: false
  description: Fifteen digits instead of sixteen
