id: ordinal_number
name: Ordinal number in English (1st, 2nd, 3rd)
status: draft
doc: 'Number written as an English ordinal with its suffix: 1st, 2nd, 3rd, 4th, 11th, 22nd, 103rd. Tables
  of results, rankings, percentiles, draft rounds, periods of games and school grades write ranks and
  positions this way (1st Place, T-3rd for a tie). The suffix follows the last digit, except 11th, 12th
  and 13th.'
categories:
- values
langs:
- en
is_pii: false
classification: categorical
regexp: ^(?:\d*1[1-3]th|(?:\d*[02-9])?1st|(?:\d*[02-9])?2nd|(?:\d*[02-9])?3rd|\d*[04-9]th)$
examples:
- value: 1st
- value: 2nd
- value: 3rd
- value: 4th
- value: 11th
- value: 22nd
- value: 103rd
- value: 11st
  valid: false
  description: a wrong suffix
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Ordinal_numeral
- type: wikipedia
  url: https://en.wikipedia.org/wiki/English_numerals
translations:
