id: runpa
name: Russian regulatory legal act
status: draft
doc: 'Reference to a Russian legal act: its requisites (kind, issuing body, date and number), its title,
  or both. Legal information systems write the requisites as Федеральный закон от 15.07.1995 № 101-ФЗ.
  The title usually starts with О or Об, for example О международных договорах Российской Федерации. The
  parts of a reference have their own types: ru_federal_law_number for the number of a federal law, runpakind
  for the kind of act.'
