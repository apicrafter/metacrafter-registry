id: onepassword_service_account_token
name: 1Password service account token
status: draft
doc: Token of a 1Password service account. 1Password gives it the prefix ops_ so that code analyzers can
  find it; the rest is a Base64-encoded JSON object with the account's sign-in details and keys, so the
  token starts with ops_eyJ and is several hundred characters long.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^ops_eyJ[A-Za-z0-9+/]{250,}={0,3}$
examples:
- value: ops_eyJExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://www.1password.dev/service-accounts/security
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
