translations:
  cs:
    name: Česká IBAN
    doc: Mezinárodní číslo bankovního účtu - 24 znaků - CZ, dvě kontrolní číslice, kód banky a šestnáctimístný
      identifikátor účtu (předčíslí a číslo účtu).
  ru:
    name: IBAN Чехии
    doc: Международный номер банковского счёта в Чехии - 24 символа - CZ, две контрольные цифры, четырёхзначный
      код банка и шестнадцатизначный идентификатор счёта.
