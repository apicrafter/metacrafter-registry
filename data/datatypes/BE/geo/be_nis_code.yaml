id: be_nis_code
name: Belgian NIS code (REFNIS)
status: stable
doc: 'Five-digit code of a Belgian administrative area in the REFNIS nomenclature of Statbel, the Belgian
  statistical office (formerly NIS/INS), used since the 1970 census. The first digit is the province,
  the second the arrondissement and the last three the municipality: 40000 is the province of East Flanders,
  44000 the arrondissement of Ghent and 44021 the city of Ghent. The two provinces created when Brabant
  was split in 1995 have 20001 (Flemish Brabant) and 20002 (Walloon Brabant). 01000 is Belgium and 02000,
  03000 and 04000 are the Flemish, Walloon and Brussels-Capital regions. A merged municipality gets a
  new code, so codes change with mergers (2019, 2025). A letter after the code denotes a former municipality
  (deelgemeente, section) of a merged one, as in 71022E (Stokrooie, part of Hasselt).'
categories:
- geo
country:
- BE
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:[1-9]\d[01]\d{2}[A-HJ-NP-Y]?|0[1-4]000)$
examples:
- value: '40000'
  description: Province of East Flanders, an example of Wikidata P1567
- value: '44021'
  description: Ghent, an example of Wikidata P1567
- value: '20001'
  description: Province of Flemish Brabant
- value: '04000'
  description: Brussels-Capital Region
- value: 71022E
  description: Stokrooie, a section of Hasselt
- value: 57081J
  description: Gaurain-Ramecroix, a section of Tournai
- value: '4402'
  valid: false
  description: Four digits
- value: '05000'
  valid: false
  description: Not a region code
mappings:
  wikidata: P1567
