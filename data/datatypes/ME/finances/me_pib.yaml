id: me_pib
name: Montenegrin tax identification number (PIB)
status: draft
doc: 'Poreski identifikacioni broj (PIB), the tax identification number of companies and other organisations
  in Montenegro: eight digits, the last of which is a check digit. ORG-ID.guide lists the register as
  ME-PIB; with that prefix an identifier reads ME-PIB-02655284.'
categories:
- finances
- companies
country:
- ME
langs:
- sr
is_pii: true
classification: identifier
regexp: ^\d{8}$
examples:
- value: 02655284
  description: python-stdnum example
- value: 0265528
  valid: false
  description: seven digits
mappings:
  orgid: ME-PIB
  schema_org: taxID
  stdnum: me.pib
links:
- type: other
  url: https://org-id.guide/list/ME-PIB
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.me.pib.html
