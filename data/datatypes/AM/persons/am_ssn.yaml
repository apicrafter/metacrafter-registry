id: am_ssn
name: Armenian Social Security Number
status: stable
doc: Armenian Social Security Number (SSN) is a 10-digit unique identifier assigned to Armenian citizens,
  legally residing foreigners, stateless individuals, and refugees. Generated based on personal information
  such as gender and date of birth, it remains constant throughout an individual's lifetime.
categories:
- pii
- persons
country:
- AM
langs:
- hy
is_pii: true
classification: identifier
regexp: ^\d{10}$
examples:
- value: '1234567890'
  description: Example Armenian SSN
mappings:
  dpv: pd:OfficialID
translations:
  hy:
    name: Հասարակական ապահովագրության համար
    doc: Հասարակական ապահովագրության համար - 10-նիշ եզակի նույնականացման համար, որը տրվում է Հայաստանի
      քաղաքացիներին, օրինականորեն բնակվող օտարերկրացիներին, անքաղաքացիներին և փախստականներին
