id: date_persian
name: Date with a Persian month name
status: draft
doc: Calendar date written in Persian with the month name, day, month and year in the order of the CLDR
  long (d MMMM y) and medium (d MMM y) date formats of the fa locale. The month is the CLDR wide or abbreviated
  name in the format context, written exactly as CLDR gives it, including any dot or apostrophe; no extra
  capitalisation variants are accepted.
semantic_type: date
langs:
- fa
regexp: ^(?:0?[1-9]|[12]\d|3[01]) (?:سپتامبر|ژانویه|دسامبر|نوامبر|اکتبر|ژوئیه|فوریه|آوریل|ژوئن|مارس|اوت|مه)
  \d{4}$
examples:
- value: 3 اکتبر 2024
  description: 3 October 2024, CLDR long format d MMMM y
- value: 25 دسامبر 2024
  description: 25 December 2024, CLDR medium format d MMM y
- value: اکتبر 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/fa/ca-gregorian.json
