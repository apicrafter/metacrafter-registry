id: atccode
name: Anatomical Therapeutic Chemical (ATC) Classification System
status: stable
doc: The Anatomical Therapeutic Chemical (ATC) Classification System is a drug classification system that
  classifies the active ingredients of drugs according to the organ or system on which they act and their
  therapeutic, pharmacological and chemical properties. Its purpose is an aid to monitor drug use and
  for research to improve quality medication use. It does not imply drug recommendation or efficacy.
categories:
- medical
langs:
- common
is_pii: false
classification: categorical
regexp: '[A-V]([0-9][0-9]([A-Z]([A-Z]([0-9][0-9])?)?)?)[0-9]'
examples:
- value: D08AX08
  description: ethanol
- value: A02BC04
  description: (RS)-rabeprazole
mappings:
