id: hk_company_number
name: Hong Kong company number
status: draft
doc: Number of a company in the register of the Companies Registry of Hong Kong. Registered non-Hong Kong
  companies have numbers that start with F. ORG-ID.guide lists the register as HK-CR; with that prefix
  an identifier reads HK-CR-2524613.
