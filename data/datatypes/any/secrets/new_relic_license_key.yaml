id: new_relic_license_key
name: New Relic license key
status: draft
doc: Ingest license key of a New Relic account, used by agents to report data. New Relic documents it
  as a 40-character key that ends in NRAL; the regexp expects 36 hexadecimal digits before the suffix.
  Older license keys of 40 hexadecimal digits look like a SHA-1 hash and are not covered.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-fA-F]{36}NRAL$
examples:
- value: NRAL
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/
- type: doc
  url: https://docs.newrelic.com/docs/infrastructure/infrastructure-agent/new-relic-guided-install-overview/
