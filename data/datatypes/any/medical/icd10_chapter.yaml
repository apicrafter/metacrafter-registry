id: icd10_chapter
name: ICD-10 chapter
status: draft
doc: Chapter of ICD-10, the International Classification of Diseases, 10th revision, given by its code
  range (A00-B99, C00-D48, D50-D89) or its title (Neoplasms, Diseases of the circulatory system), as mortality
  and morbidity statistics group the underlying causes of death and diagnoses. ICD-10 has 22 chapters,
  from I Certain infectious and parasitic diseases (A00-B99) to XXII Codes for special purposes (U00-U85).
  National tables round the ranges (E00-E99, H60-H99, S00-T99), put spaces around the dash and shorten
  or misspell the titles. A single code or a block of codes is icd10.
parent: category
