id: twitter_bearer_token
name: X (Twitter) API bearer token
status: draft
doc: App-only bearer token of the X (Twitter) API. X describes the token as a byte array of unspecified
  format; the regexp follows the gitleaks rule, which expects 22 letters A followed by 80 to 100 letters,
  digits and percent signs, as in the sample responses in the X documentation.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^A{22}[A-Za-z0-9%]{80,100}$
links:
- type: doc
  url: https://docs.x.com/fundamentals/authentication/oauth-2-0/bearer-tokens
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
