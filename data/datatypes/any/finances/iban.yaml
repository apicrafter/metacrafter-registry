  google_dlp: IBAN_CODE
  presidio: IBAN_CODE
  purview: International banking account number (IBAN)
  fta: CHECKDIGIT.IBAN
  gs1_ai: '8007'
  dpv: pd:BankAccount
  stdnum: iban
  misp: iban
links:
