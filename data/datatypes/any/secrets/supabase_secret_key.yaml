id: supabase_secret_key
name: Supabase secret key
status: draft
doc: Secret API key of a Supabase project, which bypasses row level security and must stay on the server.
  Supabase documents that secret keys start with sb_secret_ and are short strings, not JWTs; the legacy
  service_role key is a JWT and is the datatype jwt. The vendor does not document the length or the characters
  after the prefix; the regexp accepts letters and digits.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^sb_secret_[A-Za-z0-9_-]+$
examples:
- value: sb_secret_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://supabase.com/docs/guides/api/api-keys
