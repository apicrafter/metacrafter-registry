id: nlbtw
name: Dutch VAT identification number (btw-id)
status: stable
doc: 'Btw-identificatienummer, the VAT identification number of businesses in the Netherlands: NL, nine
  digits, the letter B and a 2-digit sequence number. The older btw-nummer was built from the RSIN of
  a company or the citizen service number (BSN) of a sole trader. Since 2020 sole traders have a btw-identificatienummer
  that does not contain their BSN.'
parent: vatin
categories:
- finances
country:
- NL
langs:
- nl
is_pii: true
classification: identifier
regexp: ^NL\d{9}B\d{2}$
examples:
- value: NL004495445B01
  description: python-stdnum reference value
- value: NL002455799B11
  description: Number of the form issued since 2020, python-stdnum reference value
- value: NL004495445
  valid: false
  description: The B and the sequence number are missing
- value: NL004495445B1
  valid: false
  description: The sequence number has two digits
mappings:
  purview: Netherlands value added tax number
  fta: IDENTITY.VAT_NL
links:
- type: wikipedia
  url: https://nl.wikipedia.org/wiki/BTW-nummer
- type: doc
  url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/btw/btw_nederland/btw_nummer
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.nl.btw.html
translations:
  nl:
    name: Btw-identificatienummer
