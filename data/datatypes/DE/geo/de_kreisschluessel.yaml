id: de_kreisschluessel
name: German district key (Kreisschlüssel)
status: stable
doc: 'Five-digit official code of a German district (Landkreis) or independent city: two digits for the
  state, one for the government region and two for the district. It is the first five digits of the municipality
  key (AGS).'
categories:
- geo
country:
- DE
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:0[1-9]|1[0-6])\d{3}$
examples:
- value: 03459
  description: Osnabrück District
- value: '07132'
  description: Altenkirchen district
- value: '3459'
  valid: false
  description: Leading zero dropped
- value: '18132'
  valid: false
  description: There is no state 18
mappings:
  wikidata: P440
links:
- type: wikipedia
  url: https://de.wikipedia.org/wiki/Kreisschl%C3%BCssel
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P440
translations:
  de:
    name: Kreisschlüssel
  ru:
    name: Код района Германии (Kreisschlüssel)
    doc: Пятизначный код района или города районного подчинения - первые пять цифр кода общины (AGS).
