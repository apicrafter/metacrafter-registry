id: frnir
name: French social security number (NIR)
status: stable
doc: 'French national identification number (numéro d''inscription au répertoire, NIR), known as the social
  security number. INSEE assigns it to every person born in France. It has 13 characters and a two-digit
  control key: sex (1 or 2; 7 or 8 for temporary registrations), year and month of birth, department and
  commune of birth (2A or 2B for Corsica), an order number, and the key. The key is 97 minus the 13-character
  number modulo 97, with 2A read as 19 and 2B as 18.'
categories:
- pii
- persons
country:
- FR
langs:
- fr
is_pii: true
classification: identifier
regexp: ^[1278]\d{4}(?:\d{2}|2[AB])\d{8}$
checksum: fr_nir
examples:
- value: 153072C07300443
  valid: false
  description: 2C is not a department code
mappings:
