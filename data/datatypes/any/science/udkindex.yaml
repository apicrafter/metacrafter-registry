id: udkindex
name: Universal Decimal Classification (UDC)
status: stable
doc: The Universal Decimal Classification (UDC) is a bibliographic and library classification representing
  the systematic arrangement of all branches of human knowledge organized as a coherent system in which
  knowledge fields are related and inter-linked.
categories:
- common
langs:
- common
is_pii: true
classification: identifier
regexp: \d{1,3}(\.\d{1,3})*
examples:
- value: '316.7'
  description: sociology of culture
- value: 316.774:32
  description: The Party Journalist
mappings:
  wikidata: P1190
  bioregistry: udc
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Universal_Decimal_Classification
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P1190
translations:
  ru:
    name: Индекс УДК (универсальная десятичная классификация)
    doc: Универсальная десятичная классификация — система классификации информации, широко используется
      во всём мире для систематизации произведений науки, литературы и искусства, периодической печати,
      различных видов документов и организации картотек.
