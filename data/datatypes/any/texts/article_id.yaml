id: article_id
name: Article ID
status: draft
doc: 'Identifier of an article, post, story or news item in a content management system, a news site,
  a blog platform or a publication database. Each system numbers articles its own way: WordPress and Drupal
  use integers, other systems use slugs, UUIDs or alphanumeric keys. There is no common format and no
  regexp; metacrafter detects the type by field names such as article_id, post_id, story_id, news_id and
  entry_id. Article identifiers with a published format have their own records, such as doi, pmid, arxiv_id
  and publisher_item_identifier.'
categories:
- texts
langs:
- common
is_pii: false
classification: identifier
