id: typeform_personal_access_token
name: Typeform personal access token
status: draft
doc: Personal access token of the Typeform API. The Typeform documentation shows a sample token that starts
  with tfp_ followed by 40 hexadecimal digits, while gitleaks expects 59 characters after the prefix;
  the regexp accepts 40 to 59 letters, digits and the characters _ . = -.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^tfp_[A-Za-z0-9_.=-]{40,59}$
examples:
- value: tfp_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://www.typeform.com/developers/get-started/personal-access-token/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
