id: date_icelandic
name: Date with a Icelandic month name
status: draft
doc: Calendar date written in Icelandic with the month name, day, month and year in the order of the CLDR
  long (d. MMMM y) and medium (d. MMM y) date formats of the is locale. The month is the CLDR wide or
  abbreviated name in the format context, written exactly as CLDR gives it, including any dot or apostrophe;
  no extra capitalisation variants are accepted.
semantic_type: date
langs:
- is
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01])\. (?:september|nóvember|desember|febrúar|október|janúar|apríl|ágúst|júní|mars|júlí|maí)
  \d{4}|(?:0?[1-9]|[12]\d|3[01])\. (?:mar\.|jan\.|apr\.|des\.|nóv\.|jún\.|okt\.|ágú\.|feb\.|júl\.|sep\.|maí)
  \d{4})$
examples:
- value: 3. október 2024
  description: 3 October 2024, CLDR long format d. MMMM y
- value: 25. des. 2024
  description: 25 December 2024, CLDR medium format d. MMM y
- value: október 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/is/ca-gregorian.json
