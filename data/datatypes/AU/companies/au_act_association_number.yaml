id: au_act_association_number
name: ACT incorporated association number
status: draft
doc: 'Number of an association incorporated in the Australian Capital Territory under the Associations
  Incorporation Act 1991, as Access Canberra lists it in the register of incorporated associations: the
  letter A and five digits (A00336). Associations incorporated in other states have their own registers
  and numbers.'
