id: tw_arc
name: Taiwan resident certificate number (ARC/TARC)
status: draft
doc: Number of the Taiwan resident certificate issued to foreign residents (ARC) and to residents from
  Hong Kong, Macau and mainland China (TARC). Microsoft Purview looks for two letters and eight digits.
categories:
