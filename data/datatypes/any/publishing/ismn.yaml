translations:
  ru:
    name: Международный стандартный нотный номер (ISMN)
    doc: 'Идентификатор нотного издания по ISO 10957: 13 цифр с префиксом 979-0 (прежняя форма — буква
      M и девять цифр), последняя — контрольная.'
