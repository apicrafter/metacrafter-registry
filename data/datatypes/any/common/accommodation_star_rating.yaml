id: accommodation_star_rating
name: Star rating of a tourist accommodation
status: draft
doc: 'Official category of a hotel or another tourist accommodation in stars, as registers of tourist
  accommodation give it: 1 ESTRELLA to 5 ESTRELLAS, Sin categorizar in Argentina and Spain, 3 étoiles
  in France, 4 Sterne Superior in Germany, 4 stars or *** in English, with Superior or S for the upper
  level of a category. A count of rooms or a review score is not a rating; the class of the establishment
  is accommodation_type.'
parent: category
categories:
