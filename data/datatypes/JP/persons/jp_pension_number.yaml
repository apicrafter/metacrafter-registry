id: jp_pension_number
name: Japanese basic pension number
status: draft
doc: Ten-digit number that identifies a person across all Japanese public pension schemes. It was introduced
  in January 1997 and stays the same for life. It is written as a four-digit code and a six-digit serial
  number, usually with a hyphen between them. It is different from the twelve-digit My Number (mynumber).
