id: co_vereda
name: Vereda (rural settlement area of Colombia)
status: draft
doc: 'Name of a vereda, the smallest rural division of a Colombian municipality: a stretch of countryside
  with scattered farms and sometimes a small centre, grouped into corregimientos (co_corregimiento). Rural
  registers (wells, schools, beneficiaries of rural programmes, land parcels) locate a record by its vereda:
  El Diamante, Chorro Claro, Popoa Sur, Bajo Cantano. Columns are named VEREDA, nombre_vereda or, for
  mixed urban and rural tables, barrio o vereda.'
