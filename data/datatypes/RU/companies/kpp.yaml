id: kpp
name: Russian company supplemental registration code (KPP)
status: draft
doc: Russian company supplemental registration code (KPP). Used in combination with Taxpayer INN code
categories:
- companies
country:
- RU
langs:
- ru
is_pii: false
classification: identifier
regexp: ^\d{4}[0-9A-Z]{2}\d{3}$
examples:
- value: '772501001'
  description: KPP of an organization registered with a Moscow tax office
- value: '770901001'
  description: KPP of an organization registered with a Moscow tax office
- value: '7725262013'
  valid: false
  description: Ten-digit INN, not a KPP
translations:
  ru:
    name: Код постановки на учёт (КПП)
    doc: Вспомогательный код используемый вместе с кодом ИНН для идентификации налоговой принадлежности
      компании.
