id: academic_discipline
name: Academic discipline (field of research)
status: draft
doc: 'Branch of knowledge that a researcher, a project, a publication, a course or a degree belongs to,
  by name: Biología, Medicina, Economics, Ciencias de la Tierra, Computer science. Surveys of researchers,
  research information systems and university statistics name it after their own lists or a classification
  such as the OECD Fields of Research and Development (FORD) or ANZSRC Fields of Research; the broad areas
  above the disciplines (Ciencias Sociales, Natural Sciences) are the same type. Codes of a classification
  without names, such as ISCED-F fields of education, have their own types (isced_f_2013).'
parent: category
