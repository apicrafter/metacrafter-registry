id: sentry_auth_token
name: Sentry auth token
status: draft
doc: Auth token of Sentry, the error monitoring service. Personal (user) tokens are sntryu_ followed by
  64 hexadecimal digits. Organization tokens start with sntrys_, carry a Base64 payload that includes
  the organization slug, and end with an underscore and 43 characters, about 180 to 250 characters in
  all. Older tokens without a prefix are plain 64-digit hexadecimal strings and are not covered.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:sntryu_[a-f0-9]{64}|sntrys_[A-Za-z0-9+/=]+_[A-Za-z0-9+/]{43})$
examples:
- value: sntryu_ExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://docs.sentry.io/security-legal-pii/security/token-formats/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
