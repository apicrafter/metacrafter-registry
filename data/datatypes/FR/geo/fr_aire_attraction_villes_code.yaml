id: fr_aire_attraction_villes_code
name: French functional urban area code (INSEE aire d'attraction des villes)
status: draft
doc: Three-character code of an aire d'attraction des villes (AAV), the INSEE 2020 zoning of a city and
  the communes from which many people commute to it. Files name the column aav2020. Communes outside any
  area can carry a special value instead of a code.
