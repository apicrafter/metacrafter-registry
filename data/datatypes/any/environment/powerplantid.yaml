id: powerplantid
name: Power plant identifier
status: draft
doc: Generic type of an identifier of a power plant (generating station) in an energy or emissions register,
  such as the EIA plant code in the United States or the id of the Global Power Plant Database. The metacrafter
  rules recognize it by column names such as power_plant_id, plantid or eia_plant_id. Formats differ by
  register, so this record has no regexp; the register-specific records have this record as parent.
categories:
- energy
- environment
langs:
- en
is_pii: false
classification: identifier
