id: gln
name: Global Location Number (GLN)
status: stable
doc: The Global Location Number (GLN, sometimes also referred to as International Location Number or ILN)
  of the respective organization, person, or place. The GLN is a 13-digit number used to identify parties
  and physical locations.
categories:
- geo
- gs1
langs:
- common
is_pii: false
classification: identifier
regexp: \d{13}
examples:
- value: 0865321000104
  description: Google
- value: 0860484000404
  description: The Coca-Cola Company
mappings:
  autotype: gln
  wikidata: P9860
