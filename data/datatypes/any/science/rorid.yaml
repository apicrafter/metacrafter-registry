id: rorid
name: ROR Identifier (ROR ID)
status: stable
doc: Research Organization Registry (ROR) is a community-led database that aims to provide a persistent
  identifier for every research institution in the world.[1] It complements other commonly used identifiers
  such as ORCID for researchers and DOI for research output.
categories:
- science
langs:
- common
is_pii: false
classification: identifier
regexp: '[a-z0-9]{9}'
examples:
- value: 00v4dac24
  description: Leeds Teaching Hospitals NHS Trust
- value: 03rjyp183
  description: National Library of Wales
mappings:
  wikidata: P6782
  orgid: XI-ROR
  bioregistry: ror
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Research_Organization_Registry
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P6782
