id: tickersymbol
name: Stock ticker symbol
status: stable
doc: Ticker symbol or stock symbol is an abbreviation used to uniquely identify publicly traded shares
  of a particular stock on a particular stock market.
categories:
- finances
langs:
- common
is_pii: false
classification: identifier
regexp: '[A-Z0-9.]{1,16}'
examples:
- value: MSFT
