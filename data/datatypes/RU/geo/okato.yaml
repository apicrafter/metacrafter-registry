id: okato
name: OKATO (Russian Classification on Objects of Administrative Division)
status: stable
doc: 'Russian Classification on Objects of Administrative Division (Russian: Общероссийский классификатор
  объектов административно-территориального деления), or OKATO (Russian: ОКАТО), also called All-Russian
  classification on units of administrative and territorial distribution in English, is one of several
  Russian national registers. OKATOs purpose is organization of information about structure of the administrative
  divisions of the federal subjects of Russia.'
categories:
- geo
country:
- RU
langs:
- ru
is_pii: false
classification: categorical
regexp: ^(?:\d{2}|\d{5}|\d{8}|\d{11})$
examples:
- value: '28'
  description: Tver Oblast
- value: '41420000000'
  description: Gatchina
- value: '80228825007'
  description: Kuznetsovka (Iglinsky District)
