id: cloudflaredlp
name: Cloudflare DLP
category: pii
doc: Data loss prevention of Cloudflare One, which inspects HTTP traffic, SaaS applications and AI prompts
  passing through Cloudflare. Predefined detection entries are managed by Cloudflare and can be combined
  into DLP profiles. They cover payment card numbers, national identity, tax and health numbers of several
  dozen countries (validated by check digit where an algorithm exists), bank codes, cryptocurrency wallets,
  a few service tokens, source code in common programming languages and classifiers of AI prompt content.
website: https://developers.cloudflare.com/cloudflare-one/data-loss-prevention/detection-entries/predefined-detection-entries/
