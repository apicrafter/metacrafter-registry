id: co_comuna
name: Comuna of a Colombian municipality
status: draft
doc: 'Urban subdivision of a Colombian municipality, created by the municipal council under Ley 136 de
  1994 and made of neighbourhoods (barrios): Cali has 22 comunas, Medellín 16, Bucaramanga 17. Municipal
  tables give it as a number (4, 21), with the word (Comuna 5, COMUNA 11), as number and name (17. MUTIS,
  01. NORTE), as a name alone (Cumanday, La Fuente) or as a number in words (SEIS). The rural counterpart
  is the corregimiento (co_corregimiento), and some columns hold both (Comuna/Corregimiento).'
