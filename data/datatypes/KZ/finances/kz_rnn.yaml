id: kz_rnn
name: Kazakh taxpayer registration number (RNN)
status: draft
doc: Taxpayer registration number (регистрационный номер налогоплательщика, РНН) that the tax authorities
  of Kazakhstan gave to individuals and legal entities. The individual identification number (kz_iin)
  and the business identification number (kz_bin) replaced it on 1 January 2013, but it still appears
  in older registers, documents and data sets.
