id: au_driver_license
name: Australian driver's license number
status: draft
doc: 'Number of a driving licence issued in Australia. Microsoft Purview looks for the formats of all
  states and territories: six to ten digits, six letters and digits, or digit groups separated by spaces
  or hyphens.'
parent: driver_license
categories:
- pii
- persons
country:
- AU
langs:
- en
is_pii: true
classification: identifier
regexp: ^(?:\d{6,10}|[A-Z0-9]{6}|\d{2}[ -]?\d{2}[ -]?\d{4}|\d{3}[ -]?\d{3}[ -]?\d{3,4}|\d[ -]?\d{3}[ -]?\d{3}[
  -]?\d{3})$
mappings:
  purview: Australia Driver's License Number
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-australia-drivers-license-number
