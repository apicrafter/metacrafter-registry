id: email
name: Email address
status: stable
doc: 'Address of an electronic mailbox in the form local-part@domain, defined in section 3.4.1 of RFC
  5322. The local part names the mailbox, and the domain says which mail server accepts messages for it.
  The standard grammar also allows quoted local parts, comments and IP address literals, and RFC 6531
  allows non-ASCII characters; the regexp covers the common form: letters, digits and . _ % + - in the
  local part and a dotted domain name.'
aliases:
- email_person
categories:
- common
- internet
- pii
langs:
- common
is_pii: true
classification: identifier
regexp: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z][A-Za-z0-9-]{1,62}$
examples:
- value: user@example.com
  description: Plain address
- value: first.last+tag@mail.example.org
  description: Dots, a plus tag and a subdomain
- value: user@
  valid: false
  description: No domain
- value: user.example.com
  valid: false
  description: No @
mappings:
  autotype: email
  cdm: means.identity.service.email
  d3m: http://schema.org/email
  fibo: FND/Places/VirtualPlaces/ElectronicMailAddress
  google_dlp: EMAIL_ADDRESS
  presidio: EMAIL_ADDRESS
  fta: EMAIL
  wikidata: P968
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Email_address
- type: schema.org
  url: https://schema.org/email
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P968
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc5322.html#section-3.4.1
translations:
  ru:
    name: Адрес электронной почты
    doc: Адрес почтового ящика в форме локальная_часть@домен (RFC 5322).
