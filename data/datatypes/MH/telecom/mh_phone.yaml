id: mh_phone
name: Marshall Islands phone number (E.164)
status: draft
doc: 'Phone number of Marshall Islands in international E.164 form: a plus sign, the country calling code
  +692 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- MH
langs:
- common
regexp: ^\+692(?:329\d{4}|(?:[256]\d|45)\d{5})$
examples:
- value: '+6922471234'
  description: Example number from Google libphonenumber (fixed line)
- value: '+6922351234'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
