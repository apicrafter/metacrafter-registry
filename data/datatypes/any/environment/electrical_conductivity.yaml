id: electrical_conductivity
name: Electrical conductivity
status: draft
doc: 'Electrical conductivity of water or of a soil extract, a measure of dissolved salts: in microsiemens
  per centimetre (µS/cm; fresh water is up to about 1 500), millisiemens per centimetre, or decisiemens
  per metre (dS/m) in soil science, often corrected to 25 °C (specific conductance). Water quality sensors
  report it next to the temperature, the pH and the turbidity (Lake Wendouree, City of Ballarat); soil
  surveys give it per horizon (TERN, conductivity_deciSiemensPerMetre).'
parent: numeric
categories:
