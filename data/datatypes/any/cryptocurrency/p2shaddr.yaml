id: p2shaddr
name: Bitcoin P2SH address
status: stable
doc: Bitcoin address of the pay-to-script-hash (P2SH) type, defined by BIP 13 and BIP 16. It is the Base58Check
  encoding of the version byte 5 and the 20-byte hash of a redeem script (for example a multisignature
  script or wrapped SegWit), so it has 34 characters and starts with 3. Older Litecoin P2SH addresses
  use the same version byte and cannot be told apart. Testnet P2SH addresses start with 2 and are not
  matched.
parent: crypto_address
categories:
- cryptocurrency
langs:
- common
is_pii: false
classification: identifier
regexp: ^3[1-9A-HJ-NP-Za-km-z]{33}$
checksum: base58check
examples:
- value: 3J98t1WpEZ73CNmQviecrnyiWrnqRhWNLy
  description: Example address of the Bitcoin Wiki article on invoice addresses
- value: 3J98t1WpEZ73CNmQviecrnyiWrnqRhWNLz
  valid: false
  description: last character changed, the checksum fails
- value: 1PMycacnJaSqwwJqjawXBErnLsZ7RkXUAs
  valid: false
  description: P2PKH address (p2pkhaddr)
mappings:
  presidio: CRYPTO
