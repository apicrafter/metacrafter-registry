id: sa_phone
name: Saudi Arabia phone number (E.164)
status: draft
doc: 'Phone number of Saudi Arabia in international E.164 form: a plus sign, the country calling code
  +966 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- SA
langs:
- common
regexp: ^\+966(?:(?:[15]\d|800|92)\d{7})$
examples:
- value: '+966112345678'
  description: Example number from Google libphonenumber (fixed line)
- value: '+966512345678'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
