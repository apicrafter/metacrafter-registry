id: sk_ico
name: Slovak organisation identification number (IČO)
status: draft
doc: Identifikačné číslo organizácie (IČO), the 8-digit identification number that the Statistical Office
  of the Slovak Republic gives to legal entities, entrepreneurs and public authorities. Companies are
  found by it in the Business Register of the Ministry of Justice. ORG-ID.guide lists it under SK-ICO,
  SK-ORSR and SK-ZRSR; with that prefix an identifier reads SK-ICO-47686065.
categories:
- companies
country:
- SK
langs:
- sk
is_pii: false
classification: identifier
regexp: ^\d{8}$
