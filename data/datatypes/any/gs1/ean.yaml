  description: GS1's example GTIN 09506000134352 as an EAN-13
- value: '9520000000011'
  description: Synthetic number with the GS1 demonstration prefix 952
- value: '9780521293662'
  description: ISBN-13 978-0-521-29366-2 as an EAN-13
- value: '95060001343520'
  valid: false
  description: Fourteen digits, a GTIN-14
mappings:
