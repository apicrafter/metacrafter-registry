id: no_orgnr
name: Norwegian organisation number (organisasjonsnummer)
status: draft
doc: Organisasjonsnummer, the 9-digit number of a legal entity in the Norwegian Central Coordinating Register
  for Legal Entities (Enhetsregisteret). The last digit is a modulo 11 check digit.
categories:
- companies
country:
- 'NO'
langs:
- 'no'
is_pii: false
classification: identifier
regexp: ^\d{3} ?\d{3} ?\d{3}$
examples:
- value: '986992928'
  description: Synthetic number with a valid check digit
- value: '911067404'
  description: Synthetic number with a valid check digit
- value: 986 992 928
  description: The first example in its printed form
- value: '9869929287'
  valid: false
  description: One character too many
