id: vn_foreign_ngo_number
name: Vietnamese foreign NGO registration number
status: draft
doc: Registration number that the Ministry of Foreign Affairs of Viet Nam gives to a foreign non-governmental
  organisation to work in the country. ORG-ID.guide lists the register as VN-MFA; with that prefix an
  identifier reads VN-MFA-38-NVVH-HD.
