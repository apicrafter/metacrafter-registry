id: de_gemarkung
name: German cadastral district (Gemarkung)
status: draft
doc: Name of a Gemarkung, the unit of the German land cadastre that groups the parcels of an area. It
  usually carries the name of a village or former municipality, so a city has several of them (Beuel,
  Oberkassel and Endenich in Bonn). A parcel is addressed by Gemarkung, Flur and Flurstück. Registers
  of municipal land, building plots and monuments give the name in a column named Gemarkung. The numeric
  Gemarkungsschlüssel is not this type.
