id: ismn
name: International Standard Music Number (ISMN)
status: draft
doc: 'ISO 10957 identifier of an edition of notated (printed or digital) music: scores, parts and songbooks,
  but not recordings (isrc) or the musical work itself (iswc). Since 2008 it has 13 digits starting with
  979-0; the older 10-character form starts with the letter M, which stands for 979-0. The check digit
  is the GS1 check digit of the 13-digit form, so both forms of one ISMN end with the same digit.'
categories:
- publishing
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:979[- ]?0|M)(?:[- ]?\d){9}$
checksum: ismn
examples:
- value: 979-0-001-11903-0
  description: Three Bagatelles (Wikidata example)
- value: 979-0-700-38054-0
  description: Ipnagogico (Wikidata example)
- value: M-66134-209-0
  description: Carl Nielsen Edition, former 10-character form
- value: '9790001119030'
  description: Three Bagatelles without hyphens
- value: '97900322822087'
  valid: false
  description: One character too many
- value: 979-0-001-11903-1
  valid: false
  description: Wrong check digit
mappings:
  autotype: ismn
  wikidata: P1208
  stdnum: ismn
links:
