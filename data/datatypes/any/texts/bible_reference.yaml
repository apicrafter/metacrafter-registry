doc: 'Reference to a passage of the Bible by book, chapter and verse: John 3:16, Genesis 1:1, 1 Samuel
  15:2-3. The book is written in full or abbreviated (Gen, Mt, 1 Cor, 2_Co), chapter and verse are separated
  by a colon or, in OSIS and some cross-reference lists, by a full stop (Matt.28.19, Mt_28.19), and a
  range of verses follows a hyphen. Reading plans, sermon indexes, cross-reference tables and text analyses
  of the Bible use it as the key of a verse.'
