id: vatin
name: EU VAT ID
status: stable
doc: A value-added tax identification number or VAT identification number (VATIN) is an identifier used
  in many countries, including the countries of the European Union, for value-added tax purposes.
categories:
- companies
country:
- EU
langs:
- en
is_pii: false
classification: identifier
regexp: ^(?:(?:AT|BE|BG|CY|CZ|DE|DK|EE|EL|ES|FI|FR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|SE|SI|SK|XI)[0-9A-Z+*]{0,2}[0-9][0-9A-Z+*]{4,11}|RO[0-9]{2,10})$
examples:
- value: FI15243611
  description: Sanoma Corporation
- value: BG200356710
  description: Ontotext
- value: PDFA
  valid: false
  description: no member-state prefix and no digits
- value: BE10
  valid: false
  description: a NUTS region code; VAT numbers are longer
mappings:
  fibo: BE/LegalEntities/FormalBusinessOrganizations/ValueAddedTaxIdentificationNumber
  google_dlp: VAT_NUMBER
  wikidata: P3608
  schema_org: vatID
  bioregistry: vat
  stdnum:
  - vatin
  - eu.vat
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/VAT_identification_number
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P3608
