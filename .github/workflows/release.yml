name: Release

# Push a tag like v1.3.0 to publish a GitHub Release with the bulk data files
# and the Python package. The package is not published on PyPI: the registry is
# used through its site and API.
# The tag must equal `version` in pyproject.toml.
# Versioning policy: see CONTRIBUTING.md ("Releases and versioning").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Install
        run: pip install . build

      - name: Build site and data
        run: metacrafter-registry build --no-data-files

      # The package is installed non-editable, so the default target is the
      # installed copy; write into the source tree that `python -m build` packs.
      - name: Bundle the data snapshot into the package
        run: metacrafter-registry snapshot --dist dist --out src/metacrafter_registry/snapshot

      - name: Build the Python package
        run: python -m build --outdir pkg-dist

      - name: The wheel bundles the data snapshot
        run: |
          if ! unzip -l pkg-dist/*.whl | grep -q "metacrafter_registry/snapshot/datatypes.jsonl"; then
            echo "::error::the wheel has no metacrafter_registry/snapshot/datatypes.jsonl"
            exit 1
          fi

      - name: Changelog against the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName -q '[.[].tagName | select(. != env.TAG)][0]')
          if [ -n "$PREV" ] && gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -p datatypes.jsonl -D prev; then
            metacrafter-registry changes --old prev/datatypes.jsonl --new dist \
              --old-version "$PREV" --new-version "$TAG" \
              --json release/changes.json --markdown release/CHANGES.md
          else
            echo "First release with the current pipeline." > release/CHANGES.md
          fi

      - name: Collect release assets
        run: |
          mkdir -p release
          cp dist/api/v1/datatypes.json dist/api/v1/datatypes.jsonl dist/api/v1/datatypes.csv release/
          cp dist/api/v1/tools.json dist/api/v1/categories.json dist/api/v1/countries.json release/
          cp dist/api/v1/languages.json dist/api/v1/aliases.json dist/api/v1/openapi.json release/
          cp dist/api/v1/rag/corpus.jsonl release/rag-corpus.jsonl
          cp dist/api/v1/index.json release/manifest.json
          cp dist/registry.json release/registry-legacy.json
          cp dist/registry.ttl dist/vocab.ttl dist/llms-full.txt dist/datahub-glossary.yml release/
          (cd dist && zip -qr ../release/site.zip .)
          cp pkg-dist/* release/
          (cd release && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release/CHANGES.md --verify-tag
