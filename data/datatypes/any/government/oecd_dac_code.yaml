id: oecd_dac_code
name: OECD DAC donor, agency or channel code
status: draft
doc: Code of a donor, an agency or a channel of delivery in the codelists of the OECD Development Assistance
  Committee (DAC), used to report official development assistance. ORG-ID.guide lists the register as
  XM-DAC; with that prefix an identifier reads XM-DAC-963-1.
