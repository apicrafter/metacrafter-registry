id: al_vehicle_plate
name: Albanian vehicle registration plate
status: draft
doc: 'Registration number on Albanian vehicle plates issued since 2011: two letters, three digits and
  two letters (AB 123 FG). Older plates with regional codes are still valid but are not covered.'
