id: au_nsw_epi
name: NSW environmental planning instrument
status: draft
doc: 'Title of an environmental planning instrument (EPI) of New South Wales, Australia, made under the
  Environmental Planning and Assessment Act 1979: a local environmental plan of a council area (Camden
  Local Environmental Plan 2010, Camden LEP 2010), a state environmental planning policy (State Environmental
  Planning Policy (Precincts—Western Parkland City) 2021, SEPP (Precincts—Western Parkland City) 2021),
  and the older regional environmental plans and interim development orders. The title ends with the year
  of the instrument; abbreviations of planning datasets drop the spaces (CLEP2010, SEPP2021). The EPI_NAME
  field of the NSW Planning Portal spatial layers and the epi and iteminst fields of the Camden planning
  and heritage data hold it. Development control plans are not EPIs (au_nsw_dcp).'
