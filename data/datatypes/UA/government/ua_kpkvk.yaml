id: ua_kpkvk
name: Ukrainian programme classification code of expenditure (КПКВК)
status: draft
doc: Code of the programme classification of budget expenditure and lending of Ukraine. Local budget data
  uses the four-digit typical programme classification of local budgets (ТПКВКМБ), as in 1021 or 6014;
  the full code of a spending unit adds the codes of the budget's main spending unit in front.
categories:
- government
- finances
country:
- UA
langs:
- uk
is_pii: false
classification: categorical
regexp: ^\d{4}(?:\d{3})?$
examples:
- value: '1021'
  description: Programme in the Kyiv city budget expenses
- value: '6014'
  description: Programme in the Kyiv city budget expenses
- value: '102'
  valid: false
  description: Three digits
