id: namesuffix
name: Name suffix
status: draft
doc: Word, abbreviation or numeral written after a person's surname. It can be generational (Jr., Sr.,
  III), academic (PhD), an honour (OBE), professional or military.
categories:
- persons
langs:
- en
is_pii: false
classification: categorical
examples:
- value: Jr.
  description: generational suffix (Junior)
- value: III
  description: generational suffix (the Third)
- value: PhD
  description: academic degree
- value: OBE
  description: honour (Officer of the Order of the British Empire)
- value: Esq.
  description: Esquire
