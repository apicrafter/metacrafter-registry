name: Energy performance certificate report reference number (RRN)
status: draft
doc: 'Report reference number of an energy performance certificate (EPC) or display energy certificate
  (DEC) in the register of England, Wales and Northern Ireland: 20 digits in five groups of four (0991-0918-6260-8900-9092).'
