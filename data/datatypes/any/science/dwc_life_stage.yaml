id: dwc_life_stage
name: Darwin Core life stage
status: draft
doc: 'Age class or life stage of the organisms of an occurrence (Darwin Core term lifeStage): adult, juvenile,
  larva, egg, pupa, nymph, seedling and the like. GBIF recommends the terms of its LifeStage vocabulary;
  fish and coral surveys often write abbreviations such as AD and JUV.'
