id: pl_teryt_terc
name: Polish TERYT TERC code
status: draft
doc: 'Code of a Polish voivodeship, county or municipality in the TERC part of the TERYT register of Statistics
  Poland: two digits per level and, for municipalities, a digit for the municipality type.'
categories:
- geo
country:
- PL
langs:
- common
is_pii: false
classification: identifier
regexp: ^\d{2}(?:\d{2}(?:\d{3})?)?$
examples:
