  description: UUIDv4 test vector of RFC 9562 (Appendix A.3)
- value: 16fd2706-8baf-433b-82eb-8c7fada847da
  description: uuid4() output in the Python uuid module documentation
- value: C232AB00-9414-11EC-B3C8-9F6BDECED846
  valid: false
  description: UUIDv1
- value: 919108f7-52d1-4320-cbac-f847db4148a8
  valid: false
  description: Version 4 digit, but the variant digit c is not the RFC 9562 variant
