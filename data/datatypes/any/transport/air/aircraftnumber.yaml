id: aircraftnumber
name: Aircraft/tail number
status: stable
doc: An aircraft registration, alternatively called a tail number, is a code unique to a single aircraft,
  required by international convention to be marked on the exterior of every civil aircraft.
categories:
- objectids
- transport
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Z0-9- ]+$
examples:
- value: N-X-211
  description: Spirit of St. Louis
- value: N736PA
  description: Clipper Victor
mappings:
  wikidata: P426
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Aircraft_registration
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P426
