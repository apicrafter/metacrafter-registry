id: discord_bot_token
name: Discord bot token
status: draft
doc: 'Token that authenticates a Discord bot to the Discord API, sent in the header Authorization: Bot
  <token>. It has three Base64url parts separated by dots; the first part encodes the bot''s user ID.
  Discord documents the format only by example; the regexp follows the structure of the documented sample
  and the part lengths that secret scanners expect.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9_-]{23,28}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,}$
examples:
- value: CZhtkLDpNYXgPH9Ml6shqh2OwykChw
  valid: false
  description: Sample OAuth2 bearer token from the Discord API reference
links:
- type: doc
  url: https://docs.discord.com/developers/reference#authentication
- type: other
  url: https://github.com/bee-san/pyWhat/blob/main/pywhat/Data/regex.json
