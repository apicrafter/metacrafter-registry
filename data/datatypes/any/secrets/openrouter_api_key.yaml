id: openrouter_api_key
name: OpenRouter API key
status: draft
doc: API key of OpenRouter. The OpenRouter API reference shows key labels that start with sk-or-v1-; the
  format is not described in prose. The vendor does not document the length or the characters after the
  prefix; the regexp accepts letters and digits.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^sk-or-v1-[A-Za-z0-9]+$
examples:
- value: sk-or-v1-
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://openrouter.ai/docs/api/api-reference/api-keys/get-current-api-key
