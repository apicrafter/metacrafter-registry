id: it_id_card
name: Italian identity card number
status: draft
doc: 'Number of an Italian identity card (carta d''identità). The electronic card (CIE) issued since 2016
  has nine characters: two letters, five digits and two letters, the first letter being C. Older cards
  in circulation use two letters and seven digits (paper card) or seven digits and two letters (CIE 2.0).'
categories:
- pii
- persons
country:
- IT
langs:
- it
is_pii: true
classification: identifier
regexp: ^(?:[A-Z]{2}\d{5}[A-Z]{2}|[A-Z]{2}\d{7}|\d{7}[A-Z]{2})$
examples:
- value: CA00000AA
  description: Format example of the CIE from Italian Wikipedia
- value: CA0000AA
  valid: false
  description: Only four digits
mappings:
  presidio: IT_IDENTITY_CARD
  dpv: pd:OfficialID
links:
- type: wikipedia
  url: https://it.wikipedia.org/wiki/Carta_d%27identit%C3%A0_elettronica_italiana
- type: other
  url: https://github.com/microsoft/presidio/blob/main/presidio-analyzer/presidio_analyzer/predefined_recognizers/country_specific/italy/it_identity_card_recognizer.py
