id: race_ethnicity
name: Race or ethnicity
status: draft
doc: Race or ethnic group of a person as recorded in surveys, health records and administrative data,
  for example Asian, Black or African American, or Hispanic or Latino. Values follow a local classification,
  such as the US Census categories, and are sometimes one-letter codes. Racial or ethnic origin is a special
  category of personal data under the GDPR.
categories:
- persons
- pii
langs:
- en
is_pii: true
classification: categorical
examples:
- value: Asian
- value: Black or African American
- value: Hispanic or Latino
mappings:
  fta:
  - PERSON.RACE_ABBR_EN
  - PERSON.RACE_EN
  dpv: pd:Ethnicity
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Race_and_ethnicity_in_the_United_States_census
- type: other
  url: https://github.com/tsegall/fta/blob/main/SemanticTypes.md
translations:
