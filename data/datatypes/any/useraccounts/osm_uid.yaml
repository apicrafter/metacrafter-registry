id: osm_uid
name: OpenStreetMap user ID
status: draft
doc: Numeric ID of an OpenStreetMap account. Unlike the display name (osm_user) it never changes. The
  OpenStreetMap API returns it as the uid attribute of each element version, and osm2pgsql writes it to
  an osm_uid column.
parent: userid
categories:
- pii
- useraccounts
langs:
- common
is_pii: true
classification: identifier
regexp: ^[1-9][0-9]{0,18}$
mappings:
