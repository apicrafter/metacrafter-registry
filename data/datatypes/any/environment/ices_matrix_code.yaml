id: ices_matrix_code
name: ICES matrix code (MATRX)
status: draft
doc: 'Code of the sampled matrix in the MATRX vocabulary of ICES: the tissue of an animal (LI liver, MU
  muscle, SB soft body), a sediment fraction (SED63, sediment below 63 micrometres) or a kind of water
  sample. It tells in what a contaminant was measured.'
