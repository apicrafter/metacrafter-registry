id: nlbtw
name: BTW-nummer op veldnaam
status: stable
doc: NL datatype for 'BTW-nummer op veldnaam' (nlbtw) from rules in context 'finances'. The Dutch VAT
  identification number (BTW-nummer, Belasting Toegevoegde Waarde) is a unique identifier assigned to
  businesses for VAT purposes within the European Union. It consists of the country code 'NL' followed
  by 12 alphanumeric characters (letters and/or digits).
categories:
- finances
country:
- NL
langs:
- nl
is_pii: true
classification: identifier
regexp: ^NL[0-9A-Z]{12}$
examples:
- value: NL123456789B01
  description: Dutch VAT identification number (BTW-nummer) with country code NL and 12 alphanumeric characters
- value: NL987654321A12
  description: Another valid Dutch VAT identification number format
- value: NLABCDEFGHIJ01
  description: Dutch VAT identification number with letters in the alphanumeric part
links:
- type: wikipedia
  url: https://nl.wikipedia.org/wiki/BTW-nummer
- type: doc
  url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/btw/btw_nederland/btw_nummer
