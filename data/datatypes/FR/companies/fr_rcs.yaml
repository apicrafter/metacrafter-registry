id: fr_rcs
name: French trade and companies register number (RCS)
status: draft
doc: 'Registration of a trader or a commercial company in the French Registre du commerce et des sociétés
  (RCS), as written on its K or Kbis extract: RCS, the city of the registry, the letter A for an individual
  trader or B for a company, and the nine-digit SIREN number, as in RCS Nancy B 323 159 715. The check
  digit of the SIREN applies.'
categories:
- companies
country:
- FR
langs:
- fr
is_pii: false
classification: identifier
regexp: ^RCS \S.*? [AB] ?(?:\d ?){8}\d$
examples:
- value: RCS Nancy B 323 159 715
  description: Example from the python-stdnum documentation
- value: RCS Nancy B 323159715
  description: The same number with a compact SIREN
- value: RCSNancy B 323 159 715
  valid: false
  description: No space after RCS
- value: RCS Nancy C 323 159 715
  valid: false
  description: Letter other than A or B
mappings:
  stdnum: fr.rcs
links:
