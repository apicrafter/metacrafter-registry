id: emissioninventory
name: Emission inventory field
status: draft
doc: Generic type of a column of an air pollutant or greenhouse gas emission inventory, the dataset that
  lists the amounts each source or sector emits in a year. The metacrafter rules recognize it by column
  names such as emission_inventory, air_emissions or ghg_inventory. It has no single value format; the
  codes inside such datasets have their own records, such as ipcc_emission_category and greenhouse_gas.
