id: benatcardid
name: Belgium national card ID
status: stable
doc: Belgium identity card is a national identity card issued to all citizens of Belgium aged 12 years
  old and above.
categories:
- pii
- persons
country:
- BE
langs:
- fr
is_pii: true
classification: identifier
regexp: '[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[1-2][0-9]|3[0-1])-[0-9]{3}\.[0-9]{2}'
mappings:
  purview:
  - Belgium national number
  - EU Social Security Number (SSN) or Equivalent ID
  - EU social security number or equivalent identification
  - EU national identification number
  - EU Tax Identification Number (TIN)
  - EU Tax identification number
links:
