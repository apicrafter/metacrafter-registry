id: icaoairlinecode
name: ICAO Airline code
status: stable
doc: The ICAO airline designator is a code assigned by the International Civil Aviation Organization (ICAO)
  to aircraft operating agencies, aeronautical authorities, and services related to international aviation,
  each of which is allocated both a three-letter designator and a telephony designator.
semantic_type: airlinecode
langs:
- common
regexp: '[A-Z0-9]{3}'
examples:
- value: THY
  description: Turkish Airlines
- value: BWG
  description: Blue Wings
mappings:
  wikidata: P230
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Airline_codes
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P230
