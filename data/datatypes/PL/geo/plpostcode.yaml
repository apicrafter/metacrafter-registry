id: plpostcode
name: Polish postal code
status: stable
doc: 'Postal code (kod pocztowy) in Poland: two digits, a hyphen and three digits, as in 00-950.'
semantic_type: postindex
categories:
- geo
country:
- PL
langs:
- pl
is_pii: false
classification: identifier
regexp: ^\d{2}-\d{3}$
examples:
- value: 00-950
- value: 05-470
- value: 48-300
- value: 32-015
- value: 00950
  valid: false
  description: without the hyphen
mappings:
  fta: POSTAL_CODE.POSTAL_CODE_PL
  dpv: pd:PostalCode
  schema_org: postalCode
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Postal_codes_in_Poland
- type: other
  url: https://chromium-i18n.appspot.com/ssl-address/data/PL
