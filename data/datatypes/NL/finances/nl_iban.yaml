  description: Example of the SWIFT IBAN Registry
- value: NL91 ABNA 0417 1643 00
  description: The same IBAN in its printed form
- value: NL91ABNA0417164301
  valid: false
  description: Check digits do not match
- value: NL91ABNA041716430
  valid: false
  description: 17 characters
