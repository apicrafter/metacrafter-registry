id: date_greek
name: Date with a Greek month name
status: draft
doc: Calendar date written in Greek with the month name, day, month and year in the order of the CLDR
  long (d MMMM y) and medium (d MMM y) date formats of the el locale. The month is the CLDR wide or abbreviated
  name in the format context, written exactly as CLDR gives it, including any dot or apostrophe; no extra
  capitalisation variants are accepted.
semantic_type: date
langs:
- el
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01]) (?:Φεβρουαρίου|Σεπτεμβρίου|Ιανουαρίου|Δεκεμβρίου|Οκτωβρίου|Νοεμβρίου|Αυγούστου|Απριλίου|Μαρτίου|Ιουνίου|Ιουλίου|Μαΐου)
  \d{4}|(?:0?[1-9]|[12]\d|3[01]) (?:Ιουν|Ιουλ|Νοε|Δεκ|Ιαν|Μαΐ|Μαρ|Φεβ|Απρ|Αυγ|Σεπ|Οκτ) \d{4})$
examples:
- value: 3 Οκτωβρίου 2024
  description: 3 October 2024, CLDR long format d MMMM y
- value: 25 Δεκ 2024
  description: 25 December 2024, CLDR medium format d MMM y
- value: Οκτωβρίου 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/el/ca-gregorian.json
