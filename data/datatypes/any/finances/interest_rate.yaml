- value: 6,00%
  description: a fixed rate
- value: tasa fija anual del 21%
  description: tasa final of the interest rate subsidies of the Fondo para la Transformación y el Crecimiento
- value: Semestral
  valid: false
  description: 'a frequency of payments: periodicity'
