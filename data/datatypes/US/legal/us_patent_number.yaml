id: us_patent_number
name: US patent number
status: draft
doc: 'Number of a United States patent document with the US country code and, often, the WIPO ST.16 kind
  code, as the USPTO recommends: for example "US 8,273,349 B2" for a granted patent. Granted utility patents
  have up to eight digits; prefixes mark reissues (RE), plant patents (PP), design patents (D) and statutory
  invention registrations (H). Patent application publications have the publication year and a seven-digit
  number; some sources, PubChem among them, drop the leading zero of that number. PubChem writes the parts
  with hyphens, as US-8273349-B2. Bare numbers without the US code are not covered.'
categories:
- legal
country:
- US
langs:
- common
is_pii: false
classification: identifier
regexp: ^US[- ]?(?:\d{4}/?\d{6,7}|\d{1,3}(?:,?\d{3}){1,2}|RE\d{1,2},?\d{3}|PP\d{1,2},?\d{3}|D\d{1,3},?\d{3}|H\d{1,4})(?:[-
  ]?[A-Z]\d?)?$
examples:
- value: US-8273349-B2
  description: Granted patent, as PubChem writes it
- value: US 8,273,349 B2
  description: The same patent, as the USPTO recommends
- value: US-4237089-A
  description: Patent granted before 2001
- value: US-20140213558-A1
  description: Patent application publication
- value: US-2004121015-A1
  description: Patent application publication without the leading zero of the number
- value: US-RE38496-E1
  description: Reissue patent
- value: US-D693998-S1
  description: Design patent
- value: EP-3319929-A1
  valid: false
  description: European patent publication
