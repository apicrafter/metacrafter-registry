id: uuid_v4
name: Random UUID (version 4)
status: draft
doc: UUID of version 4 under RFC 9562. Apart from the version and variant bits, its 122 bits are random,
  so it carries no time or host information. It is the most common kind of UUID, made by functions such
  as uuid.uuid4() in Python, crypto.randomUUID() in JavaScript and gen_random_uuid() in PostgreSQL. The
  version digit, the first digit of the third group, is 4, and the first digit of the fourth group is
  8, 9, a or b.
parent: uuid
categories:
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
examples:
