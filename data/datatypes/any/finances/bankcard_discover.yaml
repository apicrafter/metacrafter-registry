id: bankcard_discover
name: Discover card number
status: draft
doc: 'Primary account number of a Discover card: 16 to 19 digits that start with 6011, 644 to 649 or 65,
  or with 622126 to 622925 for cards co-branded with China UnionPay. The last digit is a Luhn check digit.
  The pattern accepts the number without spaces or hyphens.'
semantic_type: bankcard
langs:
- common
regexp: ^(?:6011[0-9]{12,15}|64[4-9][0-9]{13,16}|65[0-9]{14,17}|622(?:12[6-9]|1[3-9][0-9]|[2-8][0-9]{2}|9[01][0-9]|92[0-5])[0-9]{10,13})$
checksum: luhn
examples:
- value: '6011111111111117'
  description: Stripe test card number
- value: '6011000990139424'
  description: Stripe test card number
- value: '6200000000000005'
  valid: false
  description: UnionPay test number outside the co-branded range
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Payment_card_number
- type: doc
  url: https://docs.stripe.com/testing
