id: es_ccc
name: Spanish bank account code (CCC)
status: draft
doc: 'Código Cuenta Cliente, the 20-digit Spanish bank account number: a 4-digit bank code, a 4-digit
  office code, two check digits and a 10-digit account number. Since 2014 it is used inside the Spanish
  IBAN.'
parent: bankaccount
categories:
- finances
country:
- ES
langs:
