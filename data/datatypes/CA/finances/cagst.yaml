id: cagst
name: GST/HST account number
status: stable
doc: CA datatype for 'GST/HST account number' (cagst) from rules in context 'finances'.
categories:
- finances
country:
- CA
langs:
- en
is_pii: false
classification: identifier
regexp: ^[0-9]{9}RT[0-9]{4}$
examples:
- value: 123456789RT0001
  description: GST/HST account number with 9-digit Business Number, 'RT' program identifier and 4-digit
    reference
- value: 987654321RT0002
  description: Another valid GST/HST account number format
mappings:
