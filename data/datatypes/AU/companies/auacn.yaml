id: auacn
name: Australian Company Number (ACN)
status: stable
doc: An Australian Company Number (usually shortened to ACN) is a unique identifier required by every
  company registered under Australia’s Corporations Act 2001 (Cth).
categories:
- companies
country:
- AU
langs:
- en
is_pii: false
classification: identifier
regexp: ^\d{3} ?\d{3} ?\d{3}$
examples:
- value: 008984049
  description: Wesfarmers
- value: '158571852'
  description: Australian National Line
mappings:
