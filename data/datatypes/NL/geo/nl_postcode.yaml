id: nl_postcode
name: Dutch postal code
status: draft
doc: 'Postcode in the Netherlands: four digits, the first not 0, followed by two capital letters and normally
  separated from them by a space. The letter pairs SA, SD and SS are not used.'
parent: postindex
categories:
- geo
country:
- NL
langs:
- nl
is_pii: true
classification: categorical
regexp: ^[1-9]\d{3} ?[A-Z]{2}$
examples:
- value: 3443 BX
  description: Synthetic number in the documented format
- value: 8205 WZ
  description: Synthetic number in the documented format
- value: 3443BX7
  valid: false
  description: One character too many
mappings:
  fta: POSTAL_CODE.POSTAL_CODE_NL
links:
