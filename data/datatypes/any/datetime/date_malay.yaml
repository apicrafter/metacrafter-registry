id: date_malay
name: Date with a Malay month name
status: draft
doc: Calendar date written in Malay with the month name, day, month and year in the order of the CLDR
  long (d MMMM y) and medium (d MMM y) date formats of the ms locale. The month is the CLDR wide or abbreviated
  name in the format context, written exactly as CLDR gives it, including any dot or apostrophe; no extra
  capitalisation variants are accepted.
semantic_type: date
langs:
- ms
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01]) (?:September|Disember|November|Februari|Januari|Oktober|April|Julai|Ogos|Jun|Mei|Mac)
  \d{4}|(?:0?[1-9]|[12]\d|3[01]) (?:Jun|Ogo|Dis|Nov|Jan|Mei|Mac|Feb|Sep|Apr|Jul|Okt) \d{4})$
examples:
- value: 3 Oktober 2024
  description: 3 October 2024, CLDR long format d MMMM y
- value: 25 Dis 2024
  description: 25 December 2024, CLDR medium format d MMM y
- value: Oktober 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/ms/ca-gregorian.json
