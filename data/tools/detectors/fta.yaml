id: fta
name: FTA (Fast Text Analysis)
category: detector
doc: Java library by Tim Segall that profiles a stream of values and infers its base type, format and
  semantic type, for example EMAIL, IDENTITY.VAT_FR or POSTAL_CODE.ZIP5_US. It ships about 260 semantic
  types, many of them for specific locales. The registry records that FTA detects carry the FTA name in
  mappings.fta; this list is derived from them.
website: https://github.com/tsegall/fta
