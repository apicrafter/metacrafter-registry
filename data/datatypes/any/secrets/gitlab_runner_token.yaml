id: gitlab_runner_token
name: GitLab runner authentication token
status: draft
doc: Token with which a GitLab Runner authenticates to a GitLab instance to pick up CI/CD jobs. GitLab
  gives these tokens the prefix glrt- (glrtr- for runners created with a registration token), which cannot
  be configured. GitLab does not document the length; the regexp follows the gitleaks rule (20 characters
  after the prefix, or the longer routable form t<digit>_... ending with a dot and a nine-character suffix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glrtr?-(?:[A-Za-z0-9_-]{20}|t[0-9]_[A-Za-z0-9_-]{27,300}\.[0-9a-z]{9})$
examples:
- value: glrt-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
