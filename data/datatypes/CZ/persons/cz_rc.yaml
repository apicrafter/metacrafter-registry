id: cz_rc
name: Czech birth number (rodné číslo)
status: draft
doc: Rodné číslo, the Czech national personal identifier; Slovakia uses the same scheme. It encodes the
  date of birth and the sex. Numbers given after 1 January 1954 have ten digits, older ones nine. It is
  usually written with a slash after the sixth digit.
categories:
- pii
- persons
country:
- CZ
langs:
- cs
is_pii: true
classification: identifier
regexp: ^\d{6}/?\d{3,4}$
checksum: cz_rc
examples:
- value: '7810181082'
  description: Synthetic number with a valid check digit
- value: '1457090811'
  description: Synthetic number with a valid check digit
- value: 781018/1082
  description: The first example in its printed form
- value: '7810181080'
  valid: false
  description: Check digit does not match
