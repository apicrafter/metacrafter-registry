id: eu_corporate_body_code
name: EU corporate body code
status: draft
doc: Code of an institution, body or agency of the European Union in the corporate bodies authority list
  of the Publications Office of the EU. ORG-ID.guide lists the register as XR-EUCB; with that prefix an
  identifier reads XR-EUCB-ACP_MIN.
