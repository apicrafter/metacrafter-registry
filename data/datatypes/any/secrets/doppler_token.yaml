id: doppler_token
name: Doppler token
status: draft
doc: 'Access token of the Doppler secrets manager. Doppler documents one format per token type, each starting
  with dp. and a type code: dp.pt. (personal), dp.st. (service, optionally followed by a lowercase name
  of 2 to 35 characters and a dot), dp.ct. (CLI), dp.sa. (service account), dp.scim. (SCIM) and dp.audit.
  (audit). 40 to 44 letters and digits follow.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^dp\.(?:(?:pt|ct|sa|scim|audit)\.|st\.(?:[a-z0-9_-]{2,35}\.)?)[A-Za-z0-9]{40,44}$
examples:
- value: dp.pt.ExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://docs.doppler.com/reference/auth-token-formats
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/doppler/doppler.go
