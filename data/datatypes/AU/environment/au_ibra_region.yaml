id: au_ibra_region
name: IBRA bioregion name (Australia)
status: draft
doc: Name of one of the 89 bioregions of the Interim Biogeographic Regionalisation for Australia, version
  7 (IBRA 7, 2012), for example NSW North Coast, Brigalow Belt South or Wet Tropics. Bioregions are areas
  of similar climate, geology, landform and vegetation; they cross state borders. The three-letter code
  of a bioregion is au_ibra_region_code.
parent: name
