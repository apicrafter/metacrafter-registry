id: gitlab_trigger_token
name: GitLab pipeline trigger token
status: draft
doc: Token that starts a CI/CD pipeline of a GitLab project through the pipeline triggers API. GitLab
  gives these tokens the prefix glptt-, which cannot be configured. GitLab does not document the length;
  the regexp follows the gitleaks rule (40 hexadecimal digits after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glptt-[0-9a-f]{40}$
examples:
- value: glptt-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
