id: dcid
name: Datacommons unique id
status: stable
doc: Every entity in Data Commons (DC) has a unique identifier, called ‘dcid’. So, for example, the dcid
  of California is ‘geoId/06’ and of India is ‘country/IND’.
categories:
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9_/.-]+$
examples:
- value: geoId/06
  description: California
- value: country/IND
  description: India
- value: GiniIndex_EconomicActivity
  description: Gini coefficient
mappings:
  wikidata: P10730
links:
- type: other
  url: https://docs.datacommons.org/bigquery/unique_identifiers.html
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P10730
