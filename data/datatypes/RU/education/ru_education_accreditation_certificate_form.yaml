translations:
  ru:
    name: Серия и номер бланка свидетельства о государственной аккредитации образовательной деятельности
    doc: Серия бланка состоит из 5 знаков (код аккредитационного органа, буква А и номер серии), номер
      бланка из 7 цифр. Технические требования утверждены приказом Минобрнауки России от 10.01.2012 №
      1.
