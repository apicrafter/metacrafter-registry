id: uiccode
name: UIC station code
status: stable
doc: Identifier for a railway station in Europe, CIS countries, the Far East (China, Mongolia, Japan,
  Korea, Vietnam), North Africa and the Middle East
categories:
- transport
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:10|2\d|3[0-3]|4[01249]|5\d|6[0125678]|7\d|8[0-8]|9\d)\d{5,6}$
examples:
- value: '8748100'
  description: Nantes Station
- value: '7120100'
  description: Train station of Astorga
mappings:
  wikidata: P722
links:
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P722
