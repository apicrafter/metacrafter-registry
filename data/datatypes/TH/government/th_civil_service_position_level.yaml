is_pii: false
classification: categorical
regexp: ^(?:ปฏิบัติงาน|ชำนาญงาน|อาวุโส|ทักษะพิเศษ|ปฏิบัติการ|ชำนาญการ|ชำนาญการพิเศษ|เชี่ยวชาญ|ทรงคุณวุฒิ|(?:ประเภท)?(?:อำนวยการ|บริหาร)
  ?(?:ระดับ)?(?:ต้น|สูง)|ประเภท(?:ทั่วไป|วิชาการ) ระดับ(?:ปฏิบัติงาน|ชำนาญงาน|อาวุโส|ทักษะพิเศษ|ปฏิบัติการ|ชำนาญการ|ชำนาญการพิเศษ|เชี่ยวชาญ|ทรงคุณวุฒิ))$
examples:
- value: ชำนาญการพิเศษ
  description: senior professional level of the knowledge worker type
