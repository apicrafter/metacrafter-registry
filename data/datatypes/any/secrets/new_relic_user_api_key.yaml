id: new_relic_user_api_key
name: New Relic user key
status: draft
doc: User key of New Relic, a personal API key that NerdGraph, New Relic's GraphQL API, requires for querying
  data and changing configuration. It starts with NRAK- followed by 27 letters and digits. Ingest keys,
  such as the license key and browser keys, are different.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^NRAK-[A-Za-z0-9]{27}$
examples:
- value: NRAK-ExampleKeyNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
