translations:
  cs:
    name: Daňové identifikační číslo (DIČ)
    doc: Kód CZ a kmenová část tvořená IČO právnické osoby, rodným číslem fyzické osoby nebo vlastním
      identifikátorem přiděleným správcem daně (VČP).
  ru:
    name: Налоговый номер Чехии (DIČ)
    doc: Код CZ и основная часть - IČO юридического лица, персональный номер (rodné číslo) физического
      лица или номер, присвоенный налоговой службой.
