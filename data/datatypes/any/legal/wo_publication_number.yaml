id: wo_publication_number
name: PCT international publication number (WO)
status: draft
doc: Number that the International Bureau of WIPO gives to a published international patent application
  under the Patent Cooperation Treaty. Since 2004 it is WO, the four-digit year of publication, a slash
  and a six-digit serial number, such as WO 2004/123456; data often uses a compact form with a kind code
  A1 to A4, A8 or A9. Older numbers have a two-digit year and a five- or six-digit serial number.
categories:
- legal
langs:
- common
is_pii: false
classification: identifier
regexp: '^WO ?(?:(?:19|20)\d{2}/?\d{6}|\d{2}/?\d{5,6})(?: ?A[1-489])?$'
examples:
- value: WO 2004/012345
  description: Publication number in the format of PCT Administrative Instructions Section 404
- value: WO2004012345A2
  description: The same publication in compact form with its kind code
- value: WO 95/26134
  description: Older form with a two-digit year, from the WIPO Handbook
- value: WO 2004/12345
  valid: false
  description: A four-digit year needs a six-digit serial number
links:
- type: doc
  url: https://www.wipo.int/pct/en/texts/ai/s404.html
- type: doc
  url: https://www.wipo.int/en/web/patentscope/data/kind_codes
- type: doc
  url: https://www.wipo.int/documents/d/standards/docs-en-07-02-02.pdf
