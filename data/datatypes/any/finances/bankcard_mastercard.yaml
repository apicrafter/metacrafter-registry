id: bankcard_mastercard
name: Mastercard card number
status: draft
doc: 'Primary account number of a Mastercard card: 16 digits that start with 51 to 55 or, since 2017,
  with 2221 to 2720. The last digit is a Luhn check digit. The pattern accepts the number without spaces
  or hyphens.'
semantic_type: bankcard
langs:
- common
regexp: ^(?:5[1-5][0-9]{2}|222[1-9]|22[3-9][0-9]|2[3-6][0-9]{2}|27[01][0-9]|2720)[0-9]{12}$
checksum: luhn
examples:
- value: '5555555555554444'
  description: Stripe test card number
- value: '2223003122003222'
  description: Stripe test card number from the 2-series range
- value: '4242424242424242'
  valid: false
  description: Visa test number
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Payment_card_number
- type: doc
  url: https://docs.stripe.com/testing
