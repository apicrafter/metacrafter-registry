id: mt_postcode
name: Malta postal code
status: draft
doc: 'Postal code in Malta: three letters and four digits, optionally separated by a space; codes in the
  format used before 2007 have two digits.'
semantic_type: postindex
country:
- MT
langs:
- mt
- en
regexp: ^[A-Z]{3} ?\d{2,4}$
examples:
- value: NXR 01
- value: ZTN 05
- value: GPO 01
- value: BZN 1130
- value: SPB 6031
- value: VCT 1753
- value: NXR 0
  valid: false
  description: too short
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Postal_codes_in_Malta
- type: other
  url: https://chromium-i18n.appspot.com/ssl-address/data/MT
