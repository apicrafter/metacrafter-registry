id: language
name: Language
status: draft
doc: A human language, written as its name, such as Japanese or French. Typical columns hold the language
  of a document, film or web page, or a language that a person speaks. Language codes have their own records,
  such as languagetag (IETF BCP 47 tags), and the Dublin Core element has the record dclanguage.
