id: bf_phone
name: Burkina Faso phone number (E.164)
status: draft
doc: 'Phone number of Burkina Faso in international E.164 form: a plus sign, the country calling code
  +226 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- BF
langs:
- common
regexp: ^\+226(?:[024-7]\d{7})$
examples:
- value: '+22620491234'
  description: Example number from Google libphonenumber (fixed line)
- value: '+22670123456'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
