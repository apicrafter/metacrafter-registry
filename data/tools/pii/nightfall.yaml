id: nightfall
name: Nightfall AI
category: pii
doc: Nightfall is a cloud data loss prevention platform that scans SaaS applications, endpoints and API
  payloads for sensitive data. Its built-in detectors use machine learning models and pattern rules; each
  has a detector ID used in API requests and policies, and findings come with a confidence level. The
  detector glossary covers personal data, national identifiers by region, bank and card numbers, secrets
  and health data, plus file and image classifiers.
website: https://help.nightfall.ai/detection_platform/detection_glossary
