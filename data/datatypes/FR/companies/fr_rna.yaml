id: fr_rna
name: French association number (RNA)
status: draft
doc: Number of an association in the Répertoire national des associations (RNA), the register of associations
  declared under the 1901 law that the Ministry of the Interior keeps; it replaced the Waldec register
  in 2010. In metropolitan France it is the letter W and nine digits; Wikidata also accepts W followed
  by 2A or 2B, or by 9 and one of the letters G, M, C, T, R or N, and seven digits. Wikidata keeps numbers
  of the earlier register, such as 751P00105292, in a separate property (P6309). Associations of Alsace-Moselle
  law are not in the RNA.
categories:
- companies
