id: yescrypt_hash
name: yescrypt password hash
status: draft
doc: 'Password hash of yescrypt, the scrypt-based scheme by Openwall that is the default in /etc/shadow
  on recent releases of Debian, Ubuntu and Fedora, in Modular Crypt Format: $y$, the encoded parameters
  (j9T for the common defaults), $, the salt, $ and 43 characters of crypt Base64.'
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^\$y\$[./A-Za-z0-9]+\$[./A-Za-z0-9]{0,86}\$[./A-Za-z0-9]{43}$
examples:
- value: $y$j9T$ZVLMh/5PZBLMgF5$/1rXWcrKaeN6YWKzR1LbhwrY1sBgM9R1a4daQyX/.z/
  description: Hash of the word "example" with the salt examplesalt and the default parameters
- value: $6$saltstring$svn8UoSVapNtMuq1ukKS4tPQd8iKwSMHWjl/O817G3uBnIFNjnQJuesI68u4OTLiBFdcbYEdFCoEOfaS35inz1
  valid: false
  description: SHA-512-crypt hash
links:
- type: other
  url: https://www.openwall.com/yescrypt/
- type: doc
  url: https://man.archlinux.org/man/crypt.5
