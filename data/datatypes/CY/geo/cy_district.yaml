id: cy_district
name: District of Cyprus
status: draft
doc: 'Name of one of the six districts (επαρχίες) of the Republic of Cyprus: Lefkosia (Nicosia), Lemesos
  (Limassol), Larnaka (Larnaca), Pafos (Paphos), Ammochostos (Famagusta) and Keryneia (Kyrenia). Tables
  give it in Greek (Λευκωσία, ΛΕΜΕΣΟΣ), in the official transliteration (Lefkosia, Lemesos, Larnaka) or
  under the English exonym (Nicosia, Limassol), and court, police and forest tables in the genitive (Λευκωσίας,
  Αμμοχώστου). Election and police districts carry the same names. The number of a district in the statistical
  codes of municipalities and communities (1 to 6) is not this type.'
