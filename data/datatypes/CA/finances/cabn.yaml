id: cabn
name: Canada Business Number
status: stable
doc: 'Business Number (BN) that the Canada Revenue Agency assigns to a business for its dealings with
  federal and provincial governments: nine digits, the last of which is a Luhn check digit. With a two-letter
  program identifier and a four-digit reference number it forms a program account number (caprogramacct).'
