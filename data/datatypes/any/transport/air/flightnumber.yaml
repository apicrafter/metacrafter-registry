id: flightnumber
name: Flight number
status: stable
doc: In the aviation industry, a flight number or flight designator is a code for an airline service consisting
  of two-character airline designator and a 1 to 4 digit number.
categories:
- transport
langs:
- common
is_pii: false
classification: identifier
regexp: ([A-Z]{2,3}|[A-Z][0-9]|[0-9][A-Z])\d{1,4}[A-Z]?|\d{1,4}
examples:
- value: EK521
  description: Emirates Flight 521
- value: 4U9525
  description: Germanwings Flight 9525
mappings:
  wikidata: P3090
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Flight_number
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P3090
