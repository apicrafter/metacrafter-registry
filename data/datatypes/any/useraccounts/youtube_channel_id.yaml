id: youtube_channel_id
name: YouTube channel ID
status: draft
doc: 'Identifier of a YouTube channel: UC and 22 characters, as in youtube.com/channel/<id>. Channel handles
  that start with @ are different identifiers.'
parent: username
categories:
- pii
- persons
- useraccounts
langs:
- common
is_pii: true
classification: identifier
regexp: ^UC[-_0-9A-Za-z]{21}[AQgw]$
