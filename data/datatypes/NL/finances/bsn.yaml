id: bsn
name: Burgerservicenummer op veldnaam
status: stable
doc: NL datatype for 'Burgerservicenummer op veldnaam' (bsn) from rules in context 'finances'. The Burgerservicenummer
  (BSN) is a unique 9-digit personal identification number assigned to every Dutch citizen and resident.
  It is used for identification in interactions with government agencies, healthcare providers, and for
  tax purposes. The BSN replaced the former Social Security Number (SoFi-nummer) in 2007. It consists
  of exactly 9 digits and uses an 11-proef (11-check) algorithm for validation.
categories:
- finances
country:
- NL
langs:
- nl
is_pii: true
classification: identifier
regexp: ^[0-9]{9}$
examples:
- value: '123456782'
  description: Dutch BSN (Burgerservicenummer) with 9 digits
- value: '987654321'
  description: Another valid Dutch BSN format
- value: '111222333'
  description: Example Dutch BSN number
