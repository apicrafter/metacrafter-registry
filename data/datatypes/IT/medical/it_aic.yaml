id: it_aic
name: Italian medicine authorisation code (AIC)
status: draft
doc: Codice AIC (autorizzazione all'immissione in commercio), the code that the Italian Medicines Agency
  (AIFA) gives to each medicine pack authorised for sale in Italy. It has nine digits including a check
  digit, or six characters in its base-32 form.
categories:
- medical
country:
- IT
langs:
- it
is_pii: false
classification: identifier
regexp: ^(?:\d{9}|[0-9B-DF-HJ-NP-Z]{6})$
checksum: it_aic
examples:
- value: 079878625
  description: Synthetic number with a valid check digit
- value: 091810440
  description: Synthetic number with a valid check digit
- value: 079878620
  valid: false
  description: Check digit does not match
