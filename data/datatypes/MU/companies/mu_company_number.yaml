id: mu_company_number
name: Mauritian company number
status: draft
doc: Company or partnership number (file number) in the Companies and Businesses Registration Integrated
  System (CBRIS) of Mauritius. It differs from the business registration number that some companies also
  have. ORG-ID.guide lists the register as MU-CR; with that prefix an identifier reads MU-CR-C136127.
