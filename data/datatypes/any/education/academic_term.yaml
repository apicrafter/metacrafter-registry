id: academic_term
name: Academic term (Fall 2015, Spring Semester 2016)
status: draft
doc: 'Term of an academic year of a college or school with its year, as course lists, class schedules
  and catalogs write it: Fall 2015, Spring Semester 2016, Summer Term 2015, Winter Quarter 2014, 2013
  Fall, Fall ’10, the terms of Oxford and Cambridge (Michaelmas Term 2014) and numbered semesters (2nd
  Semester 2014-15). Registrar systems also write it as a code (FA14, Sp 2011). The academic year alone
  (2015-16) is school_year and a season of the year without a term is season.'
