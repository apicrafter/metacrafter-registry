id: se_vehicle_plate
name: Swedish vehicle registration plate
status: draft
doc: 'Registration number on Swedish vehicle plates: three letters, a space, two digits and a digit or,
  since 2019, a letter. The letters I, Q, V, Å, Ä and Ö are not used, and the last character is never
  O. Personalised plates are not covered.'
categories:
- transport
country:
- SE
langs:
- sv
is_pii: false
classification: identifier
regexp: ^[A-HJ-PR-UW-Z]{3} ?[0-9]{2}[0-9A-HJ-NPR-UW-Z]$
examples:
- value: ABC 123
  description: Format example from Wikipedia
- value: ABC 12A
  description: Format example with a letter at the end from Wikipedia
- value: ABC 12O
  valid: false
  description: O in the last position
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Sweden
