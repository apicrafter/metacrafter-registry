id: pegi_rating
name: PEGI video game rating
status: draft
doc: 'Age rating of a video game under Pan European Game Information (PEGI), used in most European countries:
  3, 7, 12, 16 or 18, often written with the prefix PEGI. Content descriptors, such as violence or bad
  language, are given separately.'
parent: content_rating
categories:
- media
langs:
- common
is_pii: false
classification: categorical
regexp: ^(?:PEGI ?)?(?:3|7|12|16|18)$
examples:
- value: PEGI 3
- value: PEGI 12
- value: PEGI 18
- value: '16'
- value: PEGI 15
  valid: false
  description: Not a PEGI age
