id: gitlab_pat
name: GitLab personal access token
status: draft
doc: Personal access token of GitLab, which authenticates a user to the GitLab API and to Git over HTTPS.
  GitLab gives these tokens the prefix glpat-. The classic form has 20 more characters; the newer routable
  form is longer and ends with a dot and a nine-character suffix. Examples are left out because GitHub
  push protection rejects token-shaped values, even constructed ones.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glpat-(?:[A-Za-z0-9_-]{20}|[A-Za-z0-9_-]{27,300}\.[0-9a-z]{2}[0-9a-z]{7})$
examples:
- value: glpat-ExampleToken
  valid: false
  description: Too short
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
