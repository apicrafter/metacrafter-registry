id: terraform_cloud_api_token
name: HashiCorp Terraform Cloud API token
status: draft
doc: 'User or organization API token of HashiCorp Terraform Cloud: 14 letters and digits, the marker .atlasv1.
  and 60 to 70 more letters, digits and the characters _ - =.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9]{14}\.atlasv1\.[A-Za-z0-9_=-]{60,70}$
examples:
- value: ExampleTokenAB.atlasv1.NotReal
  valid: false
  description: Too short
links:
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/terraformcloudpersonaltoken/terraformcloudpersonaltoken.go
