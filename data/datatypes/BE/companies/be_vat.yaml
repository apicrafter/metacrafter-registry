  nl:
    name: Ondernemingsnummer
    doc: Tiencijferig nummer van een onderneming in de Kruispuntbank van Ondernemingen (KBO); met het
      voorvoegsel BE ook het btw-nummer. Het begint met 0 of 1, de laatste twee cijfers zijn een controlegetal
      modulo 97.
  fr:
    name: Numéro d'entreprise
    doc: Numéro à dix chiffres d'une entreprise dans la Banque-Carrefour des Entreprises (BCE); précédé
      de BE, c'est aussi le numéro de TVA. Il commence par 0 ou 1 et se termine par deux chiffres de contrôle
      modulo 97.
