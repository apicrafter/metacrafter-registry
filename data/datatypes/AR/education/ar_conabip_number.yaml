id: ar_conabip_number
name: Argentine popular library number (CONABIP)
status: draft
doc: Number of a popular library (biblioteca popular, a library run by a civil association) in the register
  of the Comisión Nacional de Bibliotecas Populares (CONABIP) of Argentina, created by Ley 419 of 1870.
  The numbers are given in the order of recognition and run to a few thousand (938, 4398); the directory
  of popular libraries of the culture ministry lists about 1,900 of them.
