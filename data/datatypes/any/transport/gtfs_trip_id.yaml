id: gtfs_trip_id
name: GTFS trip id
status: draft
doc: Value of the trip_id field of a GTFS feed, the identifier of a trip in trips.txt that stop_times.txt
  and the trip descriptors of GTFS Realtime refer to. It is any text the agency chooses (759, 1492, AM_WD_1023-1),
  unique in the feed and not across feeds, so the field name is the evidence.
parent: id
