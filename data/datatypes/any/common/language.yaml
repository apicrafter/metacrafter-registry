id: language
name: Language
status: draft
doc: 'Human language written as a name, such as English, Deutsch or allemand (German in French), or as
  a code. Codes have their own patterns: iso639_1 (two letters) and iso639_2 (three letters). A language
  tag with region or script subtags, such as en-GB, is the datatype languagetag.'
