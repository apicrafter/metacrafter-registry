id: street_intersection
name: Street intersection
status: draft
doc: 'A place given as the crossing of two streets instead of a house number: two street names joined
  by a sign or a word, as in DEHEZA@PINTO, CORDOBA AV. & JUNIN, Av. San Juan y Chacabuco, Main St & 2nd
  Ave or Broadway / W 42nd St. Geocoders return it for corners, and data about traffic lights, cameras,
  accidents, bus stops and street works locate their rows this way. A row of three names is a block between
  two cross streets (Av. Brasil entre Lima y Salta).'
