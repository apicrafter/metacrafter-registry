id: cz_rc
name: Czech birth number (rodné číslo)
status: draft
doc: 'Rodné číslo, the Czech personal number; Slovakia uses the same scheme. The first six digits are
  the date of birth as YYMMDD. Women have 50 added to the month. Since 2004 (Act 53/2004) a further 20
  is added to the month (70 for women) when the serial numbers of a day run out. Numbers of people born
  before 1954 have nine digits. Later ones have a tenth, check digit: the number is divisible by 11, except
  a few issued until 1985 whose first nine digits leave a remainder of 10 and that end in 0. It is usually
  written with a slash after the sixth digit. The Ministry of the Interior also assigns birth numbers
  to foreigners with long-term residence. Health insurance, social security and, by default, tax registration
  use it.'
categories:
- pii
- persons
country:
- CZ
langs:
- cs
is_pii: true
classification: identifier
regexp: ^\d{2}(?:[0257][1-9]|[1368][0-2])(?:0[1-9]|[12]\d|3[01])/?\d{3,4}$
checksum: cz_rc
examples:
- value: 710319/2745
  description: Man born on 19 March 1971, example from the python-stdnum documentation
- value: '7810181082'
  description: Synthetic number with a valid check digit
- value: '1457090811'
  description: Synthetic number of a woman born on 9 July 2014 (month 57)
- value: 057214/4738
  description: Synthetic number of a woman born on 14 February 2005 with the alternative month 72
- value: '991231123'
  description: Nine-digit number without a check digit, example from the python-stdnum documentation
- value: '7103192746'
  valid: false
  description: Check digit does not match
- value: 781318/1082
  valid: false
  description: There is no month 13
- value: '78101810827'
  valid: false
  description: One character too many
