id: nl_postcode
name: Dutch postal code
status: stable
doc: 'Postcode in the Netherlands: four digits, the first not 0, a space and two capital letters, from
  1000 AA upwards. The letter pairs SA, SD and SS are not used because of their association with Nazi
  Germany. The letters F, I, O, Q, U and Y were left out at first but are now used. The digits 0000-0999
  are kept for the Caribbean Netherlands and are not in use. A full postcode covers a part of a street,
  so with a house number it identifies an address.'
parent: postindex
categories:
- geo
country:
- NL
langs:
- nl
is_pii: true
classification: categorical
regexp: ^[1-9]\d{3} ?(?!SA|SD|SS)[A-Z]{2}$
examples:
- value: 2601 DC
  description: python-stdnum reference value
- value: 3443 BX
  description: Synthetic postcode
- value: 8205WZ
  description: Synthetic postcode written without the space
- value: 2611 SS
  valid: false
  description: SS is not used (python-stdnum reference value)
- value: 26112 ET
  valid: false
  description: Five digits (python-stdnum reference value)
- value: 0123 AB
  valid: false
  description: The first digit is 0
mappings:
  fta: POSTAL_CODE.POSTAL_CODE_NL
  dpv: pd:PostalCode
  schema_org: postalCode
  stdnum: nl.postcode
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Postal_codes_in_the_Netherlands
- type: wikipedia
  url: https://nl.wikipedia.org/wiki/Postcodes_in_Nederland
