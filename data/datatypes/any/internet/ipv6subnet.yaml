id: ipv6subnet
name: IPv6 routing prefix (subnet)
status: stable
doc: Block of IPv6 addresses written as an IPv6 address, a slash and a prefix length from 0 to 128 (RFC
  4291, section 2.3), such as 2001:db8::/32. Most single network segments are /64, because the interface
  identifier takes the last 64 bits of an address. Wikidata records the address blocks of organizations
  in property P3793.
parent: ipsubnet
categories:
- internet
langs:
- common
is_pii: true
classification: identifier
