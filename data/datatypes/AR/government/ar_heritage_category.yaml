id: ar_heritage_category
name: Argentine national heritage category
status: draft
doc: 'Category under which a building, place, grave, object, tree or town is declared national historic
  heritage of Argentina by law or decree, on the proposal of the Comisión Nacional de Monumentos, de Lugares
  y de Bienes Históricos (Ley 12.665, as amended by Ley 27.103 of 2015): Monumento Histórico Nacional,
  Lugar Histórico Nacional, Sepulcro Histórico Nacional, Bien de Interés Histórico Nacional, Bien de Interés
  Histórico Artístico, Bien de Interés Arquitectónico, Bien de Interés Industrial, Poblado Histórico,
  Área Urbana Histórica, Árbol Histórico and others; files often drop the word Nacional (Monumento Histórico)
  and vary in case and accents.'
