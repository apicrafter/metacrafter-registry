id: handle
name: Handle System identifier
status: draft
doc: 'Persistent identifier in the Handle System: a naming authority prefix and a local name separated
  by a slash. DOIs are handles whose prefix starts with 10.'
categories:
- internet
- objectids
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-z]+(?:\.[0-9a-z]+)*/\S{2,}$
