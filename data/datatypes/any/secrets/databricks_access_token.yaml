id: databricks_access_token
name: Databricks personal access token
status: draft
doc: Personal access token of Databricks, used to authenticate to a Databricks workspace. It starts with
  dapi followed by 32 hexadecimal digits; some tokens end with a hyphen and a digit.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^dapi[0-9a-f]{32}(?:-[0-9])?$
examples:
- value: dapiExampleTokenNotReal
  valid: false
  description: Not hexadecimal and too short
links:
- type: doc
  url: https://docs.databricks.com/aws/en/dev-tools/auth/pat
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/databrickstoken/databrickstoken.go
