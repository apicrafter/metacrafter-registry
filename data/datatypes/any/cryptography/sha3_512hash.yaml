id: sha3_512hash
name: SHA3-512 hash
status: draft
doc: 'Digest of the SHA3-512 hash function (SHA-3 family, FIPS 202, 512 bits). It is written as 128 hexadecimal
  digits. SHA3-512 pads its input differently from the original Keccak-512, so the two give different
  digests of the same data. Other 512-bit digests (SHA-512, Keccak-512, BLAKE2b-512 and Streebog-512)
  have the same length, so the value alone does not tell them apart: use the field name or context.'
parent: hash
categories:
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-fA-F]{128}$
examples:
