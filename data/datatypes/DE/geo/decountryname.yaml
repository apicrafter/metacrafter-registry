id: decountryname
name: Country name in German
status: stable
doc: Name of a country written in German, such as Deutschland, Österreich, Frankreich or Vereinigte Staaten.
  Official short and long forms both occur, for example Russland and Russische Föderation.
semantic_type: country
country:
- DE
langs:
- de
classification: identifier
examples:
- value: Deutschland
  description: Germany
- value: Österreich
  description: Austria
- value: Schweiz
  description: Switzerland
- value: Frankreich
  description: France
- value: Vereinigtes Königreich
  description: United Kingdom
- value: Vereinigte Staaten
  description: United States
- value: Russische Föderation
  description: Russian Federation
- value: Tschechische Republik
  description: Czech Republic
- value: Spanien
  description: Spain
- value: Italien
  description: Italy
mappings:
  fta: COUNTRY.TEXT_DE
links:
- type: wikipedia
  url: https://de.wikipedia.org/wiki/Liste_der_Staaten_der_Erde
translations:
