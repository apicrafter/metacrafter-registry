id: eu_natura2000_site
name: Natura 2000 site code
status: draft
doc: 'Code of a protected site in the Natura 2000 network of the European Union, used in the Natura 2000
  database and the Standard Data Form (Implementing Decision 2011/484/EU). It has nine characters: the
  two-letter country code (GR for Greece) and seven letters or digits that the national authority assigns.
  Sites of the United Kingdom left the network in 2021, but their UK codes remain in older data.'
categories:
- environment
- geo
country:
- EU
langs:
- common
is_pii: false
classification: identifier
regexp: ^(AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK|UK)[0-9A-Z]{7}$
