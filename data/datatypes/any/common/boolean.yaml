  ru:
    name: Логический тип
    doc: Логи́ческий тип да́нных, или булев тип, или булевый тип (от англ. Boolean или logical data type)
      — примитивный тип данных в информатике, принимающий два возможных значения, иногда называемых истиной
      (true) и ложью (false).
