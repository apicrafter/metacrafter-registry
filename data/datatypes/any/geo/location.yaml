id: location
name: Location (place name)
status: draft
doc: Name of a place of any kind, such as a settlement, an administrative area, a country, a region, a
  body of water, a mountain or a building. It is the broad type for place names found in free text, where
  the kind of place is often unknown; narrower records cover cities, countries, administrative divisions
  and places of birth. A place linked to a person, such as where they live or travel, is personal data.
categories:
- geo
- pii
langs:
- common
is_pii: true
examples:
- value: Lake Baikal
  description: body of water
- value: Bavaria
  description: administrative area
- value: Mont Blanc
  description: mountain
