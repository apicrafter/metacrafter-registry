id: gb_bbfc_rating
name: BBFC age rating (United Kingdom)
status: draft
doc: 'Age rating of a film, video or online programme by the British Board of Film Classification: U (universal),
  PG (parental guidance), 12A (cinema films: 12 and over, younger children with an adult), 12 (videos:
  12 and over), 15, 18 and R18 (restricted, sold only in licensed shops). Uc (universal, particularly
  suitable for young children) was used for videos until 2009.'
