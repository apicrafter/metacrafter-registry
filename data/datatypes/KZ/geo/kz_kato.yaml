translations:
  ru:
    name: Код КАТО
    doc: Девятизначный код административно-территориального объекта или населённого пункта Казахстана
      по классификатору административно-территориальных объектов (КАТО, НК РК 11). Код иерархический (AB
      CD EF HIJ) - область или город республиканского значения, район, сельский округ, село.
