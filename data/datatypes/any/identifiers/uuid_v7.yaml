id: uuid_v7
name: Unix time-ordered UUID (version 7)
status: draft
doc: UUID of version 7, introduced by RFC 9562 in 2024. The first 48 bits are the Unix time in milliseconds,
  and the rest, apart from the version and variant bits, is random or a counter. Values sort by creation
  time, which suits database keys, and RFC 9562 recommends this version over versions 1 and 6. The creation
  time can be read back from the first 12 hexadecimal digits. The version digit, the first digit of the
  third group, is 7. PostgreSQL 18 makes it with uuidv7() and Python 3.14 with uuid.uuid7().
parent: uuid
categories:
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-7[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
