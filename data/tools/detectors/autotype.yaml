id: autotype
name: Auto-Type
category: detector
doc: Auto-Type is a research system from Microsoft Research, published at SIGMOD 2018, that builds type-detection
  functions for rich semantic types. Given a type name and a few example values, it searches open-source
  code on GitHub for functions that parse or validate the type and synthesizes a detector from them. Its
  benchmark covers 112 types in 142 test cases. The registry maps the test cases in mappings.autotype,
  and this list contains the records that have such a mapping.
website: https://github.com/congy/AutoType
