id: lv_registration_number
name: Latvian registration number
status: draft
doc: Reģistrācijas numurs, the 11-digit registration number of a company in the Register of Enterprises
  of the Republic of Latvia. With the LV prefix it is the VAT number (lv_pvn). ORG-ID.guide lists the
  register as LV-RE; with that prefix an identifier reads LV-RE-40008124830.
categories:
- companies
country:
- LV
langs:
- lv
is_pii: false
classification: identifier
regexp: ^\d{11}$
