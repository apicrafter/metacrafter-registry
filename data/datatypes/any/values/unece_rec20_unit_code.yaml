id: unece_rec20_unit_code
name: UN/ECE Recommendation 20 unit code (UN/CEFACT common code)
status: stable
doc: Two- or three-character code of a unit of measure from UN/ECE Recommendation 20, used in trade documents
  such as UN/EDIFACT and UBL invoices, for example KGM for kilogram or H87 for piece. Codes use uppercase
  letters and digits. Some lists, such as Peppol, add package codes from Recommendation 21 with an X prefix;
  they have the same shape but are not units.
semantic_type: unit_of_measure
langs:
- common
regexp: ^[A-Z0-9]{2,3}$
examples:
- value: KGM
  description: kilogram
- value: MTR
  description: metre
- value: LTR
  description: litre
- value: C62
  description: one (unit)
- value: H87
  description: piece
- value: KGMS
  valid: false
  description: four characters
mappings:
  wikidata: P6512
links:
- type: doc
  url: https://unece.org/trade/documents/2021/06/uncefact-rec20-0
- type: wikidata
