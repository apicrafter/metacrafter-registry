id: ng_lga
name: Nigerian local government area
status: draft
doc: Name of one of the 774 local government areas (LGAs) of Nigeria or of the six area councils of the
  Federal Capital Territory, the second-level divisions under the states, such as Birnin Gwari, Aba North,
  Isiala-Ngwa South or Yenagoa. Spellings vary between sources (Isiala Ngwa North, Isiala-Ngwa North;
  Arochukwu, Arochukw in GADM 2), and NMIS facility lists join state and LGA in one key (bayelsa_yenagoa).
  Australian local government areas are au_lga_name.
