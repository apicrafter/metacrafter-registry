id: siret
name: Code SIRET par nom de champ
status: stable
doc: 'FR datatype for ''Code SIRET par nom de champ'' (siret) from rules in context ''finances''. The
  SIRET (Système d''Identification du Répertoire des Établissements) is a unique 14-digit identifier assigned
  to each business establishment in France. It consists of two parts: the first 9 digits are the SIREN
  number (identifying the legal entity or company), and the last 5 digits are the NIC (Numéro Interne
  de Classement), where the first 4 digits identify the specific establishment and the last digit is a
  check digit calculated using the Luhn algorithm. The SIRET number is used for official identification
  and registration of business establishments in France.'
categories:
- finances
country:
- FR
langs:
- fr
is_pii: false
classification: identifier
regexp: ^[0-9]{14}$
examples:
- value: '73282932000074'
  description: 'French SIRET number with 14 digits (SIREN: 732829320, NIC: 00074)'
- value: '19974968000013'
  description: Establishment of a public school in La Réunion, in the national school directory
- value: '49185036800011'
  description: Health establishment in Val-d'Oise, in the FINESS register
