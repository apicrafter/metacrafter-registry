id: ru_grnti
name: GRNTI code (State Rubricator of Scientific and Technical Information)
status: draft
doc: 'Code of a rubric of ГРНТИ, the State Rubricator of Scientific and Technical Information: the subject
  classification of scientific and technical information in Russia and other CIS countries, kept by a
  methodological council whose lead organisation is the State Public Scientific Technological Library
  of Russia (ГПНТБ России). Each section has three levels, each a two-digit number, written with dots:
  27 is mathematics, 27.17 algebra and 27.17.15 semigroups. Research reports, theses, grant applications
  and scientific articles give ГРНТИ codes. The regexp accepts codes of the second and third level; a
  two-digit section alone is not accepted, because any two-digit number would match.'
categories:
- publishing
- science
country:
- RU
langs:
- ru
is_pii: false
classification: categorical
regexp: ^\d{2}\.\d{2}(?:\.\d{2})?$
examples:
- value: 27.17.15
  description: Semigroups
- value: 27.17.29
  description: Linear algebra
- value: '27.17'
  description: Algebra
- value: '27.15'
  description: Number theory
- value: 27.17.1
  valid: false
  description: Each level has two digits
