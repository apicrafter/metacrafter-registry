is_pii: false
classification: identifier
regexp: ^(?:0[1-9]|1[01])[A-Z]{2}\d{3}$
examples:
- value: 05BH004
  description: Bow River at Calgary
- value: 08MF005
  description: Fraser River at Hope
- value: 05LJ021
  description: Station Number of a Manitoba station list (CanWIN, 2024)
- value: 12AB001
  valid: false
  description: there are eleven major drainage areas
- value: MB05LDS002
  valid: false
  description: a station number of the Manitoba provincial network
