id: jp_cn
name: Japanese corporate number (hōjin bangō)
status: draft
doc: 法人番号 (hōjin bangō), the 13-digit Corporate Number that the National Tax Agency gives to corporations,
  government bodies and other organisations in Japan. The first digit is a check digit and is never 0.
categories:
- companies
country:
- JP
langs:
- ja
is_pii: false
classification: identifier
regexp: ^[1-9]-?\d{4}-?\d{4}-?\d{4}$
examples:
- value: '1878613755182'
  description: Real-world value published online
- value: '2506450764947'
  description: Real-world value published online
- value: 1-8786-1375-5182
  description: The first example in its printed form
- value: '18786137551827'
  valid: false
  description: One character too many
mappings:
