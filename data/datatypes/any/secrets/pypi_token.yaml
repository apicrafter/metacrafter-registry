id: pypi_token
name: PyPI API token
status: draft
doc: API token of the Python Package Index, used to upload packages. It is a serialized macaroon with
  the prefix pypi-; PyPI documents that the part after the prefix is at least 85 characters long. Tokens
  of pypi.org begin with pypi-AgEIcHlwaS5vcmc. Examples are left out because GitHub push protection rejects
  token-shaped values, even constructed ones.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^pypi-[A-Za-z0-9_-]{85,}$
examples:
- value: pypi-AgEIcHlwaS5vcmcExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://docs.pypi.org/api/secrets/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
