id: musicbrainz_work_id
name: MusicBrainz work ID
status: draft
doc: 'MBID of a work in MusicBrainz: a song, composition or other piece of music apart from its recordings,
  as in musicbrainz.org/work/<id>. A work can also have an ISWC (iswc).'
parent: musicbrainz_id
categories:
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
examples:
- value: f617e5ae-572c-46a9-9902-1d53774c01aa
  description: Turandot
- value: 0c80db24-389e-3620-8e0b-84dc2b7c009a
  description: Yesterday
- value: B10BBBFC-CF9E-42E0-BE17-E2C3E1D2600D
  valid: false
  description: Upper case; MusicBrainz writes MBIDs in lower case
mappings:
  wikidata: P435
links:
- type: doc
  url: https://musicbrainz.org/doc/Work
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P435
translations:
  ru:
    name: Идентификатор произведения в MusicBrainz
