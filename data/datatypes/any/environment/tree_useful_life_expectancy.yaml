id: tree_useful_life_expectancy
name: Useful life expectancy of a tree (ULE class)
status: draft
doc: 'Useful life expectancy (ULE) of a tree, the years an arborist expects it to stay safe and useful
  in its place, as a class of an urban tree register: 31-60 years, 61+ years, 1-5 years (<50% canopy)
  in the Urban Forest of the City of Melbourne, 20+ years, 10 - 20 years, < 5 years in the trees of the
  City of Greater Geelong. It comes from the SULE and ULE methods of urban tree assessment; the age of
  the tree is another field.'
parent: category
categories:
- environment
langs:
- en
is_pii: false
classification: categorical
regexp: ^(?:[<>]\s*)?\d{1,3}\s*(?:-|–|to)?\s*(?:\d{1,3})?\s*\+?\s*(?:years?|yrs?)(?:\s*\(.*\))?$
examples:
- value: 31-60 years
  description: Trees, with species and dimensions (Urban Forest), City of Melbourne
- value: 61+ years
- value: 6-10 years (>50% canopy)
- value: 20+ years
  description: Trees, City of Greater Geelong
- value: < 5 years
- value: Mature
  valid: false
  description: an age class, tree_age_class
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Arboriculture
translations:
  ru:
    name: Ожидаемый срок жизни дерева (класс ULE)
