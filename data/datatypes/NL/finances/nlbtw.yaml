id: nlbtw
name: Dutch VAT identification number (btw-id)
status: stable
doc: 'Btw-identificatienummer, the VAT identification number of businesses in the Netherlands: NL, nine
  digits, the letter B and a 2-digit sequence number that is not 00. The older btw-nummer (omzetbelastingnummer)
  was built from the RSIN of a legal entity or the citizen service number (BSN) of a sole trader, and
  its nine digits pass the 11-proef. Since 1 January 2020 sole traders have a separate btw-identificatienummer
  that does not contain their BSN; it is used on invoices and in contacts with other businesses, while
  the omzetbelastingnummer stays in use with the tax service. python-stdnum validates these newer numbers
  with ISO 7064 MOD 97-10 over NL and the whole number; the tax service does not publish the check.'
parent: vatin
categories:
- finances
country:
- NL
langs:
- nl
is_pii: true
classification: identifier
regexp: ^NL\d{9}B\d{2}$
checksum: nl_btw
