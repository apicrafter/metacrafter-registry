id: flutterwave_secret_key
name: Flutterwave secret key
status: draft
doc: Secret API key of the Flutterwave payments API. Flutterwave documents that secret keys start with
  FLWSECK and that test keys add _TEST to the prefix. The regexp applies the structure of the gitleaks
  rule for test keys (32 characters from 0-9 and a-h, then -X) to live keys as well.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^FLWSECK(?:_TEST)?-[0-9a-hA-H]{32}-X$
examples:
- value: FLWSECK_TEST-
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://developer.flutterwave.com/v3.0/docs/authentication
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
