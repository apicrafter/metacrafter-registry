id: trufflehog
name: TruffleHog
category: detector
doc: TruffleHog is an open-source (AGPL-3.0) secret scanner from Truffle Security that searches git history,
  file systems, cloud storage and other sources for leaked credentials. Each of its several hundred detectors
  targets one service and combines keywords with a regular expression; many detectors then call the service's
  API to check whether the credential is live. The list of supported types covers only the registry datatypes
  that match a detector.
website: https://github.com/trufflesecurity/trufflehog
supported_types:
- anthropic_api_key
- aws_access_key_id
- aws_secret_access_key
