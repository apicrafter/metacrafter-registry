    doc: Codice IBAN di un conto in Italia - 27 caratteri, IT, due cifre di controllo, il CIN, il codice
      ABI, il codice CAB e il numero di conto di 12 caratteri.
  ru:
    name: IBAN Италии
    doc: Международный номер банковского счёта в Италии - 27 символов - IT, две контрольные цифры, контрольная
