id: ipi_base_number
name: IPI base number
status: draft
doc: 'Interested Parties Information (IPI) base number: the identifier of a rights holder, a person or
  a legal entity, in the IPI system of CISAC, which collecting societies share. It is written as a letter,
  nine digits and a check digit separated by hyphens, such as I-001068130-6. Each name of the party has
  its own IPI name number (ipi_name_number).'
categories:
- media
- persons
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Z]-\d{9}-\d$
examples:
- value: I-001068130-6
  description: Pablo Picasso
- value: I-001896807-3
  description: Jean Carlu
- value: 00119750569
  valid: false
  description: IPI name number (ipi_name_number)
