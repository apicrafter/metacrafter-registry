is_pii: false
classification: categorical
examples:
- value: GRANDE
  description: a large company, BNDES
- value: MICRO
  description: a microenterprise, BNDES
- value: EPP
  description: empresa de pequeno porte
- value: Pequeno 1
  valid: false
  description: a municipality of up to 20 000 inhabitants
