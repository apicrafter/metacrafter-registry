id: scopus_source_id
name: Scopus source ID
status: draft
doc: Number of a journal, book series or conference proceedings in the Scopus bibliographic database of
  Elsevier.
categories:
- science
- publishing
langs:
- common
is_pii: false
classification: identifier
regexp: ^[1-9]\d{0,11}$
examples:
- value: '25283'
  description: Journal of Fluorine Chemistry
- value: '16129'
  description: ACC Current Journal Review
- value: '22380'
  description: International Journal of Infectious Diseases
- value: 025283
  valid: false
  description: Leading zero
mappings:
  wikidata: P1156
  bioregistry: scopus.publication
links:
- type: doc
  url: https://www.scopus.com/sources
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P1156
translations:
  ru:
    name: Идентификатор источника Scopus
    doc: Номер журнала, книжной серии или сборника трудов в базе Scopus.
