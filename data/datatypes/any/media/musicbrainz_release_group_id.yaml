id: musicbrainz_release_group_id
name: MusicBrainz release group ID
status: draft
doc: 'MBID of a release group in MusicBrainz: an album, single, EP or other release as a whole, which
  groups all its editions (releases), as in musicbrainz.org/release-group/<id>.'
parent: musicbrainz_id
categories:
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
examples:
- value: f5093c06-23e3-404f-aeaa-40f72885ee3a
  description: The Dark Side of the Moon
- value: f32fab67-77dd-3937-addc-9062e28e4c37
  description: Thriller
- value: 7fdc293a-f634-356f-b611-b1e3d94be5e2
  description: Toy Story soundtrack
- value: B10BBBFC-CF9E-42E0-BE17-E2C3E1D2600D
  valid: false
  description: Upper case; MusicBrainz writes MBIDs in lower case
mappings:
  wikidata: P436
links:
- type: doc
  url: https://musicbrainz.org/doc/Release_Group
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P436
translations:
  ru:
    name: Идентификатор группы релизов в MusicBrainz
