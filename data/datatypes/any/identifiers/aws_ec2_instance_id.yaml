id: aws_ec2_instance_id
name: Amazon EC2 instance ID
status: draft
doc: 'Resource ID of an Amazon EC2 instance: i- followed by 17 characters, or by 8 characters for IDs
  created before the longer format. The examples in the AWS documentation use lowercase hexadecimal digits,
  as does the regexp.'
categories:
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: ^i-(?:[0-9a-f]{8}|[0-9a-f]{17})$
examples:
- value: i-abc
  valid: false
  description: Too short
links:
- type: other
  url: https://aws.amazon.com/blogs/compute/longer-resource-ids-in-2018-for-amazon-ec2-amazon-ebs-and-amazon-vpc
- type: doc
  url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyIdFormat.html
