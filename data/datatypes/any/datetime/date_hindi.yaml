id: date_hindi
name: Date with a Hindi month name
status: draft
doc: Calendar date written in Hindi with the month name, day, month and year in the order of the CLDR
  long (d MMMM y) and medium (d MMM y) date formats of the hi locale. The month is the CLDR wide or abbreviated
  name in the format context, written exactly as CLDR gives it, including any dot or apostrophe; no extra
  capitalisation variants are accepted.
semantic_type: date
langs:
- hi
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01]) (?:अक्तूबर|अक्टूबर|अप्रैल|दिसंबर|सितंबर|फ़रवरी|अगस्त|नवंबर|जुलाई|जनवरी|मार्च|जून|मई)
  \d{4}|(?:0?[1-9]|[12]\d|3[01]) (?:अक्टू॰|अक्तू॰|अप्रैल|मार्च|फ़र॰|सित॰|दिस॰|जुल॰|अग॰|जून|नव॰|जन॰|मई)
  \d{4})$
examples:
- value: 3 अक्टूबर 2024
  description: 3 October 2024, CLDR long format d MMMM y
- value: 25 दिस॰ 2024
  description: 25 December 2024, CLDR medium format d MMM y
- value: अक्टूबर 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/hi/ca-gregorian.json
