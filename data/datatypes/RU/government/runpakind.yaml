id: runpakind
name: Russian regulatory legal act type
status: draft
doc: 'Kind of a Russian legal act: federal law, decree, resolution, order and so on. The official publication
  portal publication.pravo.gov.ru distinguishes 47 kinds, from federal laws and decrees to regional statutes,
  international treaties and court rulings. Datasets also write the kind together with the issuing body,
  for example Постановление Правительства Российской Федерации.'
