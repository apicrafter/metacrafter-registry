id: cd_phone
name: Democratic Republic of the Congo phone number (E.164)
status: draft
doc: 'Phone number of Democratic Republic of the Congo in international E.164 form: a plus sign, the country
  calling code +243 and the national number, with no spaces. The regexp follows the national number pattern
  of Google libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens
  are not covered.'
semantic_type: phone
country:
- CD
langs:
- common
regexp: ^\+243(?:(?:(?:[189]|5\d)\d|2)\d{7}|[1-68]\d{6})$
examples:
- value: '+2431234567'
  description: Example number from Google libphonenumber (fixed line)
- value: '+243991234567'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
