id: kvk
name: KvK-nummer op veldnaam
status: stable
doc: NL datatype for 'KvK-nummer op veldnaam' (kvk) from rules in context 'companies'. The KvK-nummer
  (Kamer van Koophandel nummer) is a unique 8-digit registration number assigned to businesses and organizations
  in the Netherlands by the Chamber of Commerce (Kamer van Koophandel). Every business entity registered
  in the Netherlands receives a KvK number, which is used for official identification and registration
  purposes. The number consists of exactly 8 digits, sometimes with leading zeros.
categories:
- companies
country:
- NL
langs:
- nl
is_pii: false
classification: identifier
regexp: ^[0-9]{8}$
examples:
- value: '12345678'
  description: Dutch KvK number with 8 digits
- value: '01234567'
  description: Dutch KvK number with leading zero
- value: '87654321'
  description: Another valid Dutch KvK number format
