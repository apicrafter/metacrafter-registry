id: isbn13
name: International Standard Book Number 13-digits (ISBN13)
status: stable
doc: The International Standard Book Number (ISBN) is a numeric commercial book identifier that is intended
  to be unique. Publishers purchase ISBNs from an affiliate of the International ISBN Agency
categories:
- objectids
langs:
- common
is_pii: false
classification: identifier
regexp: ^97[89](?:[- ]?\d){10}$
examples:
- value: 978-0-521-29366-2
  description: Hamlet, Prince of Denmark (ISBN-10 0-521-29366-9)
- value: 978-0-521-22151-1
  description: Hamlet, Prince of Denmark (ISBN-10 0-521-22151-X)
mappings:
  wikidata: P212
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/International_Standard_Book_Number
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P212
