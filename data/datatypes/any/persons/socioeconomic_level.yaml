id: socioeconomic_level
name: Socioeconomic level (NSE, social grade)
status: draft
doc: 'Socioeconomic class of a household or a person in market research and surveys, as letters of a national
  scheme or in words: in Latin America the nivel socioeconómico (NSE), in Argentina ABC1, C2, C3, D1,
  D2, E (also AB and C1, grouped C2+C3, D2E), in Mexico the AMAI levels A/B, C+, C, C-, D+, D, E, in Chile
  AB, C1a, C1b, C2, C3, D, E, in Brazil the classes A, B1, B2, C1, C2, DE of the Critério Brasil; in the
  United Kingdom the NRS social grades A, B, C1, C2, D, E; or Alto, Medio, Bajo. The point scores the
  classes are computed from are numbers, not this type.'
parent: category
