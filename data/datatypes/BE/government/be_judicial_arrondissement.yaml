id: be_judicial_arrondissement
name: Belgian judicial arrondissement (name)
status: draft
doc: 'Name of a judicial arrondissement (arrondissement judiciaire, gerechtelijk arrondissement), the
  territory of a court of first instance. Since the reform of 1 April 2014 there are twelve: Antwerpen,
  Limburg, Oost-Vlaanderen, West-Vlaanderen, Leuven, Brussel/Bruxelles, Brabant wallon, Hainaut, Liège,
  Luxembourg, Namur and Eupen; Halle-Vilvoorde is a part of the arrondissement of Brussels. Most of them
  cover a province, so the names are also province names: a value is a judicial arrondissement in a field
  named after it. They differ from the 43 administrative arrondissements (be_arrondissement).'
