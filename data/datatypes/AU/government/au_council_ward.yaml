id: au_council_ward
name: Australian local council ward
status: draft
doc: 'Ward of an Australian local government area: an electoral subdivision of a council area that elects
  its own councillors, named after its position (North Ward, Central Ward, South Ward of Camden Council,
  New South Wales), after a place or a person (Bass Hill Ward, Macquarie Ward) or numbered (Ward 1, A
  Ward; Division 3 in Queensland). Councils without wards are undivided (unsubdivided). Council and electoral
  commission files hold it in fields named ward, ward_name or tag; a ward of another country (a UK electoral
  ward, a Kenyan county assembly ward) is not one.'
