id: torrent_info_hash
name: BitTorrent Info Hash (BTIH)
status: stable
doc: A BitTorrent info hash (BTIH) is a SHA-1 hash of the "info" section of a BitTorrent metainfo file
  (.torrent file). It is a 40-character hexadecimal string that uniquely identifies a torrent. The info
  hash is used in magnet links and tracker communications to identify specific torrents without needing
  to reference a .torrent file.
categories:
- internet
- identifiers
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-fA-F]{40}$
examples:
- value: 0123456789abcdef0123456789abcdef01234567
  description: Standard 40-character hex info hash (lowercase)
- value: ABCDEF0123456789ABCDEF0123456789ABCDEF01
  description: Info hash with uppercase letters
- value: fedcba9876543210fedcba9876543210fedcba98
  description: Example info hash
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/BitTorrent
