id: be_iban
name: Belgian IBAN
status: stable
doc: 'International Bank Account Number of a bank account in Belgium. It has 16 characters: BE, two IBAN
  check digits and the 12 digits of the national account number (be_bank_account): a 3-digit bank identification
  code, a 7-digit account number and two national check digits, the remainder of the first ten digits
  divided by 97 (97 when it is 0). The National Bank of Belgium publishes the list of bank identification
  codes. It is printed in groups of four, as in BE71 0961 2345 6769.'
parent: iban
categories:
- finances
country:
- BE
langs:
- nl
- fr
- de
is_pii: false
classification: identifier
regexp: ^BE\d{2} ?\d{4} ?\d{4} ?\d{4}$
checksum: iban_mod97
examples:
- value: BE71096123456769
  description: Example of a Belgian IBAN from iban.com (account 096-1234567-69)
- value: BE71 0961 2345 6769
  description: The same IBAN in its printed form
- value: BE41761551657010
  description: Synthetic number with valid check digits
- value: BE23729339420191
  description: Synthetic number with valid check digits
- value: BE41761551657011
  valid: false
  description: Check digits do not match
- value: BE7109612345676
  valid: false
  description: 15 characters
mappings:
  dpv: pd:BankAccount
  stdnum: be.iban
links:
