id: cfdanumber
name: The Catalog of Federal Domestic Assistance (CFDA) number
status: stable
doc: 'CFDA numbers are the system for identifying and sorting the 2,000+ federal programs. Each CFDA number
  contains five digits and appears in the following format: ##.### (e.g., 10.001 or 98.102).'
categories:
- government
country:
- US
langs:
- en
is_pii: false
classification: categorical
regexp: \d{2}\.\d{3}
examples:
- value: '93.791'
  description: Money Follows the Person Rebalancing Demonstration
- value: '93.778'
  description: Medical Assistance Program
links:
- type: other
  url: https://grantsgovprod.wordpress.com/2018/06/04/what-is-a-cfda-number-2/
