id: egiban
name: Egyptian IBAN
status: stable
doc: 'International Bank Account Number of a bank account in Egypt. It has 29 characters: the country
  code, two IBAN check digits and a four-digit bank code, a four-digit branch code and a 17-digit account
  number, as defined in the SWIFT IBAN registry.'
