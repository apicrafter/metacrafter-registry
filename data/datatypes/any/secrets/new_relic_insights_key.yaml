id: new_relic_insights_key
name: New Relic Insights insert or query key
status: draft
doc: Older New Relic key for the Insights event insert API (insert key) or the Insights query API (query
  key). New Relic does not publish the format; gitleaks expects NRII- for insert keys, pyWhat expects
  NRII- or NRIQ-, each followed by 32 letters, digits, underscores and hyphens.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^NRI[IQ]-[A-Za-z0-9_-]{32}$
examples:
- value: NRII-
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/bee-san/pyWhat/blob/main/pywhat/Data/regex.json
