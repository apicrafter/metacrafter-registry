id: accommodation_type
name: Type of tourist accommodation
status: draft
doc: 'Class of an establishment that lodges tourists, as registers of tourist accommodation and statistics
  of tourism classify them: hotel, apart-hotel, motel, hostel, bed and breakfast, guest house, camping,
  holiday cottages or cabins, refuge, holiday rental, in the language of the register: Hotel, Apart-Hotel,
  Hostería, Hospedaje, Cabañas, Hostel, Camping, Refugio in Argentina and Spain; hôtel, camping, gîte,
  chambre d''hôtes, résidence de tourisme in France; Hotel, Pension, Ferienwohnung, Campingplatz in Germany.
  The star rating is accommodation_star_rating.'
