id: date_serbian
name: Date with a Serbian month name
status: draft
doc: Calendar date written in Serbian with the month name, day, month and year in the order of the CLDR
  long (d. MMMM y.) date formats of the sr locale. The month is the CLDR wide or abbreviated name in the
  format context, written exactly as CLDR gives it, including any dot or apostrophe; no extra capitalisation
  variants are accepted. The CLDR medium format (d. M. y.) is numeric, so it is not covered here.
semantic_type: date
langs:
- sr
regexp: ^(?:0?[1-9]|[12]\d|3[01])\. (?:септембар|децембар|новембар|октобар|фебруар|јануар|август|април|март|јул|мај|јун)
  \d{4}\.$
examples:
- value: 3. октобар 2024.
  description: 3 October 2024, CLDR long format d. MMMM y.
- value: октобар 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/sr/ca-gregorian.json
