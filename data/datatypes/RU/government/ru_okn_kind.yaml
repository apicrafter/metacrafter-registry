id: ru_okn_kind
name: Kind of a Russian cultural heritage object
status: draft
doc: Kind of a cultural heritage object under Article 3 of Federal Law No. 73-FZ on cultural heritage
  objects. The law distinguishes monuments (памятник), ensembles (ансамбль) and landmark sites (достопримечательное
  место). The register of cultural heritage objects (ЕГРОКН) records the kind of each object.
