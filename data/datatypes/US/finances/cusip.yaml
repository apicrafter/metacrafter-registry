id: cusip
name: CUSIP (Committee on Uniform Securities Identification Procedures)
status: stable
doc: A CUSIP is a nine-digit numeric (e.g. 037833100 for Apple) or nine-character alphanumeric (e.g. 38259P508
  for Google) code that identifies a North American financial security for the purposes of facilitating
  clearing and settlement of trades
categories:
- finances
- identifiers
country:
- US
- CA
langs:
- en
is_pii: false
classification: identifier
regexp: ^[0-9]{3}[a-zA-Z0-9]{2}[a-zA-Z0-9*@#]{3}[0-9]$
examples:
- value: 037833100
  description: Apple Inc. common stock
- value: 38259P508
  description: Google Inc. Class C capital stock
- value: 30303M102
  description: Facebook Inc. Class A common stock
mappings:
  fibo: SEC/Securities/SecuritiesIdentificationIndividuals/CommitteeOnUniformSecuritiesIdentificationProceduresNumber
