doc: Branch of medical practice, for example cardiology or pediatrics; in Spanish cardiología, clínica
  médica, pediatría, ginecología, traumatología. Health service statistics count consultations and appointments
  by specialty, often in capitals without accents (CLINICA MEDICA).
