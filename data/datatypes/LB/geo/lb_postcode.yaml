id: lb_postcode
name: Lebanon postal code
status: draft
doc: 'Postal code in Lebanon: four digits, or eight digits written as two groups of four with an optional
  space.'
semantic_type: postindex
country:
- LB
langs:
- ar
regexp: '^(?:\d{4})(?: ?(?:\d{4}))?$'
examples:
- value: 2038 3054
- value: 1107 2810
- value: '1000'
- value: 2038 305
  valid: false
  description: too short
links:
