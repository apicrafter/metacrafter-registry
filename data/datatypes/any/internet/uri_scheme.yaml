id: uri_scheme
name: URI scheme
status: draft
doc: 'Name of a URI scheme, the part of a URI before the first colon, such as http, https, mailto, urn
  or data. It starts with a letter followed by letters, digits, +, - or ., and is case-insensitive, with
  lowercase as the canonical form (RFC 3986, section 3.1). IANA keeps the registry of permanent, provisional
  and historical schemes (RFC 7595). The record has no regexp: the syntax matches almost any word.'
categories:
- internet
langs:
- common
is_pii: false
classification: categorical
examples:
- value: https
  description: Hypertext Transfer Protocol Secure
- value: mailto
  description: Email address
- value: urn
  description: Uniform Resource Name
- value: coap+tcp
  description: Constrained Application Protocol over TCP
