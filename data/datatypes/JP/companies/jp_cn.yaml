id: jp_cn
name: Japanese corporate number (hōjin bangō)
status: draft
doc: 法人番号 (hōjin bangō), the 13-digit Corporate Number that the National Tax Agency gives to corporations,
  government bodies and other organisations in Japan. The first digit is a check digit and is never 0.
categories:
- companies
country:
- JP
langs:
