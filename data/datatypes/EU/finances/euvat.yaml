id: euvat
name: EU VAT number (VIES format)
status: stable
doc: VAT identification number of a business registered for VAT in a European Union member state, in the
  compact form that the VIES system checks. It is the 2-letter code of the member state followed by the
  national number without spaces or punctuation. Greece uses EL rather than GR, and businesses in Northern
  Ireland use XI for trade in goods with the EU. Each member state has its own fixed structure for the
  national part, from 8 to 12 characters (2 to 10 digits in Romania); the national records describe them
  and their check digits.
parent: vatin
categories:
- finances
country:
- EU
langs:
- en
is_pii: true
classification: identifier
regexp: ^(?:ATU\d{8}|BE[01]\d{9}|BG\d{9,10}|CY\d{8}[A-Z]|CZ\d{8,10}|DE\d{9}|DK\d{8}|EE\d{9}|EL\d{9}|ES(?:[A-Z]\d{7}[A-Z0-9]|\d{8}[A-Z])|FI\d{8}|FR[0-9A-HJ-NP-Z]{2}\d{9}|HR\d{11}|HU\d{8}|IE(?:\d{7}[A-W][A-IW]?|\d[A-Z+*]\d{5}[A-W])|IT\d{11}|LT(?:\d{9}|\d{12})|LU\d{8}|LV\d{11}|MT\d{8}|NL\d{9}B\d{2}|PL\d{10}|PT\d{9}|RO[1-9]\d{1,9}|SE\d{10}01|SI\d{8}|SK\d{10}|XI(?:\d{9}|\d{12}|GD\d{3}|HA\d{3}))$
