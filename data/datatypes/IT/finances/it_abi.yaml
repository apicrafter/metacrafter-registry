- type: doc
  url: https://www.fatturapa.gov.it/export/documenti/fatturapa/v1.2.2/Schema_del_file_xml_FatturaPA_v1.2.2.xsd
translations:
  it:
    name: Codice ABI
    doc: Codice di cinque cifre che identifica la banca; nell'IBAN italiano segue il CIN.
  ru:
    name: Код банка Италии (ABI)
    doc: Пятизначный код банка в Италии; в итальянском IBAN следует за контрольной буквой CIN.
