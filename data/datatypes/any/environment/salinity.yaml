id: salinity
name: Salinity
status: draft
doc: 'Salt content of water: in parts per thousand (ppt, ‰) or practical salinity units (PSU) in oceanography
  (about 35 in sea water), or in grams or milligrams per litre; fresh water is below 0.5 ppt. Water quality
  sensors usually derive it from the electrical conductivity.'
