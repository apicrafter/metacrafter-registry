id: it_codice_fiscale
name: Italian fiscal code (codice fiscale)
status: draft
doc: Personal tax code of Italy, issued by the Agenzia delle Entrate. For a natural person it has 16 characters
  derived from personal data - three letters from the surname, three from the given name, the last two
  digits of the year of birth, a letter for the month, the day of birth (plus 40 for women), the Belfiore
  code of the place of birth (a letter and three digits) - and a check letter. When two people would get
  the same code, digits are replaced by letters (omocodia). Companies and other entities have an 11-digit
  fiscal code instead, which is the same as their VAT number (it_vat).
categories:
- pii
- persons
country:
- IT
langs:
- it
is_pii: true
classification: identifier
regexp: ^[A-Z]{6}[0-9LMNP-V]{2}[ABCDEHLMPRST][0-9LMNP-V]{2}[A-Z][0-9LMNP-V]{3}[A-Z]$
checksum: it_codice_fiscale
examples:
- value: RCCMNL83S18D969H
  description: man, valid check letter (python-stdnum test value)
- value: CNTCHR83T41D969D
  description: woman (day of birth plus 40), valid check letter (python-stdnum test value)
- value: MRTMTT91D08F205J
  description: example from the English Wikipedia article
- value: RCCMNL83S18D969A
  valid: false
  description: wrong check letter
- value: RCCMNL83Z18D969H
  valid: false
  description: Z is not a month letter
