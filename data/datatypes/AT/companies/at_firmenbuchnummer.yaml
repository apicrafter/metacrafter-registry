id: at_firmenbuchnummer
name: Austrian company register number (Firmenbuchnummer)
status: draft
doc: 'Number of a company in the Austrian commercial register: digits followed by a lowercase check letter,
  such as 123456a. It is often written with the prefix FN.'
categories:
