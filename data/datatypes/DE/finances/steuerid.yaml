id: steuerid
name: German tax identification number (Steuer-ID, IdNr.)
status: stable
doc: Steuerliche Identifikationsnummer (IdNr., Steuer-ID), the personal tax number that the Federal Central
  Tax Office (BZSt) assigns once to every person registered in Germany and that stays the same for life.
  It has 11 digits that are chosen at random and hold no personal data. The first digit is never 0; in
  the first ten digits one digit occurs twice (since 2016 also three times, never three in a row) and
  the others at most once. The last digit is an ISO 7064 MOD 11,10 check digit. It is often printed in
  groups, as in 36 574 261 809. It is not the Steuernummer that a tax office gives.
aliases:
- de_steuerid
categories:
- finances
- pii
country:
- DE
langs:
- de
is_pii: true
classification: identifier
regexp: '^[1-9][0-9](?: ?[0-9]{3}){3}$'
checksum: de_idnr
examples:
- value: '36574261809'
  description: python-stdnum reference value
- value: 36 574 261 809
  description: The same number in its printed form
- value: '32571556483'
  description: Synthetic number with a valid check digit
- value: '36574261890'
  valid: false
  description: Check digit does not match
- value: '36554266806'
  valid: false
  description: Two different digits are repeated
- value: 06574261809
  valid: false
  description: The first digit is never 0
