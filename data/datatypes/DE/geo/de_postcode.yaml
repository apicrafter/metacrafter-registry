id: de_postcode
name: German postal code (Postleitzahl)
status: stable
doc: Five-digit postal code (Postleitzahl, PLZ) used in Germany since 1 July 1993, in the range 01001
  to 99998. The first digit is the postal zone and the first two digits are the postal region.
semantic_type: postindex
country:
- DE
langs:
- de
regexp: ^(?:0[1-9]|[1-9]\d)\d{3}$
examples:
- value: '10117'
  description: Berlin
- value: '80331'
  description: München
- value: '01067'
  description: Dresden
- value: '1011'
  valid: false
  description: four digits, the system used before 1993
mappings:
  fta: POSTAL_CODE.POSTAL_CODE_DE
  presidio: DE_PLZ
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Postal_codes_in_Germany
translations:
  de:
    name: Postleitzahl
  ru:
    name: Почтовый индекс Германии
