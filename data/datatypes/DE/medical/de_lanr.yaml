  url: https://de.wikipedia.org/wiki/Lebenslange_Arztnummer
- type: other
  url: https://www.kbv.de/
translations:
  de:
    name: Lebenslange Arztnummer (LANR)
  ru:
    name: Пожизненный номер врача в Германии (LANR)
    doc: Девятизначный номер врача или психотерапевта, работающего с обязательным медицинским страхованием,
      - шесть цифр личного номера, контрольная цифра и две цифры специальности.
