id: br_state_ibge_code
name: IBGE code of a Brazilian state (federative unit)
status: draft
doc: 'The two-digit code IBGE gives each of the 27 federative units of Brazil: the first digit is the
  region (1 Norte, 2 Nordeste, 3 Sudeste, 4 Sul, 5 Centro-Oeste) and the second the state in it (11 Rondônia,
  29 Bahia, 35 São Paulo, 43 Rio Grande do Sul, 53 Distrito Federal). It begins the municipality, district
  and census tract codes (br_municipality_code, br_municipality_code_6, br_census_tract_code). Tables
  give it as uf, cod_uf, coduf, CD_UF or UF_Cod, and spreadsheet exports as 35.0; the letter abbreviation
  (SP) is br_state_code.'
parent: id
categories:
- geo
- government
country:
- BR
langs:
- pt
is_pii: false
classification: categorical
regexp: ^(1[1-7]|2[1-9]|3[1-35]|4[1-3]|5[0-3])$
examples:
- value: '35'
  description: São Paulo
- value: '31'
  description: Minas Gerais
- value: '53'
  description: Distrito Federal
- value: '34'
  valid: false
  description: not assigned (the Sudeste has 31, 32, 33 and 35)
- value: SP
  valid: false
  description: the abbreviation (br_state_code)
