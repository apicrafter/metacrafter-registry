id: jp_driver_license
name: Japanese driver's license number
status: draft
doc: Twelve-digit number of a Japanese driver's license. The first two digits identify the prefectural
  public safety commission that first issued the license, the next two are the last two digits of the
  year it was first obtained, then come a six-digit serial number, a check digit and a last digit that
  counts reissues.
parent: driver_license
categories:
- pii
- persons
country:
- JP
langs:
- ja
is_pii: true
classification: identifier
regexp: ^\d{12}$
examples:
- value: 30-21-123456-7-0
  valid: false
  description: separators are not part of the number
