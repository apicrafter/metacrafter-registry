id: ng_state
name: Nigerian state
status: draft
doc: Name of one of the 36 states of Nigeria or of the Federal Capital Territory (FCT, Abuja), such as
  Kaduna, Akwa Ibom, Cross River or Lagos. The two-letter state codes (KD, AK, FC) are the ISO 3166-2:NG
  codes without the country (iso3166code_part). Niger, Delta, Plateau and Rivers are also common words.
