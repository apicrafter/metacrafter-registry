id: procurement_method
name: Procurement method (procedure type)
status: draft
doc: 'Type of the procedure by which a public buyer awards a contract, written out in the language of
  the procurement law or as a code: open tender (Licitación Pública, Appel d''offres ouvert, Offenes Verfahren,
  Avatud hankemenetlus, 一般競争入札), restricted or selective tender (Licitación Privada, Procedura ristretta,
  指名競争入札), negotiated procedure, competitive dialogue, small purchases (Compras Menores, Procédure adaptée,
  Contrato menor, Lihthange) and direct award (Contratación Directa, Adjudicación directa, Ajuste direto,
  Affidamento diretto, 随意契約), often with the article of the law that allows it (Contratacion directa -
  Inciso F in the purchase orders of ARSAT). The Open Contracting Data Standard maps them to its method
  code list (open, selective, limited, direct) and keeps the local name in procurementMethodDetails; eForms
  and TED use the procedure type code list (open, restricted, neg-w-call, neg-wo-call, comp-dial, innovation,
  oth-single, oth-mult).'
