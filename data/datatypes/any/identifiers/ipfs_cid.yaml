id: ipfs_cid
name: Content identifier (CID) of IPFS and IPLD
status: draft
doc: Self-describing content address of the multiformats CID specification, used by IPFS, IPLD, Filecoin
  and the AT Protocol. It is made from a cryptographic hash of the content, so the same content always
  has the same CID. A CIDv0 is 46 base58btc characters starting with Qm and always holds a SHA-256 hash
  of a dag-pb block. A CIDv1 starts with a multibase prefix that names its encoding; the default is b
  for lowercase base32, as in bafy... strings. The regexp covers CIDv0 and base32 CIDv1, not CIDv1 in
  other encodings such as base58btc (prefix z) or base36 (prefix k).
categories:
- identifiers
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:Qm[1-9A-HJ-NP-Za-km-z]{44}|b[a-z2-7]{58,})$
examples:
- value: QmbWqxBEKC3P8tqsKc98xmWNzrzDtRLMiMPL8wBuTGsMnR
  description: CIDv0 of the IPFS content addressing documentation
- value: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
  description: The same content as a base32 CIDv1, IPFS documentation
- value: QmY7Yh4UquoXHLPFo2XbhXkhBvFoPwmQUSa92pxnxjQuPU
  description: Sample CID of the IPFS CID Inspector
- value: zb2rhe5P4gXftAwvA4eXQ5HJwsER2owDyS9sKaQRRVQPn93bA
  valid: false
  description: CIDv1 in base58btc, not covered
- value: QmbWqxBEKC3P8tqsKc98xmWNzrzDtRLMiMPL8wBuTGsMn0
  valid: false
  description: 0 is not a base58btc character
links:
- type: doc
  url: https://github.com/multiformats/cid
- type: doc
  url: https://docs.ipfs.tech/concepts/content-addressing/
translations:
  ru:
    name: Идентификатор содержимого (CID) IPFS и IPLD
