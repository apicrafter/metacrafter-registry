id: mac_address
name: MAC address (Media Access Control)
status: stable
doc: A media access control address (MAC address) is a unique identifier assigned to a network interface
  controller (NIC) for use as a network address in communications within a network segment.
aliases:
- eui48
categories:
- internet
- identifiers
- pii
langs:
- common
is_pii: true
classification: identifier
regexp: ^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$
examples:
- value: 00:1B:44:11:3A:B7
  description: MAC address with colons
- value: 00-1B-44-11-3A-B7
  description: MAC address with dashes
- value: 08:00:27:3A:2E:5C
  description: MAC address example
mappings:
  google_dlp: MAC_ADDRESS
  presidio: MAC_ADDRESS
  wikidata: P2817
links:
