id: ar_sedimentary_basin
name: Argentine hydrocarbon sedimentary basin
status: draft
doc: 'Name of a sedimentary basin in the oil and gas data of the Argentine Secretaría de Energía: the
  producing basins Neuquina, Golfo San Jorge, Austral, Cuyana and Noroeste, and others named in well,
  permit and seismic data such as Noreste, Del Colorado, Cañadón Asfalto, Los Bolsones, Ñirihuau, General
  Levalle, Las Salinas, Mercedes, Malvinas, Malvinas Oeste and Argentina Norte. Files write them in capitals
  (NEUQUINA, GOLFO SAN JORGE); the idcuenca columns next to them hold three-letter codes (NEU Neuquina,
  GSJ Golfo San Jorge, CAU Austral, CCB Cuyana, NOR Noroeste).'
