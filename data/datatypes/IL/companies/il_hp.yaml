id: il_hp
name: Israeli company number
status: draft
doc: Mispar ḥevra (מספר חברה, short ח.פ.), the 9-digit registration number of a corporation in Israel.
  Companies start with 5, and the first two digits give the type of corporation. The last digit is a Luhn
  check digit.
categories:
- companies
country:
- IL
langs:
- he
is_pii: false
classification: identifier
regexp: ^\d{9}$
checksum: luhn
examples:
- value: '513174813'
  description: Real-world value published online
- value: '516133030'
  description: Real-world value published online
- value: '513174810'
  valid: false
  description: Check digit does not match
