id: date_bulgarian
name: Date with a Bulgarian month name
status: draft
doc: 'Calendar date written in Bulgarian with the month name, day first, for example 5 май 2022 or 25
  декември 2024, optionally followed by г. (година, year): 25 декември 2024 г. The month is capitalised
  or in lower case.'
semantic_type: date
langs:
- bg
regexp: '^(?:0?[1-9]|[12]\d|3[01]) (?:[Яя]нуари|[Фф]евруари|[Мм]арт|[Аа]прил|[Мм]ай|[Юю]ни|[Юю]ли|[Аа]вгуст|[Сс]ептември|[Оо]ктомври|[Нн]оември|[Дд]екември)
  \d{4}(?: ?г\.)?$'
examples:
- value: 25 декември 2024
  description: 25 December 2024
- value: 5 Май 2022
  description: 5 May 2022
- value: 25 декември 2024 г.
  description: With the abbreviation of година (year)
- value: декември 2024
  valid: false
- value: 25 декабря 2024
  valid: false
mappings:
  qddate:
  - dt:date:bg_base
  - dt:date:bg_base_lc
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/List_of_date_formats_by_country
- type: other
  url: https://github.com/ivbeg/qddate/blob/v1.1.0/qddate/patterns/bg.py
translations:
  ru:
    name: Дата с болгарским названием месяца
    doc: Календарная дата на болгарском языке с названием месяца, например 5 май 2022.
