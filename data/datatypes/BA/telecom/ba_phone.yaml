id: ba_phone
name: Bosnia and Herzegovina phone number (E.164)
status: draft
doc: 'Phone number of Bosnia and Herzegovina in international E.164 form: a plus sign, the country calling
  code +387 and the national number, with no spaces. The regexp follows the national number pattern of
  Google libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens
  are not covered.'
semantic_type: phone
country:
- BA
langs:
- common
regexp: ^\+387(?:6\d{8}|(?:[35689]\d|49|70)\d{6})$
examples:
- value: '+38730212345'
  description: Example number from Google libphonenumber (fixed line)
- value: '+38761123456'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
