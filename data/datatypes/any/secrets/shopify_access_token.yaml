id: shopify_access_token
name: Shopify access token
status: draft
doc: 'Access token of a Shopify app. The prefix tells the kind of token: shpat_ for an app access token,
  shpca_ for a custom app and shppa_ for a private app. 32 hexadecimal digits follow.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^shp(?:at|ca|pa)_[a-fA-F0-9]{32}$
examples:
- value: shpat_ExampleTokenNotReal
  valid: false
  description: Not hexadecimal and too short
- value: shpss_0123456789abcdef
  valid: false
  description: Prefix of a shared secret
links:
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/shopify/shopify.go
