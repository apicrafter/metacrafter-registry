id: do_rnc
name: Dominican Republic taxpayer registration number (RNC)
status: draft
doc: Registro Nacional del Contribuyente, the 9-digit tax number of companies and institutions in the
  Dominican Republic. It ends with a check digit and is often written with hyphens.
categories:
- companies
- finances
country:
- DO
langs:
- es
is_pii: false
classification: identifier
regexp: ^\d-?\d{2}-?\d{5}-?\d$
