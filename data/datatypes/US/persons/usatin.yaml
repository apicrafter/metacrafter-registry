id: usatin
name: US ATIN (Adoption Taxpayer Identification Number)
status: stable
doc: An ATIN is an Adoption Taxpayer Identification Number issued by the Internal Revenue Service as a
  temporary taxpayer identification number for the child in a domestic adoption where the adopting taxpayers
  do not have and/or are unable to obtain the child's Social Security Number (SSN).
categories:
- pii
- persons
country:
- US
langs:
- en
is_pii: true
classification: identifier
regexp: '[0-9]{9}'
mappings:
  dpv: pd:OfficialID
  schema_org: taxID
  stdnum: us.atin
links:
- type: other
  url: https://www.irs.gov/individuals/adoption-taxpayer-identification-number
