id: bo_province
name: Bolivian province
status: draft
doc: Name of one of the 112 provinces of Bolivia, the second-level divisions of the departments, such
  as Murillo (La Paz), Andrés Ibáñez (Santa Cruz), Sud Yungas or Ñuflo de Chávez. Five departments have
  a province named Cercado. Tables use the short or the full name (Murillo or Pedro Domingo Murillo),
  Sud and Sur alike (Sud Cinti, Sur Cinti), capitals without accents, and shapefiles cut the names at
  20 characters (General Jose Balliv); the INE code is bo_province_code.
