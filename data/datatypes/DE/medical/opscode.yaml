id: opscode
name: OPS-Prozedurcode
status: stable
doc: DE datatype for 'OPS-Prozedurcode anhand Feldnamen' (opscode) from rules in context 'medical'.
categories:
- medical
country:
- DE
langs:
- de
is_pii: false
classification: identifier
regexp: ^[0-9]{4}(\.[0-9]{1,2})?$
examples:
- value: '1234'
  description: OPS procedure code with 4 digits without fractional part
- value: '1234.5'
  description: OPS procedure code with 4 digits and a 1-digit fractional part
