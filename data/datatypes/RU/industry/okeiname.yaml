id: okeiname
name: Russian OKEI name of code (classifier of units of measurement)
status: stable
doc: Name of a unit of measurement in the Russian OKEI classifier (Общероссийский классификатор единиц
  измерения), for example 'миллиграмм'. The code is okei.
categories:
- common
country:
- RU
langs:
- ru
is_pii: false
classification: categorical
examples:
- value: миллиграмм
  description: миллиграмм
- value: сутки
  description: сутки
translations:
  ru:
    name: Наименование кода по ОКЕИ (Общероссийский классификатор единиц измерения)
    doc: Общероссийский классификатор единиц измерения — это общероссийский классификатор, предназначенный
      для использования при решении задач количественной оценки технико-экономических и социальных показателей
      в целях осуществления государственного учета и отчетности, анализа и прогнозирования развития экономики,
      обеспечения международных статистических сопоставлений, осуществления внутренней и внешней торговли,
      государственного регулирования внешнеэкономической деятельности и организации таможенного контроля.
