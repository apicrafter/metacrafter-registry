id: soil_type
name: Soil type name
status: draft
doc: 'Name of a soil type, subtype or soil mapping unit in a national genetic soil classification, as
  soil maps and soil profile descriptions give it. The Soviet classification of 1977 and the national
  classifications derived from it (Russia, Armenia, Ukraine, Kazakhstan, Central Asia) name types after
  the zone, the relief and the colour, with subtypes after them: горные черноземы выщелоченные, каштановые,
  бурые полупустынные, дерново-подзолистые, серые лесные, солонцы, солончаки. English versions of these
  maps translate them (Mountain chernozem, Mountain chestnut soil, Mountain cinnamonic forest soil, Gray-fulvous
  semidesert, Meadow-steppe soil), and the Armenian soil profile database of ArmSIS gives the Armenian
  names (Լեռնային սևահողեր, mountain chernozems). Reference soil groups of the World Reference Base are
  wrb_reference_soil_group, orders of the Australian Soil Classification au_soil_order.'
