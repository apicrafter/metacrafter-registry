id: privateai
name: Private AI (Limina)
category: pii
doc: Commercial PII, PHI and PCI detection and redaction service from Private AI (now Limina), offered
  as an API and a container. It finds entities in free text, documents and images with machine learning
  models, in many languages, and groups them by regulation such as GDPR, CPRA and HIPAA. Entity labels
  include contact data, names, locations, dates, identifiers, health information and payment card data;
  some labels, like SSN, also cover national equivalents of the named identifier. The supported types
  cover only registry datatypes that match a documented type.
website: https://docs.private-ai.com/entities/supported-entity-types
