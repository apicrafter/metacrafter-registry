id: date_slovenian
name: Date with a Slovenian month name
status: draft
doc: Calendar date written in Slovenian with the month name, day, month and year in the order of the CLDR
  long (d. MMMM y) and medium (d. MMM y) date formats of the sl locale. The month is the CLDR wide or
  abbreviated name in the format context, written exactly as CLDR gives it, including any dot or apostrophe;
  no extra capitalisation variants are accepted.
semantic_type: date
langs:
- sl
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01])\. (?:september|december|november|februar|oktober|avgust|januar|junij|april|julij|marec|maj)
  \d{4}|(?:0?[1-9]|[12]\d|3[01])\. (?:mar\.|sep\.|jan\.|jun\.|apr\.|dec\.|nov\.|okt\.|avg\.|feb\.|jul\.|maj)
  \d{4})$
examples:
- value: 3. oktober 2024
  description: 3 October 2024, CLDR long format d. MMMM y
- value: 25. dec. 2024
  description: 25 December 2024, CLDR medium format d. MMM y
- value: oktober 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/sl/ca-gregorian.json
