id: va_phone
name: Vatican City phone number (E.164)
status: draft
doc: 'Phone number of Vatican City in international E.164 form: a plus sign, the country calling code
  +39 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- VA
langs:
- common
regexp: ^\+39(?:0\d{5,10}|3[0-8]\d{7,10}|55\d{8}|8\d{5}(?:\d{2,4})?|(?:1\d|39)\d{7,8})$
examples:
- value: '+390669812345'
  description: Example number from Google libphonenumber (fixed line)
- value: '+393123456789'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
