translations:
  it:
    name: Numero della patente di guida
    doc: Numero della patente (campo 5) - U1, sette caratteri e una lettera di controllo per le patenti
      dell'Ufficio Centrale Operativo, oppure due lettere, sette cifre e una lettera.
  ru:
    name: Номер водительского удостоверения Италии
    doc: Номер итальянского водительского удостоверения (поле 5) - U1, семь символов и контрольная буква
      или две буквы, семь цифр и буква.
