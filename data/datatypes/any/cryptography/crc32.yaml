id: crc32
name: CRC-32
status: stable
doc: A cyclic redundancy check (CRC) is an error-detecting code commonly used in digital networks and
  storage devices to detect accidental changes to digital data. Blocks of data entering these systems
  get a short check value attached, based on the remainder of a polynomial division of their contents.
