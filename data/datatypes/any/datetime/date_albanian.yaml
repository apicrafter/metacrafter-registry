id: date_albanian
name: Date with a Albanian month name
status: draft
doc: Calendar date written in Albanian with the month name, day, month and year in the order of the CLDR
  long (d MMMM y) and medium (d MMM y) date formats of the sq locale. The month is the CLDR wide or abbreviated
  name in the format context, written exactly as CLDR gives it, including any dot or apostrophe; no extra
  capitalisation variants are accepted.
semantic_type: date
langs:
- sq
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01]) (?:dhjetor|shtator|qershor|nëntor|korrik|shkurt|gusht|tetor|prill|janar|mars|maj)
  \d{4}|(?:0?[1-9]|[12]\d|3[01]) (?:korr|gush|shk|pri|nën|qer|dhj|jan|maj|mar|tet|sht) \d{4})$
examples:
- value: 3 tetor 2024
  description: 3 October 2024, CLDR long format d MMMM y
- value: 25 dhj 2024
  description: 25 December 2024, CLDR medium format d MMM y
- value: tetor 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/sq/ca-gregorian.json
