id: idnpwp
name: Indonesian NPWP
status: stable
doc: Indonesian taxpayer identification number (NPWP). The older form has 15 digits, written as XX.XXX.XXX.X-XXX.XXX;
  since 2024 the NPWP has 16 digits.
categories:
- finances
