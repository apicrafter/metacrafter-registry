id: item_condition
name: Condition of an item for sale (New, Used, Refurbished)
status: draft
doc: 'Condition of a product, vehicle, part or collectible that is offered for sale: New, Used, Refurbished,
  Like New, Pre-Owned, Open Box, NOS (new old stock), the grades of used goods of marketplaces (Used -
  Good, For parts or not working) and the same in other languages (Gebraucht, Occasion, Usado). The values
  of the schema.org enumeration OfferItemCondition (NewCondition, UsedCondition, RefurbishedCondition,
  DamagedCondition) mark it up in product pages. Ratings of the state of an asset (Good, Fair, Poor) are
  another type.'
