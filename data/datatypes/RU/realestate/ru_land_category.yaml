id: ru_land_category
name: Russian land category
status: draft
doc: 'Category of land by its intended purpose under Article 7 of the Land Code of the Russian Federation.
  There are seven categories: agricultural land, land of settlements, land of industry, energy, transport,
  communications and other special purpose, land of specially protected territories and objects, forest
  fund land, water fund land and reserve land. Registers of land plots and property on regional open data
  portals write the category in Russian, often in lower case and with the long name of the third category
  shortened.'
categories:
- realestate
- geo
country:
- RU
langs:
- ru
is_pii: false
classification: categorical
regexp: '^[Зз]емли (?:сельскохозяйственного назначения|насел[её]нн(?:ых пунктов|ого пункта)|промышленности(?:[
  ,(].*)?|особо охраняемых (?:природных )?территорий(?: и объектов)?|лесного фонда|водного фонда|запаса)$'
examples:
