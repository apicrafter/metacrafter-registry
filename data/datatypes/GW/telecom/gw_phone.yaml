id: gw_phone
name: Guinea-Bissau phone number (E.164)
status: draft
doc: 'Phone number of Guinea-Bissau in international E.164 form: a plus sign, the country calling code
  +245 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- GW
langs:
- common
regexp: ^\+245(?:[49]\d{8}|4\d{6})$
examples:
- value: '+245443201234'
  description: Example number from Google libphonenumber (fixed line)
- value: '+245955012345'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
