id: nz_region
name: New Zealand region
status: draft
doc: 'Name of one of the 16 regions of New Zealand: Northland, Auckland, Waikato, Bay of Plenty, Gisborne,
  Hawke''s Bay, Taranaki, Manawatū-Whanganui, Wellington, Tasman, Nelson, Marlborough, West Coast, Canterbury,
  Otago and Southland. Eleven have a regional council; Auckland, Gisborne, Tasman, Nelson and Marlborough
  are unitary authorities. Tables write Manawatu-Wanganui for the name before 2019 and add Region to the
  name (Canterbury Region). Their ISO 3166-2 codes are NZ-CAN, NZ-AUK and so on.'
