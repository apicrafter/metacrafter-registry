id: usfain
name: Federal Award Identification Number (FAIN)
status: stable
doc: FAIN (Federal Award Identification Number) is the unique identifying number assigned to all federal
  finance awards. Since October of 2013, the Office of Management and Budget (OMB) has required all Federal
  Agencies to issue a FAIN to all financial assistance awards or grants.
categories:
- government
country:
- US
langs:
- en
is_pii: false
classification: identifier
regexp: '[0-9A-Z]{10,13}'
examples:
- value: SSI60022GR0005
  description: FAIN SSI60022GR0005
- value: '2680229104'
  description: FAIN 2680229104
links:
