id: cardano_address
name: Cardano address (Shelley)
status: draft
doc: Shelley-era address of Cardano as specified by CIP-19, encoded with Bech32 without a length limit.
  Payment addresses have the prefix addr (base, pointer, enterprise and script addresses) and reward addresses
  the prefix stake; the first data character encodes the address type. Testnet addresses (addr_test, stake_test)
  and Byron-era Base58 addresses are not matched.
parent: crypto_address
categories:
- cryptocurrency
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:addr1|stake1)[02-9ac-hj-np-z]{53,}$
checksum: bech32
examples:
- value: addr1qx2fxv2umyhttkxyxp8x0dlpdt3k6cwng5pxj3jhsydzer3n0d3vllmyqwsx5wktcd8cc3sq835lu7drv2xwl2wywfgse35a3x
  description: CIP-19 test vector, base address (type 0)
- value: addr1vx2fxv2umyhttkxyxp8x0dlpdt3k6cwng5pxj3jhsydzers66hrl8
  description: CIP-19 test vector, enterprise address (type 6)
- value: stake1uyehkck0lajq8gr28t9uxnuvgcqrc6070x3k9r8048z8y5gh6ffgw
  description: CIP-19 test vector, reward address (type 14)
- value: addr1vx2fxv2umyhttkxyxp8x0dlpdt3k6cwng5pxj3jhsydzers66hrl9
  valid: false
  description: last character changed, the checksum fails
- value: addr_test1vz2fxv2umyhttkxyxp8x0dlpdt3k6cwng5pxj3jhsydzerspjrlsz
  valid: false
  description: testnet address
