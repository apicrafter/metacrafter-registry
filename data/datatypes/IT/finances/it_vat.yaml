id: it_vat
name: Italian VAT identification number (partita IVA)
status: draft
doc: Italian VAT number (partita IVA). In the EU form it is IT followed by 11 digits - a seven-digit taxpayer
  number, a three-digit tax office code (mostly the province code; 888 and 999 are used for special regimes
  and for non-residents) and a Luhn check digit. For companies the 11 digits are also the fiscal code.
parent: euvat
categories:
