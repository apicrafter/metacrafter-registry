id: musicbrainz_label_id
name: MusicBrainz label ID
status: draft
doc: 'MBID of a label in MusicBrainz: an imprint, record company or other organisation whose name appears
  on releases, as in musicbrainz.org/label/<id>.'
parent: musicbrainz_id
categories:
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
examples:
- value: e979fa51-f704-4a15-bd1f-1f9a1d4e4f0b
  description: Monstercat
- value: f9e45080-8640-4097-9816-030d79dd3f53
  description: Brennus Music
- value: B10BBBFC-CF9E-42E0-BE17-E2C3E1D2600D
  valid: false
  description: Upper case; MusicBrainz writes MBIDs in lower case
mappings:
  wikidata: P966
links:
- type: doc
  url: https://musicbrainz.org/doc/Label
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P966
translations:
