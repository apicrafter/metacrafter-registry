id: us_mpa_rating
name: MPA film rating (United States)
status: draft
doc: 'Rating of a film by the Motion Picture Association of the United States (MPAA until 2019): G (general
  audiences), PG (parental guidance suggested), PG-13 (parents strongly cautioned), R (restricted: under
  17 only with a parent or guardian) and NC-17 (no one 17 and under admitted). The system is voluntary
  and has been in use since 1968. Films without a rating are often marked NR (not rated) or UR (unrated);
  these labels are not MPA ratings.'
