id: data_type
name: Data type name (int, String, boolean, VARCHAR(64))
status: draft
doc: 'Name of the data type of a field, column, parameter or return value in the documentation of an API,
  a programming language, a file format or a database schema: int, String, boolean, void, double, List<String>,
  java.lang.Integer, xs:date of XML Schema, VARCHAR(64), bigint(20) unsigned and Decimal(39,0) of SQL.
  Javadoc tables name the column Modifier and Type, and data dictionaries Type or Data Type. Words such
  as Text, Date and Number are types only in a column named after the type.'
