id: eu_banknote
name: Euro banknote serial number
status: draft
doc: Serial number printed on euro banknotes. Notes of the first series have one letter and eleven digits;
  notes of the Europa series have two letters and ten digits. The first letter shows the printing works,
  and all characters together form a simple checksum.
categories:
- finances
country:
- EU
langs:
- en
is_pii: false
classification: identifier
regexp: ^[B-HJLMNPR-Z][A-Z0-9]\d{10}$
examples:
- value: VA0436214792
  description: Real-world value published online
- value: U71220515711
  description: Real-world value published online
- value: VA04362147927
  valid: false
  description: One character too many
mappings:
  stdnum: eu.banknote
links:
