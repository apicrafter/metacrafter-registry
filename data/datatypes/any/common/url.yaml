id: url
name: Uniform Resource Locator (URL)
status: stable
doc: 'Address of a resource on a network that also says how to retrieve it: a scheme such as https, a
  host, an optional port, a path, a query and a fragment, as in https://www.example.com/docs?page=2#intro.
  URLs are the most common kind of URI (RFC 3986), and browsers follow the WHATWG URL Standard. The regexp
  covers http, https and ftp URLs whose host is a dotted domain name, an IPv4 address or an IPv6 address
  in brackets; other schemes are covered by uri.'
parent: uri
categories:
- common
- internet
langs:
- common
is_pii: false
regexp: ^(?:https?|ftp)://(?:[^\s/?#@]+@)?(?:[^\s/?#@:.\[\]]+(?:\.[^\s/?#@:.\[\]]+)+\.?|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?(?:[/?#]\S*)?$
examples:
- value: http://www.rdaregistry.info/xml/termList/AspectRatio.xml
  description: RDA aspect ratio designation
- value: http://vocab.getty.edu/doc/
  description: Art & Architecture Thesaurus LOD Dataset
- value: ftp://ftp.is.co.za/rfc/rfc1808.txt
  description: Example of RFC 3986, section 1.1.2
- value: www.example.com
  valid: false
  description: No scheme
- value: mailto:John.Doe@example.com
  valid: false
  description: A URI without a host, not a web address
mappings:
