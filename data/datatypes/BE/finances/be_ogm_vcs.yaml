id: be_ogm_vcs
name: Belgian structured communication (OGM/VCS)
status: draft
doc: Gestructureerde mededeling (OGM) or communication structurée (VCS), the 12-digit payment reference
  of Belgian credit transfers that lets the payee match a payment to an invoice or customer automatically.
  It is written in groups of three, four and five digits between three plus signs or three asterisks,
  as in +++090/9337/55493+++. The first ten digits are chosen by the payee, for example an invoice or
  customer number; the last two are their remainder divided by 97, or 97 when the remainder is 0. Banks
  refuse a transfer whose check digits do not match. In SEPA credit transfers it is sent as structured
  remittance information.
categories:
- finances
country:
- BE
langs:
- nl
- fr
- de
is_pii: false
classification: identifier
regexp: ^(?:\+{3}\d{3}/\d{4}/\d{5}\+{3}|\*{3}\d{3}/\d{4}/\d{5}\*{3}|\d{3}/?\d{4}/?\d{5})$
checksum: be_mod97
examples:
