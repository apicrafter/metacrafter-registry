id: ch_egrid
name: Swiss federal property identifier (E-GRID)
status: draft
doc: 'Identifier of a land register property (a parcel, a building right, a condominium unit) in Switzerland,
  the same in the land register and in the cadastral survey. It has 14 characters: CH and 12 digits. The
  last two digits check the ten before them: they are 97 minus the remainder of that ten-digit number
  divided by 97. CH says that the number comes from the Swiss number pool, not where the property lies.'
