id: gs1_ai_21
name: Serial number (GS1 AI 21)
status: draft
doc: 'GS1 element string of Application Identifier (21): ''21'' followed by the serial number of one instance
  of a trade item, up to 20 characters of GS1 character set 82. GS1 format N2+X..20. With the GTIN in
  AI (01) it identifies one item, the serialised GTIN (SGTIN). It is a key qualifier in GS1 Digital Link.
  In the human-readable text under a barcode it is written as (21) and the value.'
categories:
- gs1
- objectids
langs:
- common
is_pii: false
classification: identifier
regexp: ^21[!%-?A-Z_a-z\x22]{1,20}$
examples:
- value: 21SN58213X
  description: Serial number SN58213X
- value: 217XK29
  description: Serial number 7XK29
- value: 21AAAAAAAAAAAAAAAAAAAAA
  valid: false
  description: Serial number longer than 20 characters
mappings:
  gs1_ai: '21'
links:
- type: doc
  url: https://ref.gs1.org/ai/21
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Serial_number
