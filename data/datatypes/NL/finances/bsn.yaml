id: bsn
name: Dutch citizen service number (BSN)
status: stable
doc: Burgerservicenummer (BSN), the personal number of everyone registered in the Dutch population register
  (BRP). It replaced the sofinummer in 2007 and keeps its numbers. The government uses it to identify
  a person in contacts with public bodies, the tax service, healthcare and education. The Rijksdienst
  voor Identiteitsgegevens (RvIG) issues the numbers, which carry no information about the person. A BSN
  has nine digits and passes the 11-proef (elfproef). The first eight digits are weighted 9 down to 2
  and the last one -1, and the sum must be divisible by 11. Systems that store it as a number drop the
  leading zero, so 8-digit values occur; they are checked with the zero restored.
