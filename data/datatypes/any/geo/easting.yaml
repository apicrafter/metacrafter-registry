id: easting
name: Easting (projected coordinate)
status: draft
doc: Eastward coordinate of a point in a projected coordinate reference system, such as a UTM zone or
  the British National Grid, usually in metres from a false origin. It is paired with a northing. Unlike
  longitude, its origin and scale depend on the projection, so the value has a meaning only together with
  its coordinate reference system.
categories:
- geo
langs:
- common
is_pii: false
regexp: ^-?\d+(?:\.\d+)?$
examples:
- value: '530000'
  description: British National Grid easting in metres, central London
- value: '448251.5'
  description: UTM easting in metres
- value: 530 000 m
  valid: false
  description: unit and digit grouping are not part of the value
mappings:
  fta: COORDINATE.EASTING
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Easting_and_northing
- type: other
  url: https://github.com/tsegall/fta/blob/main/SemanticTypes.md
translations:
  ru:
    name: Восточная координата (истинг)
