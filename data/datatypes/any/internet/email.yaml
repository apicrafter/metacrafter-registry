  ru:
    name: Электронная почта (email)
    doc: Электро́нная по́чта (англ. email, e-mail [iˈmeɪl], от англ. electronic mail) — технология и служба
      по пересылке и получению электронных сообщений (называемых «письма», «электронные письма» или «сообщения»)
      между пользователями компьютерной сети (в том числе — Интернета).
