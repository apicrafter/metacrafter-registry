id: am_vehicle_plate
name: Armenian Vehicle Registration Plate
status: stable
doc: Armenian vehicle registration plate. Format consists of two or three numbers, two letters, and two
  or three additional numbers. Plates include the international code "AM" and feature the national flag,
  security hologram, and machine-readable Data Matrix Code (since 2014).
categories:
- transport
country:
- AM
langs:
- hy
is_pii: false
classification: identifier
regexp: ^\d{2,3}[A-Z]{2}\d{2,3}$
examples:
- value: 12AB345
  description: Example Armenian vehicle plate (2 digits, 2 letters, 3 digits)
- value: 123AB45
  description: Example Armenian vehicle plate (3 digits, 2 letters, 2 digits)
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Armenia
translations:
  hy:
    name: Մեքենայի համարանիշ
    doc: Մեքենայի համարանիշ - Հայաստանում ավտոմեքենաների գրանցման համարանիշ, որը բաղկացած է թվերից և տառերից
