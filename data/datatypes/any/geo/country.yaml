translations:
  ru:
    name: Название или код страны
    doc: Страна — территория, имеющая политические, физико-географические, культурные или исторические
      границы, которые могут быть как чётко определёнными и зафиксированными, так и размытыми (в таком
      случае нередко говорят не о границах, а о «рубежах»).
