id: pt_vehicle_plate
name: Portuguese vehicle registration plate
status: draft
doc: 'Registration number on Portuguese vehicle plates: three pairs of characters. Plates issued since
  March 2020 have letters, digits and letters (AA 00 AA) without separators; earlier series used 00-AA-00
  (from 2005), 00-00-AA (from 1992) and AA-00-00 (from 1937). The regexp accepts all four, with or without
  hyphens.'
categories:
- transport
country:
- PT
langs:
- pt
is_pii: false
classification: identifier
regexp: ^(?:[A-Z]{2}[- ]?[0-9]{2}[- ]?[A-Z]{2}|[0-9]{2}[- ]?[A-Z]{2}[- ]?[0-9]{2}|[0-9]{2}[- ]?[0-9]{2}[-
  ]?[A-Z]{2}|[A-Z]{2}[- ]?[0-9]{2}[- ]?[0-9]{2})$
examples:
- value: AB-12-34-CD
  valid: false
  description: Four pairs
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Portugal
