id: notion_integration_token
name: Notion integration token
status: draft
doc: API token of a Notion integration. Tokens generated since 25 September 2024 start with ntn_; older
  tokens start with secret_ and keep working. Notion does not publish the length; the regexp uses the
  forms that gitleaks (ntn_, 11 digits and 35 letters and digits) and pyWhat (secret_ and 43 letters and
  digits) expect.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:ntn_[0-9]{11}[A-Za-z0-9]{35}|secret_[A-Za-z0-9]{43})$
examples:
- value: secret_
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://developers.notion.com/changelog
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/bee-san/pyWhat/blob/main/pywhat/Data/regex.json
