id: deust
name: USt-IdNr. anhand Feldname
status: stable
doc: DE datatype for 'USt-IdNr. anhand Feldname' (deust) from rules in context 'finances'. The German
  VAT identification number (Umsatzsteuer-Identifikationsnummer, USt-IdNr.) is a unique identifier assigned
  to businesses for VAT purposes within the European Union. It consists of the country code 'DE' followed
  by 9 digits.
categories:
- finances
country:
- DE
langs:
- de
is_pii: true
classification: identifier
regexp: ^DE[0-9]{9}$
examples:
- value: DE123456789
  description: German VAT identification number (USt-IdNr.) with country code DE and 9 digits
- value: DE987654321
  description: Another valid German VAT identification number format
mappings:
  purview: Germany value added tax number
links:
- type: doc
  url: https://www.bzst.de/DE/Unternehmen/SteuerlicheIdentifikationsnummern/UStIdNr/ustidnr_node.html
