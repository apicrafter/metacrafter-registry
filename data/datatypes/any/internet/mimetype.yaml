id: mimetype
name: Multipurpose Internet Mail Extensions (MIME)
status: stable
doc: 'Mime type of the file/content. Used to identify contents of the stream or file. The MIME standard
  is specified in a series of requests for comments: RFC 2045, RFC 2046, RFC 2047, RFC 4288, RFC 4289
  and RFC 2049.'
categories:
- common
langs:
- common
is_pii: false
classification: identifier
regexp: (application|audio|example|font|image|message|model|multipart|text|video)/[a-zA-Z0-9\-+.]+
examples:
- value: text/html
  description: HyperText Markup Language
- value: image/jpeg
  description: JPEG File Interchange Format, version 1.0
mappings:
  wikidata: P1163
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/MIME
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P1163
