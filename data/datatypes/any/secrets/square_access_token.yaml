id: square_access_token
name: Square access token
status: draft
doc: Personal or OAuth access token of the Square APIs. Square does not document the format; secret scanners
  such as gitleaks recognize it by the prefix EAAA or the older prefix sq0atp- followed by 22 to 60 letters,
  digits, underscores or hyphens.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:EAAA|sq0atp-)[A-Za-z0-9_-]{22,60}$
examples:
- value: EAAAExampleTokenExampleTokenExampleTokenExampleTokenExampleToken
  description: Constructed, non-functional value
links:
- type: doc
  url: https://developer.squareup.com/docs/build-basics/access-tokens
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
