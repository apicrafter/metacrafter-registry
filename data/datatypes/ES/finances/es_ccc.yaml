is_pii: false
classification: identifier
regexp: ^\d{4}[ -]?\d{4}[ -]?\d{2}[ -]?\d{10}$
examples:
- value: '78485312256049891785'
  description: Synthetic number with a valid check digit
- value: '22296089868003386336'
  description: Synthetic number with a valid check digit
- value: '784853122560498917857'
  valid: false
  description: One character too many
