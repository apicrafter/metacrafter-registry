id: br_cnh
name: Brazilian driving licence registration number (CNH)
status: draft
doc: Número de registro of the Brazilian national driving licence (Carteira Nacional de Habilitação),
  generated by the national BINCO system. It is unique to each driver for life and never reused. It has
  nine positions and two check digits, eleven digits in all; the check-digit algorithm is not published
  in the CONTRAN resolution.
categories:
- pii
- persons
- transport
country:
- BR
langs:
- pt
is_pii: true
classification: identifier
regexp: ^\d{11}$
examples:
- value: '99427484645'
  description: Synthetic value in the documented format; the check digits are not computed
- value: '9942748464'
  valid: false
  description: Ten digits
links:
- type: doc
  url: https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao5982016.pdf
translations:
  pt:
    name: Número de registro da CNH
