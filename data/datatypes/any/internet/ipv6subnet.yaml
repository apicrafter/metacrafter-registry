examples:
- value: 2001:610::/29
  description: SURFnet (example of Wikidata property P3793)
- value: 2001:630:440::/44
  description: University of Oxford (example of Wikidata property P3793)
- value: 2001:db8::/32
  description: Documentation prefix (RFC 3849)
- value: 08:00-22:00
  valid: false
  description: A time range, not an IPv6 prefix
- value: '2001:db8::'
  valid: false
  description: An IPv6 address without the prefix length
- value: 2001:db8::/129
  valid: false
  description: The prefix length is larger than 128
