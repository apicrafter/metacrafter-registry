id: sl_phone
name: Sierra Leone phone number (E.164)
status: draft
doc: 'Phone number of Sierra Leone in international E.164 form: a plus sign, the country calling code
  +232 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- SL
langs:
- common
regexp: ^\+232(?:(?:[237-9]\d|66)\d{6})$
examples:
- value: '+23222221234'
  description: Example number from Google libphonenumber (fixed line)
- value: '+23225123456'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
