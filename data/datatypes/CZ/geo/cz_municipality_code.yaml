  url: https://www.wikidata.org/wiki/Property:P7606
- type: doc
  url: https://vdp.cuzk.cz/vdp/ruian/obce/554782
translations:
  cs:
    name: Kód obce
  ru:
    name: Код муниципалитета Чехии (kód obce)
    doc: Шестизначный код чешской общины (obec) в справочнике Чешского статистического управления и в
      реестре RÚIAN, начинается с 5.
