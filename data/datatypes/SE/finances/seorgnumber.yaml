id: seorgnumber
name: Swedish organization number by field name
status: stable
doc: 'Swedish organisation number (organisationsnummer) of a legal entity: ten digits, usually written
  as NNNNNN-NNNN. The last digit is a Luhn check digit, and the third digit is 2 or greater, which tells
  it apart from a personal identity number.'
