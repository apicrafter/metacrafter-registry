id: planet
name: Planet of the Solar System
status: draft
doc: 'Planet of the Solar System by name: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.
  Tables made before or apart from the 2006 decision of the International Astronomical Union still list
  Pluto, now a dwarf planet. Teaching and astronomy tables give their mass, gravity, orbital period or
  distance from the Sun. Names of exoplanets and of moons are other types.'
