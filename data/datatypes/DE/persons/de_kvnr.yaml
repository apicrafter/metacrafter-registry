id: de_kvnr
name: German health insurance number (Krankenversichertennummer, KVNR)
status: draft
doc: 'Krankenversichertennummer (KVNR), the lifelong number of a person in the German statutory health
  insurance (§ 290 SGB V), printed on the electronic health card. The fixed part has ten characters: a
  random capital letter, eight random digits and a check digit. For the check, the letter becomes its
  position in the alphabet as two digits (A=01 ... Z=26), the ten digits are weighted 1 2 1 2 ..., and
  the digit sums of the products are added modulo 10. It is derived from the pension insurance number
  in a way that cannot be reversed. In data exchange the insurer code (IK) and further check digits follow,
  which gives 20 or 30 characters.'
categories:
- pii
