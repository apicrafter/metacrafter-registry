id: msisdn
name: Mobile Subscriber ISDN Number (MSISDN)
status: stable
doc: MSISDN is a number uniquely identifying a subscription in a Global System for Mobile communications
  or a Universal Mobile Telecommunications System mobile network. It is the mapping of the telephone number
  to the subscriber identity module in a mobile or cellular phone.
categories:
- telecom
- pii
langs:
- common
is_pii: true
classification: identifier
regexp: ^[1-9][0-9]{10,14}$
examples:
- value: '12025551234'
  description: US MSISDN (country code 1, 11 digits total)
- value: '447911123456'
  description: UK MSISDN (country code 44, 12 digits total)
- value: '79101234567'
  description: Russian MSISDN (country code 7, 11 digits total)
- value: '8613800138000'
  description: Chinese MSISDN (country code 86, 13 digits total)
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/MSISDN
