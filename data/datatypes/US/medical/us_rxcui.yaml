  url: https://en.wikipedia.org/wiki/RxNorm
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P3345
- type: schema.org
  url: https://schema.org/rxcui
- type: doc
  url: https://www.nlm.nih.gov/research/umls/rxnorm/index.html
translations:
