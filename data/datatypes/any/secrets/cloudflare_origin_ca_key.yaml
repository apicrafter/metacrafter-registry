id: cloudflare_origin_ca_key
name: Cloudflare Origin CA key
status: draft
doc: Key for the Cloudflare Origin CA certificates API, often sent in the X-Auth-User-Service-Key header
  and also used by the Keyless SSL key server. It always starts with v1.0-; secret scanners expect 24
  hexadecimal digits, a hyphen and 146 more hexadecimal digits.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^v1\.0-[a-f0-9]{24}-[a-f0-9]{146}$
examples:
- value: v1.0-ExampleKeyNotReal
  valid: false
  description: Not hexadecimal and too short
links:
- type: doc
  url: https://developers.cloudflare.com/fundamentals/api/get-started/ca-keys/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/cloudflarecakey/cloudflarecakey.go
