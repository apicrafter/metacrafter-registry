id: gitlab_feature_flags_client_token
name: GitLab feature flags client token
status: draft
doc: Token with which applications fetch the feature flags of a GitLab project through its Unleash-compatible
  API. GitLab gives these tokens the prefix glffct-, which cannot be configured. GitLab does not document
  the length; the regexp follows the gitleaks rule (20 characters after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glffct-[A-Za-z0-9_-]{20}$
examples:
- value: glffct-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
