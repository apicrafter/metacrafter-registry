id: swiftcode
name: Bank SWIFT code (ISO 9362)
status: stable
doc: ISO 9362 defines a standard format of Business Identifier Codes (also known as SWIFT-BIC, BIC, SWIFT
  ID or SWIFT code) approved by the International Organization for Standardization (ISO).
categories:
- finances
langs:
- common
is_pii: false
classification: identifier
regexp: '[A-Z]{6}[0-9A-Z]{2}([0-9A-Z]{3})?'
examples:
- value: DEUTDEFF
  description: Deutsche Bank
mappings:
  autotype: SWIFT1_correct
  fibo: FBC/FunctionalEntities/FinancialServicesEntities/BusinessIdentifierCode
  google_dlp: SWIFT_CODE
  purview: SWIFT code
  wikidata: P2627
links:
