id: countrycode_num
name: ISO 3166-1 Numeric code (country code)
status: stable
doc: ISO 3166-1 numeric (or numeric-3) codes are three-digit country codes defined in ISO 3166-1, part
  of the ISO 3166 standard published by the International Organization for Standardization (ISO), to represent
  countries, dependent territories, and special areas of geographical interest.
semantic_type: country
langs:
- common
regexp: ^[0-9]{3}$
examples:
- value: '554'
  description: New Zealand
- value: '276'
  description: Germany
mappings:
  wikidata: P299
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/ISO_3166-1_numeric
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P299
