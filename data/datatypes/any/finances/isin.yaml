id: isin
name: International Securities Identification Number
status: stable
doc: An International Securities Identification Number (ISIN) uniquely identifies a security. Its structure
  is defined in ISO 6166. The ISIN code is a 12-character alphanumeric code that serves for uniform identification
  of a security through normalization of the assigned National Number, where one exists, at trading and
  settlement.
categories:
- finances
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Z]{2}[A-Z\d]{10}$
examples:
- value: RU0007661625
  description: Gazprom
- value: NL0000235190
  description: Airbus Group
