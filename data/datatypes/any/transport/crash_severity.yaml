id: crash_severity
name: Road crash severity
status: draft
doc: 'Severity of a road crash by its worst outcome, in the words of police and road authority crash data:
  Fatal, Serious (injury, hospitalisation), Minor (other) injury, First Aid, Medical treatment, Injury,
  Property Damage Only (non-injury, tow-away), Not known (Tasmanian crash data, ACT crash data, KSI statistics).
  The injury of each person in the crash is a separate field.'
