id: in_reply_to
name: In-Reply-To (Email Header)
status: stable
doc: In-Reply-To is an email header field that contains the Message-ID of the message to which this message
  is a reply, as defined in RFC 5322.
categories:
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^<[^<>@]+@[^<>@]+>$
examples:
- value: <CABcD1234@example.com>
  description: In-Reply-To header containing Message-ID
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Email#Message-ID
