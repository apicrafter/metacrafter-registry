id: validatorjs
name: validator.js
category: other
doc: Open-source (MIT) JavaScript library of string validators and sanitizers, used in browsers and Node.js.
  Most validators check one format, such as an email address, URL, IBAN, ISIN, IMEI, UUID, MAC address,
  hash or payment card number, with check digits where the format has them. Locale-aware validators check
  tax identification numbers (EU member states, the UK, the US and others), VAT numbers, identity card
  numbers, passport numbers, postal codes, mobile phone numbers and vehicle license plates of the countries
  listed in the README. Like python-stdnum, it validates a given value and does not scan text.
website: https://github.com/validatorjs/validator.js
