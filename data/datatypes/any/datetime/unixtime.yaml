id: unixtime
name: Digital timestamp (Unix time, Epoch time, Posix time)
status: stable
doc: Digital timestamp defined as Unix Time. It is a system for describing a point in time. It is the
  number of seconds that have elapsed since the Unix epoch, excluding leap seconds.
parent: datetime
categories:
- datetime
langs:
- common
is_pii: false
regexp: ^\d{1,10}$
examples:
- value: '1652190194'
  description: '2022-05-10T13:43:14+00:00'
- value: '915148800'
  description: '1998-12-31T23:59:60.25'
mappings:
  autotype:
  - unixback
  - unixtime
  fta:
  - EPOCH.MILLISECONDS
  - EPOCH.SECONDS
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Unix_time
