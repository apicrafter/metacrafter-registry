id: be_driver_license
name: Belgian driver's license number
status: draft
doc: Number of a driving licence (rijbewijs, permis de conduire, Führerschein) issued in Belgium as a
  card in the European format. Microsoft Purview looks for ten digits without spaces or delimiters and
  no check digit. On the card models described in PRADO a changing image shows the photo of the holder
  and the last five digits of the number.
parent: driver_license
categories:
- pii
- persons
country:
- BE
langs:
- nl
- fr
- de
is_pii: true
classification: identifier
regexp: ^\d{10}$
examples:
- value: 4027 591 836
  valid: false
  description: Purview expects no spaces
- value: '402759183'
  valid: false
  description: Nine digits
mappings:
  purview:
  - Belgium drivers license number
  - EU drivers license number
links:
