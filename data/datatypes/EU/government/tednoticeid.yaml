id: tednoticeid
name: TED notice id
status: stable
doc: EU datatype for 'TED notice id' (tednoticeid) from rules in context 'government'. The TED (Tenders
  Electronic Daily) notice ID is a unique identifier assigned to procurement notices published in the
  Tenders Electronic Daily database, which is the online version of the Supplement to the Official Journal
  of the European Union. The identifier format consists of a 4-digit year followed by a hyphen and then
  1 to 8 digits representing the notice number within that year.
categories:
- government
country:
- EU
langs:
- en
is_pii: false
classification: identifier
regexp: ^[0-9]{4}-[0-9]{1,8}$
examples:
- value: 2024-12345678
  description: TED notice ID with 4-digit year and 8-digit notice number
- value: 2023-1234567
  description: TED notice ID with 4-digit year and 7-digit notice number
- value: 2024-12345
  description: TED notice ID with 4-digit year and 5-digit notice number
- value: 2023-1
  description: TED notice ID with 4-digit year and single-digit notice number
links:
- type: doc
  url: https://ted.europa.eu/
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Tenders_Electronic_Daily
- type: doc
  url: https://docs.ted.europa.eu/
translations:
  en:
    name: TED Notice ID
  fr:
    name: Identifiant d'avis TED
  de:
    name: TED-Bekanntmachungs-ID
  es:
    name: ID de aviso TED
