id: kg_inn
name: Kyrgyz taxpayer identification number (INN)
status: draft
doc: ИНН, the taxpayer identification number of a legal entity or branch, as shown in the register of
  legal entities of the Ministry of Justice of Kyrgyzstan. ORG-ID.guide lists it under KG-TIN and KG-INN;
  with that prefix an identifier reads KG-TIN-02507199510010.
