id: chuid
name: Swiss UID
status: stable
doc: Swiss UID (Unternehmens-Identifikationsnummer) - Swiss business identification number
categories:
- finances
country:
- CH
langs:
- de
- fr
- it
is_pii: false
classification: identifier
regexp: '^CHE-?\d{3}\.?\d{3}\.?\d{3}(?: ?(?:MWST|TVA|IVA))?$'
examples:
- value: CHE-123.456.788
  description: Swiss UID (valid MOD-11 check digit)
- value: CHE-123.456.788 TVA
  description: Swiss UID used as VAT number
