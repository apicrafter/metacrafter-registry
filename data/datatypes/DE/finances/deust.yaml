id: deust
name: German VAT identification number (USt-IdNr.)
status: stable
doc: Umsatzsteuer-Identifikationsnummer (USt-IdNr.), the VAT identification number that the Federal Central
  Tax Office (BZSt) issues to businesses in Germany for trade with other EU member states. It is DE followed
  by nine digits; the first digit is never 0 and the last one is an ISO 7064 MOD 11,10 check digit. It
  is not the domestic tax number (Steuernummer) or the personal tax identification number (Steuer-ID).
  Since November 2024 the business identification number (W-IdNr.) reuses it with a five-digit suffix.
parent: vatin
categories:
- finances
country:
- DE
langs:
- de
is_pii: true
classification: identifier
regexp: ^DE[1-9][0-9]{8}$
checksum: de_ustidnr
