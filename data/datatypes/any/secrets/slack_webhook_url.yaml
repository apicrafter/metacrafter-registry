id: slack_webhook_url
name: Slack incoming webhook URL
status: draft
doc: URL of a Slack incoming webhook or workflow trigger on hooks.slack.com. Anyone who knows the URL
  can post messages to the channel, so the URL itself is the secret.
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:https?://)?hooks\.slack\.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{43,56}$
examples:
- value: https://hooks.slack.com/services/T00000000
  valid: false
  description: Incomplete path
links:
- type: doc
  url: https://docs.slack.dev/messaging/sending-messages-using-incoming-webhooks
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
