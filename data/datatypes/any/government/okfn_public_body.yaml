id: okfn_public_body
name: Public Bodies identifier (Open Knowledge Foundation)
status: draft
doc: 'Identifier of a public body in Public Bodies, a database of the Open Knowledge Foundation: a country
  code, a slash and a slug of the body''s name. ORG-ID.guide lists the register as XI-PB; with that prefix
  an identifier reads XI-PB-gb/aberdeen-city-council.'
