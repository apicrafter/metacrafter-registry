id: gs1_ai_411
name: Bill to / invoice to GLN (GS1 AI 411)
status: draft
doc: 'GS1 element string of Application Identifier (411): ''411'' followed by the 13-digit Global Location
  Number of the party to be invoiced. GS1 format N3+N13. The GLN ends in a GS1 check digit. In the human-readable
  text under a barcode it is written as (411) and the value.'
semantic_type: gln
langs:
- common
regexp: ^411\d{13}$
examples:
- value: '4119528765000017'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '4119528765000253'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '411952876500001'
  valid: false
  description: Twelve-digit GLN
mappings:
  gs1_ai: '411'
links:
- type: doc
  url: https://ref.gs1.org/ai/411
