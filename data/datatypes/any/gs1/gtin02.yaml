id: gtin02
name: Global Trade Item Number (GTIN) of contained trade items
status: stable
doc: 'GTIN of the trade items contained in a logistic unit, written as a GS1 element string with Application
  Identifier (02): ''02'' followed by 14 digits. Used together with the SSCC of the unit.'
categories:
- industry
- objectids
- gs1
langs:
- common
is_pii: false
classification: identifier
regexp: ^02(\d{14})$
examples:
- value: 0209506000134352
  description: GS1's example GTIN 09506000134352 as the contained item
- value: 0209528765000123
  description: Synthetic value with the GS1 demonstration prefix 952
- value: 020950600013435
  valid: false
  description: Thirteen-digit GTIN
mappings:
  gs1_ai: '02'
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Global_Trade_Item_Number
- type: other
  url: https://www.gs1.org/standards/barcodes/application-identifiers/02
