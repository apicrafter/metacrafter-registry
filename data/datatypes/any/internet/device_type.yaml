id: device_type
name: Device type (desktop, phone, tablet)
status: draft
doc: 'Class of the device a person used to open a web page, an application or a survey: Desktop, Phone
  (or Mobile, Smartphone), Tablet, and sometimes TV, Console or Bot. Web analytics and survey platforms
  derive it from the user agent (user_agent) and keep it beside the browser (web_browser) and the operating
  system (operating_system), in fields named DeviceType, device_category or device. The model of the device
  (iPhone 12) is not this type.'
parent: category
