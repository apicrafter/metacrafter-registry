  url: https://en.wikipedia.org/wiki/Israeli_identity_card
- type: wikipedia
  url: https://he.wikipedia.org/wiki/%D7%9E%D7%A1%D7%A4%D7%A8_%D7%96%D7%94%D7%95%D7%AA_(%D7%99%D7%A9%D7%A8%D7%90%D7%9C)
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.il.idnr.html
- type: other
  url: https://docs.dataprep.ai/user_guide/clean/clean_il_idnr.html
