id: ianatimezoneid
name: IANA Timezone ID
status: stable
doc: Time zone identifier from the IANA time zone database (tz database), in Area/Location form, for example
  Europe/London.
semantic_type: timezone
langs:
- common
regexp: ^(?:[A-Z][A-Za-z_-]+(?:/[A-Za-z0-9_+-]+){1,2}|UTC|GMT)$
examples:
- value: Australia/Sydney
  description: Australia/Sydney
- value: Europe/London
  description: Europe/London
mappings:
  wikidata: P6687
  fta: TIMEZONE.IANA
links:
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P6687
