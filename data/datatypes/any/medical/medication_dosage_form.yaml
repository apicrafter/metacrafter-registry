translations:
  ru:
    name: Лекарственная форма
    doc: Состояние лекарственного препарата, которое соответствует способу его введения и применения,
      например таблетки, таблетки, покрытые пленочной оболочкой, капсулы, сироп или раствор для инъекций.
      Значение берется из закрытого перечня терминов. В ЕАЭС это Номенклатура лекарственных форм (Решение
      Коллегии ЕЭК от 22.12.2015 № 172); в России лекарственную форму по-русски записывает каталог ЕСКЛП.
