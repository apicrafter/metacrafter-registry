id: ee_registrikood
name: Estonian organisation registration code (registrikood)
status: draft
doc: Registrikood, the 8-digit code that the Estonian registers give to organisations. Commercial companies
  start with 1, state and local government bodies with 7, non-profit associations with 8 and foundations
  with 9. The last digit is a check digit.
categories:
- companies
country:
- EE
langs:
- et
is_pii: false
classification: identifier
regexp: ^[1789]\d{7}$
examples:
- value: '19232463'
  description: Synthetic number with a valid check digit
- value: '95529387'
  description: Synthetic number with a valid check digit
- value: '192324637'
  valid: false
  description: One character too many
