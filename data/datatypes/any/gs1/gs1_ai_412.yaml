id: gs1_ai_412
name: Purchased from GLN (GS1 AI 412)
status: draft
doc: 'GS1 element string of Application Identifier (412): ''412'' followed by the 13-digit Global Location
  Number of the party from which the goods were bought. GS1 format N3+N13. The GLN ends in a GS1 check
  digit. In the human-readable text under a barcode it is written as (412) and the value.'
semantic_type: gln
langs:
- common
regexp: ^412\d{13}$
examples:
- value: '4129528765000017'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '4129528765000253'
  description: Synthetic value with the GS1 demonstration prefix 952
- value: '412952876500001'
  valid: false
  description: Twelve-digit GLN
mappings:
  gs1_ai: '412'
links:
- type: doc
  url: https://ref.gs1.org/ai/412
