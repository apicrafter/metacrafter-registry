id: dropbox_short_lived_token
name: Dropbox short-lived access token
status: draft
doc: Short-lived OAuth access token of the Dropbox API. Dropbox staff state that these tokens start with
  sl., while the deprecated long-lived tokens have no prefix. The regexp follows the gitleaks rule (sl.
  and 135 characters).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^sl\.[A-Za-z0-9=_-]{135}$
examples:
- value: sl.
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://docs.dropboxapi.com/dropbox-api/docs/oauth
- type: other
  url: https://www.dropboxforum.com/discussions/101000042/is-dropbox-access-tokenwill-expire-after-some-time/554402
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
