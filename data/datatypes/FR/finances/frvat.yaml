id: frvat
name: French VAT number (numéro de TVA intracommunautaire)
status: stable
doc: 'Numéro de TVA intracommunautaire, the VAT identification number of businesses in France: FR, a 2-character
  key and the 9-digit SIREN number of the business. In older numbers the key is two digits computed from
  the SIREN; in newer numbers at least one character of the key is a letter, never I or O. Businesses
  in Monaco receive numbers of the same form (see mc_tva).'
parent: vatin
categories:
- finances
country:
- FR
langs:
- fr
is_pii: true
classification: identifier
regexp: ^FR[0-9A-HJ-NP-Z]{2}\d{9}$
examples:
- value: FR40303265045
  description: python-stdnum reference value
- value: FR23334175221
  description: python-stdnum reference value
- value: FRK7399859412
  description: Key with a letter, python-stdnum reference value
- value: FRIO334175221
  valid: false
  description: The key cannot contain the letters I or O
- value: FR4030326504
  valid: false
  description: One digit short
mappings:
  purview: France value added tax number
  fta: IDENTITY.VAT_FR
links:
