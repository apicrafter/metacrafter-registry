id: dedriverlic
name: Germany driver license number
status: stable
doc: 'Number (Führerscheinnummer) of a German card driving licence: eleven characters. The first four
  are the key of the issuing authority (a letter for the state, A Baden-Württemberg to P Thüringen, two
  digits for the district and one more character), the next five a serial number of digits and capital
  letters, then a check digit and an issue number that grows with each new licence. For the check digit
  the first nine characters count as base-36 values (A=10 ... Z=35), are weighted 9 down to 1, and the
  sum modulo 11 is the digit, X for 10.'
parent: driver_license
categories:
- pii
- persons
country:
- DE
langs:
- common
is_pii: true
classification: identifier
regexp: ^[A-Z0-9]\d{2}[A-Z0-9]{6}[0-9X][A-Z0-9]$
checksum: de_fsnr
examples:
- value: B072RRE2I55
  description: Number of the specimen licence (Musterführerschein)
- value: B072RRE21X1
  description: Synthetic number whose check digit is X
- value: B072RRE2I45
  valid: false
  description: Check digit does not match
- value: B072RRE2I5
  valid: false
  description: Ten characters
