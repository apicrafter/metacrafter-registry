translations:
  ru:
    name: Регистрационный номер объекта культурного наследия в ЕГРОКН
    doc: Пятнадцатизначный регистрационный номер объекта в Едином государственном реестре объектов культурного
      наследия (памятников истории и культуры) народов Российской Федерации со структурой СС ГГ В XXXXXX
      ППП К. Здесь СС — код субъекта РФ, ГГ — год внесения записи, В — вид объекта, XXXXXX — порядковый
      номер, ППП — пообъектный состав, К — категория историко-культурного значения.
