translations:
  ru:
    name: Основной государственный регистрационный номер (ОГРН, ОГРНИП)
    doc: Номер записи о государственной регистрации, который налоговая служба присваивает юридическому
      лицу (ОГРН, 13 цифр, ЕГРЮЛ) или индивидуальному предпринимателю (ОГРНИП, 15 цифр, ЕГРИП). Первая
      цифра 1 или 5 у ОГРН и 3 у ОГРНИП, затем две последние цифры года записи (ОГРН присваивают с 2002
      года, ОГРНИП — с 2004 года), код региона, номер записи и контрольная цифра.
