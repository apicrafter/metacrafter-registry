id: dcid
name: Datacommons unique id
status: stable
doc: Every entity in Data Commons (DC) has a unique identifier, called ‘dcid’. So, for example, the dcid
  of California is ‘geoId/06’ and of India is ‘country/IND’.
categories:
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: '[A-Za-z\d_/]+'
mappings:
