id: okpd
name: Russian product code (OKPD)
status: stable
doc: 'Code of a product, service or work in the Russian Classification of Products by Economic Activities
  (ОКПД 2, ОК 034-2014 (КПЕС 2008)), which is harmonised with the European CPA 2008. Procurement plans,
  contracts, budget documents and statistics use it. The code has 2 to 9 digits with dots after the second,
  fourth and sixth digits; each level adds digits: class (XX), subclass (XX.X), group (XX.XX), subgroup
  (XX.XX.X), type (XX.XX.XX), category (XX.XX.XX.XX0) and subcategory (XX.XX.XX.XXX). OKPD2 came into
  force in 2014 and replaced the earlier OKPD (ОК 034-2007 (КПЕС 2002)). Codes of up to six digits look
  like OKVED codes, so use the field name or context to tell them apart.'
aliases:
- okpd2
categories:
- common
country:
- RU
langs:
- ru
is_pii: false
classification: categorical
regexp: ^\d{2}(?:\.\d(?:\d(?:\.\d(?:\d(?:\.\d{3})?)?)?)?)?$
examples:
- value: 35.30.12.130
  description: OKPD2 code from a procurement plan published on data.mos.ru
- value: 91.01.11
  description: OKPD2 grouping code
- value: 21.20.10.226
  description: OKPD2 subcategory of a medicine in the ESKLP catalogue
- value: 35-30-12
  valid: false
  description: Hyphens instead of dots
- value: 21.20.10.22
  valid: false
  description: Two digits after the last dot; categories and subcategories have three
- value: 10.0.0.1
  valid: false
  description: IPv4 address; OKPD2 puts dots only after the second, fourth and sixth digits
mappings:
  wikidata: P3250
links:
