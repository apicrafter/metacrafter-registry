id: ocn
name: OCLC Control Number
status: stable
doc: Number of a bibliographic record in WorldCat, the union catalogue of OCLC. Numbers are assigned in
  sequence and have no check digit; more than a billion exist, and OCLC has placed them in the public
  domain. Library systems use the number to link their local records to WorldCat. In MARC records it is
  stored in field 035 with the prefix (OCoLC) and often the letters ocm, ocn or on.
categories:
- objectids
- publishing
langs:
- common
is_pii: false
classification: identifier
regexp: ^\d{1,14}$
examples:
- value: '787911721'
  description: Directory of Open Access Books
- value: '57722711'
  description: Iso suomen kielioppi
- value: (OCoLC)ocm57722711
  valid: false
  description: MARC 035 form with prefixes, not the bare number
mappings:
  wikidata: P243
  bioregistry: oclc
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/OCLC
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P243
- type: doc
  url: https://search.worldcat.org/
translations:
  ru:
    name: Контрольный номер OCLC (OCN)
    doc: Номер библиографической записи в сводном каталоге WorldCat. Присваивается по порядку, контрольной
      цифры нет.
