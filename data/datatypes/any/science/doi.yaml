id: doi
name: Digital Object Identifier (DOI)
status: stable
doc: A digital object identifier (DOI) is a persistent identifier or handle used to identify objects uniquely,
  standardized by the International Organization for Standardization (ISO).
parent: url
categories:
- science
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: ^10\.\d{4,9}/\S+$
examples:
- value: 10.1371/JOURNAL.PONE.0029797
  description: PLOS ONE article
- value: 10.12987/YALE/9780300197051.003.0010
  description: Book chapter (Yale University Press)
mappings:
  autotype: doi
  wikidata: P356
  bioregistry: doi
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Digital_object_identifier
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P356
translations:
  ru:
    name: Цифровой идентификатор объекта (DOI)
    doc: Цифровой идентификатор объекта (англ. digital object identifier (DOI), дискретный объекта идентификатор
      (ДОИ)) — основной элемент системы ДОИ, предназначенной для обозначения объектов информационной деятельности.
