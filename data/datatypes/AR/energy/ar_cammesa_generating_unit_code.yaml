id: ar_cammesa_generating_unit_code
name: Argentine generating unit code (CAMMESA)
status: draft
doc: 'Eight-character code of a generating unit (máquina) of the Argentine wholesale electricity market
  in the data of CAMMESA and the Secretaría de Energía: four characters for the plant or group of units,
  two letters for the technology (TG gas turbine, TV steam turbine, DI diesel engine) and a two-digit
  unit number, as in COSTTG08 (a gas turbine of Central Costanera), ANATDI01 and CEPUTG11.'
parent: id
categories:
- energy
country:
- AR
langs:
- es
is_pii: false
classification: identifier
regexp: ^[A-Z0-9]{4}[A-Z]{2}\d{2}$
examples:
- value: COSTTG08
  description: gas turbine 8 of Central Costanera
- value: ANATDI01
  description: diesel engine 1 of Central Térmica Añatuya
- value: CEPUTG11
  description: gas turbine 11 of Central Puerto
- value: COST
  valid: false
  description: a power plant code
links:
- type: doc
  url: https://cammesaweb.cammesa.com/
- type: doc
  url: https://datos.gob.ar/dataset/publicaciones-cammesa
translations:
  es:
    name: Código de máquina generadora (CAMMESA)
