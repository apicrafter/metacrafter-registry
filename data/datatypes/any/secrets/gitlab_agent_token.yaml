id: gitlab_agent_token
name: GitLab agent for Kubernetes token
status: draft
doc: Token with which the GitLab agent for Kubernetes, running in a cluster, authenticates to GitLab.
  GitLab gives these tokens the prefix glagent-, which cannot be configured. GitLab does not document
  the length; the regexp follows the gitleaks rule (50 characters after the prefix).
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^glagent-[A-Za-z0-9_-]{50}$
examples:
- value: glagent-
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://docs.gitlab.com/security/tokens/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
