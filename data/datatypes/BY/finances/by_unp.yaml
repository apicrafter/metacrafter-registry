id: by_unp
name: Belarusian payer account number (UNP)
status: draft
doc: Учетный номер плательщика, the 9-character tax number that Belarus gives to organisations and individuals.
  Organisations have nine digits; for individuals the first two positions are letters. The number holds
  a region code, a serial number and a check digit.
categories:
- finances
country:
- BY
langs:
- be
- ru
is_pii: true
classification: identifier
regexp: ^(?:[1-7]\d|[ABCEHKM][ABCEHKMOPT])\d{7}$
examples:
- value: CC6500316
  description: Synthetic number with a valid check digit
- value: '534414149'
  description: Synthetic number with a valid check digit
- value: CC65003167
  valid: false
  description: One character too many
mappings:
  orgid: BY-ADR
  schema_org: taxID
  stdnum: by.unp
