id: etim_group_code
name: ETIM group code
status: draft
doc: 'Language-independent code of an ETIM group, assigned by ETIM International in its classification
  model of technical products: the prefix EG and six digits. Groups bundle related classes.'
categories:
- industry
langs:
- common
is_pii: false
classification: categorical
regexp: ^EG\d{6}$
examples:
- value: EG000017
  description: Example from the ETIM International classification guidelines
- value: EG00016
  valid: false
  description: Five digits instead of six
links:
- type: doc
  url: https://www.etim-international.com/wp-content/uploads/2019/07/ETIM-International-Guidelines-V3-2020.pdf
- type: doc
  url: https://viewer.etim-international.com/about
