id: awsglue
name: AWS Glue Sensitive Data Detection
category: pii
doc: 'AWS Glue Sensitive Data Detection, used through the Detect PII transform in AWS Glue Studio or from
  ETL scripts, finds personal and other sensitive data in datasets. It can scan every cell or a sample
  of rows to label whole columns, and it can redact, partially redact or hash the values it found. AWS
  manages a list of predefined data types: a few universal ones such as person names, email, IP and MAC
  addresses, US types such as SSN, ITIN and medical codes, and identity, passport, driver''s license,
  tax and VAT numbers for about sixty other countries and territories. Users can add their own types defined
  by a regular expression and context words.'
website: https://docs.aws.amazon.com/glue/latest/dg/sensitive-data-managed-data-types.html
