id: permid
name: PermID (Permanent Identifier)
status: draft
doc: PermID, the permanent identifier that Thomson Reuters (later Refinitiv, now part of LSEG) gives to
  organisations, instruments, people and other entities. ORG-ID.guide uses the PermIDs of organisations.
  ORG-ID.guide lists the register as XI-PID; with that prefix an identifier reads XI-PID-4295895031.
