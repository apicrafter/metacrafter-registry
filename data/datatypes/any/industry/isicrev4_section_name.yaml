id: isicrev4_section_name
name: ISIC Rev. 4 section title
status: draft
doc: Title of a section of ISIC Rev. 4, the International Standard Industrial Classification of All Economic
  Activities (A Agriculture, forestry and fishing to U Activities of extraterritorial organizations and
  bodies), in English or Arabic (الصناعة التحويلية, Manufacturing), as statistics name the industries
  of employment, investment and national accounts tables. Publishers shorten and reword the titles (Mining
  & Quarrying, Wholesale and Retail Trade Repair of Motor Vehicles and Motorcycles, Manufacturing Industry).
  NACE Rev. 2 (eu_nace) has the same sections. The section letter or class code is isicrev4.
parent: category
