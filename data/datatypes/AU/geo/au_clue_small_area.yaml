id: au_clue_small_area
name: CLUE small area of the City of Melbourne
status: draft
doc: 'Small area of the Census of Land Use and Employment (CLUE) of the City of Melbourne, the 13 areas
  into which the council divides its municipality for the census, its forecasts and many of its open data
  tables: Carlton, Docklands, East Melbourne, Kensington, Melbourne (CBD), Melbourne (Remainder), North
  Melbourne, Parkville, Port Melbourne, South Yarra, Southbank, West Melbourne (Industrial) and West Melbourne
  (Residential), with City of Melbourne (total) for the whole. Most names are also suburbs, so a value
  is a CLUE small area in a field named after it (clue_small_area, clue_area, small_area); CLUE blocks
  are numbered inside them.'
