id: au_gbr_reef_id
name: Great Barrier Reef feature identifier (GBRMPA GBR ID)
status: draft
doc: 'Identifier of a reef or other feature in the Great Barrier Reef Marine Park Authority (GBRMPA) dataset
  of Great Barrier Reef and Torres Strait features: the whole degrees of south latitude, a hyphen and
  a three-digit number (19-051); the label of a part of a feature adds a lowercase letter (19-051a). Unnamed
  reefs are known by it (U/N Reef 21-550), so monitoring and genomics data of AIMS put it in their reef
  name columns.'
categories:
- geo
- environment
country:
- AU
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:09|1\d|2[0-4])-\d{3}[a-z]?$
examples:
- value: 11-049
  description: unnamed reef (GBR genomics database, REEF_NAME)
- value: 19-051a
  description: part of a feature (LABEL_ID)
- value: 09-246
  description: Torres Strait feature
- value: MCSWEENEY REEF
  valid: false
  description: reef name
- value: 30-123
  valid: false
  description: south of the Marine Park
links:
- type: doc
  url: https://www2.gbrmpa.gov.au/about-us/naming-reefs-and-undersea-geographic-features
