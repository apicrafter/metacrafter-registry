id: ethereum_address
name: Ethereum address
status: stable
doc: 'Address of an Ethereum account or contract: 0x followed by 40 hexadecimal digits, the last 20 bytes
  of the Keccak-256 hash of the public key (or the address computed for a contract). Mixed upper and lower
  case encodes the EIP-55 checksum; all lower case or all upper case carries no checksum. Other EVM networks
  (BNB Smart Chain, Polygon, Arbitrum, Optimism, Avalanche C-Chain and others) use the same format, so
  the value alone does not tell the network.'
parent: crypto_address
categories:
- cryptocurrency
langs:
- common
is_pii: false
classification: identifier
regexp: ^0x[0-9a-fA-F]{40}$
examples:
