  description: Moment magnitude of an aftershock catalogue
- value: '1.864'
  description: Local magnitude with three decimals, IPOC catalogue of northern Chile
- value: '8.8'
- value: '-0.3'
  description: A micro-earthquake
- value: '25'
  valid: false
  description: Above every magnitude scale
