id: gq_phone
name: Equatorial Guinea phone number (E.164)
status: draft
doc: 'Phone number of Equatorial Guinea in international E.164 form: a plus sign, the country calling
  code +240 and the national number, with no spaces. The regexp follows the national number pattern of
  Google libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens
  are not covered.'
semantic_type: phone
country:
- GQ
langs:
- common
regexp: ^\+240(?:222\d{6}|(?:3\d|55|[89]0)\d{7})$
examples:
- value: '+240333091234'
  description: Example number from Google libphonenumber (fixed line)
- value: '+240222123456'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
