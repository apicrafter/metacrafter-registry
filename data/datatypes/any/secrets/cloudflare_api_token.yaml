id: cloudflare_api_token
name: Cloudflare API token
status: draft
doc: Scoped API token of Cloudflare. Tokens created or rolled in the scannable format start with cfut_
  (user API token) or cfat_ (account API token), followed by 40 characters and a checksum whose length
  Cloudflare does not state. Older tokens are unprefixed 40-character strings; they keep working but are
  too generic for a regexp and are not covered.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^cf(?:ut|at)_[A-Za-z0-9]{41,}$
examples:
- value: cfut_
  valid: false
  description: Prefix without the token
links:
- type: doc
  url: https://developers.cloudflare.com/fundamentals/api/get-started/token-formats/
