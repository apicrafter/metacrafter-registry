id: fr_gaspar_id
name: French risk procedure identifier (GASPAR)
status: draft
doc: Identifier of a risk procedure (risk prevention plan, PPR) in GASPAR, the database of the Ministry
  of Ecology published by Géorisques. Before GASPAR NG (2022) it is the department, the acronym of the
  instructing service (DDT, DDTM, DREAL, RTM ...), the year and a four-digit number (76DDTM20120001);
  GASPAR NG identifiers are the type of procedure, the year and a number separated by underscores (PPRN-RGA_2025_0396).
categories:
- environment
- government
country:
- FR
langs:
- fr
is_pii: false
classification: identifier
regexp: ^(?:(?:\d{2,3}|2[AB])[A-Z]+\d{8}|[A-Z]+(?:-[A-Z]+)?_\d{4}_\d{4})$
examples:
- value: 67DREAL20120003
  description: Flood risk plan of the Eurométropole de Strasbourg
- value: 2BDREAL20170001
  description: Technological risk plan in Haute-Corse
- value: PPRN-RGA_2025_0396
  description: GASPAR NG identifier
- value: DREAL20170001
  valid: false
  description: no department
links:
- type: doc
  url: https://cnig.gouv.fr/IMG/pdf/2026-03-24-commission-standards-risques-spp-26-0011.pdf
- type: doc
  url: https://georisques.gouv.fr/api/v1/gaspar/pprn
translations:
  fr:
    name: Identifiant GASPAR
