id: gb_planning_application_ref
name: UK planning application reference
status: draft
doc: Reference number that a local planning authority gives a planning application. There is no national
  format; most authorities that use Idox software write the year, a running number and the application
  type (14/01103/FUL for full permission, OUT outline, HOU householder, LBC listed building consent, ADV
  advertisement), with a two- or four-digit year.
categories:
- realestate
- government
country:
- GB
langs:
- en
is_pii: false
classification: identifier
regexp: ^(?:\d{2}|\d{4})/\d{3,6}/[A-Z]{1,8}$
examples:
- value: 14/01103/FUL
  description: Full planning permission
- value: 15/01940/OUT
  description: Outline permission
- value: 17/00003/CLOPUD
  description: Lawful development certificate
- value: 2019/1602/P
  description: Four-digit year
- value: 14/01103
  valid: false
  description: No application type
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Planning_permission
