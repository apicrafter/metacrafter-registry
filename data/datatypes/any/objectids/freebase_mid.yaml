id: freebase_mid
name: Freebase machine ID (MID)
status: draft
doc: 'Identifier of a topic in Freebase, the knowledge base that Google shut down in 2016: /m/0 followed
  by lowercase letters, digits and underscores. Google Knowledge Graph and many datasets still use these
  identifiers.'
categories:
- objectids
langs:
- common
is_pii: false
classification: identifier
regexp: ^/m/0(?:[0-9b-df-hj-np-tv-z_]{2,7}|1[0123][0-9b-df-hj-np-tv-z_]{5,6})$
examples:
- value: /m/0bjy66
  description: Baranagar
- value: /m/04l
  description: English
- value: /m/0j9kvph
  description: Wikidata
mappings:
  wikidata: P646
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Freebase_(database)
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P646
