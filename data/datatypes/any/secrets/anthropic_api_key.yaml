id: anthropic_api_key
name: Anthropic API key
status: draft
doc: Secret key of the Anthropic (Claude) API, sent in the x-api-key header. Standard keys start with
  sk-ant-api03- and Admin API keys, which manage an organization, with sk-ant-admin01-. Secret scanners
  expect 93 more letters, digits, underscores or hyphens and the ending AA.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^sk-ant-(?:api03|admin01)-[A-Za-z0-9_-]{93}AA$
examples:
- value: sk-ant-api03-ExampleKeyNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://platform.claude.com/docs/en/manage-claude/admin-api
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/anthropic/anthropic.go
