id: rubygems_api_key
name: RubyGems API key
status: draft
doc: 'API key of RubyGems.org, used by the gem CLI to push and manage gems, for example through the GEM_HOST_API_KEY
  environment variable: rubygems_ followed by 48 hexadecimal digits.'
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^rubygems_[a-f0-9]{48}$
examples:
