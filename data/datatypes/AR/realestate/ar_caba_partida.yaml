id: ar_caba_partida
name: Buenos Aires property tax account number (partida inmobiliaria)
status: draft
doc: 'Number of a property in the real estate register of the City of Buenos Aires, under which the city
  revenue agency (AGIP) bills the property tax and the ABL service charge: a number of up to seven digits,
  six for most properties. A building divided into units has a partida matriz for the whole parcel and
  a partida for each unit. The parcel map, the planning code and the business licence data of the city
  carry it beside the cadastral designation (ar_caba_smp); 0 stands for a parcel without one.'
