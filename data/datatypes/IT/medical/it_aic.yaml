  url: https://www.gazzettaufficiale.it/do/atto/serie_generale/caricaPdf?cdimg=14A0566800100010110001&dgu=2014-07-18&art.dataPubblicazioneGazzetta=2014-07-18&art.codiceRedazionale=14A05668&art.num=1&art.tiposerie=SG
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.it.aic.html
- type: other
  url: https://docs.dataprep.ai/user_guide/clean/clean_it_aic.html
translations:
  it:
    name: Codice AIC
    doc: Codice di autorizzazione all'immissione in commercio che l'AIFA attribuisce a ogni confezione
      di medicinale - nove cifre con cifra di controllo, o sei caratteri in base 32.
  ru:
    name: Код регистрации лекарственного средства Италии (AIC)
    doc: Код, который агентство AIFA присваивает каждой упаковке лекарства, разрешённой к продаже в Италии
      - девять цифр с контрольной цифрой или шесть символов в системе счисления по основанию 32.
