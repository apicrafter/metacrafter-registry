id: sctcrypto
name: Signed certificate timestamp (SCT)
status: stable
doc: Signed certificate timestamp (SCT). The SCT is the log's promise to incorporate the certificate in
  the Merkle Tree within a fixed amount of time known as the Maximum Merge Delay (MMD
categories:
- cryptography
langs:
- common
is_pii: false
regexp: ^(?=.)(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
links:
- type: other
  url: https://www.rfc-editor.org/rfc/rfc6962.html
