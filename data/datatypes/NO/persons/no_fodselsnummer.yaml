id: no_fodselsnummer
name: Norwegian national identity number (fødselsnummer)
status: draft
doc: 'Fødselsnummer, the 11-digit national identity number in Norway: the date of birth (DDMMYY), a 3-digit
  individual number that also gives the sex, and two check digits.'
categories:
- pii
- persons
country:
- 'NO'
langs:
- 'no'
is_pii: true
classification: identifier
regexp: ^\d{6}[ -]?\d{5}$
examples:
