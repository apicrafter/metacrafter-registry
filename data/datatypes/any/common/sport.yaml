doc: 'Name of a sport or sporting discipline: basketball, tennis, swimming, archery. Tables of results,
  facilities, clubs, athletes and surveys of leisure give it in the language of the publisher (Pallacanestro,
  Baloncesto, Basquete, Leichtathletik) and often name the event within the sport separately (100 m freestyle
  in swimming). The field name (sport, sports, deporte, esporte, sportart, disciplina) and a known list
  of sports tell it from other categories.'
