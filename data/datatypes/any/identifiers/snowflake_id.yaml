id: snowflake_id
name: Snowflake ID
status: draft
doc: 64-bit identifier scheme that Twitter introduced in 2010 and that X, Discord, Instagram, Mastodon
  and other services use, each with its own epoch and bit layout. In the Twitter form the highest bit
  is 0, then come 41 bits of milliseconds since the epoch 1288834974657 (4 November 2010), 10 bits of
  machine ID and a 12-bit sequence number, so IDs sort by creation time. Discord uses the same layout
  with the epoch 1420070400000 (1 January 2015). Values are written as decimal numbers, today of 18 or
  19 digits, and APIs often send them as strings because JavaScript numbers cannot hold 64-bit integers
  exactly. Any large integer looks the same, so there is no regexp; detect Snowflake IDs by field name.
