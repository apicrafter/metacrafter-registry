id: ru_okn_typology
name: Typology of a Russian cultural heritage object
status: draft
doc: General typology (общая видовая принадлежность) of a cultural heritage object in the register of
  cultural heritage objects (ЕГРОКН), such as a monument of archaeology, of history, of urban planning
  and architecture, or of monumental art. An object can have several typologies.
