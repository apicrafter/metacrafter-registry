id: openssh_private_key
name: OpenSSH private key
status: draft
doc: 'Private key in the OpenSSH key format (openssh-key-v1): a Base64 block between the lines -----BEGIN
  OPENSSH PRIVATE KEY----- and -----END OPENSSH PRIVATE KEY-----, which ssh-keygen writes. Keys in the
  PEM formats of OpenSSL (RSA PRIVATE KEY, EC PRIVATE KEY, PRIVATE KEY) are the datatype x509_private_key.'
parent: private_key
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^-----BEGIN OPENSSH PRIVATE KEY-----[\s\S]+-----END OPENSSH PRIVATE KEY-----$
examples:
- value: '-----BEGIN OPENSSH PRIVATE KEY-----'
  valid: false
  description: Header line without the key and the footer
links:
- type: doc
  url: https://github.com/openssh/openssh-portable/blob/master/PROTOCOL.key
- type: other
  url: https://github.com/openssh/openssh-portable/blob/master/sshkey.c
