id: abstract
name: Abstract (summary)
status: draft
doc: Short summary of an article, paper, thesis, report or book, placed before the text or stored with
  its metadata, so that a reader can decide whether to read the whole work. Field names are abstract,
  summary and annotation; in Russian data аннотация and реферат. The Dublin Core term is dcabstract.
