id: mn_soum
name: Mongolian district (soum)
status: draft
doc: Name of a district (soum, сум) of a Mongolian province or of a district (düüreg, дүүрэг) of Ulaanbaatar,
  the second level of administrative units, such as Хэрлэн, Баянзүрх or Хан-Уул. Several provinces have
  soums of the same name (Булган, Сүхбаатар), so a name needs its province. Its code is mn_soum_code.
