id: hu_vehicle_plate
name: Hungarian vehicle registration plate
status: draft
doc: Registration number on Hungarian vehicle plates. Plates issued since July 2022 have four letters,
  with the coat of arms between the second and the third, and three digits; the first two letters are
  either both vowels or both consonants. Older plates, issued from 1990, have three letters and three
  digits. Special series are not covered.
categories:
- transport
country:
- HU
langs:
- hu
is_pii: false
classification: identifier
regexp: ^(?:[A-Z]{2} ?[A-Z]{2}|[A-Z]{3})[- ]?[0-9]{3}$
examples:
- value: AA AB 123
  description: Format example of the 2022 plate from Wikipedia
- value: AB 1234
  valid: false
  description: Four digits
links:
