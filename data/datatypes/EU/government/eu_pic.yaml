id: eu_pic
name: EU Participant Identification Code (PIC)
status: draft
doc: Nine-digit Participant Identification Code of an organization registered to take part in EU funding
  programmes (Horizon Europe, Erasmus+). CORDIS gives it as organisationID next to the project number.
parent: id
categories:
- government
- companies
country:
- EU
langs:
- en
is_pii: false
classification: identifier
regexp: ^\d{9}$
examples:
