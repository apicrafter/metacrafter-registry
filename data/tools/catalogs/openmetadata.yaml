id: openmetadata
name: OpenMetadata auto-classification
category: catalogs
doc: OpenMetadata's auto-classification workflow samples table columns and tags them PII.Sensitive or
  PII.NonSensitive. It matches column names against regular expressions and checks sampled values with
  Microsoft Presidio recognizers and a spaCy model. Each PII tag holds a list of recognizers that administrators
  can change; the default list, seeded from piiTagsWithRecognizers.json, covers card numbers, IBAN, email,
  IP addresses, phone numbers, person names and national identifiers of the US, UK, Spain, Italy, Poland,
  Singapore, Australia, India and Finland.
website: https://docs.open-metadata.org/latest/how-to-guides/data-governance/classification/auto-classification/auto-pii-tagging
