id: hexcolor
name: sRGB color hex triplet (hex color)
status: stable
doc: 'Color written as a hexadecimal sRGB triplet, for example #1F5FBF.'
semantic_type: color
langs:
- common
regexp: ^#?(?:[0-9A-Fa-f]{3}){1,2}$
examples:
- value: '#1F5FBF'
  description: 'six hex digits with a leading #'
- value: FF8800
  description: 'six hex digits without #'
- value: '#FFF'
  description: short three-digit form
mappings:
  autotype: hexcolor
  wikidata: P465
links:
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P465
translations:
  ru:
    name: Цвет в шестнадцатеричной кодировке
    doc: Цвет sRGB в шестнадцатеричной кодировке
