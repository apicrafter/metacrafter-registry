id: planetscale_token
name: PlanetScale API token
status: draft
doc: 'Token for the PlanetScale API and CLI: a service token starts with pscale_tkn_ and an OAuth token
  with pscale_oauth_. Secret scanners expect 32 to 64 letters, digits and the characters _ = . - after
  the prefix. Database passwords are a separate type (planetscale_password).'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^pscale_(?:tkn|oauth)_[A-Za-z0-9_=.-]{32,64}$
examples:
- value: pscale_tkn_ExampleTokenNotReal
  valid: false
  description: Too short
links:
- type: doc
  url: https://planetscale.com/docs/api/service-tokens
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/planetscale/planetscale.go
