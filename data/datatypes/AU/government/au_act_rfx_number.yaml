id: au_act_rfx_number
name: ACT Government procurement (RFx) number
status: draft
doc: Number that ACT Government procurement gives a request for tender, quote or expression of interest
  (an RFx) published through Tenders ACT, and that the ACT contracts register repeats. Since about 2019
  the number is five digits, the kind of request and three digits (50019-RFT-006, 30874-RFQ-110, 81492-REOI-001;
  RFT request for tender, RFQ request for quote, REOI request for expression of interest, RFP request
  for proposal), sometimes after an agency acronym (GGS456-RFT-003, JACS437-REOI-001). Older numbers are
  a file number with sequence parts (31106.110, 2014.22462.300, 2018.29133.110.011) or a prefix and digits
  (GS001025.110, SL170497, ACT31092.110, VC.2019.100).
parent: id
categories:
- government
- finances
country:
- AU
langs:
- common
is_pii: false
classification: identifier
regexp: '^(?:\d{5}-(?:RFT|RFQ|REOI|EOI|NCT|RFP|RFI|PTC)-\d{3}(?:-\d{2})?|[A-Z]{2,6}\d{1,3}-(?:RFT|RFQ|REOI|EOI|NCT|RFP)-\d{3}|(?:\d{4}\.)?\d{4,6}(?:\.\d{1,4}){1,4}(?:
  ?LRS\d?)?|(?:GS|SL|L|ACT|HR|EP) ?\d{4,7}(?:\.\d{2,3}){0,2}|VC\.\d{4}\.\d{3}|\d{4}-LRS\d{2}-\d{3})$'
examples:
- value: 50019-RFT-006
  description: Tuggeranong and Belconnen bus upgrades, 2020 RFx responses of Tenders ACT
- value: 30303-RFT-001
  description: Materials recovery facility expansion design services
- value: 2014.22462.300
  description: Trade services panel, ACT contracts register
- value: GGS456-REOI-001
  description: agency acronym and the kind of request
- value: GS001025.110
  description: Tenders ACT RFx responses, July to December 2019
- value: 50019-ABC-006
  valid: false
  description: not a kind of request
links:
- type: doc
  url: https://www.tenders.act.gov.au/
translations:
  ru:
    name: Номер закупки правительства ACT (RFx)
