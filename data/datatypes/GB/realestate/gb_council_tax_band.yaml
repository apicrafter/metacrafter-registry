is_pii: false
classification: categorical
regexp: ^[A-I]$
examples:
- value: A
  description: The lowest band
- value: D
  description: The band that council tax rates are quoted for
- value: H
  description: The highest band of England
- value: I
  description: The highest band of Wales
- value: J
  valid: false
  description: No such band
