id: gb_srs_identifier
name: UK Supplier Registration Service identifier
status: draft
doc: 'Identifier that the UK Government Supplier Registration Service (Crown Commercial Service) gives
  to a registered organisation: a domain, a slash and a unique string. ORG-ID.guide lists the register
  as GB-SRS; with that prefix an identifier reads GB-SRS-sid4gov.cabinetoffice.gov.uk/tBq37PN7.'
