id: posthog_personal_api_key
name: PostHog personal API key
status: draft
doc: Personal API key of PostHog, which gives access to the private API endpoints of a user's projects.
  PostHog documents the prefix phx_. Project tokens (phc_) are meant to be public and are not this datatype.
  The vendor does not document the length or the characters after the prefix; the regexp accepts letters
  and digits.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^phx_[A-Za-z0-9]+$
examples:
- value: phx_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://posthog.com/docs/api
