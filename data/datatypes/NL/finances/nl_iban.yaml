id: nl_iban
name: Dutch IBAN
status: draft
doc: 'International Bank Account Number of a bank account in the Netherlands: 18 characters, NL, two IBAN
  check digits, the four-letter bank code and the ten-digit account number. The bank code is always the
  first four letters of the BIC of the bank, as in ABNA for ABN AMRO. Betaalvereniging Nederland is the
  registration authority and publishes the list of bank codes. It is printed in groups of four, as in
  NL91 ABNA 0417 1643 00.'
parent: iban
categories:
- finances
country:
- NL
langs:
- common
is_pii: false
classification: identifier
regexp: '^NL\d{2} ?[A-Z]{4}(?: ?\d{4}){2} ?\d{2}$'
checksum: iban_mod97
examples:
