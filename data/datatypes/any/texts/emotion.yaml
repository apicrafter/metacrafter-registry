id: emotion
name: Emotion (category)
status: draft
doc: 'Emotion that a text, a voice recording or a face expresses, as emotion classifiers and lexicons
  label it: the six basic emotions of Paul Ekman (anger, disgust, fear, happiness, sadness, surprise),
  the eight primary emotions of the wheel of Robert Plutchik (joy, trust, fear, surprise, sadness, disgust,
  anger, anticipation), which the NRC Emotion Lexicon uses, and often a neutral class. Tables of tweets,
  reviews and survey answers count or average them. The polarity of a text (positive, negative, neutral)
  is sentiment.'
