id: cpid
name: Component/Part Identifier (CPID)
status: draft
doc: GS1 identification key for a type of component or part, used mainly in the automotive industry. It
  is a GS1 Company Prefix followed by a component/part reference, up to 30 characters of GS1 character
  set 39 (digits, capital letters, '#', '-' and '/'); the first four characters are digits because the
  shortest GS1 Company Prefix has four. In barcodes it is carried by Application Identifier (8010), and
  (8011) adds the serial number of one part; the element strings are the patterns gs1_ai_8010 and gs1_ai_8011.
categories:
- gs1
- objectids
- industry
langs:
- common
is_pii: false
classification: identifier
regexp: ^\d{4}[A-Z0-9/#-]{1,26}$
examples:
- value: 9528765PART-12A/7
  description: Synthetic value with the GS1 demonstration prefix 952 and a part reference
- value: 9528765B-77/2#1
  description: Synthetic value with the GS1 demonstration prefix 952; part reference with '-', '/' and
    '#'
- value: 9528765part-12a
  valid: false
  description: Lower-case letters are not in GS1 character set 39
links:
- type: doc
  url: https://ref.gs1.org/ai/8010
- type: doc
  url: https://ref.gs1.org/standards/genspecs/
