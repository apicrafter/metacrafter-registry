id: cf_phone
name: Central African Republic phone number (E.164)
status: draft
doc: 'Phone number of Central African Republic in international E.164 form: a plus sign, the country calling
  code +236 and the national number, with no spaces. The regexp follows the national number pattern of
  Google libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens
  are not covered.'
semantic_type: phone
country:
- CF
langs:
- common
regexp: ^\+236(?:8776\d{4}|(?:[27]\d|61)\d{6})$
examples:
- value: '+23621612345'
  description: Example number from Google libphonenumber (fixed line)
- value: '+23670012345'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
