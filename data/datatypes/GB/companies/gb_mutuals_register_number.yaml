id: gb_mutuals_register_number
name: UK Mutuals Public Register number
status: draft
doc: Registration number of a mutual society, such as a co-operative, a community benefit society or a
  credit union, in the Mutuals Public Register of the Financial Conduct Authority. ORG-ID.guide lists
  the register as GB-MPR; with that prefix an identifier reads GB-MPR-235C.
