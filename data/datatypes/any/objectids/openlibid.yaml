id: openlibid
name: Open Library ID
status: stable
doc: 'Identifier of a record in Open Library, the book catalogue of the Internet Archive: OL, a number
  and a letter for the record type - W for a work, M for an edition (manifestation) and A for an author.'
categories:
- objectids
- publishing
langs:
- common
is_pii: false
classification: identifier
regexp: ^OL[1-9]\d*[AMW]$
examples:
- value: OL36858W
  description: Twenty Years After
- value: OL3156833A
  description: Anton Chekhov
- value: OL6917238M
  description: Edition record (Wikidata example)
- value: OL36858
  valid: false
  description: The type letter is missing
mappings:
  wikidata: P648
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Open_Library
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P648
- type: doc
  url: https://openlibrary.org/developers/api
translations:
  ru:
    name: Идентификатор Open Library
    doc: Идентификатор произведения (W), издания (M) или автора (A) в каталоге Open Library.
