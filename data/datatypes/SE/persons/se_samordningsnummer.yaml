id: se_samordningsnummer
name: Swedish coordination number (samordningsnummer)
status: draft
doc: 'Identity number that the Swedish Tax Agency (Skatteverket) assigns to people who are not or have
  not been registered as residents in Sweden. It has the same ten-digit structure as the personnummer:
  the birth date as YYMMDD with 60 added to the day, a three-digit individual number whose last digit
  is odd for men and even for women, and a Luhn check digit. The regexp accepts the number with or without
  the hyphen.'
categories:
- pii
- persons
country:
- SE
langs:
- sv
is_pii: true
classification: identifier
regexp: ^[0-9]{2}(?:0[1-9]|1[0-2])(?:6[1-9]|[78][0-9]|9[01])-?[0-9]{4}$
checksum: luhn
examples:
- value: 701063-2391
  description: Example from the Skatteverket page on coordination numbers
- value: '7010632391'
  description: The same number without the hyphen
- value: '701063'
  valid: false
  description: Birth date part only
mappings:
  dpv: pd:OfficialID
links:
- type: doc
  url: https://skatteverket.se/privat/folkbokforing/samordningsnummer
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Personal_identity_number_(Sweden)
