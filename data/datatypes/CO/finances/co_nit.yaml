id: co_nit
name: Colombian tax identification number (NIT)
status: draft
doc: Número de Identificación Tributaria, the tax number of businesses and other taxpayers in Colombia,
  also called the RUT number (Registro Único Tributario). It has 7 to 15 digits and a check digit, and
  is often written with dots and a hyphen before the check digit.
categories:
- finances
country:
- CO
langs:
- es
is_pii: true
classification: identifier
regexp: ^\d{1,3}(?:\.?\d{3}){2,4}-?\d$
checksum: co_nit
examples:
- value: '8253396981'
  description: Synthetic number with a valid check digit
- value: '9060174050'
  description: Synthetic number with a valid check digit
- value: 825.339.698-1
  description: The first example in its printed form
- value: '8253396980'
  valid: false
  description: Check digit does not match
links:
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.co.nit.html
- type: other
  url: https://docs.dataprep.ai/user_guide/clean/clean_co_nit.html
translations:
  es:
    name: Número de Identificación Tributaria (NIT)
