id: timespan
name: Timespan
status: stable
doc: 'The TimeSpan structure represents a length of time (duration of time or elapsed time), and may be
  expressed as start/end, start/duration, or duration/end. Start, end, and duration are documented using
  the designated DateTime structures. Examples: start/end 2018-02-22T13:0'
