id: what3words
name: What3Words
status: stable
doc: What3words is a proprietary geocode system designed to identify any location with a resolution of
  about 3 metres (9.8 ft). It is owned by What3words Limited, based in London, England.
categories:
- geo
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:///)?[^\W\d_]+\.[^\W\d_]+\.[^\W\d_]+$
