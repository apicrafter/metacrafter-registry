name: Argentine ANPCyT fund
status: draft
doc: 'Fund of the Agencia Nacional de Promoción Científica y Tecnológica (ANPCyT, now Agencia I+D+i) of
  Argentina that finances a project: FONCYT (Fondo para la Investigación Científica y Tecnológica, research
  projects such as PICT), FONTAR (Fondo Tecnológico Argentino, innovation in companies), FONSOFT (Fondo
  Fiduciario de Promoción de la Industria del Software) and FONARSEC (Fondo Argentino Sectorial). The
  SICYTAR projects list gives it as fondo_anpcyt.'
