id: azure_cache_redis_key
name: Azure Cache for Redis access key
status: draft
doc: Access key of Azure Cache for Redis, used as the password in Redis connection strings. Keys in the
  identifiable format are 44 Base64 characters ending in = with the signature AzCa at positions 34 to
  37. Older keys have no signature and are not covered. The regexp follows the pattern of the Microsoft
  security-utilities library; Microsoft Purview describes the same key.
parent: symmetric_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z0-9+/]{33}AzCa[A-P][A-Za-z0-9+/]{5}=$
mappings:
  purview:
  - Azure Redis cache connection string password
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-azure-redis-cache-connection-string-password
- type: other
  url: https://github.com/microsoft/security-utilities/blob/main/GeneratedRegexPatterns/PreciselyClassifiedSecurityKeys.json
