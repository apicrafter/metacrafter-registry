id: nz_company_number
name: New Zealand Companies Office number
status: draft
doc: Number that the New Zealand Companies Office gives a company, an incorporated society or a charitable
  trust board in its registers. The Charities Register gives it as CompaniesOfficeNumber, with N/A or
  - for charities that are not on a Companies Office register.
parent: id
categories:
- companies
country:
- NZ
langs:
- en
is_pii: false
classification: identifier
regexp: ^\d{1,8}$
