translations:
  cs:
    name: Rodné číslo
    doc: Datum narození ve tvaru RRMMDD (u žen měsíc + 50, od roku 2004 případně + 20) a za lomítkem tři
      nebo čtyři číslice; desetimístné rodné číslo je dělitelné jedenácti.
  ru:
    name: Персональный номер Чехии (rodné číslo)
    doc: Дата рождения в виде ГГММДД (у женщин к месяцу прибавляется 50, с 2004 года иногда ещё 20) и
      после косой черты три или четыре цифры; десятизначный номер делится на 11.
