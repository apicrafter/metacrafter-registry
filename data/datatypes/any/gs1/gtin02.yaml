id: gtin02
name: Global Trade Item Number (GTIN) of contained trade items
status: stable
doc: The Global Trade Item Number (GTIN) is an identifier for trade items, developed by the international
  organization GS1.Such identifiers are used to look up product information in a database (often by entering
  the number through a barcode scanner pointed at an actual product) which may belong to a retailer, manufacturer,
  collector, researcher, or other entity. The uniqueness and universality of the identifier is useful
  in establishing which product in one database corresponds to which product in another database, especially
  across organizational boundaries.
categories:
- industry
- objectids
- gs1
langs:
- common
is_pii: false
classification: identifier
regexp: ^02(d{14})$
