id: github_token
name: GitHub token
status: draft
doc: Token issued by GitHub, such as a personal access token. It starts with a prefix that names the token
  type (ghp_, gho_, ghu_, ghs_ or ghr_) followed by 36 letters and digits.
categories:
- secrets
langs:
- common
is_pii: false
regexp: ^gh[pousr]_[A-Za-z0-9]{36}$
mappings:
  purview:
  - GitHub personal access token
  - All Credential Types
  - All credentials
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-github-personal-access-token
- type: doc
  url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github
