id: review_text
name: Review text
status: draft
doc: Text of a review of a product, service, place, book, film or app, written by a customer, user or
  critic. It usually comes with a rating, an author and a date. Field names are review, review_text, review_body
  and feedback. Schema.org calls it reviewBody.
