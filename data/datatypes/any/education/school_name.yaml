doc: Name of a school as a table of schools, pupils or school results writes it (Abbey Park Academy, St
  Malachy's Catholic Primary School). It is a free name, not a code; the registers of each country identify
  the school by a number, such as the URN of England (ukurn) or the UAI of France (fr_uai).
