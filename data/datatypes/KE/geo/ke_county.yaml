id: ke_county
name: Kenyan county
status: draft
doc: Name of one of the 47 counties of Kenya, the first-level divisions created by the 2010 Constitution,
  such as Mombasa, Tana River, Taita Taveta, Elgeyo Marakwet or Nairobi City. Tables of the Kenya National
  Bureau of Statistics and of the Council of Governors write them with spaces, hyphens or slashes (Taita/Taveta,
  Tharaka-Nithi, Murang'a, Muranga) and sometimes with the word County or City; the old provinces (Coast,
  Rift Valley) are not counties.
