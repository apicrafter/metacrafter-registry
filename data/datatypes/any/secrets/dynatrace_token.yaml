id: dynatrace_token
name: Dynatrace token
status: draft
doc: 'Access token of Dynatrace in the format used since Dynatrace version 1.210: a prefix that names
  the token type (dt0 followed by a letter and two digits, such as dt0c01 or dt0s01), a 24-character public
  part and a 64-character secret part, separated by dots and written in uppercase letters and digits.
  The prefix and the public part form the token identifier, which may appear in logs; the secret part
  must not.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^dt0[a-zA-Z][0-9]{2}\.[A-Z0-9]{24}\.[A-Z0-9]{64}$
examples:
- value: dt0s01.ST2EY72KQINMH574WMNVI7YN
  valid: false
  description: Token identifier only, without the secret part
links:
- type: doc
  url: https://docs.dynatrace.com/docs/manage/identity-access-management-classic/access-tokens-and-oauth-clients/access-tokens
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
