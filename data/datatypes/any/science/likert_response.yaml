id: likert_response
name: Answer on a rating scale (Likert item)
status: draft
doc: 'Answer of a questionnaire item on an ordered scale, written in words: agreement (Strongly agree
  to Strongly disagree, Totalmente de acuerdo to Totalmente en desacuerdo, Stimme voll zu), likelihood
  (Extremadamente probable, Very unlikely), frequency (Never, Sometimes, Always; Nunca, A veces, Siempre),
  importance, satisfaction or interest, often with a neutral answer and a don''t know answer (Neutral,
  No sé). Survey tools export one column per item; coded answers (1 to 5) need the codebook and are not
  this type.'
parent: category
categories:
