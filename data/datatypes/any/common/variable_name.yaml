id: variable_name
name: Variable name (name of a data field)
status: draft
doc: 'Name of a variable or field of a dataset as a codebook, a data dictionary, a variable list or a
  table in the long format lists it: a short token without spaces such as f1, SEX_2016, Q28_1 or v2x_polyarchy,
  in the spelling of the data file. The variable info exports of Dataverse (variable, value, label) and
  DDI codebooks give one row per variable or per value label. Not the label that describes the variable
  (description).'
categories:
- common
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z_@#$][A-Za-z0-9_.@#$]{0,127}$
examples:
- value: SEX_2016
  description: Sex of the respondent (Social Survey Austria 2016)
- value: f11_10
  description: Item 10 of question 11
- value: v2x_polyarchy
  description: Electoral democracy index of V-Dem
- value: Q28_1
  description: First item of question 28
- value: Wie zufrieden sind Sie?
  valid: false
  description: A variable label, not a name
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Data_dictionary
translations:
  de:
    name: Variablenname
