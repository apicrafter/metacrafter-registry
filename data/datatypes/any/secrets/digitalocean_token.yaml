id: digitalocean_token
name: DigitalOcean API token
status: draft
doc: 'API token of DigitalOcean. The prefix tells the token type: dop_v1_ for a personal access token,
  doo_v1_ for an OAuth access token and dor_v1_ for an OAuth refresh token. 64 hexadecimal digits follow.
  The API takes the token in a bearer Authorization header.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^do[opr]_v1_[a-f0-9]{64}$
examples:
- value: dop_v1_ExampleTokenNotReal
  valid: false
  description: Not hexadecimal and too short
links:
- type: doc
  url: https://docs.digitalocean.com/reference/api/create-personal-access-token/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/digitaloceanv2/digitaloceanv2.go
