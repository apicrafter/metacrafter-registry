id: bg_vat
name: Bulgarian VAT number
status: draft
doc: Идентификационен номер по ДДС, the VAT identification number in Bulgaria. Legal entities have nine
  digits; natural persons, foreigners and others have ten digits. Each kind of number has its own check
  digit algorithm.
parent: vatin
categories:
- finances
country:
- BG
langs:
- bg
is_pii: true
classification: identifier
regexp: ^(?:BG[ -]?)?\d{9,10}$
examples:
- value: BG 6114314233
  description: Synthetic number with a valid check digit
- value: BG-2975537765
  description: Synthetic number with a valid check digit
- value: '61143142337'
  valid: false
  description: One character too many
links:
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.bg.vat.html
- type: other
  url: https://docs.dataprep.ai/user_guide/clean/clean_bg_vat.html
translations:
  bg:
    name: Идентификационен номер по ДДС
