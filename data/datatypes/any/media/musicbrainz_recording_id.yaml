id: musicbrainz_recording_id
name: MusicBrainz recording ID
status: draft
doc: 'MBID of a recording in MusicBrainz: one recorded performance or mix of a work, which may appear
  on many releases, as in musicbrainz.org/recording/<id>. A recording can also have an ISRC (isrc).'
parent: musicbrainz_id
categories:
- media
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
examples:
- value: e0218f3e-993a-4f4e-ae3e-626330dea13d
  description: Alone (recording)
- value: B10BBBFC-CF9E-42E0-BE17-E2C3E1D2600D
  valid: false
  description: Upper case; MusicBrainz writes MBIDs in lower case
mappings:
  wikidata: P4404
links:
- type: doc
  url: https://musicbrainz.org/doc/Recording
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P4404
translations:
  ru:
    name: Идентификатор записи в MusicBrainz
