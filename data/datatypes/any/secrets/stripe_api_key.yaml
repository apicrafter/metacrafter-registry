id: stripe_api_key
name: Stripe secret or restricted API key
status: draft
doc: Server-side API key of Stripe. Secret keys start with sk_ and restricted keys with rk_, followed
  by test_ for a sandbox or live_ for live mode. Publishable keys (pk_) are meant to be public and are
  not covered.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:sk|rk)_(?:test|live)_[0-9A-Za-z]{10,99}$
examples:
- value: pk_test_ExampleKeyExampleKeyExam
  valid: false
  description: Publishable key
links:
- type: doc
  url: https://docs.stripe.com/keys
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
