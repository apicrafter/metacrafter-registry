id: vehicle_type
name: Vehicle type
status: draft
doc: 'Kind of road vehicle or self-propelled machine by its body or use: car, pickup, van, truck, bus,
  motorcycle, tractor, grader, ambulance; in Spanish automóvil, camioneta, pick up, furgón, camión, colectivo,
  motocicleta, tractor, motoniveladora, retroexcavadora. Fleet lists, vehicle registers and road crash
  data give it beside the plate, the make and the model. The way of transport of a trip or a route (bus,
  rail, ferry) is transport_mode; the type approval categories of the UNECE (M1, N2) are codes, not names.'
