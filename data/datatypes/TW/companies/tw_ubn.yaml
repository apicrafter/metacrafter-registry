id: tw_ubn
name: Taiwanese unified business number (UBN)
status: draft
doc: 'Unified Business Number (統一編號), the eight-digit number of a business in Taiwan, used for tax (VAT)
  purposes. Wikidata calls it the GUI number assigned by the Ministry of Economic Affairs, whose business
  register (findbiz) can be searched by it. The last digit is a check digit: the digits are multiplied
  by 1, 2, 1, 2, 1, 2, 4 and 1, and the digit sum of the products must end in 0, or in 9 when the seventh
  digit is 7.'
categories:
- companies
- finances
country:
- TW
langs:
- zh
is_pii: false
classification: identifier
regexp: ^\d{8}$
