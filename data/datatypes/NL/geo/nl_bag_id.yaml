    doc: Zestiencijferige identificatie van een BAG-object - gemeentecode, objecttypecode en volgnummer.
  ru:
    name: Идентификатор объекта BAG (Нидерланды)
    doc: Шестнадцатизначный идентификатор объекта в реестре адресов и зданий BAG - код муниципалитета,
      код типа объекта и порядковый номер.
