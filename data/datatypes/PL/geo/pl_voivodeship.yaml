id: pl_voivodeship
name: Polish voivodeship
status: draft
doc: 'Name of one of the 16 voivodeships (województwa) of Poland since 1999, as Polish tables write it:
  the adjective in small letters (mazowieckie, warmińsko-mazurskie), capitalised or in capitals (ŚLĄSKIE).
  Statistics of the health, education and statistical offices give the voivodeship of a row this way,
  in a column named województwo. Their two-digit TERYT codes are part of pl_teryt_terc.'
