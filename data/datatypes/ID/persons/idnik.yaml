id: idnik
name: Indonesian NIK
status: stable
doc: 'Nomor Induk Kependudukan (NIK), the population identification number of Indonesia: 16 digits. The
  first six identify the province, city or regency and district of residence when the number was issued,
  the next six the date of birth as DDMMYY (40 is added to the day for women), and the last four make
  the number unique.'
categories:
- pii
- persons
country:
- ID
langs:
- id
is_pii: true
classification: identifier
regexp: ^[0-9]{16}$
examples:
- value: '3171011708450001'
  description: python-stdnum example
- value: '31710117084500'
  valid: false
  description: 14 digits (python-stdnum example)
mappings:
  purview: Indonesia identity card (KTP) number
  dpv: pd:OfficialID
  stdnum: id.nik
links:
