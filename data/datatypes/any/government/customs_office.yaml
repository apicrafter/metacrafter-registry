id: customs_office
name: Customs office
status: draft
doc: Name of the customs office, customs house or customs post that handles a declaration, for example
  the office of entry, exit or clearance. Customs declarations and trade statistics keep it next to the
  port of loading or unloading (port). Customs administrations also give their offices codes; these codes
  are national and are not covered by this record.
