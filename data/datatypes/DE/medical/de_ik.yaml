id: de_ik
name: German institution code (Institutionskennzeichen, IK)
status: draft
doc: 'Institutionskennzeichen (IK), the nine-digit number that identifies health insurers, hospitals,
  care services, pharmacies and other institutions that bill the German social insurance (§ 293 SGB V).
  Two digits classify the kind of institution, two give the state, four are a serial number and the last
  is a check digit: digits 3 to 8 weighted 2 1 2 1 2 1, 9 subtracted from products above 9, and the sum
  modulo 10. The IK of a health insurer is printed on the health card as its insurer number.'
categories:
- medical
- companies
country:
- DE
langs:
- common
