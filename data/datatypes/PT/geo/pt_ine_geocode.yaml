id: pt_ine_geocode
name: Portuguese INE geographic code
status: draft
doc: 'Geographic code of Statistics Portugal (INE) in its data API: the three-character NUTS III code
  followed by the four-digit municipality code (DICO, district and municipality), as in 1D11108.'
categories:
- geo
- government
country:
- PT
langs:
- pt
is_pii: false
classification: identifier
regexp: ^[1-3][A-D0-9]{2}\d{4}$
examples:
- value: 1D11108
  description: Municipality in an INE indicator table
- value: '1108'
  valid: false
  description: DICO alone
links:
- type: doc
  url: https://www.ine.pt/
translations:
  pt:
    name: Código geográfico do INE
