id: de_stadtbezirk
name: German city district (Stadtbezirk)
status: draft
doc: 'Name or number of a Stadtbezirk, the administrative district of a large German city, with its own
  district council in most states: Bad Godesberg, Beuel and Hardtberg in Bonn, Rodenkirchen and Lindenthal
  in Cologne, Stadtbezirk 1 to 10 in Düsseldorf. Tables give the name, the number (1, 03) or both (2 /
  Rodenkirchen) in columns named Stadtbezirk or Bezirk. The smaller Stadtteil is de_stadtteil.'
