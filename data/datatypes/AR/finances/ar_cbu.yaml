id: ar_cbu
name: Argentine uniform bank account code (CBU)
status: draft
doc: Clave Bancaria Uniforme, the 22-digit code that identifies a customer account at a bank in Argentina.
  The first block holds a 3-digit bank code, a 4-digit branch code and a check digit; the second block
  holds a 13-digit account number and another check digit.
parent: bankaccount
