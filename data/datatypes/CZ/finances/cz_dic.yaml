  url: https://financnisprava.gov.cz/assets/cs/prilohy/d-sprava-dani-a-poplatku/79651_20_MP_ke_zmene_DIC_na_zadost_subjektu.pdf
- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.cz.dic.html
- type: other
