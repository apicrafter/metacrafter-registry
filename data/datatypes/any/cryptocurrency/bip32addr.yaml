name: BIP-32 key
status: stable
doc: The BIP-32 mainly describes the way of building the hierarchical deterministic wallet basing on the
  BIP-39 features. What does it mean? BIP-32 is exactly explaining how the bitcoin master private key
  and the master chain code is being created from delivered by BIP-39 bitcoin seed. The bitcoin seed generated
  by BIP-39 is the base for generating deterministic and hierarchical deterministic wallets.
