id: fr_fantoir
name: French FANTOIR street identifier
status: draft
doc: 'Identifier of a street, locality (lieu-dit), housing estate or pseudo-street in FANTOIR, the file
  of streets and localities of the French tax administration (DGFiP), which TOPO replaced in July 2023.
  It has ten characters and a check letter: the department and direction code (3 characters, such as 450,
  2A0, 754 or 971), the INSEE code of the commune within the department (3 digits), the RIVOLI code of
  the street (4 characters) and the RIVOLI key, as in 450 002 3086 F. The first character of the RIVOLI
  code tells the kind of way: a digit for a street, A for a housing estate or condominium, B to W for
  a locality (lieu-dit), X for a pseudo-street such as a canal or a metro station, Y or Z for a provisional
  street.'
categories:
- geo
country:
- FR
langs:
- fr
is_pii: false
classification: identifier
regexp: ^\d[\dAB]\d ?\d{3} ?[\dA-Z]{4} ?[A-Z]$
