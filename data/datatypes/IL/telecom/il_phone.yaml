id: il_phone
name: Israel phone number (E.164)
status: draft
doc: 'Phone number of Israel in international E.164 form: a plus sign, the country calling code +972 and
  the national number, with no spaces. The regexp follows the national number pattern of Google libphonenumber.
  National formats with a trunk prefix and numbers written with spaces or hyphens are not covered.'
semantic_type: phone
country:
- IL
langs:
- common
regexp: ^\+972(?:1\d{6}(?:\d{3,5})?|[57]\d{8}|[1-489]\d{7})$
examples:
- value: '+97221234567'
  description: Example number from Google libphonenumber (fixed line)
- value: '+972502345678'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
