translations:
  it:
    name: Partita IVA
    doc: Numero di 11 cifre attribuito dall'Agenzia delle Entrate - sette cifre di matricola, il codice
      dell'ufficio e una cifra di controllo; per le società coincide con il codice fiscale.
  ru:
    name: Номер плательщика НДС Италии (partita IVA)
    doc: Номер из 11 цифр, который присваивает Agenzia delle Entrate - семь цифр номера налогоплательщика,
      трёхзначный код налоговой инспекции и контрольная цифра по алгоритму Луна; у юридических лиц совпадает
      с налоговым кодом.
