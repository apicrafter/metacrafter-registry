id: aws_arn
name: Amazon Resource Name (ARN)
status: draft
doc: 'Identifier of an AWS resource, used in IAM policies, tags and API calls: arn, the partition (aws,
  aws-cn, aws-us-gov and others), the service namespace, the Region, the 12-digit account ID and the resource,
  separated by colons. Some resources omit the Region, the account ID or both, and the resource part may
  contain a type, a path and, in policies, wildcards. AWS does not consider ARNs secret.'
categories:
- identifiers
langs:
- common
is_pii: false
classification: identifier
regexp: ^arn:aws(?:-[a-z]+)*:[a-z0-9-]+:[a-z0-9-]*:(?:[0-9]{12}|aws)?:\S+$
examples:
- value: arn:aws:iam::aws:contextProvider/IdentityCenter
  description: ARN of the IAM Identity Center context provider from the AWS documentation
- value: arn:aws:s3:::amzn-s3-demo-bucket/Development/*
  description: ARN of S3 objects under a prefix from the AWS documentation
- value: arn:aws:iam
  valid: false
  description: Fewer than six fields
links:
- type: doc
  url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html
- type: doc
  url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
