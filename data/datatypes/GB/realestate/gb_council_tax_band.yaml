id: gb_council_tax_band
name: Council tax band
status: draft
doc: Valuation band of a dwelling for council tax, a letter. England has eight bands, A (up to 40,000
  pounds at the values of 1 April 1991) to H (more than 320,000 pounds); Wales has nine, A to I, at the
  values of 1 April 2003. The Valuation Office assesses the dwellings of England and Wales. Council tables
  of dwellings and of empty homes give the band in a Council Tax Band column.
parent: category
