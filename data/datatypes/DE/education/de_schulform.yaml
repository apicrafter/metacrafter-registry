id: de_schulform
name: German school type (Schulform)
status: draft
doc: 'Type of a school in the German school system: Grundschule, Hauptschule, Realschule, Gymnasium, Gesamtschule,
  Sekundarschule, Förderschule, Berufskolleg, Weiterbildungskolleg, Freie Waldorfschule. The types and
  their names differ between the states (Oberschule, Gemeinschaftsschule, Stadtteilschule). School registers
  of cities give it in columns named Schulform or Schulart, often with the school authority in front (Städt.
  Gymnasium, Städt. Katholische Grundschule) or as an abbreviation of the state (G, GY, GE, BK).'
