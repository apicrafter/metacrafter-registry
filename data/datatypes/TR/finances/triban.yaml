id: triban
name: Turkish IBAN
status: stable
doc: 'International Bank Account Number of a bank account in Turkey. It has 26 characters: the country
  code, two IBAN check digits and a five-digit bank code, a reserved digit and a 16-character account
  number, as defined in the SWIFT IBAN registry.'
