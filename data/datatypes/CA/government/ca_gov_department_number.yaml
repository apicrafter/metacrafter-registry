doc: Number that the Receiver General gives to a federal department or agency of Canada that may use the
  Consolidated Revenue Fund, as published in the list of legal department names. ORG-ID.guide lists the
  register as CA-GOV; with that prefix an identifier reads CA-GOV-001.
