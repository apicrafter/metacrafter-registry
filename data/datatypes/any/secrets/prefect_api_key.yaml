id: prefect_api_key
name: Prefect Cloud API key
status: draft
doc: 'API key of Prefect Cloud, used by workers and the Prefect client. Prefect does not publish the format;
  the regexp follows the gitleaks rule: pnu_ and 36 letters and digits.'
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^pnu_[A-Za-z0-9]{36}$
examples:
- value: pnu_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://www.prefect.io/docs/v3/how-to-guides/cloud/manage-users/api-keys
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
