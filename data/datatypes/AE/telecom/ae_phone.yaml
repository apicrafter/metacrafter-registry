id: ae_phone
name: United Arab Emirates phone number (E.164)
status: draft
doc: 'Phone number of United Arab Emirates in international E.164 form: a plus sign, the country calling
  code +971 and the national number, with no spaces. The regexp follows the national number pattern of
  Google libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens
  are not covered.'
semantic_type: phone
country:
- AE
langs:
- common
regexp: ^\+971(?:(?:[4-7]\d|9[0-689])\d{7}|800\d{2,9}|[2-4679]\d{7})$
examples:
- value: '+97122345678'
  description: Example number from Google libphonenumber (fixed line)
- value: '+971501234567'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
