country:
- US
- CA
langs:
- en
is_pii: false
classification: identifier
regexp: ^[A-Z]{2,4}$
examples:
- value: LAL
  description: Los Angeles Lakers
- value: GSW
  description: Golden State Warriors
- value: NYK
  description: New York Knicks
- value: SAS
  description: San Antonio Spurs
