id: countrycode_alpha3
name: ISO 3166-1 Alpha3 country code
status: stable
doc: ISO 3166-1 alpha-3 codes are three-letter country codes defined in ISO 3166-1, part of the ISO 3166
  standard published by the International Organization for Standardization (ISO), to represent countries,
  dependent territories, and special areas of geographical interest.
semantic_type: country
langs:
- common
regexp: '[A-Z]{3}'
examples:
- value: RUS
  description: Russia
- value: DEU
  description: Germany
mappings:
  wikidata: P298
  fta: COUNTRY.ISO-3166-3
links:
