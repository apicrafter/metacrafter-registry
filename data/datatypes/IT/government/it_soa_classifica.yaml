id: it_soa_classifica
name: Italian public works qualification class (classifica SOA)
status: draft
doc: 'Class of an SOA attestation of an Italian contractor of public works: a Roman numeral from I to
  VIII that caps the value of the works the contractor may take in a category, from 258 000 euros for
  class I to more than 15.5 million for class VIII. Two intermediate classes are III-bis and IV-bis, which
  registers also write IIIB and IVB.'
parent: category
categories:
- government
- industry
country:
- IT
langs:
- common
is_pii: false
classification: categorical
regexp: ^(?:I{1,3}|IV|V|VI{1,3}|(?:III|IV)(?:[ -]?[Bb][Ii][Ss]|B))$
examples:
- value: III
- value: VIII
  description: Works above 15 493 706.97 euros
- value: III-bis
  description: Up to 1 500 000 euros
- value: IVB
  description: IV-bis, as contract registers of the transport ministry write it
- value: IX
  valid: false
  description: The highest class is VIII
links:
- type: wikipedia
  url: https://it.wikipedia.org/wiki/Attestazione_SOA
translations:
  it:
    name: Classifica SOA
  ru:
    name: Класс квалификации подрядчика общественных работ Италии (SOA)
