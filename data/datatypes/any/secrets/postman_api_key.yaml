id: postman_api_key
name: Postman API key
status: draft
doc: 'API key of the Postman API, sent in the X-API-Key header: PMAK- followed by 24 hexadecimal digits,
  a hyphen and 34 more hexadecimal digits.'
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^PMAK-[0-9a-fA-F]{24}-[0-9a-fA-F]{34}$
examples:
- value: PMAK-ExampleKeyNotReal
  valid: false
  description: Not hexadecimal and too short
links:
- type: doc
  url: https://learning.postman.com/docs/reference/postman-api/authentication/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
- type: other
  url: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/postman/postman.go
