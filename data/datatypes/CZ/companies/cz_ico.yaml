id: cz_ico
name: Czech business identification number (IČO)
status: draft
doc: Identifikační číslo osoby (IČO), the 8-digit identification number of a company, public body or other
  organisation in the Czech registers of economic subjects (ARES). ORG-ID.guide lists the register as
  CZ-ICO; with that prefix an identifier reads CZ-ICO-28179609.
