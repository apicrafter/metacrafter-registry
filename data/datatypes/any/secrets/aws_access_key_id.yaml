id: aws_access_key_id
name: AWS access key ID
status: draft
doc: 'Public half of an Amazon Web Services access key pair, sent with every signed API request together
  with the secret access key. It has 20 characters: the prefix AKIA for a long-term key of an IAM user
  or the root user, or ASIA for a temporary key issued by AWS STS, then 16 uppercase letters and digits.'
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:AKIA|ASIA)[A-Z2-7]{16}$
examples:
- value: AKIAIOSFODNN7EXAMPLE
  description: Example key ID from the AWS IAM documentation
- value: AIDACKCEVSQ6C2EXAMPLE
  valid: false
  description: Unique ID of an IAM user (prefix AIDA), not an access key
links:
- type: doc
  url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html#identifiers-prefixes
- type: doc
  url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
