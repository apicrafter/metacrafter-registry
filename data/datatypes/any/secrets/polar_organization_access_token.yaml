id: polar_organization_access_token
name: Polar organization access token
status: draft
doc: Organization access token of the Polar (polar.sh) API. The Polar API reference shows these tokens
  with the prefix polar_oat_ in the Authorization header. The vendor does not document the length or the
  characters after the prefix; the regexp accepts letters and digits.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^polar_oat_[A-Za-z0-9]+$
examples:
- value: polar_oat_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://polar.sh/docs/api-reference/introduction
