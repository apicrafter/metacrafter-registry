id: gb_usrn
name: Unique Street Reference Number (USRN)
status: draft
doc: Eight-digit number that identifies a street in Great Britain. GeoPlace allocates ranges of numbers
  to the local authorities, which hold the statutory responsibility for the streets of the National Street
  Gazetteer of England and Wales; the Improvement Service manages the numbers of Scotland. Council tables
  of streets, road works and gritting routes give it in a USRN column.
