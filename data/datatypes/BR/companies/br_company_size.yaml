id: br_company_size
name: Size class (porte) of a Brazilian company
status: draft
doc: 'The size class of a company in Brazilian registers and credit statistics: MICRO, PEQUENA, MÉDIA
  and GRANDE in the BNDES classification by gross revenue, or the tax categories ME (microempresa), EPP
  (empresa de pequeno porte), MEI (microempreendedor individual) and DEMAIS of the company register. The
  size classes of municipalities (Pequeno 1, Médio, Metrópole) are not company sizes.'
parent: category
categories:
- companies
country:
- BR
