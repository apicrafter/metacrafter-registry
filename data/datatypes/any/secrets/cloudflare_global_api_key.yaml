id: cloudflare_global_api_key
name: Cloudflare Global API Key
status: draft
doc: Global API Key of a Cloudflare user account, which grants full access to the account. Keys in the
  scannable format start with cfk_, followed by 40 characters and a checksum whose length Cloudflare does
  not state. Older keys are unprefixed strings of 37 to 45 lowercase hexadecimal digits; they look like
  hashes and are not covered by the regexp.
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^cfk_[A-Za-z0-9]{41,}$
examples:
- value: cfk_
  valid: false
  description: Prefix without the key
links:
- type: doc
  url: https://developers.cloudflare.com/fundamentals/api/get-started/token-formats/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
