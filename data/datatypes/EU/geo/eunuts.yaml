id: eunuts
name: NUTS code (EU)
status: stable
doc: European Union geographic code, identifier for a region per NUTS
categories:
- geo
country:
- EU
langs:
- en
is_pii: false
classification: categorical
regexp: ^(?:AT|BE|BG|CY|CZ|DE|DK|EE|EL|ES|FI|FR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK|UK|AL|CH|IS|LI|ME|MK|NO|RS|TR)[A-Z0-9]{0,3}$
examples:
- value: BE10
  description: Brussels-Capital Region
- value: JPEG
  valid: false
  description: JP is not a country prefix used in NUTS
mappings:
  wikidata: P605
  bioregistry: nuts
links:
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P605
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Nomenclature_of_Territorial_Units_for_Statistics
