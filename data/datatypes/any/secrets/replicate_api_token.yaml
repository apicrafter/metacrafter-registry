id: replicate_api_token
name: Replicate API token
status: draft
doc: API token of Replicate. Replicate documents that tokens are 40-character strings that always start
  with r8_; the regexp accepts letters and digits after the prefix.
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^r8_[A-Za-z0-9]{37}$
examples:
- value: r8_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://replicate.com/docs/topics/security/api-tokens
