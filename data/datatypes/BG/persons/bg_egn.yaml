id: bg_egn
name: Bulgarian unified civil number (EGN)
status: draft
doc: Единен граждански номер, the 10-digit personal number of Bulgarian citizens. The first six digits
  encode the date of birth (the month is shifted for births outside the 20th century), the next three
  are a birth order number that also gives the sex, and the last digit is a check digit.
categories:
- pii
- persons
country:
- BG
langs:
- bg
is_pii: true
classification: identifier
regexp: ^\d{10}$
examples:
- value: '2143258377'
  description: Synthetic number with a valid check digit
- value: '2631299974'
  description: Synthetic number with a valid check digit
- value: '21432583777'
  valid: false
  description: One character too many
