id: sports_position
name: Position of a player in a team sport
status: draft
doc: 'Position or role in which a player plays in a team sport, written in full or as the abbreviation
  of the sport: QB, RB, WR and TE in American football; P, C, 1B, SS, CF and DH in baseball; PG, SG, SF,
  PF and C in basketball; goalkeeper, defender, midfielder and forward in association football (Torwart,
  Zagueiro, Portiere in other languages); prop, hooker and flanker in rugby. Rosters, drafts, statistics
  and fantasy league tables carry it next to the player and the team. The same letter means different
  positions in different sports (C is a catcher in baseball and a centre in basketball), and a job position
  in a staff list is a different type (jobtitle).'
