id: frvat
name: TVA intracommunautaire par nom de champ
status: stable
doc: FR datatype for 'TVA intracommunautaire par nom de champ' (frvat) from rules in context 'finances'.
  The French VAT identification number (TVA intracommunautaire, Taxe sur la Valeur Ajoutée) is a unique
  identifier assigned to businesses for VAT purposes within the European Union. It consists of the country
  code 'FR' followed by 11 alphanumeric characters (letters and/or digits).
categories:
- finances
country:
- FR
langs:
- fr
is_pii: true
classification: identifier
regexp: ^FR[0-9A-Z]{11}$
examples:
- value: FR12345678901
  description: French VAT identification number (TVA intracommunautaire) with country code FR and 11 alphanumeric
    characters
- value: FR98765432109
  description: Another valid French VAT identification number format
- value: FRABCDEFGHIJ1
  description: French VAT identification number with letters in the alphanumeric part
mappings:
  fta: IDENTITY.VAT_FR
links:
- type: wikipedia
  url: https://fr.wikipedia.org/wiki/Num%C3%A9ro_d%27identification_%C3%A0_la_TVA_intracommunautaire
- type: doc
  url: https://www.service-public.fr/professionnels-entreprises/vosdroits/F23500
