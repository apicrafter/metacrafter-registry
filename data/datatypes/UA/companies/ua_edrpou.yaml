id: ua_edrpou
name: Ukrainian EDRPOU code
status: draft
doc: Код ЄДРПОУ, the 8-digit identification code of a legal entity in the Unified State Register of Ukraine.
  ORG-ID.guide lists the register as UA-EDR; with that prefix an identifier reads UA-EDR-38422948.
categories:
- companies
country:
- UA
langs:
- uk
is_pii: false
classification: identifier
regexp: ^\d{8}$
