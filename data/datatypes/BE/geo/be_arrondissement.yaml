id: be_arrondissement
name: Belgian administrative arrondissement (name)
status: draft
doc: Name of one of the 43 administrative arrondissements of Belgium, the level between the province and
  the municipality (Charleroi, Halle-Vilvoorde, Tournai-Mouscron, Bruxelles-Capitale). Since 1 January
  2019 the arrondissements of Mouscron and Tournai form Tournai-Mouscron and the arrondissement of La
  Louvière exists. Names are given in French, Dutch or German (Liège, Luik, Lüttich; Courtrai, Kortrijk),
  sometimes with the NIS prefix (62 - LIEGE), and most of them are also the names of their main towns,
  so a value is an arrondissement in a field named after it. Its NIS code ends in 000 (62000 is the arrondissement
  of Liège, be_nis_code). The judicial arrondissements are another division (be_judicial_arrondissement).
