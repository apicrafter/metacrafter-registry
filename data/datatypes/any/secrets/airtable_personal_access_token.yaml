id: airtable_personal_access_token
name: Airtable personal access token
status: draft
doc: 'Personal access token of the Airtable Web API, which replaced the deprecated API keys in February
  2024. Airtable does not publish the format; the regexp follows the gitleaks rule: pat, 14 letters and
  digits, a dot and 64 hexadecimal digits.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^pat[A-Za-z0-9]{14}\.[0-9a-f]{64}$
examples:
- value: pat
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://airtable.com/developers/web/api/authentication
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
