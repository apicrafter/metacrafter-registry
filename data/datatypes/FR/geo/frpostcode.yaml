id: frpostcode
name: French postal code
status: draft
doc: 'Postal code (code postal) in France, including the overseas departments: five digits. Google''s
  address metadata also accepts a space after the first two digits, as in 75 008.'
semantic_type: postindex
categories:
- geo
country:
- FR
langs:
- fr
regexp: ^\d{2} ?\d{3}$
examples:
- value: '75008'
  description: Paris
- value: '97439'
  description: Sainte-Rose
- value: '33380'
- value: '34092'
- value: '7500'
  valid: false
  description: too short
mappings:
  fta: POSTAL_CODE.POSTAL_CODE_FR
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Postal_codes_in_France
- type: other
  url: https://www.wikidata.org/wiki/Q1105640
- type: other
  url: https://chromium-i18n.appspot.com/ssl-address/data/FR
