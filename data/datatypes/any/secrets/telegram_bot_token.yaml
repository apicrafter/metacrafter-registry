id: telegram_bot_token
name: Telegram bot token
status: draft
doc: 'Token that authorizes a bot in the Telegram Bot API: the numeric bot ID, a colon and a secret that
  starts with A. Telegram documents the format only by example, so the regexp accepts the length of the
  documented samples (34 characters after the colon) and the length that the gitleaks secret scanner checks
  (35).'
parent: api_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9]{5,16}:A[A-Za-z0-9_-]{33,34}$
examples:
- value: 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
  description: Sample token from the Telegram Bot API documentation
- value: 4839574812:AAFD39kkdpWt3ywyRZergyOLMaJhac60qc
  description: Sample token from the Telegram bot tutorial
- value: 123456:ABC
  valid: false
  description: Secret part too short
links:
- type: doc
  url: https://core.telegram.org/bots/api#authorizing-your-bot
- type: doc
  url: https://core.telegram.org/bots/tutorial
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
