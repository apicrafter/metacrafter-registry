id: govlicaccount
name: Personal account for government budgets (Russian Treasury)
status: stable
doc: A personal account is an account for use by an individual for that persons own needs. It is a relative
  term to differentiate them from those accounts for business or corporate use. Used by Russian treasury
  for organizations accounts.
categories:
- government
- finances
country:
- RU
langs:
- ru
is_pii: false
classification: identifier
regexp: '[0-9А-Я]{9,11}'
examples:
