id: marketing_channel
name: Marketing channel (channel grouping of web analytics)
status: draft
doc: 'Channel that brought a visit, a lead or a sale, as web analytics tools group traffic: the default
  channel grouping of Google Analytics (Direct, Organic Search, Paid Search, Social, Email, Referral,
  Display, Affiliates, Other Advertising, (Other)) and the similar lists of other tools (Paid Social,
  Organic Social, Video). Dashboards report sessions, conversions and revenue by it. The source and medium
  of a visit (google / organic) are finer fields.'
