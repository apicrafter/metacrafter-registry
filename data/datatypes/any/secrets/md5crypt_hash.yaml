id: md5crypt_hash
name: MD5-crypt password hash
status: draft
doc: 'Password hash of the MD5-based crypt scheme of FreeBSD, in Modular Crypt Format: $1$, a salt of
  up to 8 characters, $ and 22 characters of crypt Base64. It was the default on Linux before SHA-crypt
  and is now considered weak.'
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^\$1\$[^$:\n]{1,8}\$[./0-9A-Za-z]{22}$
examples:
- value: $1$examples$9syBlMva027I.Vd2Z0JGl1
  description: Hash of the word "example" with the salt examples
- value: $6$saltstring$svn8UoSVapNtMuq1ukKS4tPQd8iKwSMHWjl/O817G3uBnIFNjnQJuesI68u4OTLiBFdcbYEdFCoEOfaS35inz1
  valid: false
  description: SHA-512-crypt hash
links:
- type: doc
  url: https://man.archlinux.org/man/crypt.5
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Crypt_(C)
