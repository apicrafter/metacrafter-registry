id: pg_phone
name: Papua New Guinea phone number (E.164)
status: draft
doc: 'Phone number of Papua New Guinea in international E.164 form: a plus sign, the country calling code
  +675 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- PG
langs:
- common
regexp: ^\+675(?:(?:180|[78]\d{3})\d{4}|(?:[2-589]\d|64)\d{5})$
examples:
- value: '+6753123456'
  description: Example number from Google libphonenumber (fixed line)
- value: '+67570123456'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
