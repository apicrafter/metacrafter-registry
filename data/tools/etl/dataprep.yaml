id: dataprep
name: DataPrep
category: etl
doc: 'DataPrep is an open-source Python library for data preparation from the SFU Database Group. Its
  clean module standardises and validates the values of a DataFrame column: national identifiers, tax
  and VAT numbers, company registration numbers, bank account numbers and product, publication and securities
  codes (most of them checked with python-stdnum), as well as email addresses, phone numbers, URLs, IP
  addresses, dates, coordinates, countries and addresses.'
website: https://github.com/sfu-db/dataprep
