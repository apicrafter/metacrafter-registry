  url: https://www.argentina.gob.ar/jefatura/innovacion-ciencia-y-tecnologia/innovacion/preguntas-frecuentes
- type: doc
  url: https://infra.datos.gob.ar/catalog/jgm/dataset/30/distribution/30.0/download/metodologico-contratar.pdf
