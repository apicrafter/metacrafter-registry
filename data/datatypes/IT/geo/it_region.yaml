id: it_region
name: Italian region
status: draft
doc: Name of one of the 20 regions of Italy, such as Lombardia, Lazio or Sicilia, in Italian or English
  (Lombardy, Sicily). Five of them have special autonomy. Their ISO 3166-2 codes are in it_subdivision_code
  and their ISTAT codes in it_istat_comune.
