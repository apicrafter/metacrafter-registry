translations:
  ru:
    name: Уникальный номер средства маркирования животного (УНСМ)
    doc: Федеральный уникальный номер средства маркирования сельскохозяйственного животного в ФГИС «ВетИС»
      (компонент «Хорриот») — 11 символов, RU, признак индивидуальной или групповой идентификации, семь
      символов и контрольная цифра.
