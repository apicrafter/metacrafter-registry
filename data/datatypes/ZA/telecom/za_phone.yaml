id: za_phone
name: South Africa phone number (E.164)
status: draft
doc: 'Phone number of South Africa in international E.164 form: a plus sign, the country calling code
  +27 and the national number, with no spaces. The regexp follows the national number pattern of Google
  libphonenumber. National formats with a trunk prefix and numbers written with spaces or hyphens are
  not covered.'
semantic_type: phone
country:
- ZA
langs:
- common
regexp: ^\+27(?:[1-79]\d{8}|8\d{4,9})$
examples:
- value: '+27101234567'
  description: Example number from Google libphonenumber (fixed line)
- value: '+27711234567'
  description: Example number from Google libphonenumber (mobile)
links:
- type: other
  url: https://github.com/google/libphonenumber/blob/master/resources/PhoneNumberMetadata.xml
