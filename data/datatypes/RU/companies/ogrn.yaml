id: ogrn
name: Russian primary state registration number (OGRN, OGRNIP)
status: stable
doc: 'Number that the Russian tax service assigns when it enters a business in a state register. A legal
  entity gets a 13-digit OGRN in the register of legal entities (EGRUL); an individual entrepreneur gets
  a 15-digit OGRNIP in the register of individual entrepreneurs (EGRIP), and that number identifies a
  natural person. The first digit is 1 or 5 for an OGRN and 3 for an OGRNIP; numbers of other register
  entries (GRN) start with other digits. Then come the last two digits of the registration year, the region
  code, the entry number and a check digit: the last digit of the remainder of the preceding digits divided
  by 11 (OGRN) or by 13 (OGRNIP).'
