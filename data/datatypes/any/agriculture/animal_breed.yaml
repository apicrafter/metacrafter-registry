id: animal_breed
name: Animal breed
status: draft
doc: Name or code of a breed of domestic animal, such as Holstein Friesian cattle, Merino sheep or Labrador
  Retriever dogs. Typical columns are in livestock registers, herd books, animal movement and slaughter
  data, dog and cat licences and veterinary records. Breed codes are national or studbook-specific; FAO
  DAD-IS keeps a global list of livestock breeds.
