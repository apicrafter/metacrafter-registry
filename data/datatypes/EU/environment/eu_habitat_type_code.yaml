translations:
  ru:
    name: Код типа местообитания по Директиве ЕС о местообитаниях (Natura 2000)
    doc: Четырёхзначный код типа природного местообитания из приложения I Директивы 92/43/EEC, совпадающий
      с кодом Natura 2000. Первая цифра обозначает группу местообитаний, например 9 — леса.
