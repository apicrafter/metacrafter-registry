id: bankcard_expiry
name: Payment card expiration date
status: draft
doc: Month and year after which a payment card is no longer valid, printed on the card next to the card
  number. Payment card rules treat it as cardholder data together with the card number and the cardholder
  name. Data sets usually store it as month and two- or four-digit year.
