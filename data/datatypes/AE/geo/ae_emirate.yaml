id: ae_emirate
name: UAE emirate
status: draft
doc: Name of one of the seven emirates of the United Arab Emirates (Abu Dhabi, Dubai, Sharjah, Ajman,
  Umm Al Quwain, Ras Al Khaimah, Fujairah), in English or Arabic, as federal and emirate statistics label
  their tables by emirate (Emirate_EN, Emirate_AR). Spellings vary (Umm Al - Quwain, Umm Al Qaiwain, Ras
  Al-Khaimah) and abbreviations are common (R.A.K., U.A.Q., UMQ); Arabic labels have hamza variants and
  the stretching tatweel (أبوظبي, أبو ظــبي). Tables often add the regions of Abu Dhabi (Al Ain, Western
  Region) as rows of their own, which are ae_abu_dhabi_region. Each emirate shares its name with its capital
  city (aecity). The ISO 3166-2 codes are AE-AZ, AE-DU, AE-SH, AE-AJ, AE-UQ, AE-RK and AE-FU.
