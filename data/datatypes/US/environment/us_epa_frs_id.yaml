id: us_epa_frs_id
name: US EPA Facility Registry Service (FRS) registry ID
status: draft
doc: Identifier that the Facility Registry Service of the US Environmental Protection Agency gives to
  a facility, site or other place of environmental interest. FRS links the records of the same place in
  EPA program systems (air, water, waste, toxics release and greenhouse gas reporting) under one registry
  ID, and other EPA data sets carry it as FRS ID or REGISTRY_ID. It has 12 digits, and all values seen
  in EPA data start with 110.
categories:
- environment
- government
country:
- US
langs:
- common
is_pii: false
classification: identifier
regexp: ^110\d{9}$
examples:
- value: '110000495777'
  description: San Francisco Mint; Wikidata
- value: '110009342265'
  description: Dewey Loeffel Landfill Superfund site; Wikidata
- value: '110000490166'
  description: PSE Ferndale Generating Station, Washington; EPA greenhouse gas reporting data
- value: '11000049577'
  valid: false
  description: Eleven digits; a registry ID has twelve
mappings:
