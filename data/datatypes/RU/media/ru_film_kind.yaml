id: ru_film_kind
name: Kind of film in the Russian film registers
status: draft
doc: Kind of film (вид фильма) in the registers of the Russian Ministry of Culture, such as feature (художественный),
  documentary (документальный), animated (анимационный) or popular science (научно-популярный). The registers
  write the values inconsistently, with about sixty variants.
