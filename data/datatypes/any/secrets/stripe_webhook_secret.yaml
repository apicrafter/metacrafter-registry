id: stripe_webhook_secret
name: Stripe webhook signing secret
status: draft
doc: Secret with which a Stripe webhook endpoint verifies the signatures of the events it receives. Stripe
  documents that it starts with whsec_. The vendor does not document the length or the characters after
  the prefix; the regexp accepts letters and digits.
parent: symmetric_key
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^whsec_[A-Za-z0-9]+$
examples:
- value: whsec_
  valid: false
  description: Prefix without the secret
links:
- type: doc
  url: https://docs.stripe.com/webhooks/stripe-events
