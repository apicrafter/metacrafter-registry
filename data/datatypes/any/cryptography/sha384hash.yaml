id: sha384hash
name: SHA-384 hash
status: stable
doc: Digest of the SHA-384 hash function (SHA-2 family, 384 bits). It is written as 96 hexadecimal digits.
categories:
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-fA-F]{96}$
examples:
- value: 38b060a751ac96384cd9327eb1b1e36a21fdb71114be07434c0cc7bf63f6e1da274edebfe76f65fbd51ad2f14898b95b
  description: SHA-384 hash of the empty string
- value: cb00753f45a35e8bb5a03d699ac65007272c32ab0eded1631a8b605a43ff5bed8086072ba1e7cc2358baeca134c825a7
  description: SHA-384 hash of the string 'abc'
- value: 38b060a751ac96384cd9327eb1b1e36a21fdb71114be07434c0cc7bf63f6e1da274edebfe76f65fbd51ad2f14898b95
  valid: false
  description: one hex digit short (95 instead of 96)
links:
