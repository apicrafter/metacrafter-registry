id: be_vat
name: Belgian enterprise number (KBO/BCE, VAT number)
status: stable
doc: 'Ondernemingsnummer (numéro d''entreprise, Unternehmensnummer), the 10-digit number of a company,
  association, public body or self-employed person in the Crossroads Bank for Enterprises (KBO/BCE). With
  the prefix BE it is also the VAT number (BTW, TVA). It is usually written as 0415.580.365. The first
  digit is 0 or 1: the KBO started to assign numbers beginning with 1 on 19 September 2023, when the numbers
  beginning with 0 ran out. The last two digits are 97 minus the remainder of the first eight digits divided
  by 97. Older numbers had nine digits and are still often written without the leading 0, as in BE 428.759.497.
  Establishment units of an enterprise have numbers of their own, beginning with 2 to 8. ORG-ID.guide
  lists the register as BE-BCE_KBO, and Peppol identifies Belgian participants with ISO 6523 scheme 0208
  and the 10 digits.'
