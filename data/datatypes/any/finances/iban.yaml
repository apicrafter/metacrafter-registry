id: iban
name: International Bank Account Number
status: stable
doc: The International Bank Account Number (IBAN) is an internationally agreed system of identifying bank
  accounts across national borders to facilitate the communication and processing of cross border transactions
  with a reduced risk of transcription errors. An IBAN uniquely identifies the account of a customer at
  a financial institution.
categories:
- finances
langs:
- common
is_pii: false
classification: identifier
regexp: '^[A-Z]{2}\d{2}(?: ?[A-Z0-9]){11,30}$'
checksum: iban_mod97
examples:
- value: GB82WEST12345698765432
  description: Documentation example, electronic format
- value: GB82 WEST 1234 5698 7654 32
  description: The same IBAN in print format
- value: DE89370400440532013000
  description: German documentation example
- value: GB82WEST12345698765433
  valid: false
  description: 'Last digit changed: fails the mod-97 check'
