id: npm_access_token
name: npm access token
status: draft
doc: 'Access token of the npm package registry in the format introduced in 2021: the prefix npm_ followed
  by 36 letters and digits, the last six of which are a Base62-encoded CRC32 checksum. Older npm tokens
  are bare UUIDs.'
parent: access_token
categories:
- secrets
langs:
- common
is_pii: false
classification: identifier
regexp: ^npm_[A-Za-z0-9]{36}$
examples:
- value: npm_ExampleTokenExampleTokenExampleToken
  description: Constructed, non-functional value
- value: npm_ExampleTokenExampleTokenExampl
  valid: false
  description: Too short
links:
- type: doc
  url: https://github.blog/changelog/2021-09-23-npm-has-a-new-access-token-format/
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
