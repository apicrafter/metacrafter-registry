id: comment
name: Comment / Note
status: stable
doc: Free-text comment, note or remark attached to a record or an object, such as a note on a payment,
  a remark in a register or a user's comment under a post. Field names are comment, comments, note, notes,
  remarks and, in Russian data, примечание and комментарий. Short structured remarks look like categories,
  long ones like article text.
categories:
- common
- texts
langs:
- common
is_pii: false
mappings:
  sherlock: notes
  schema_org: comment
links:
