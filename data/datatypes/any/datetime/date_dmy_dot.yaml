id: date_dmy_dot
name: Date as DD.MM.YYYY
status: draft
doc: Calendar date written as day, month and four-digit year separated by dots, for example 25.12.2024.
  The day and the month have one or two digits. This is the usual numeric date in Germany, Russia and
  many other European countries.
semantic_type: date
langs:
- common
regexp: ^(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.\d{4}$
examples:
- value: 25.12.2024
  description: 25 December 2024
- value: 5.5.2022
  description: 5 May 2022, one-digit day and month
- value: 25.12.24
  valid: false
- value: 2024.12.25
  valid: false
mappings:
  qddate: dt:date:date_2
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/List_of_date_formats_by_country
- type: other
  url: https://github.com/ivbeg/qddate/blob/v1.1.0/qddate/patterns/base.py
translations:
  ru:
    name: Дата в формате ДД.ММ.ГГГГ
    doc: 'Календарная дата: день, месяц и год из четырёх цифр через точки, например 25.12.2024.'
