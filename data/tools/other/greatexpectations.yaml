id: greatexpectations
name: Great Expectations Semantic Types Expectations
category: other
doc: A contributed package of custom expectations for Great Expectations, the Python data validation framework.
  Each expectation asserts that the values of a column are valid for one semantic type, using a regular
  expression or a helper library such as python-stdnum, schwifty, phonenumbers, pycountry or geonamescache;
  a few call online services. The expectations live in the package's expectations folder in the Great
  Expectations repository and are not part of the core library.
website: https://github.com/fivetran/great_expectations/tree/develop/contrib/great_expectations_semantic_types_expectations
