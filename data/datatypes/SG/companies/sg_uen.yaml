id: sg_uen
name: Singapore Unique Entity Number (UEN)
status: draft
doc: 'Identification number that the government of Singapore gives to every entity that operates in Singapore:
  businesses, local companies, societies, charities and others. It has nine or ten characters in one of
  three formats: eight digits and a check letter for businesses, nine digits starting with the year of
  registration and a check letter for local companies, and for other entities a letter (R, S or T), two
  digits of the year, two letters for the entity type, four digits and a check letter.'
categories:
- companies
country:
- SG
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:\d{8}[A-Z]|\d{9}[A-Z]|[RST]\d{2}[A-Z]{2}\d{4}[A-Z])$
examples:
- value: 198101793G
  description: NCS Pte Ltd
- value: 202120748H
  description: SPH Media
- value: 202134064M
  description: Oh Baby Games
- value: 00192200M
  description: Business format, test value of python-stdnum
- value: S16FC0121D
  description: Other entity format, test value of python-stdnum
- value: S16FC0121
  valid: false
  description: The check letter is missing
mappings:
  wikidata: P13194
  presidio: SG_UEN
