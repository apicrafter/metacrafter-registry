id: pgp_private_key_block
name: OpenPGP private key block
status: draft
doc: 'OpenPGP secret key in ASCII armor: Radix-64 text between the lines -----BEGIN PGP PRIVATE KEY BLOCK-----
  and -----END PGP PRIVATE KEY BLOCK-----, as defined in RFC 9580.'
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^-----BEGIN PGP PRIVATE KEY BLOCK-----[\s\S]+-----END PGP PRIVATE KEY BLOCK-----$
examples:
- value: '-----BEGIN PGP PRIVATE KEY BLOCK-----


    EXAMPLE

    -----END PGP PRIVATE KEY BLOCK-----'
  description: Armor lines around placeholder text, not a key
- value: '-----BEGIN PGP PUBLIC KEY BLOCK-----


    EXAMPLE

    -----END PGP PUBLIC KEY BLOCK-----'
  valid: false
  description: Public key block
links:
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc9580#section-6.2
- type: other
  url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
