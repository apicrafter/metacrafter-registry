id: date_vietnamese
name: Date with a Vietnamese month name
status: draft
doc: Calendar date written in Vietnamese with the month name, day, month and year in the order of the
  CLDR long (d MMMM, y) and medium (d MMM, y) date formats of the vi locale. The month is the CLDR wide
  or abbreviated name in the format context, written exactly as CLDR gives it, including any dot or apostrophe;
  no extra capitalisation variants are accepted.
semantic_type: date
langs:
- vi
regexp: ^(?:(?:0?[1-9]|[12]\d|3[01]) (?:tháng\ 10|tháng\ 12|tháng\ 11|tháng\ 9|tháng\ 1|tháng\ 7|tháng\
  5|tháng\ 8|tháng\ 2|tháng\ 4|tháng\ 3|tháng\ 6), \d{4}|(?:0?[1-9]|[12]\d|3[01]) (?:thg\ 12|thg\ 11|thg\
  10|thg\ 9|thg\ 3|thg\ 5|thg\ 2|thg\ 4|thg\ 8|thg\ 7|thg\ 6|thg\ 1), \d{4})$
examples:
- value: 3 tháng 10, 2024
  description: 3 October 2024, CLDR long format d MMMM, y
- value: 25 thg 12, 2024
  description: 25 December 2024, CLDR medium format d MMM, y
- value: tháng 10 2024
  valid: false
links:
- type: other
  url: https://github.com/unicode-org/cldr-json/blob/main/cldr-json/cldr-dates-full/main/vi/ca-gregorian.json
