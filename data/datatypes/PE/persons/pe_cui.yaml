- type: other
  url: https://arthurdejong.org/python-stdnum/doc/2.2/stdnum.pe.cui.html
- type: other
  url: https://docs.dataprep.ai/user_guide/clean/clean_pe_cui.html
translations:
  es:
    name: Cédula Única de Identidad (CUI)
