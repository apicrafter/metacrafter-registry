id: jp_passport
name: Japanese passport number
status: draft
doc: Number of a passport issued by Japan - two letters followed by seven digits. The first letter shows
  the passport type (M for a five-year passport, T for a ten-year one).
semantic_type: passport
country:
- JP
langs:
- ja
regexp: ^[A-Z]{2}\d{7}$
examples:
- value: TK123456
  valid: false
  description: only six digits
