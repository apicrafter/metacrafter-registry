id: date_english
name: Date with an English month name
status: draft
doc: Calendar date written in English with the month name, full or abbreviated, capitalised or in lower
  case. The day comes first (5 May 2022, 5th May 2022, 5.May.2022, 5-May-2022, 25-Dec-20) or after the
  month (May 5, 2022; Sept. 5, 2022; Dec 25th 2024). A weekday may come first (Monday, 5 May 2022; Mon,
  Dec 5, 2022), also before a day-first numeric date (Monday, 25/12/2024).
semantic_type: date
langs:
- en
regexp: ^(?:(?:(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|[Mm]on|[Tt]ue|[Ww]ed|[Tt]hu|[Ff]ri|[Ss]at|[Ss]un),?
  )?(?:(?:0?[1-9]|[12]\d|3[01])(?:st|nd|rd|th)?(?:\. ?| )(?:[Jj]an(?:uary)?|[Ff]eb(?:ruary)?|[Mm]ar(?:ch)?|[Aa]pr(?:il)?|[Mm]ay|[Jj]une?|[Jj]uly?|[Aa]ug(?:ust)?|[Ss]ep(?:t|tember)?|[Oo]ct(?:ober)?|[Nn]ov(?:ember)?|[Dd]ec(?:ember)?)(?:\.
  ?|,? )\d{4}|(?:[Jj]an(?:uary)?|[Ff]eb(?:ruary)?|[Mm]ar(?:ch)?|[Aa]pr(?:il)?|[Mm]ay|[Jj]une?|[Jj]uly?|[Aa]ug(?:ust)?|[Ss]ep(?:t|tember)?|[Oo]ct(?:ober)?|[Nn]ov(?:ember)?|[Dd]ec(?:ember)?)\.?
  (?:0?[1-9]|[12]\d|3[01])(?:st|nd|rd|th)?,? \d{4})|(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|[Mm]on|[Tt]ue|[Ww]ed|[Tt]hu|[Ff]ri|[Ss]at|[Ss]un),?
  (?:0?[1-9]|[12]\d|3[01])/(?:0?[1-9]|1[0-2])/\d{4}|(?:0?[1-9]|[12]\d|3[01])-(?:[Jj]an(?:uary)?|[Ff]eb(?:ruary)?|[Mm]ar(?:ch)?|[Aa]pr(?:il)?|[Mm]ay|[Jj]une?|[Jj]uly?|[Aa]ug(?:ust)?|[Ss]ep(?:t|tember)?|[Oo]ct(?:ober)?|[Nn]ov(?:ember)?|[Dd]ec(?:ember)?)-(?:\d{4}|\d{2}))$
examples:
- value: 25 December 2024
  description: Day first
- value: December 25, 2024
  description: Month first, as in the United States
- value: Wednesday, 25 December 2024
  description: With the weekday
- value: 25th Dec 2024
  description: Ordinal day, abbreviated month
- value: 25-Dec-24
  description: Day, abbreviated month and two-digit year
- value: December 2024
  valid: false
- value: 25 Decembers 2024
  valid: false
