id: x509_private_key
name: X.509 certificate private key
status: draft
doc: 'Private key of an X.509 certificate, usually written as a PEM block that starts with -----BEGIN
  PRIVATE KEY----- (or RSA PRIVATE KEY, EC PRIVATE KEY) or embedded in a Base64 PKCS #12 file.'
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
regexp: ^-----BEGIN (?:RSA |EC |DSA |ENCRYPTED )?PRIVATE KEY-----[\s\S]+-----END (?:RSA |EC |DSA |ENCRYPTED
  )?PRIVATE KEY-----$
mappings:
  purview:
  - Azure subscription management certificate
  - X.509 certificate private key
  - All Credential Types
  - All credentials
links:
- type: doc
  url: https://learn.microsoft.com/en-us/purview/sit-defn-x-509-certificate-private-key
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc7468
