id: nl_amco
name: Amsterdamse code (AMCO)
status: draft
doc: 'Number of a Dutch municipality in the Amsterdamse code, which Ad van der Meer and Onno Boonstra
  give to every municipality that has existed since 1812 in their Repertorium van Nederlandse gemeenten.
  Unlike the CBS code (nl_municipality_code), which changes or is reused when municipalities merge, it
  stays with one municipality for all its years, so historical statistics and boundary files (NLGIS) join
  on it. Five digits; the codes in use begin with 10 or 11. The site gemeentegeschiedenis.nl resolves
  them (https://www.gemeentegeschiedenis.nl/amco/10002). A bare number: recognize it only with column
  context (amco, acode, amsterdamse_code).'
