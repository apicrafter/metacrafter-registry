id: uri
name: Uniform Resource Identifier (URI)
status: draft
doc: 'Identifier of a resource in the generic syntax of RFC 3986: a scheme, a colon and a scheme-specific
  part, optionally followed by ?query and #fragment, such as https://example.com/, mailto:John.Doe@example.com,
  urn:isbn:0451450523 or tel:+1-816-555-1212. URLs, which locate a resource, and URNs, which name it,
  are both URIs. The scheme starts with a letter and may contain letters, digits, +, - and .; IANA keeps
  the registry of schemes. The regexp accepts only the ASCII characters that RFC 3986 allows, with other
  characters percent-encoded, so IRIs with non-ASCII characters do not match.'
categories:
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^[A-Za-z][A-Za-z0-9+.-]*:(?:[A-Za-z0-9._~!$&'()*+,;=:@/?#\[\]-]|%[0-9A-Fa-f]{2})+$
examples:
- value: ldap://[2001:db8::7]/c=GB?objectClass?one
  description: Example of RFC 3986, section 1.1.2
- value: mailto:John.Doe@example.com
  description: Example of RFC 3986, section 1.1.2
- value: news:comp.infosystems.www.servers.unix
  description: Example of RFC 3986, section 1.1.2
- value: tel:+1-816-555-1212
  description: Example of RFC 3986, section 1.1.2
- value: urn:oasis:names:specification:docbook:dtd:xml:4.1.2
  description: Example of RFC 3986, section 1.1.2
- value: www.example.com
  valid: false
  description: No scheme
- value: '10:30'
  valid: false
  description: A time; a scheme starts with a letter
- value: http://example.com/a b
  valid: false
  description: Unencoded space
mappings:
  fhir: urn:ietf:rfc:3986
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Uniform_Resource_Identifier
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc3986
- type: doc
  url: https://www.iana.org/assignments/uri-schemes/uri-schemes.xhtml
translations:
  ru:
    name: Унифицированный идентификатор ресурса (URI)
    doc: 'Идентификатор ресурса в общем синтаксисе RFC 3986: схема, двоеточие и часть, зависящая от схемы.'
