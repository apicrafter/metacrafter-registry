id: miccode
name: Market Identifier Code (ISO 10383)
status: stable
doc: This International Standard specifies a universal method of identifying exchanges, trading platforms,
  regulated or non-regulated markets and trade reporting facilities as sources of prices and related information
  in order to facilitate automated processing
categories:
- finances
langs:
- common
is_pii: false
classification: categorical
regexp: ^[A-Z0-9]{4}$
examples:
- value: GBUL
  description: Bulgarian Stock Exchange - SME Growth Market Beam
- value: IFCA
  description: Winnipeg Commodity Exchange
mappings:
  fibo: FBC/FunctionalEntities/Markets/MarketIdentifier
  wikidata: P7534
links:
- type: other
  url: https://www.iso20022.org/market-identifier-codes
- type: wikidata
  url: https://www.wikidata.org/wiki/Property:P7534
