id: pgp_key_id
name: OpenPGP key ID
status: draft
doc: 'Short identifier of an OpenPGP key, 64 bits written as 16 hexadecimal digits, often after 0x (gpg
  --keyid-format long): the low-order 64 bits of the fingerprint for version 4 keys and the high-order
  64 bits for version 6 keys (RFC 9580). Key IDs can collide; the older 8-digit short key IDs are easy
  to forge and are not covered.'
categories:
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^(?:0x)?[0-9A-Fa-f]{16}$
examples:
- value: 8CFDE12197965A9A
  description: Key ID of the sample version 4 key of RFC 9580 (the issuer in appendix A.2)
- value: '0x8CFDE12197965A9A'
  description: The same key ID with the 0x prefix
- value: CB186C4F0609A697
  description: Key ID of the sample version 6 key of RFC 9580
- value: 97965A9A
  valid: false
  description: Short 8-digit key ID
links:
- type: doc
  url: https://www.rfc-editor.org/rfc/rfc9580#section-5.5.4
