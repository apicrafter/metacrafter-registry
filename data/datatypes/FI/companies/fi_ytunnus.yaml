id: fi_ytunnus
name: Finnish business ID (Y-tunnus)
status: draft
doc: 'Y-tunnus (yritys- ja yhteisötunnus, in Swedish FO-nummer), the business identity code of companies
  and organisations in Finland: seven digits, a hyphen and a weighted check digit.'
categories:
- companies
country:
- FI
langs:
- fi
- sv
is_pii: false
classification: identifier
regexp: ^\d{7}-?\d$
