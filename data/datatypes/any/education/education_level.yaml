id: education_level
name: Level of education (in words)
status: draft
doc: 'Level or stage of education in words: of a school, a programme or a degree (inicial, primario, secundario,
  superior; grado, pregrado, posgrado; primary, secondary, tertiary, undergraduate, postgraduate) or the
  highest level a person attained (Secundario completo, Universitario incompleto). Each country names
  its own levels; the codes of a classification have their own types, such as isced2011_level of UNESCO
  and ru_education_level, both children of this type.'
