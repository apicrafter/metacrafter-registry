id: bcrypt_hash
name: bcrypt password hash
status: draft
doc: 'Password hash produced by bcrypt in Modular Crypt Format: $2, an optional version letter (a, b,
  x or y), $, a two-digit cost, $ and 53 characters of bcrypt Base64 (a 22-character salt and a 31-character
  hash).'
categories:
- secrets
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^\$2[abxy]?\$[0-9]{2}\$[./A-Za-z0-9]{53}$
examples:
- value: $2y$10$PvHZA2qDCPtJ6C/JxFval.y80.N4NJBCHhyTY.XkcksghdCXe3oXG
  description: Hash of the word "example" made with htpasswd -B
- value: $1$examples$9syBlMva027I.Vd2Z0JGl1
  valid: false
  description: MD5-crypt hash
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/Bcrypt
- type: doc
  url: https://man.archlinux.org/man/crypt.5
