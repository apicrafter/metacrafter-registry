id: torrent_info_hash
name: BitTorrent Info Hash (BTIH)
status: stable
doc: 'Identifier of a torrent: the hash of the bencoded info dictionary of its .torrent file. Version
  1 torrents (BEP 3) use SHA-1, written as 40 hexadecimal digits, as in magnet:?xt=urn:btih: links; old
  magnet links may carry the same 20 bytes as 32 Base32 characters, which the regexp does not cover. Version
  2 torrents (BEP 52) use a SHA-256 info hash, written as a multihash in urn:btmh: links.'
parent: sha1hash
categories:
- internet
- identifiers
- cryptography
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-fA-F]{40}$
examples:
- value: dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c
  description: Info hash of the Big Buck Bunny torrent published by WebTorrent
- value: 08ada5a7a6183aae1e09d831df6748d566095a10
  description: Info hash of the Sintel torrent published by WebTorrent
- value: DD8255ECDC7CA55FB0BBF81323D87062DB1F6D1C
  description: The Big Buck Bunny info hash in uppercase
- value: dd8255ecdc7ca55fb0bbf81323d87062db1f6d1
  valid: false
  description: one hex digit short (39 instead of 40)
links:
- type: wikipedia
  url: https://en.wikipedia.org/wiki/BitTorrent
- type: doc
  url: https://www.bittorrent.org/beps/bep_0003.html
- type: doc
  url: https://www.bittorrent.org/beps/bep_0009.html
- type: doc
  url: https://www.bittorrent.org/beps/bep_0052.html
translations:
  ru:
    name: Хеш info торрента (BTIH)
    doc: 'Идентификатор торрента: SHA-1-хеш словаря info файла .torrent, 40 шестнадцатеричных цифр.'
