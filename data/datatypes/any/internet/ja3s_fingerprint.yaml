id: ja3s_fingerprint
name: JA3S TLS server fingerprint
status: draft
doc: 'Server-side counterpart of JA3: the MD5 hash of the TLS version, the chosen cipher suite and the
  extensions of a ServerHello message, written as 32 lowercase hexadecimal digits. A server answers the
  same client the same way, so a JA3 and JA3S pair identifies a client-server negotiation, for example
  malware talking to its command and control server.'
parent: md5hash
categories:
- internet
langs:
- common
is_pii: false
classification: identifier
regexp: ^[0-9a-f]{32}$
examples:
