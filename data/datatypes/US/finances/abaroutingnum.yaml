id: abaroutingnum
name: American Banking Association (ABA) routing number
status: stable
doc: In the United States, an ABA routing transit number (ABA RTN) is a nine-digit code printed on the
  bottom of checks to identify the financial institution on which it was drawn.
categories:
- finances
country:
- US
langs:
- en
is_pii: false
classification: identifier
regexp: ^(?:[0123678]\d{8}|[0123678]\d{3}-\d{4}-\d)$
examples:
- value: '111000025'
  description: python-stdnum example
- value: '11100002'
  valid: false
  description: eight digits (python-stdnum example)
- value: 11100002B
  valid: false
  description: not all digits (python-stdnum example)
mappings:
  autotype: routingnumber
  fibo: FBC/FunctionalEntities/NorthAmericanEntities/USRegulatoryAgencies/RoutingTransitNumber
  purview: ABA Routing Number
  presidio: ABA_ROUTING_NUMBER
  fta: CHECKDIGIT.ABA
  stdnum: us.rtn
links:
