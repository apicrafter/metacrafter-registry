translations:
  ru:
    name: Код отходов Базельской конвенции
    doc: Код категории или позиции отходов из приложений Базельской конвенции о трансграничной перевозке
      опасных отходов — Y1–Y49 (приложения I и II), A-коды (приложение VIII) и B-коды (приложение IX).
