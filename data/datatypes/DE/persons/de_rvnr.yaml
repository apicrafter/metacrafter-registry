id: de_rvnr
name: German pension insurance number (Rentenversicherungsnummer)
status: draft
doc: 'Versicherungsnummer of the German statutory pension insurance (§ 147 SGB VI), also called social
  insurance number (Sozialversicherungsnummer). It has 12 characters, as in 15 070649 C 103: a two-digit
  area number of the pension insurance institution, the date of birth as DDMMYY, the first letter of the
  birth name, a two-digit serial number (00-49 male, 50-99 female, diverse or no gender entry) and a check
  digit. For the check, the letter becomes its position in the alphabet as two digits (A=01 ... Z=26),
  the twelve digits are weighted 2 1 2 5 7 1 2 1 2 1 2 1, and the digit sums of the products are added
  modulo 10. The day of birth can be raised above 31 when a serial range is used up.'
