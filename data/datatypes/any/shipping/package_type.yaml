id: package_type
name: Package type
status: draft
doc: Kind of package in which goods are shipped, written as a word, for example Box, Carton, Bag, Drum
  or Pallet. Customs declarations, packing lists and bills of lading keep it next to the number of packages.
  The coded form in trade documents is the two-character code of UN/ECE Recommendation 21 (unece_rec21_package_code).
