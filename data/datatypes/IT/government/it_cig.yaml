translations:
  it:
    name: Codice identificativo di gara (CIG)
    doc: Codice di 10 caratteri attribuito dall'ANAC a un contratto pubblico; CIG ordinario, smart CIG
      (iniziale da V a Z) o CIG nel formato unico (iniziale da A a U).
  ru:
    name: Идентификационный код закупки Италии (CIG)
    doc: Десятисимвольный код, который антикоррупционное агентство ANAC присваивает государственному контракту.
